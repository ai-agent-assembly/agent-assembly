[workspace]
# Standalone workspace root — deliberately NOT a member of the outer
# agent-assembly Cargo workspace. This crate cross-compiles to
# aarch64-unknown-linux-musl and is packaged into the initramfs as the
# guest's PID 1; it never builds or runs on the host toolchain/target and
# has nothing to do with the product's own crates. See ../README.md
# ("virtiofs + vsock guest-init").

[package]
name = "guest-init"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "init"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# AAASM-5837. Path dependency across the outer agent-assembly workspace
# boundary — this crate is deliberately its own standalone workspace (see the
# note at the top of this file) but the wire contract with the host process
# must be the exact same code on both sides, so it reaches across that
# boundary for exactly this one crate. Verified buildable from a clean clone
# during AAASM-5837's design pass.
aa-isolation-vm-proto = { path = "../../aa-isolation-vm-proto" }

[profile.release]
panic = "abort"
strip = true
opt-level = "z"

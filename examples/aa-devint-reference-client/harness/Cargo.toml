[package]
name = "aa-devint-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test harness that serves a real DI-API socket so the TypeScript reference client can be contract-tested against it"
publish = false

[dependencies]
aa-core      = { path = "../../../aa-core", version = "0.0.1-rc.6" }
aa-runtime   = { path = "../../../aa-runtime", version = "0.0.1-rc.6" }
async-trait  = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "io-std"] }
tokio-util   = { workspace = true, features = ["rt"] }

[lints]
workspace = true

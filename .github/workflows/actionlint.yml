name: Workflow Syntax Check

# AAASM-5375: a workflow file with an unparseable expression does not fail —
# it produces zero check runs and vanishes from the checks list entirely.
# `claude-code-conformance.yml` hit exactly this (a job-level `env:` block
# referencing the steps-only `runner` context) and failed to parse on six
# consecutive pushes with zero jobs, while `gh pr checks` reported everything
# green throughout. actionlint statically validates every workflow file's
# syntax and expression contexts, catching this class before it reaches a
# workflow GitHub itself refuses to run.
#
# shellcheck and pyflakes integration are deliberately disabled
# (`-shellcheck= -pyflakes=`): this gate's scope is workflow-file validity
# (AAASM-5375's actual failure mode), not general shell-script quality. A
# shellcheck finding inside a `run:` block is a separate concern with its own
# false-positive risk — e.g. an intentionally-unquoted `$(...)` word-split in
# release.yml's Apple notarization script — and making an unrelated style
# warning block every PR's merge gate would be exactly the "trims a genuine
# signal to fit a check nobody can act on" failure this org's governance
# gates are written to avoid.

on:
  pull_request:
    # Deliberately NOT path-filtered on the trigger itself, same reasoning as
    # contact-metadata-check.yml: this is governance-bearing (CONTRIBUTING,
    # "Which CI checks are governance-bearing") and a required check that
    # doesn't reliably report blocks the PR forever. Selection happens in the
    # `changes` job below instead.
  push:
    branches:
      - main
  # Lets ci.yml invoke this workflow's jobs directly so `ci-success` can
  # genuinely `needs:` its conclusion, per the AAASM-5677 pattern.
  workflow_call:

# Literal group name, not `${{ github.workflow }}-${{ github.ref }}` — under
# `workflow_call`, `github.workflow` resolves to the CALLING workflow's name
# ("CI"), which every governance satellite this repo adds would also compute,
# colliding in one concurrency group. `github.event_name` is appended so this
# workflow's own `pull_request` trigger and ci.yml's `workflow_call`
# invocation (same PR, same time) don't collide with each other either — see
# contact-metadata-check.yml's identical comment for the live failure this
# pattern produced elsewhere (PR #2087).
concurrency:
  group: actionlint-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Consulted for `pull_request` only. The `push` backstop stays unconditional
  # so the gate still runs on the merge that breaks it.
  changes:
    name: Detect changed areas (Workflow Syntax)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              # The reachability gate below lives outside .github/, and editing
              # a gate must re-run it.
              - 'scripts/check_workflow_job_reachability.py'
              - 'scripts/check_workflow_timeout_ceilings.py'

  lint:
    name: actionlint
    needs: [changes]
    # `!cancelled()` stops a skipped `changes` (every non-PR event) from
    # force-skipping this job. A failed `changes` leaves the condition false,
    # so this skips and the aggregate below turns red: fail closed.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          # AAASM-6194: retry, matching the sandlock download in ci.yml. This
          # step runs under `set -euo pipefail`, so one dropped connection
          # fails a required check before the linter has run at all — which
          # is what happened on #2538, where curl exited 35
          # ("Recv failure: Connection reset by peer") while this same
          # workflow, on the same commit, downloaded the same pinned tarball
          # cleanly in its parallel standalone run. The red check said
          # nothing about the code under review.
          #
          # `--retry-all-errors` is load-bearing and not redundant with
          # `--retry`: on its own, `--retry` re-attempts timeouts and
          # retryable HTTP statuses but NOT connection-level failures, so it
          # would not have caught exit 35. Measured against a peer that
          # accepts then resets: bare 1 connection, `--retry 3` 1 connection,
          # `--retry 3 --retry-all-errors` 4 connections.
          #
          # This cannot admit a bad archive: the digest check below is
          # unchanged and still gates, and the step still fails loudly when
          # the download genuinely cannot succeed — retrying a lost
          # connection is not the same as tolerating a wrong one.
          curl -fsSLO --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint

      - name: Validate every workflow file's syntax and expressions
        run: ./actionlint -shellcheck= -pyflakes= -color

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # AAASM-6214: actionlint validates each file in isolation and has no
      # opinion about the job graph, so it is silent on a job that GitHub will
      # never run. docs.yml's Pages deploy was skipped on 100% of runs for six
      # and a half weeks with actionlint green throughout: a skipped job fails
      # nothing, and the `always()` aggregate reported success.
      #
      # Self-test first, in this same step, so the gate cannot pass vacuously —
      # and no error suppression on the enforcing call.
      - name: Fail if any job is unreachable through its needs chain
        run: |
          set -euo pipefail
          python3 scripts/check_workflow_job_reachability.py --selftest
          python3 scripts/check_workflow_job_reachability.py

      # AAASM-6231: actionlint accepts any `timeout-minutes` that parses, so it
      # is silent on a job ceiling that sits at or below the sum of its step
      # ceilings. That relationship decides whether an overrun is reported as a
      # red failure (a step ceiling fired) or as `cancelled` (the job ceiling
      # fired), and branch protection accepts `cancelled`.
      #
      # integration-tests.yml derives its job ceiling from its step ceilings for
      # that reason and said so only in comments. PR #2566 edited the file
      # without re-deriving it and this check reported success, because nothing
      # was checking.
      #
      # Self-test first, in the same step, for the same reason as above.
      - name: Fail if a job ceiling does not sit above the sum of its step ceilings
        run: |
          set -euo pipefail
          python3 scripts/check_workflow_timeout_ceilings.py --selftest
          python3 scripts/check_workflow_timeout_ceilings.py

  # The stable required context. Named separately from the job it aggregates
  # so renaming an internal job cannot silently drop the branch-protection
  # requirement, per the AAASM-5677 pattern.
  workflow-syntax-success:
    name: Workflow Syntax Success
    needs: [changes, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required Workflow Syntax job concluded with '$r'"
                exit 1
                ;;
            esac
          done
          echo "All required Workflow Syntax jobs passed or were intentionally skipped."

  # ---- Dashboard (TypeScript) jobs, gated on dashboard changes ----------------
  dashboard-typecheck:
    name: Dashboard (type-check + lint)
    needs: [changes]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types from OpenAPI spec
        run: pnpm generate:api
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint

  dashboard-build:
    name: Dashboard build
    needs: [changes, dashboard-typecheck]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types from OpenAPI spec
        run: pnpm generate:api
      - name: Build production bundle
        run: pnpm build
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist/
          retention-days: 1

  dashboard-test:
    name: Dashboard tests + coverage
    needs: [changes, dashboard-typecheck]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate API types from OpenAPI spec
        run: pnpm generate:api
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload TypeScript coverage (LCOV) for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-coverage-lcov
          path: dashboard/coverage/lcov.info
          # AAASM-3829: 14d for parity with rust-coverage-lcov (Codecov + any
          # backfill consumer); the sonar job regenerates dashboard LCOV in-job
          # (AAASM-3803 Option C), so this is a non-critical safety margin.
          retention-days: 14
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: dashboard/coverage/lcov.info
          name: Dashboard (TypeScript)
          flags: dashboard
          token: ${{ secrets.CODECOV_TOKEN }}

  # AAASM-5192: the dashboard Playwright suite had no CI job at all, so the
  # 31-file breakage in AAASM-5191 sat undetected for 19 days — every e2e result
  # in the programme was author-run evidence that nothing re-checked. This job
  # is the thing that was missing.
  #
  # It runs `playwright.ci.config.ts`, which is the normal config plus a
  # quarantine list (see that file for why, and AAASM-5195 for the backlog).
  # Specs are gated by default and must be named to opt out, so a spec added by
  # anyone else is covered automatically.
  #
  # It consumes `dashboard-build`'s dist artifact rather than rebuilding: a
  # failed build then cannot leave `vite preview` serving a stale bundle that
  # the suite passes against, because the artifact only exists if the build
  # succeeded.
  dashboard-e2e:
    name: Dashboard e2e (Playwright)
    needs: [changes, dashboard-build]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # AAASM-5191: the whole outage was specs seeding `aa_token` into
      # localStorage while `tokenStorage.ts` reads sessionStorage. Worse than
      # the timeouts: localStorage is a state production cannot reach, because
      # AAASM-4322 removed the token from it as XSS-exfiltration hardening — so
      # a spec seeding both stores would keep passing if that hardening were
      # ever reverted, and the gate would certify the vulnerability. Cheap grep,
      # runs before the browser is even provisioned.
      - name: Guard — aa_token is seeded into sessionStorage only
        run: pnpm e2e:check-seeds
      - name: Generate API types from OpenAPI spec
        run: pnpm generate:api
      - name: Download dashboard dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist/
      - name: Install Playwright chromium + OS deps
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e suite
        run: pnpm exec playwright test --config=playwright.ci.config.ts
      # `always()` so a red run still publishes its evidence — the HTML report,
      # the failure screenshots, the retry traces and the JUnit XML. A failure
      # that can only be understood by reproducing it locally is the failure
      # mode this gate is meant to remove.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-report
          path: dashboard/playwright-report/
          retention-days: 14
      - name: Upload Playwright traces, screenshots + JUnit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-results
          path: dashboard/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # AAASM-5694: the one lane in this repository that compares the dashboard
  # against the *real* API rather than against its own fixtures.
  #
  # `dashboard-e2e` above stubs every network call in every one of its gated
  # specs, so its real-backend coverage is exactly zero and it cannot see
  # backend contract drift. AAASM-4892 is the demonstrated cost: the pagination
  # envelope changed, the app had already been fixed, and the *mocks* were what
  # went stale — the gate stayed green against a contract the backend no longer
  # had. Recovering that needs a Rust-side lane, not a shorter quarantine list.
  #
  # It runs on the union of dashboard and Rust API changes, because either side
  # can break the contract and only one of them is watched today.
  dashboard-e2e-real-backend:
    name: Dashboard e2e (real backend)
    #
    # `needs` both builders and `if: always()` so the job survives one of them
    # skipping. An earlier version had `needs: [changes, dashboard-build]` with a
    # dashboard-OR-rust condition, and `dashboard-build` is dashboard-only — so on
    # a **Rust-only** pull request this lane either skipped (and `ci-success`
    # treats a skipped need as passing) or ran and died on a missing artifact.
    # Either way the one lane that can observe backend contract drift was absent
    # on exactly the changes that cause it, which is AAASM-4892's shape again.
    needs: [changes, dashboard-build, dashboard-assets]
    # `!cancelled()` and not `always()`: this workflow sets
    # `cancel-in-progress` for pull requests, and under `always()` a superseded
    # run would still start this job — ~15 min of pre-build, server build and
    # browser provisioning — only to die at the download. Requiring the builder
    # that will actually supply the artifact to have **succeeded** (rather than
    # merely not failed) closes the same hole for a *skipped* builder, e.g. when
    # `dashboard-typecheck` fails and `dashboard-build` never runs.
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      (
        (needs.changes.outputs.dashboard == 'true' &&
         needs.dashboard-build.result == 'success') ||
        (needs.changes.outputs.dashboard != 'true' &&
         needs.changes.outputs.rust == 'true' &&
         needs.dashboard-assets.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dashboard-e2e-real-backend

      - name: Install protoc
        # `aa-proto`'s build script shells out to `protoc`, and the runner image
        # does not ship it — every other Rust job here installs it the same way.
        # Without it the first cargo invocation dies with
        #   Could not find `protoc` … try setting the `PROTOC` environment variable
        # which is what took this lane red on its first CI run while it passed
        # locally, where protoc happened to be installed.
        run: sudo apt-get install -y protobuf-compiler

      - name: Pre-build the hitl-approval fixture
        # `hitl-approval` spawns its own gateway via `cargo test --test
        # e2e_hitl_approval`, and `hitl-fixture.ts` waits up to 4 minutes for it
        # to print READY. Compiling inside that window on a cold runner spends
        # the whole budget on rustc, so the fixture is built here — where a
        # build failure is reported as a build failure — and the spec's wait
        # then covers only process start.
        #
        # No Docker: this fixture's `TopologyTestEnv` is backed by in-memory
        # stores. The testcontainers dependency in `aa-integration-tests` belongs
        # to `audit_consumer_verify.rs`, a different target.
        #
        # Command must match `hitl-fixture.ts`'s spawn EXACTLY — it runs
        # `cargo test --test e2e_hitl_approval` from the workspace root with no
        # `-p`. An earlier version pre-built with `-p aa-integration-tests`,
        # which is a different package selection, therefore a different feature
        # unification, therefore a different binary hash — so the fixture still
        # compiled inside its own 4-minute window and cleared it by ~13 s.
        # Measured after the fix: the whole lane runs in 37 s and the fixture's
        # `beforeAll` in ~33 s, against ~227 s before. Step order relative to
        # `Build aa-api-server` turned out not to matter — cargo keys artifacts
        # by a hash that includes the feature set, so the two builds coexist.
        run: cargo test --no-run --test e2e_hitl_approval

      - name: Build aa-api-server
        # `aa-gateway --mode local` deliberately does not construct
        # `aa_api::AppState`, so every /api/v1/* path returns the SPA fallback as
        # text/html. The REST surface comes from this binary, and that is not
        # discoverable from the gateway's own output — AAASM-5694 records it
        # because it is the first wall anyone hits trying to "run the app".
        run: cargo build -p aa-api --bin aa-api-server

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Generate API types from OpenAPI spec
        working-directory: dashboard
        run: pnpm generate:api

      # `dashboard-build` publishes `dashboard-dist`; `dashboard-assets` (the
      # rust-gated builder) publishes `dashboard-dist-rust`. Exactly one of them
      # ran, and the two conditions below select on the same `changes` outputs
      # that decided which — so selection is by router output, not by probing for
      # existence. A missing artifact fails at `download-artifact` itself.
      - name: Download dashboard dist (dashboard-gated build)
        if: needs.changes.outputs.dashboard == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist/

      - name: Download dashboard dist (rust-gated build)
        if: needs.changes.outputs.dashboard != 'true' && needs.changes.outputs.rust == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/

      - name: Fail loudly if the dist has no index.html
        # Narrower than it looks, and deliberately kept: `download-artifact`
        # already fails on a *missing* artifact, so the only state this catches
        # is one that uploaded but is empty or mis-laid-out. Without it the
        # preview server serves nothing and every spec fails with an unhelpful
        # navigation error instead of naming the cause.
        run: test -f dashboard/dist/index.html

      - name: Install Playwright chromium + OS deps
        working-directory: dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Boot aa-api-server and wait for health
        env:
          AASM_API_AUTH: 'off'
          AA_API_ADDR: 127.0.0.1:7700
        run: |
          set -euo pipefail
          ./target/debug/aa-api-server &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7700/api/v1/health >/dev/null 2>&1; then
              echo "aa-api-server is up"
              exit 0
            fi
            sleep 1
          done
          echo "aa-api-server did not become healthy within 60s" >&2
          exit 1

      - name: Run the real-backend specs
        working-directory: dashboard
        env:
          AA_API_BASE: http://127.0.0.1:7700
        run: pnpm exec playwright test --config=playwright.realbackend.config.ts

      # The step that makes this lane mean something. Playwright exits 0 on a run
      # where every real-backend spec skipped for want of a backend, so an
      # exit-code-only gate would record verification that never happened —
      # the precise defect AAASM-5694 reports. This asserts the population.
      - name: Assert the real-backend specs actually ran
        if: always()
        working-directory: dashboard
        run: node scripts/assert-e2e-actually-ran.mjs test-results/real-backend-report.json 12

      - name: Upload real-backend report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-real-backend-results
          path: dashboard/test-results/
          retention-days: 14
          if-no-files-found: ignore

  dashboard-codegen-drift:
    name: Dashboard codegen drift check
    needs: [changes]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate API types
        run: pnpm generate:api
      - name: Check generated types are up to date
        run: git diff --exit-code src/api/generated/

  aa-cli-compat:
    name: aa-cli build compat (dashboard embed)
    needs: [changes, dashboard-build]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Download dashboard dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: dashboard/dist/
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Verify aa-cli compiles with embedded assets
        run: cargo build -p aa-cli

  # SonarCloud analysis. Reuses the Rust LCOV from the `coverage` job and the
  # TypeScript LCOV from the `dashboard-test` job (both downloaded as artifacts)
  # instead of re-running any tests. `needs: [changes, coverage, dashboard-test]`
  # — either coverage producer may be skipped (path-gated), so the Rust steps run
  # only when `coverage` succeeded and the TS download only when `dashboard-test`
  # succeeded. Runs in the pull_request context so PR decoration works (AAASM-2542).
  #
  # AAASM-3197: SonarCloud treats every main-branch analysis as a FULL snapshot
  # that REPLACES the project's coverage. A push that touches only one side (e.g.
  # dashboard-only → `coverage` skipped) would otherwise publish a partial report
  # that wipes the other side's coverage to 0. On pushes, whichever producer was
  # skipped/failed is backfilled from the last successful main run so the
  # snapshot is always complete. PR analysis (new-code-only) is left unchanged.
  devint-reference-client:
    name: DI-API reference client (typecheck, lint, bindings drift, contract tests)
    needs: [changes]
    if: needs.changes.outputs.devint_client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/aa-devint-reference-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: examples/aa-devint-reference-client/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the bindings still match proto/devint.proto
        run: pnpm generate:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build the DI-API test harness
        # The contract suite talks to the real `aa_runtime::devint` server over a
        # real Unix socket. Without this binary the suite fails loudly rather
        # than silently degrading to a mock.
        working-directory: .
        run: cargo build -p aa-devint-harness
      - name: Unit, guard and contract tests
        run: pnpm test

  sonar:
    name: SonarCloud analysis
    needs: [changes, coverage, dashboard-test]
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-coverage') || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-latest
    # AAASM-3197: actions:read lets `gh run download` pull the last successful
    # main LCOV when a coverage producer was skipped this run (see fallback
    # steps below). contents:read mirrors the workflow default for checkout.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # ---- Rust coverage + clippy (only when the Rust side ran) --------------
      - name: Install protobuf compiler
        if: needs.coverage.result == 'success'
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.coverage.result == 'success'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.coverage.result == 'success'
      - name: Generate Clippy report
        if: needs.coverage.result == 'success'
        run: cargo clippy --all-targets --all-features --exclude aa-ebpf --message-format=json 2>&1 | tee clippy-report.json || true
      - name: Download Rust coverage (LCOV) from the Coverage job
        if: needs.coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-coverage-lcov
          path: .
      # AAASM-3197: main-branch analysis is a FULL snapshot — a partial report
      # wipes the other side's coverage to 0. When the `coverage` job was skipped
      # or failed on a push (non-Rust change), backfill `lcov.info` from the most
      # recent successful main CI run so the snapshot stays complete. PR runs are
      # new-code-decorated and intentionally left untouched.
      - name: Backfill Rust coverage (LCOV) from last successful main run
        if: ${{ github.event_name == 'push' && needs.coverage.result != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "::warning::No prior successful main CI run found; scanning without backfilled Rust LCOV."
            exit 0
          fi
          echo "Backfilling rust-coverage-lcov from main run ${run_id}."
          gh run download "$run_id" --name rust-coverage-lcov --dir . \
            || echo "::warning::rust-coverage-lcov artifact unavailable on run ${run_id} (expired/absent); scanning without it."
      # ---- TypeScript coverage ---------------------------------------------
      # AAASM-3803 (Option C): prefer the SAME-RUN `dashboard-test` artifact and
      # only regenerate in-job when that job did not run this build. Same-run
      # artifacts never expire, so the download is reliable — unlike the previous
      # cross-run backfill, which degraded to a soft `::warning:: ... scanning
      # without it` when the artifact was expired/absent (common on the
      # billing-throttled scan), letting Sonar scan with 0.0% dashboard coverage.
      # This avoids re-running the dashboard tests on the common path (a dashboard
      # PR, where `dashboard-test` already ran) while still guaranteeing coverage
      # on a Rust-only main push (where `dashboard-test` is path-skipped but the
      # AAASM-3197 full-snapshot invariant still requires dashboard coverage).
      - name: Download TypeScript coverage (LCOV) from the Dashboard test job
        if: needs.dashboard-test.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-coverage-lcov
          path: dashboard/coverage
      # Fallback — regenerate only when `dashboard-test` was skipped/failed.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.dashboard-test.result != 'success'
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.dashboard-test.result != 'success'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies (fallback)
        if: needs.dashboard-test.result != 'success'
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: Generate API types from OpenAPI spec (fallback)
        if: needs.dashboard-test.result != 'success'
        working-directory: dashboard
        run: pnpm generate:api
      - name: Generate TypeScript coverage (LCOV) for SonarCloud (fallback)
        if: needs.dashboard-test.result != 'success'
        working-directory: dashboard
        run: pnpm test:coverage
      # ---- Scan -------------------------------------------------------------
      # AAASM-3819: derive sonar.projectVersion from the workspace Cargo version
      # so SonarCloud's reported project version tracks the release automatically
      # and the static value in sonar-project.properties can never silently go
      # stale. Passed to every scan attempt below via the scanner `args` input,
      # which overrides the file value.
      - name: Resolve sonar.projectVersion from Cargo version
        id: sonar-version
        run: |
          version="$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved sonar.projectVersion=${version}"
      - name: Cache SonarCloud analysis state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-
      - name: SonarCloud scan (attempt 1)
        id: sonar-scan-attempt-1
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Wait before retry (attempt 2)
        if: steps.sonar-scan-attempt-1.outcome == 'failure'
        run: |
          echo "::warning::SonarCloud scanner failed on attempt 1 (likely transient CDN flake); waiting 30s before retry."
          sleep 30
      - name: SonarCloud scan (attempt 2)
        id: sonar-scan-attempt-2
        if: steps.sonar-scan-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Wait before retry (attempt 3)
        if: steps.sonar-scan-attempt-1.outcome == 'failure' && steps.sonar-scan-attempt-2.outcome == 'failure'
        run: |
          echo "::warning::SonarCloud scanner failed twice; waiting 30s before final retry."
          sleep 30
      - name: SonarCloud scan (attempt 3 — final)
        if: steps.sonar-scan-attempt-1.outcome == 'failure' && steps.sonar-scan-attempt-2.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ steps.sonar-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  isolation-backend-linux:
    needs: [changes]
    # Path-gated like the eBPF lanes, with the same two backstops: a weekly
    # schedule and manual dispatch. Without them a lane that only fires on its
    # own files would leave `main` claiming a measured boundary long after an
    # unrelated change broke it.
    if: needs.changes.outputs.isolation_backend == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # AAASM-5708 — the only place any claim this backend makes is measured.
    #
    # Nothing about process confinement can be established on macOS or in a
    # unit test: the backend's capability reports are gated on a live probe that
    # watches a real denial happen, and that probe needs a Linux kernel with the
    # mechanism installed. Every scenario that cannot run here declines *and
    # records the decline*, and the final step fails the job when the whole lane
    # declined — because `ci-success` treats a skipped job as a pass, so a lane
    # that silently measured nothing would read as a green boundary.
    name: Isolation backend confinement (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AA_CONFORMANCE_OUTCOME_DIR: ${{ github.workspace }}/.isolation-outcomes
      # Pinned to the exact release whose provenance is recorded in
      # metadata/isolation-backends.json. The digest below is the one that file
      # records; verifying it here is what makes that record a checkable claim
      # rather than a note, and a drifted upstream artifact fails this step
      # instead of silently changing what the lane measured.
      SANDLOCK_VERSION: "0.8.6"
      SANDLOCK_SHA256: "86e89e5bdb2da748e683cda6908a95504ae6751f73d9dadf79cf0fc6843873fb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the host this lane measured
        # First, and unconditionally. When a scenario declines because the
        # kernel is too old, this is the number that says so, and reconstructing
        # it afterwards from a skip message is guesswork.
        run: |
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '<securityfs not readable>')"
      - name: Install the confinement mechanism
        # Downloaded and digest-verified rather than built from source: the
        # digest is the provenance record's whole point, and a source build
        # would measure a binary nobody recorded. `sha256sum -c` fails the job
        # on a mismatch, which is the fail-closed direction.
        env:
          SANDLOCK_URL: https://github.com/multikernel/sandlock/releases/download/v${{ env.SANDLOCK_VERSION }}/sandlock-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o sandlock.tar.gz "$SANDLOCK_URL"
          echo "${SANDLOCK_SHA256}  sandlock.tar.gz" | sha256sum -c -
          mkdir -p sandlock-dist
          tar -xzf sandlock.tar.gz -C sandlock-dist
          sudo install -m 0755 sandlock-dist/sandlock /usr/local/bin/sandlock
          sandlock --version
      - name: Record what the mechanism says it can do here
        # `sandlock check` exits zero even when it reports the host as
        # unsupported, so its exit status is not a gate and is deliberately not
        # treated as one. It is captured because it names the ABI version that
        # explains every decline this lane can produce.
        run: sandlock check || true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: isolation-backend-linux
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest
      - name: Install protobuf compiler
        # `aa-cli` transitively compiles `aa-proto`, whose build.rs invokes
        # `protoc`, and the runner does not ship it. Needed since this lane
        # started building `aa-cli` for the `run_isolation_linux` binary below.
        run: sudo apt-get install -y protobuf-compiler
      - name: Run the confinement suite
        # `--no-capture` so a `SKIP [...]` line is visible in the log; without
        # it a declining scenario reads exactly like a measuring one.
        # `--profile evidence` writes the JUnit report the summary step needs
        # for its denominator: the ledger says which cases declined, and only
        # the runner knows how many there were.
        #
        # AAASM-5711: `run_isolation_linux` lives in `aa-cli` and measures the
        # end-to-end confined launch. It was running in the `Test` lane, which
        # does NOT install the mechanism — so all four scenarios took the
        # `ToolAbsent` branch and reported PASS in 8-14 ms, a green that covered
        # nothing. That lane also never sets `AA_CONFORMANCE_OUTCOME_DIR`, so the
        # decline did not reach the ledger either, and it captures stdout, so the
        # `SKIP` line was invisible too. Three independent reasons the absence
        # could not be seen.
        #
        # `-p` bounds what is compiled; `-E` selects what runs. One invocation,
        # because the summary step reads a single JUnit report and a second
        # `nextest run` would overwrite the first — halving the denominator it
        # nets declines against.
        run: |
          cargo nextest run --profile evidence --no-capture \
            -p aa-isolation-sandlock -p aa-cli \
            -E 'package(aa-isolation-sandlock) + binary(run_isolation_linux)'
      - name: Report what this lane measured
        # `always()`: a lane that failed still has an outcome worth reading, and
        # the ledger is most useful exactly when something went wrong.
        #
        # `--require-evidence`: this lane exists to take a measurement. Every
        # scenario declining means the runner could not confine anything, which
        # is a broken lane rather than an honest opt-out — and the one failure
        # mode `ci-success` cannot see on its own.
        if: always()
        run: |
          .ci/test-evidence-summary.sh \
            --lane "isolation backend (Linux)" \
            --junit target/nextest/evidence/junit.xml \
            --evidence-dir "${AA_CONFORMANCE_OUTCOME_DIR}" \
            --require-evidence
      - name: Fail on any decline, not merely on a lane that declined everything
        # `--require-evidence` fails only when the substantive count reaches
        # zero, and this suite contains one scenario that needs no kernel and no
        # mechanism (an absent backend must refuse before launch). That single
        # portable case would hold the count at one while every measurement
        # scenario declined — a green lane over a suite that measured nothing
        # about confinement, which is the exact reading this lane exists to
        # prevent.
        #
        # On *this* runner both decline reasons are defects rather than honest
        # opt-outs: the job provisions the mechanism itself, so `tool_absent`
        # means the install step is broken, and it selects the runner, so
        # `unsupported_platform` means the image's kernel no longer meets the
        # mechanism's protection floor. Either is a lane to fix, not a result to
        # accept.
        if: always()
        run: |
          set -euo pipefail
          # `|| true` on every grep: zero matches is the expected, healthy
          # answer here and grep reports it as exit 1, which `pipefail` would
          # otherwise turn into a step failure — a check that fails precisely
          # when it has nothing to report.
          declined_records() {
            grep -l '"outcome": "\(unsupported_platform\|tool_absent\)"' \
              "${AA_CONFORMANCE_OUTCOME_DIR}"/*.json 2>/dev/null || true
          }
          declines=$(declined_records | grep -c . || true)
          measured=$({ grep -l '"outcome": "measured"' \
            "${AA_CONFORMANCE_OUTCOME_DIR}"/*.json 2>/dev/null || true; } | grep -c . || true)
          echo "measured=${measured} declined=${declines}"
          if [ "${declines}" -ne 0 ]; then
            echo "::error title=Isolation lane declined a measurement::${declines} scenario(s) declined on a runner that provisions the mechanism and selects the kernel. Records:"
            declined_records | while IFS= read -r record; do cat "$record" >&2; done
            exit 1
          fi
      - name: Assert the lane measured the scenario set it declares
        # AAASM-5712. This replaces a hand-written floor — `measured -lt 9`, and
        # a message saying "the suite has 10" — that was written against a
        # ten-scenario crate. The crate records 33 scenarios now, so the floor
        # stayed green with two thirds of the suite deleted: the exact vacuity
        # this lane exists to refuse.
        #
        # A raised floor would not fix it, and neither would a count. The ledger
        # writes one file per scenario NAME, so a duplicated name collapses into
        # one record and "33" is equally consistent with 33 distinct scenarios
        # and with 32 plus a duplicate. This diffs the SET of names instead,
        # against `.ci/isolation-lane-scenarios.txt` — a second artifact, so a
        # deleted or renamed scenario reddens here until someone records the
        # change there. The expected count is read off that file rather than
        # typed into this step, which is how the previous number went stale.
        #
        # `always()` for the same reason as the two steps above: what the lane
        # measured is most worth reading when something else has gone wrong.
        if: always()
        run: |
          set -euo pipefail
          measured_records=$(mktemp)
          declared_records=$(mktemp)
          # `|| true`: an empty ledger is a reading this step reports through the
          # diff below, and `pipefail` would turn grep's exit 1 into an abort
          # before it gets there.
          { grep -l '"outcome": "measured"' \
            "${AA_CONFORMANCE_OUTCOME_DIR}"/*.json 2>/dev/null || true; } \
            | while IFS= read -r record; do
                sed -n 's/^  "scenario": "\(.*\)",$/\1/p' "${record}"
              done | LC_ALL=C sort -u > "${measured_records}"
          grep -v -e '^#' -e '^[[:space:]]*$' .ci/isolation-lane-scenarios.txt \
            | LC_ALL=C sort -u > "${declared_records}"
          echo "declared=$(wc -l < "${declared_records}") measured=$(wc -l < "${measured_records}")"
          if ! diff -u --label declared --label measured "${declared_records}" "${measured_records}"; then
            echo "::error title=Isolation lane did not measure the scenario set it declares::the scenario names carrying \"outcome\": \"measured\" differ from .ci/isolation-lane-scenarios.txt. In the diff above, a '-' line is declared and unmeasured (deleted, renamed, or it declined) and a '+' line is measured and undeclared (added without updating the file)."
            exit 1
          fi

  # AAASM-2599: single aggregate gate that succeeds only when every functional
  # CI job passed or was intentionally skipped (path-routed). This is the one
  # status to make a required check in branch protection — it stays green for
  # PRs that legitimately skip whole areas, yet fails if any job failed or was
  # cancelled. Quality/acceptance jobs (coverage, sonar) are deliberately NOT
  # gated here: their failures are advisory and must not block merge.
  # AAASM-5677: makes "no check ran" a failure instead of a silent pass.
  #
  # `ci-success` counts a skipped need as a pass, which is correct given the
  # router but makes the router's globs load-bearing for merge safety now that
  # `CI Success` is the only required check. This job cross-checks the
  # declaration in `governance/ci-coverage.yaml` against the workflow files and
  # the tracked file tree, so a governance path that has fallen outside every
  # filter — or a required check that has stopped reporting — turns the merge
  # gate red rather than disappearing from the checks list.
  #
  # Blocks, by CONTRIBUTING's rule: it asserts a property (every
  # governance-bearing path is inside a required check's trigger surface), not
  # a metric. Pure Python, no toolchain, so it costs seconds.
  isolation-benchmark-harness:
    needs: [changes]
    if: needs.changes.outputs.benchmarks == 'true'
    name: Isolation benchmark harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --quiet ruff
      # `benchmarks/isolation/ruff.toml` is the only Python lint config in the
      # repository, and nothing was running it.
      - name: Lint the harness
        working-directory: benchmarks/isolation
        run: ruff check .
      # The self-test IS the negative control: it runs the harness against a
      # launcher whose degradation is known in advance and fails unless the
      # harness recovers it. Running it here is what stops "the benchmark
      # numbers are green" from being unfalsifiable — a harness that has
      # silently stopped detecting a 500 ms injected delay would otherwise keep
      # reporting GREEN for a backend that had become slow.
      #
      # The run rewrites `benchmarks/isolation/results/selftest-*.json` in
      # place — the harness has no output-directory option. Harmless here
      # because the checkout is thrown away, but it means running this locally
      # overwrites the committed evidence from the original measurement, so
      # restore those files afterwards if you do.
      - name: The harness can still detect a slowdown
        run: python3 benchmarks/isolation/harness/selftest.py

  # AAASM-5713: the one-time confined-arm measurement METHODOLOGY.md's
  # decision matrix has been waiting on. Manual-only — `workflow_dispatch`
  # only, deliberately NOT `needs.changes.outputs.benchmarks == 'true'` like
  # `isolation-benchmark-harness` above. This is a spike measurement (three
  # full arms, ~10 workload families each, on a shared runner), not a
  # regression gate; wiring it to the router would spend a Linux build and a
  # ~30+ minute run on every future PR that so much as edits a workload
  # script's comment. It is also deliberately absent from `ci-success`'s
  # `needs:` for the same reason — it must never gate a merge.
  #
  # Reuses `isolation-backend-linux`'s sandlock install pattern exactly
  # (AAASM-5712's pinned digest) rather than diverging from it — that job's
  # own steps are untouched.
  isolation-benchmark-confined-arm:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch'
    name: "Isolation benchmark: confined-arm measurement (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANDLOCK_VERSION: "0.8.6"
      SANDLOCK_SHA256: "86e89e5bdb2da748e683cda6908a95504ae6751f73d9dadf79cf0fc6843873fb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the host this run measures
        # First, and unconditionally — same reason as isolation-backend-linux.
        run: |
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '<securityfs not readable>')"
      - name: Install the confinement mechanism
        env:
          SANDLOCK_URL: https://github.com/multikernel/sandlock/releases/download/v${{ env.SANDLOCK_VERSION }}/sandlock-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o sandlock.tar.gz "$SANDLOCK_URL"
          echo "${SANDLOCK_SHA256}  sandlock.tar.gz" | sha256sum -c -
          mkdir -p sandlock-dist
          tar -xzf sandlock.tar.gz -C sandlock-dist
          sudo install -m 0755 sandlock-dist/sandlock /usr/local/bin/sandlock
          sandlock --version
          sandlock check || true
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: isolation-benchmark-confined-arm
      # `aa-cli` transitively compiles `aa-proto`, whose build.rs invokes
      # `protoc`. `ripgrep` is the `repo_traversal` family's `rg` requirement —
      # absent it, that family degrades to `skipped` rather than measuring
      # anything, and the CI-hosted `ubuntu-latest` image does not ship it.
      - name: Install protobuf compiler and ripgrep
        run: sudo apt-get install -y protobuf-compiler ripgrep
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the aasm and aa-gateway binaries
        # aa-gateway too: `aasm run` refuses a live (non-dry-run) launch unless
        # it can register the session against a reachable governance gateway
        # (AAASM-5349) — `aasm gateway start` resolves that binary alongside
        # `aasm` (aa-cli/src/commands/gateway/start.rs), so both need building.
        run: cargo build --release -p aa-cli --bin aasm -p aa-gateway --bin aa-gateway
      - name: Record every toolchain version the harness's environment block needs
        run: |
          rustc --version
          cargo --version
          python3 --version
          node --version
          pnpm --version
          rg --version
          git --version
          openssl version
      - name: Render the confined-arm policy against this run's scratch root
        # A fixed, pre-created scratch root — not the harness's own
        # `tempfile.mkdtemp` default — because the policy's write grant has to
        # name a path that exists before `aasm run` negotiates against it.
        # `--keep-scratch` on the confined-arm run below so this directory
        # survives for inspection if a family fails; `.gitignore`-equivalent
        # cleanup happens implicitly when the runner is torn down.
        run: |
          scratch="${{ github.workspace }}/.aabench-scratch"
          mkdir -p "$scratch"
          policy="${{ github.workspace }}/.aabench-confined-policy.yaml"
          benchmarks/isolation/policy/render.sh "$scratch" "$policy"
          cat "$policy"
          {
            echo "AABENCH_SCRATCH=$scratch"
            echo "AABENCH_SANDLOCK_POLICY=$policy"
            echo "AABENCH_AASM_BIN=${{ github.workspace }}/target/release/aasm"
          } >> "$GITHUB_ENV"
      - name: Confirm the rendered policy actually lowers (not not_stated)
        # Cheap, fast guard before spending the full multi-family run below on
        # a policy that would silently confine nothing — see
        # benchmarks/isolation/policy/README.md for what this checks and why.
        run: |
          "$AABENCH_AASM_BIN" run exec --isolation process --no-proxy \
            --policy "$AABENCH_SANDLOCK_POLICY" --dry-run -- true \
            | tee dry-run-report.txt
          for domain in filesystem_read filesystem_write network_egress; do
            if ! grep -qE "^  ${domain}[[:space:]]+stated" dry-run-report.txt; then
              echo "::error::${domain} did not lower to a stated requirement; the confined arm would not confine it. Check policy/confined-arm.yaml.tmpl against aa-isolation/src/lowering.rs."
              exit 1
            fi
          done
      - name: Unconfined baseline — re-captured on this host, this session
        # METHODOLOGY.md, "Cross-platform comparison is invalid": the darwin
        # baseline committed in results/ is not an admissible control for this
        # run. This one is.
        working-directory: benchmarks/isolation/harness
        run: |
          python3 aabench.py run --label unconfined-linux-ci \
            --out ../results/ci-unconfined-linux.json
      - name: Throttled negative control — re-captured on this host, this session
        working-directory: benchmarks/isolation/harness
        run: python3 aabench.py self-test --out-dir ../results
      - name: Start the governance gateway
        # A live (non-dry-run) `aasm run` refuses to launch unless it can
        # register the session against a reachable gateway — the --dry-run
        # guard step above never exercises this because a preview reports an
        # unmet precondition rather than refusing on it. Discovered from the
        # second confined-arm run (31816602980): sandlock was selected
        # correctly and every domain lowered as expected, but every family
        # still failed uniformly at ~230ms/exit 1, and the per-repetition log
        # (only visible once the hidden-file artifact bug above was also
        # fixed) named the real cause: "refusing to launch unregistered: the
        # governance gateway at http://127.0.0.1:50051 is unreachable".
        #
        # Detached (no --no-detach): the gateway outlives this step and keeps
        # serving for the confined-arm run below. The runner is destroyed at
        # job end, so nothing stops it explicitly.
        run: |
          "$AABENCH_AASM_BIN" gateway start --policy "$AABENCH_SANDLOCK_POLICY"
          for _ in $(seq 1 30); do
            if "$AABENCH_AASM_BIN" gateway status --json | grep -q '"running":[[:space:]]*true'; then
              echo "gateway is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::gateway did not report running within 30s"
          "$AABENCH_AASM_BIN" gateway status || true
          cat ~/.aasm/logs/gateway.log 2>/dev/null || true
          exit 1
      - name: Confined arm — sandlock
        # The launcher path must be absolute: runner.py's run_once() chdirs the
        # child to REPO_ROOT (the monorepo root) before exec, so a launcher
        # spec written relative to harness/ (as the README's earlier example
        # and this job's first attempt both did) resolves against the wrong
        # directory and every family fails identically and immediately — which
        # is exactly what happened here before this fix, discovered from the
        # uniform sub-3ms failures across every family including startup_nop.
        working-directory: benchmarks/isolation/harness
        run: |
          python3 aabench.py run --label sandlock-confined \
            --launcher "sh ${{ github.workspace }}/benchmarks/isolation/launchers/sandlock.sh" \
            --scratch-root "$AABENCH_SCRATCH" \
            --keep-scratch \
            --out ../results/ci-confined-linux.json
      - name: Stop the governance gateway
        if: always()
        run: $AABENCH_AASM_BIN gateway stop || true
      - name: Score confined against the fresh Linux baseline
        working-directory: benchmarks/isolation/harness
        run: |
          python3 aabench.py compare \
            --baseline ../results/ci-unconfined-linux.json \
            --candidate ../results/ci-confined-linux.json \
            --out ../results/ci-comparison-linux.json
      - name: Upload results
        # `always()`: a run that failed partway (one family's admissibility
        # gate, say) still has whatever it produced worth downloading — this
        # is a spike, not a gate, and a partial result is real evidence, not
        # nothing. Includes the per-repetition `*.log` files runner.py writes
        # under the scratch root (stdout+stderr of the launcher invocation,
        # not captured in the result JSON) — without these a failed family's
        # exit code has no accompanying diagnostic, which is how the first
        # attempt at this job took an extra round-trip to root-cause.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolation-benchmark-confined-arm-results
          path: |
            benchmarks/isolation/results/ci-*.json
            benchmarks/isolation/results/selftest-*.json
            .aabench-scratch/**/*.log
          retention-days: 30
          # `.aabench-scratch` starts with a dot, and upload-artifact excludes
          # hidden paths by default — the second confined-arm run (31816602980)
          # uploaded exactly the 7 JSON files and silently zero `.log` files,
          # discovered only after downloading the artifact and finding the
          # per-repetition stderr that should have explained a uniform exit-1
          # failure simply wasn't there.
          include-hidden-files: true
          if-no-files-found: warn

  governance-coverage:
    needs: [changes]
    if: needs.changes.outputs.governance == 'true'
    name: Governance CI coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --quiet pyyaml
      # The selftest runs first so a gate that has stopped detecting anything
      # fails loudly instead of passing everything.
      - name: Coverage gate still fails closed
        run: python3 scripts/check_governance_ci_coverage.py --selftest
      - name: Every governance-bearing path is inside a required check
        run: python3 scripts/check_governance_ci_coverage.py --verbose

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - dashboard-assets
      - build
      # AAASM-5385: asserts behaviour (does every commit in the range compile),
      # not a metric, so it blocks — see CONTRIBUTING, "Which CI jobs block a
      # merge". A gate that catches an unbuildable commit but does not block is
      # a report nobody reads, which is the condition it exists to end.
      - commit-range-build
      - fmt
      - clippy
      - docs
      - test
      - timescaledb-tests
      - migration-drift-check
      - deny
      # AAASM-5714: blocks, like `deny`. It asserts a distribution-boundary
      # property (no unreviewed license reaches a channel), not a metric, so an
      # advisory version of it would be a report nobody acts on.
      - backend-license
      # AAASM-5738: blocks. AAASM-5270 exit criterion 6 asks for behaviour
      # *verified* under egress-denied testing, and an advisory version of this
      # would be a dependency-tree argument again — which is what the criterion
      # already had and rejected as insufficient.
      - detection-egress-closure
      - no-std
      - buf-lint
      - schema-lint
      - openapi-drift
      - openapi-lint
      - compat-matrix-check
      - ebpf-build
      - e2e-ebpf-linux
      # AAASM-5708: blocks. It asserts behaviour — that the process-isolation
      # boundary still denies what it reports it denies — and it is the only
      # job in this workflow that can. Note the interaction it is written
      # around: this aggregator counts a *skipped* need as a pass, so the lane
      # carries `--require-evidence` and fails itself when it measured nothing,
      # rather than relying on a green here to mean anything.
      - isolation-backend-linux
      - benchmark
      - conformance
      - conformance-python
      - conformance-node
      - conformance-go
      - dashboard-typecheck
      - dashboard-build
      - dashboard-test
      # AAASM-5192: gated here deliberately, not left advisory. The exclusions
      # above are quality/acceptance signals; this one asserts functional
      # behaviour (routes render, client-side behaviour holds, the rendered app
      # still works against a stubbed backend) exactly as `dashboard-test` does,
      # so it belongs in the same bucket. Note what it does NOT assert: the
      # gated specs stub every call, so this is not an API-contract check and
      # cannot see backend drift; real-backend coverage is zero because the one
      # spec that talks to a live gateway needs `cargo` (dashboard/tests/e2e/
      # README.md, "What this gate does not prove"). An advisory e2e job would reproduce the condition
      # that caused AAASM-5191 — a suite nothing acts on — with extra steps. It
      # is credible as a gate only because its config quarantines the known-red
      # specs (AAASM-5195) and ratchets that list against a frozen baseline
      # (QUARANTINE_BASELINE in playwright.quarantine.ts).
      - dashboard-e2e
      # AAASM-5694: gated for the same reason as `dashboard-e2e`, and with more
      # force — this is the only lane that can observe backend contract drift at
      # all. Left advisory it would reproduce the defect it was built to fix: a
      # real-backend signal that exists, is green, and gates nothing.
      - dashboard-e2e-real-backend
      - dashboard-codegen-drift
      - aa-cli-compat
      - devint-reference-client
      # AAASM-5677: blocks. It asserts that every governance-bearing path is
      # inside the trigger surface of a required check — a property, not a
      # metric. Advisory, it would be a report on the health of the merge gate
      # that the merge gate itself ignores.
      - governance-coverage
      - isolation-benchmark-harness
    steps:
      - name: Verify no required job failed or was cancelled
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required CI job concluded with '$r'"
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs passed or were intentionally skipped."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

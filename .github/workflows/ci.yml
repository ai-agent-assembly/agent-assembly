name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "aa-*/**/*.rs"
      - "aa-*/**/*.sql"
      - "aa-*/**/*.toml"
      - "aa-*/**/*.py"
      - "aa-*/**/*.ts"
      - "aa-*/**/*.js"
      - "aa-*/**/*.mjs"
      - "aa-*/**/*.go"
      - "aa-*/**/*.wat"
      - "aa-*/**/*.sh"
      - "aa-*/**/*.json"
      - "aa-*/**/*.jsonl"
      - "proto/**/*.proto"
      - "conformance/**/*.rs"
      - "conformance/**/*.json"
      - "conformance/**/*.bin"
      - "conformance/**/*.toml"
      - "conformance/**/*.py"
      - "conformance/runner/requirements.txt"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      # AAASM-5385: the Rust jobs' own shell implementations, by exact filename.
      # Without these, editing a gate's script does not re-run the gate that the
      # script IS. Named individually rather than `.ci/*.sh` because the other
      # four scripts in `.ci/` belong to docs.yml, release.yml and
      # sdk-sha-drift.yml, and have no business triggering the Rust matrix.
      - ".ci/verify-range-builds.sh"
      - ".ci/check-compatibility-matrix.sh"
      # AAASM-5738: same rule, for the detection-closure gate. Paired with the
      # `rust` router filter below; on `main` this is what makes a script-only
      # merge produce a check run at all, rather than none — and an absent check
      # reads as "not applicable", not as "failing".
      - "scripts/check_detection_egress_closure.py"
      # AAASM-5708: the evidence-ledger summary and the nextest profile that
      # produces its denominator. Paired with the `isolation_backend` router
      # filter below — a router filter without a matching `on.*.paths` entry is
      # a dead trigger (ADR 0028), and this lane's whole purpose is to fail when
      # it measures nothing, which it cannot do if it never runs.
      - ".ci/test-evidence-summary.sh"
      # AAASM-5712: the scenario set that lane diffs its ledger against. Editing
      # it alone is how a deletion gets declared, so it has to select the job
      # that checks it — otherwise the declaration merges without the lane it
      # describes ever running.
      - ".ci/isolation-lane-scenarios.txt"
      - ".config/nextest.toml"
      - "openapi/v1.yaml"
      - "schemas/**/*.json"
      - "schemas/**/*.yaml"
      - ".spectral.yaml"
      - ".github/workflows/ci.yml"
      - "dashboard/**/*.ts"
      - "dashboard/**/*.tsx"
      - "dashboard/**/*.css"
      - "dashboard/**/*.js"
      - "dashboard/**/*.mjs"
      - "dashboard/**/*.cjs"
      - "dashboard/package.json"
      - "dashboard/tsconfig.json"
      - "dashboard/.npmrc"
      - "dashboard/pnpm-lock.yaml"
      - "dashboard/index.html"
      - "sonar-project.properties"
      # AAASM-5282: the DI-API TypeScript reference client and its Rust
      # contract-test harness. Paired with the `devint_client` router filter
      # below — a router filter without a matching `on.*.paths` entry is a dead
      # trigger, and a trigger that looks like coverage but is not is worse than
      # no trigger at all (ADR 0028).
      - "examples/aa-devint-reference-client/**/*.ts"
      - "examples/aa-devint-reference-client/**/*.mjs"
      - "examples/aa-devint-reference-client/**/*.rs"
      - "examples/aa-devint-reference-client/**/*.json"
      - "examples/aa-devint-reference-client/**/*.yaml"
      - "examples/aa-devint-reference-client/**/*.cjs"
      - "examples/aa-devint-reference-client/**/*.toml"
      - "examples/aa-devint-reference-client/.npmrc"
      # AAASM-5714: the isolation-backend license/provenance gate's own inputs.
      # Paired with the `backend_license` router filter below — a router filter
      # without a matching `on.*.paths` entry is a dead trigger (ADR 0028).
      # `deny.toml` is included because the manifest's allowlist mirrors it; a
      # license added to one and not the other is exactly the drift this catches.
      - "metadata/isolation-backends.json"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/check-backend-license-compliance.sh"
      # AAASM-5714: the files that actually DECIDE what each channel ships.
      # These matter more than the manifest itself. Without them the gate fires
      # only when someone edits the manifest — i.e. only when they are already
      # doing the right thing — while a PR that bundles a backend binary by
      # editing the release pipeline alone never triggers this workflow at all,
      # so the job never runs and `ci-success` counts the skip as a pass.
      # Listed by exact filename, never a bare `dir/**` (CONTRIBUTING.md).
      - ".github/workflows/release.yml"
      - ".github/workflows/docker.yml"
      - "scripts/install-cli.sh"
      - "scripts/install.sh"
      - "metadata/versions.rb"
      - "scripts/check-release-completeness.sh"
      # AAASM-5714 AC4: the Dockerfiles are the `ghcr-container` channel's real
      # packaging surface — a binary enters a published image through a
      # Dockerfile instruction, not through the workflow that calls buildx.
      # Measured with picomatch (the matcher dorny/paths-filter uses) against
      # the filter as it stood before this change: `aa-gateway/Dockerfile` and
      # `docker/Dockerfile.node-20-slim` matched NO existing entry, so bundling
      # a backend by editing one of them selected no job at all. The smoke
      # fixtures under `docker/smoke/**` stay unselected — they build nothing
      # that is published.
      - "aa-*/Dockerfile"
      - "docker/Dockerfile.*"
      # AAASM-5677: inputs of the `governance-coverage` gate below. Paired with
      # the `governance` router filter — a router filter without a matching
      # `on.*.paths` entry is a dead trigger, and on `push` that means the gate
      # never runs on the merge that breaks it.
      #
      # `.github/workflows/*.yml` is load-bearing rather than incidental: the
      # gate reads the workflow files, so re-adding an `on.pull_request.paths`
      # filter to a governance workflow — the exact regression this closes —
      # must re-run it. Extension-qualified, never a bare directory wildcard
      # (CONTRIBUTING). The router keeps the cost down: a workflow-only change
      # leaves `rust` false, so only `governance-coverage` runs.
      - "governance/**"
      - "schemas/capability-manifest/**"
      - "scripts/validate_capability_manifest.py"
      - "scripts/check_governance_ci_coverage.py"
      - "docs/src/adr/**/*.md"
      - ".github/workflows/*.yml"
      - "verification-reports/AAASM-5527-capability-coverage-matrix.yaml"
      - "verification-reports/AAASM-5527-capability-coverage-matrix-and-threat-model.md"
      # AAASM-5713: the isolation benchmark harness. It ships pre-registered
      # thresholds and a self-test that exists to prove the harness can still
      # detect a slowdown — and until now NO job in this workflow covered
      # `benchmarks/**` at all, so both were local-only and unexercised on every
      # merge after the one that added them. That is acceptable for a harness
      # nobody depends on; it is not acceptable for the evidence base of this
      # Epic's Go / No-Go decision. Paired with the `benchmarks` router filter
      # below — a router filter without a matching `on.*.paths` entry is a dead
      # trigger, and on `push` that means the gate never runs on the merge that
      # breaks it.
      - "benchmarks/**/*.py"
      - "benchmarks/**/*.sh"
      - "benchmarks/**/*.json"
      - "benchmarks/**/*.toml"
  pull_request:
    branches: [main]
    # AAASM-5675: deliberately NOT path-filtered, unlike `push` above.
    #
    # `main` carried no required status checks at all, so a pull request could
    # merge with every check red. Requiring the `CI Success` aggregator is the
    # fix, and it only works if that check reliably reports: a workflow that
    # never triggers produces no check run, and a required check that never
    # arrives leaves the pull request waiting forever. A docs-only or
    # governance-only change hits exactly that.
    #
    # Job selection does not live in this filter — it lives in the `changes`
    # router below. But it was NOT the only thing gating every job:
    # `commit-range-build` has no router condition and never has, and this
    # filter was what kept it off unrelated pull requests. It deliberately
    # stays ungated (see the comment on that job for why a net-diff router
    # would reopen the AAASM-5385 hole), so it now runs on every pull request
    # and the cost is disclosed there rather than hidden.
    #
    # **If you add a job here, gate it on `needs.changes.outputs.*`** — this
    # filter is no longer a backstop.
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # AAASM-2579: incremental artifacts bloat the rust-cache and give no
  # benefit on cold CI runners; pin off uniformly across every Rust job.
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      ebpf: ${{ steps.filter.outputs.ebpf }}
      proto: ${{ steps.filter.outputs.proto }}
      schema: ${{ steps.filter.outputs.schema }}
      openapi: ${{ steps.filter.outputs.openapi }}
      storage: ${{ steps.filter.outputs.storage }}
      conformance: ${{ steps.filter.outputs.conformance }}
      devint_client: ${{ steps.filter.outputs.devint_client }}
      backend_license: ${{ steps.filter.outputs.backend_license }}
      isolation_backend: ${{ steps.filter.outputs.isolation_backend }}
      governance: ${{ steps.filter.outputs.governance }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'aa-*/**/*.rs'
              - 'aa-*/**/*.sql'
              - 'aa-*/**/*.toml'
              - 'aa-*/**/*.py'
              - 'aa-*/**/*.ts'
              - 'aa-*/**/*.js'
              - 'aa-*/**/*.mjs'
              - 'aa-*/**/*.go'
              - 'aa-*/**/*.wat'
              - 'aa-*/**/*.sh'
              - 'aa-*/**/*.json'
              - 'aa-*/**/*.jsonl'
              - 'proto/**/*.proto'
              - 'conformance/**/*.rs'
              - 'conformance/**/*.json'
              - 'conformance/**/*.bin'
              - 'conformance/**/*.toml'
              - 'conformance/**/*.py'
              - 'conformance/runner/requirements.txt'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.ci/verify-range-builds.sh'
              - '.ci/check-compatibility-matrix.sh'
              # AAASM-5738: the closure gate's own script. Its VERDICT is the
              # `EXPECTED` table inside this file, not the Cargo manifests — so
              # without this entry a pull request that only edits the script
              # (adding a crate to EXPECTED to silence a drift, loosening the
              # parser, deleting a selection) skips the job, and `ci-success`
              # counts a skip as a pass. The gate would merge its own weakening
              # having never run.
              - 'scripts/check_detection_egress_closure.py'
              - 'openapi/v1.yaml'
              - '.spectral.yaml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**/*.ts'
              - 'dashboard/**/*.tsx'
              - 'dashboard/**/*.css'
              - 'dashboard/**/*.js'
              - 'dashboard/**/*.mjs'
              - 'dashboard/**/*.cjs'
              - 'dashboard/package.json'
              - 'dashboard/tsconfig.json'
              - 'dashboard/.npmrc'
              - 'dashboard/pnpm-lock.yaml'
              - 'dashboard/index.html'
              - 'openapi/v1.yaml'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            # AAASM-2599: fine-grained filters so single-purpose validators run
            # only when their own inputs change (each is a strict subset of the
            # broad `rust` set above, so this can never lose coverage). Always
            # include this workflow so editing CI re-runs everything.
            proto:
              - 'proto/**/*.proto'
              - 'aa-proto/**/*.rs'
              - 'aa-proto/**/Cargo.toml'
              - '.github/workflows/ci.yml'
            schema:
              - 'schemas/**/*.json'
              - 'schemas/**/*.yaml'
              - '.github/workflows/ci.yml'
            openapi:
              - 'aa-api/**/*.rs'
              - 'aa-api/**/Cargo.toml'
              - 'openapi/v1.yaml'
              - '.spectral.yaml'
              - '.github/workflows/ci.yml'
            storage:
              - 'aa-gateway/**/*.rs'
              - 'aa-gateway/**/Cargo.toml'
              - 'aa-gateway/**/*.sql'
              - 'aa-storage*/**/*.rs'
              - 'aa-storage*/**/Cargo.toml'
              - 'aa-storage*/**/*.sql'
              - '.github/workflows/ci.yml'
            # AAASM-4454: explicit, self-documenting trigger for the
            # integration-surface contract tests, which police that the gRPC
            # registration surface the SDK dials stays present on the server(s)
            # the CLI starts. These paths are a strict subset of `rust` above
            # (so this never loses coverage); the conformance job ORs the two,
            # so the contract still runs if `rust` is ever narrowed. Every path
            # here is covered by an `on.*.paths` entry (`aa-*/**/*.rs`,
            # `conformance/**/*.rs`), so this is a live trigger, not a dead one.
            # AAASM-5282: the DI-API TypeScript reference client. Its contract
            # tests run against the real `aa_runtime::devint` server through the
            # `aa-devint-harness` binary, so the proto and the runtime's DI-API
            # module are inputs too — a change to either can break the client
            # without touching a single file under `examples/`. Every path here
            # has a matching `on.*.paths` entry above, so this is a live trigger.
            devint_client:
              - 'examples/aa-devint-reference-client/**'
              - 'proto/devint.proto'
              - 'aa-runtime/src/devint/**'
              - '.github/workflows/ci.yml'
            conformance:
              - 'aa-cli/src/commands/start.rs'
              - 'aa-gateway/src/local_mode.rs'
              - 'aa-gateway/src/main.rs'
              - 'aa-api/src/**/*.rs'
              - 'conformance/**/*.rs'
              - 'conformance/**/*.json'
              - 'conformance/**/*.bin'
              - 'conformance/**/*.toml'
              - 'proto/**/*.proto'
              - '.github/workflows/ci.yml'
            # AAASM-2580: gate the slow eBPF --release jobs (fat-LTO BPF build +
            # bpf-linker compile) so they only run when eBPF code — or this
            # workflow — actually changes. Non-eBPF PRs skip them.
            ebpf:
              - 'aa-ebpf*/**/*.rs'
              - 'aa-ebpf*/**/*.toml'
              - '.github/workflows/ci.yml'
              - 'scripts/build-ebpf-probes.sh'
              - '.github/workflows/release.yml'
            # AAASM-5714: the isolation-backend license/provenance gate. Its
            # inputs are NOT a subset of `rust` — `metadata/isolation-backends.json`
            # and `THIRD_PARTY_NOTICES.md` match no `aa-*/**` pattern — so this
            # needs its own filter and its own `on.*.paths` entries (added
            # above) rather than riding on the Rust matrix.
            backend_license:
              - 'metadata/isolation-backends.json'
              - 'THIRD_PARTY_NOTICES.md'
              - 'scripts/check-backend-license-compliance.sh'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
              # The channel-deciding files. A backend enters a distribution
              # channel by a change to one of THESE, not to the manifest — the
              # manifest is only where an honest author records it. Gating on
              # the manifest alone would mean the gate fires exclusively for
              # people already doing the right thing.
              - '.github/workflows/release.yml'
              - '.github/workflows/docker.yml'
              - 'scripts/install-cli.sh'
              - 'scripts/install.sh'
              - 'metadata/versions.rb'
              - 'scripts/check-release-completeness.sh'
              # AAASM-5714 AC4. Paired with the matching `on.push.paths`
              # entries above — a router filter without one is a dead trigger.
              - 'aa-*/Dockerfile'
              - 'docker/Dockerfile.*'
            # AAASM-5708: the Linux process-isolation backend and the contract it
            # implements. Narrower than `rust` on purpose — this lane installs a
            # third-party confinement binary and runs eight confined processes
            # per discovery, so it should not ride on every Rust change. Every
            # path here has a matching `on.*.paths` entry above, so it is a live
            # trigger; `schedule` and `workflow_dispatch` back it up so a change
            # elsewhere cannot leave the backend unmeasured on main indefinitely.
            isolation_backend:
              - 'aa-isolation/**/*.rs'
              - 'aa-isolation/**/Cargo.toml'
              - 'aa-isolation-sandlock/**/*.rs'
              - 'aa-isolation-sandlock/**/Cargo.toml'
              # AAASM-5711: the end-to-end confined-launch scenarios and the
              # launch path they measure. Without these, editing either selects
              # no lane that can measure them, and `ci-success` counts a skipped
              # lane as a pass.
              - 'aa-cli/tests/run_isolation_linux.rs'
              - 'aa-cli/src/commands/run.rs'
              - 'aa-integration-tests/tests/evidence/mod.rs'
              - '.ci/test-evidence-summary.sh'
              - '.ci/isolation-lane-scenarios.txt'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            # AAASM-5713: the isolation benchmark harness. Extension-qualified
            # rather than a bare `benchmarks/**` so a results JSON committed by
            # a measurement run selects the gate (its schema is what `compare`
            # reads) while a README edit does not.
            benchmarks:
              - 'benchmarks/**/*.py'
              - 'benchmarks/**/*.sh'
              - 'benchmarks/**/*.json'
              - 'benchmarks/**/*.toml'
              - '.github/workflows/ci.yml'
            # AAASM-5677: the governance surface. Before this filter existed, a
            # change to `governance/capability-manifest.yaml` selected NO job in
            # this workflow — every `needs` of `ci-success` skipped, and the
            # aggregate reported the skip as a pass. `CI Success` is the sole
            # required check, so that was a governance path with no merge gate
            # at all.
            governance:
              - 'governance/**'
              - 'schemas/capability-manifest/**'
              - 'scripts/validate_capability_manifest.py'
              - 'scripts/check_governance_ci_coverage.py'
              - 'docs/src/adr/**/*.md'
              - '.github/workflows/*.yml'
              - 'verification-reports/AAASM-5527-capability-coverage-matrix.yaml'
              - 'verification-reports/AAASM-5527-capability-coverage-matrix-and-threat-model.md'
  # AAASM-2582: build the dashboard assets (embedded by aa-cli's build.rs)
  # exactly once and share them via an artifact, instead of running
  # `pnpm install && pnpm build` in each of build/clippy/test/coverage.
  dashboard-assets:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    name: Build dashboard assets (shared)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Build dashboard assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload dashboard dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/
          retention-days: 1

  build:
    needs: [changes, dashboard-assets]
    if: needs.changes.outputs.rust == 'true'
    name: Build
    runs-on: ubuntu-latest
    env:
      # AAASM-2581: select mold for host-target links only. Cross targets
      # (bpfel/wasm32/thumbv7) keep their own linkers — this is per-target,
      # not a global RUSTFLAGS, on purpose.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Download prebuilt dashboard assets (required by aa-cli)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/
      - name: Build workspace
        # aa-ebpf requires nightly (aya-build invokes rustup run nightly).
        # It is validated by the dedicated ebpf-build job.
        run: cargo build --workspace --exclude aa-ebpf

  # AAASM-5385. Every other Rust job builds exactly one tree: the merge result.
  # That is the right tree to build (this repository never overrides `ref:`, so
  # `actions/checkout` gives `refs/pull/N/merge` on a pull_request, not the PR
  # head), but building only it leaves every INTERMEDIATE commit unbuilt, and an
  # intermediate commit that a later commit repairs reaches `main` with every
  # check green. c596246a2 did exactly that. `git bisect` then cannot run a test
  # at that point in history, which is the cost CONTRIBUTING's "keep commits
  # small and bisectable" was meant to buy.
  #
  # This job asserts behaviour — does each commit compile — so per CONTRIBUTING
  # ("Which CI jobs block a merge") it is a member of `ci-success` and blocks.
  #
  # It deliberately does NOT gate on `needs.changes.outputs.rust`. That router is
  # `dorny/paths-filter` over the PR's NET three-dot diff, which is blind to
  # intermediate commits by construction — and this job exists precisely because
  # intermediate commits differ from the net diff. Gating on it would reopen the
  # hole: a PR whose net diff touches only `dashboard/**` sets `rust=false`, so
  # the job would skip, `ci-success` treats a skipped need as passing, and a
  # sequence of `break aa-gateway` -> `revert it` -> `dashboard work` would land
  # an unbuildable commit on `main` with every check green. `is_skippable` in the
  # script already skips non-build commits, per commit, where the decision is
  # actually sound; a job-level allow-list only subtracts coverage.
  #
  # pull_request-only is a COST choice, not a capability one: `main`'s commits
  # are merges (`HEAD^1..HEAD` would walk fine on push), but every commit in that
  # range was already walked by this job on the PR that introduced it.
  commit-range-build:
    # AAASM-5675 — COST DISCLOSURE, deliberately not a router gate.
    #
    # Removing `on.pull_request.paths` removed this job's only gating: it has
    # never carried a `needs.changes.outputs.*` condition. So it now runs on
    # every pull request, including a one-line README fix. That cost is real and
    # is stated here rather than left to be discovered:
    #
    #   * ~1m07s of `cargo check` on a warm cache — the FLOOR for any pull
    #     request, because `is_skippable()` never skips a merge commit and the
    #     synthetic `refs/pull/N/merge` head is always the last element of the
    #     range. Every PR builds at least that one commit.
    #   * 6m43s measured on this branch's own head run (2 build-relevant commits).
    #   * ~5m for a cold first commit, per this job's own env comment.
    #
    # A first review asked for either a gate or an explicit justification of the
    # cost. **The gate is not available**, and the paragraph directly above says
    # why: `needs.changes.outputs.rust` is a `dorny/paths-filter` over the PR's
    # NET three-dot diff, and this job exists precisely because intermediate
    # commits differ from that diff. An earlier revision of this PR added exactly
    # that gate; it would have reopened the AAASM-5385 hole (break -> revert ->
    # dashboard work lands an unbuildable commit with every check green) and it
    # also silently dropped coverage of `schemas/**` and the two `examples/`
    # workspace members, which `.ci/verify-range-builds.sh` classifies MUST BUILD.
    #
    # `CONTRIBUTING.md` "No filter at all" is satisfied by the `pull_request`
    # condition below; `CONTRIBUTING.md` (`ci-success` treats a skipped need as
    # passing — "if your job can be broken by a change outside its own filter, it
    # needs a different guard") is what rules the net-diff router out. A
    # range-aware guard would be the real answer and does not exist yet; until it
    # does, paying the floor cost is the correct trade against landing an
    # unbuildable commit on `main`.
    if: github.event_name == 'pull_request'
    name: Every commit in the range builds
    runs-on: ubuntu-latest
    env:
      # AAASM-2581: select mold for host-target links only.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Must sit inside the workspace: `Swatinem/rust-cache` caches
      # `$GITHUB_WORKSPACE/target` and nothing else. The script otherwise
      # defaults this to a temp dir it deletes on exit, which leaves the cache
      # unpopulated and re-pays the cold dependency build on EVERY run, forever.
      # Measured on the first run of this job: 5m03s for the first commit vs
      # ~33s for each subsequent one — that 5m03s is the part being cached.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole job is a walk over history, so the default shallow clone
          # cannot serve it: `git rev-list HEAD^1..HEAD` needs the base's
          # ancestry present. No `ref:` — the default merge ref is the point.
          fetch-depth: 0
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build every commit the merge introduces
        run: .ci/verify-range-builds.sh

  fmt:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: [changes, dashboard-assets]
    if: needs.changes.outputs.rust == 'true'
    name: Clippy lint
    runs-on: ubuntu-latest
    env:
      # AAASM-2581: select mold for host-target links only.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Download prebuilt dashboard assets (required by aa-cli)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/
      - name: Run Clippy
        # aa-ebpf requires nightly (aya-build invokes rustup run nightly).
        # It is linted by the dedicated ebpf-build job.
        run: cargo clippy --workspace --all-targets --all-features --exclude aa-ebpf -- -D warnings

      # AAASM-5682. The run above cannot see a cfg gate that is too wide: with
      # every feature on, an item gated to a superset of its uses still has its
      # uses. That is how 14 clippy errors reached `main` — `-p conformance
      # --all-targets` exited 101 there while this job stayed green.
      #
      # `--all-targets` is deliberately absent from the aa-core selections:
      # aa-core carries a self dev-dependency with `features = ["serde",
      # "schemars"]`, so `--all-targets` force-opens both gates and the run
      # stops discriminating. Lib-only is what moved with the fix.
      #
      # Each line below was measured 101-before / 0-after on that change; the
      # two combinations that were green either side (`--features serde` and
      # `--features serde,schemars`) are omitted rather than run for symmetry.
      - name: Clippy — feature-gate selections the all-features run cannot see
        run: |
          set -euo pipefail
          cargo clippy -p aa-core --lib -- -D warnings
          cargo clippy -p aa-core --lib --features schemars -- -D warnings
          cargo clippy -p conformance --all-targets -- -D warnings

  docs:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check rustdoc (no undocumented public items)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features -p aa-core

  test:
    needs: [changes, dashboard-assets]
    if: needs.changes.outputs.rust == 'true'
    name: Test
    runs-on: ubuntu-latest
    env:
      # AAASM-2581: select mold for host-target links only.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    services:
      # AAASM-1741: postgres for the env-gated storage::postgres::tests
      # in aa-gateway. Tests skip cleanly when AAASM_DATABASE_URL is unset
      # (any non-CI environment); CI exports it on the Run tests step so
      # the suite actually exercises the PostgresBackend.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aasm
          POSTGRES_PASSWORD: aasm
          POSTGRES_DB: aasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout sibling node-sdk (for e2e_sdk_node fixtures)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-agent-assembly/node-sdk
          path: node-sdk
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - name: Free up runner disk space
        # AAASM-2581: selecting mold changes the rust-cache key (it hashes
        # RUSTFLAGS), so the first run rebuilds the workspace cold. The Test
        # job is the heaviest disk consumer (cold target/ + nextest archive +
        # node_modules + node-sdk native build + postgres testcontainer image)
        # and, unlike Coverage, never frees target/. Reclaim ~25 GB of
        # preinstalled toolchains we don't use so the cold build fits.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            aa-integration-tests/tests/fixtures/agents/typescript/pnpm-lock.yaml
      - name: Download prebuilt dashboard assets (required by aa-cli)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/
      - name: "Symlink node-sdk for TypeScript fixture file: dependency"
        run: ln -sfn "$GITHUB_WORKSPACE/node-sdk" "$(dirname "$GITHUB_WORKSPACE")/node-sdk"
      - name: Build Node.js native binding + TS dist (e2e_sdk_node real_* tests, AAASM-1602)
        # MUST run BEFORE the fixture's `pnpm install` — pnpm's `file:`
        # protocol copies the package contents at install time, so dist/
        # and the napi `.node` must already exist when fixture install
        # runs. Use the symlinked sibling path (created above) so cargo
        # sees the inner Cargo.toml at its own root, not inside the
        # agent-assembly workspace.
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/node-sdk"
          pnpm install --no-frozen-lockfile
          pnpm native:build
          pnpm build
      - name: Install TypeScript fixture dependencies (e2e_sdk_node)
        working-directory: aa-integration-tests/tests/fixtures/agents/typescript
        run: pnpm install --frozen-lockfile
      - name: Pre-build aasm binary (AAASM-2340)
        # Compiling aa-cli (which transitively pulls wasmtime via aa-sandbox)
        # once serially is cheaper than letting concurrent nextest workers
        # serialise on the build lock — each per-test `cargo run -p aa-cli`
        # re-walks the build graph and blocks on the lock under contention.
        # Tests then spawn the pre-built binary directly via AASM_BIN_PATH.
        run: cargo build --quiet -p aa-cli --bin aasm
      - name: Run tests
        # aa-ebpf requires nightly (aya-build invokes rustup run nightly) and has no
        # unit tests. Validated by the dedicated ebpf-build job.
        # Relax p99 SLA for shared CI runners; nextest runs all crate tests
        # concurrently which inflates tail latency well beyond bare-metal.
        # The dedicated Benchmark job enforces the strict 15ms default.
        # 5000ms absorbs the heavy noisy-neighbor variance currently seen on
        # GitHub-hosted runners (observed p99 1.2-2.7s under concurrent load
        # as of 2026-05; the prior 500ms ceiling was set when p99 was ~270ms).
        env:
          AA_BENCH_SLA_P99_MS: "5000"
          AAASM_DATABASE_URL: "postgres://aasm:aasm@localhost:5432/aasm_test"
          # AAASM-2340: skip per-test cargo-run overhead by spawning the
          # binary pre-built in the previous step. CliFixture::cmd and the
          # in-test command builders honour AASM_BIN_PATH; absent it they
          # fall back to cargo run for local dev.
          AASM_BIN_PATH: ${{ github.workspace }}/target/debug/aasm
        # AAASM-5334: `--no-fail-fast` so a red run reports EVERY failing test,
        # not just the ones that happened to be dispatched before nextest
        # cancelled. Without it the reported blast radius is arbitrary and
        # misleadingly small: run 30689213155 (main, 2026-08-01) cancelled after
        # `1681/6267 tests run` — 73% of the suite, including every integration
        # binary, never executed, so the job reported 1 failure out of an unknown
        # true total. A reviewer reasonably reads that as "localised" and it may
        # not be.
        #
        # The runner-minute cost is small and bounded, because fail-fast cannot
        # skip the expensive part. nextest compiles all 328 test binaries before
        # running any test; on that run compilation was ~8m30s of the 8m43s step.
        # Only the test phase is truncated, and a complete test phase is 191.7s
        # (run 30686659787) against 13.2s truncated — so the worst case is ~3
        # extra minutes, paid only on runs that are already failing.
        run: cargo nextest run --workspace --no-tests=pass --exclude aa-ebpf --no-fail-fast
      - name: Run aa-gateway doctests
        # AAASM-5354: nextest does not execute doctests, and nothing else in
        # this workflow ran `cargo test --doc`, so every doctest in the
        # workspace has always been dead weight in CI. That matters here
        # specifically: `engine::detection::DetectionPass` carries the
        # `compile_fail` case that is the evidence for ADR 0032 validation
        # requirement 10 — the out-of-process provider boundary — and it was
        # never being executed.
        #
        # Scoped to aa-gateway on purpose. Workspace-wide doctests have never
        # run, so enabling them all at once would surface unrelated pre-existing
        # breakage in a PR that has nothing to do with it. Widening this is
        # worth its own ticket.
        run: cargo test --doc -p aa-gateway

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [changes, dashboard-assets]
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.rust == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-coverage'))
    env:
      # AAASM-1741: lets the env-gated storage::postgres::tests run under
      # cargo llvm-cov so codecov/patch sees coverage for the PG backend.
      AAASM_DATABASE_URL: "postgres://aasm:aasm@localhost:5432/aasm_test"
      # AAASM-2581: select mold for host-target links only.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aasm
          POSTGRES_PASSWORD: aasm
          POSTGRES_DB: aasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Free disk space (reclaim runner space for llvm-cov build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout sibling node-sdk (for e2e_sdk_node fixtures)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-agent-assembly/node-sdk
          path: node-sdk
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f7f2bd74f95d407a45d96b106f26d4f6c238fab # cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            dashboard/pnpm-lock.yaml
            aa-integration-tests/tests/fixtures/agents/typescript/pnpm-lock.yaml
      - name: Download prebuilt dashboard assets (required by aa-cli)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist-rust
          path: dashboard/dist/
      - name: "Symlink node-sdk for TypeScript fixture file: dependency"
        run: ln -sfn "$GITHUB_WORKSPACE/node-sdk" "$(dirname "$GITHUB_WORKSPACE")/node-sdk"
      - name: Build Node.js native binding + TS dist (e2e_sdk_node real_* tests, AAASM-1602)
        # MUST run BEFORE the fixture's `pnpm install` — pnpm's `file:`
        # protocol copies the package contents at install time, so dist/
        # and the napi `.node` must already exist when fixture install
        # runs. Use the symlinked sibling path (created above) so cargo
        # sees the inner Cargo.toml at its own root, not inside the
        # agent-assembly workspace.
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/node-sdk"
          pnpm install --no-frozen-lockfile
          pnpm native:build
          pnpm build
      - name: Install TypeScript fixture dependencies (e2e_sdk_node)
        working-directory: aa-integration-tests/tests/fixtures/agents/typescript
        run: pnpm install --frozen-lockfile
      - name: Pre-build aasm binary (AAASM-2340)
        # See sonar.yml for the rationale — same pattern, same reason.
        run: |
          cargo build --quiet -p aa-cli --bin aasm
          mkdir -p "$RUNNER_TEMP/aasm-bin"
          mv target/debug/aasm "$RUNNER_TEMP/aasm-bin/aasm"
          rm -rf target/debug

      - name: Generate coverage report
        env:
          AASM_BIN_PATH: ${{ runner.temp }}/aasm-bin/aasm
        # aa-ebpf requires nightly and has no testable userspace logic — excluded.
        # aa-devtool-claude-code is run separately (step 2) without docker-integration:
        # the docker-integration feature builds aa-proxy from scratch inside Docker
        # and doesn't add instrumented coverage. Running it under --all-features would
        # add 8+ minutes of Docker build time with zero coverage benefit.
        run: |
          # sustained_load_p99_under_5ms, all_layers_run_independently, and
          # auth_rate_limit_resets_after_window are timing-sensitive tests that
          # fail under llvm-cov instrumentation overhead — skipped in coverage
          # runs only. The `handle_shutdown_*` local_mode tests (AAASM-1728) join
          # the same allow-list: they spawn an axum server + reqwest client and
          # assert sub-500 ms shutdown, which wedges under llvm-cov's 2-5× overhead.
          #
          # The `ebpf_*` tests in aa-integration-tests/tests/e2e_ebpf.rs are the
          # AAASM-1520 Layer 3 suite: they require nightly + bpf-linker + the
          # built BPF probes + root, none of which Coverage provides
          # (`--all-features` activates them but `--exclude aa-ebpf` means the
          # BPF object never gets built, so `Ebpf::load` trips on empty bytes).
          # The dedicated `e2e-ebpf-linux` job is authoritative for these.
          cargo llvm-cov nextest --no-report --all-features --workspace \
            --exclude aa-ebpf --exclude aa-devtool-claude-code \
            --no-tests=pass \
            -E 'not test(sustained_load_p99_under_5ms) and not test(all_layers_run_independently) and not test(auth_rate_limit_resets_after_window) and not test(ebpf_) and not test(handle_shutdown_)'
          cargo llvm-cov nextest --no-report -p aa-devtool-claude-code --no-tests=pass
          cargo llvm-cov --no-run --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          name: Rust unit tests
          slug: ai-agent-assembly/agent-assembly
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust
          verbose: true
          fail_ci_if_error: false
      - name: Upload Rust coverage (LCOV) for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-lcov
          path: lcov.info
          # AAASM-3829: 14d (not 1d) so the AAASM-3197 cross-run backfill in the
          # `sonar` job reliably finds this artifact when a Rust-less main push
          # (dashboard-only / dep bump) path-skips the `coverage` job — otherwise
          # the scan silently runs without Rust LCOV (dashboard-only, ~5k lines).
          retention-days: 14

  # AAASM-1858: dedicated TimescaleDB job for env-gated tests in
  # aa-gateway. Sibling tests (in storage::timescale::tests and
  # storage::postgres::tests) check the `TIMESCALEDB_AVAILABLE` env
  # var and either run-and-assert against a TimescaleDB-enabled
  # cluster (this job) or skip (the regular `test` job above, which
  # runs against vanilla postgres:18-alpine and leaves the env unset).
  # The `timescale/timescaledb` image lags vanilla postgres by one
  # major; pg17 is the latest published tag as of 2026-05.
  timescaledb-tests:
    needs: [changes]
    if: needs.changes.outputs.storage == 'true'
    name: TimescaleDB Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: aasm
          POSTGRES_PASSWORD: aasm
          POSTGRES_DB: aasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest
      - name: Run TimescaleDB tests
        # The `timescale` substring filter matches all 9 env-gated tests
        # across SD-1..SD-4: storage::timescale::tests::* (probe) plus
        # storage::postgres::tests::{migrate_0002_*timescaledb*,
        # apply_timescaledb_setup_*, healthcheck_reports_timescale_*}.
        env:
          AAASM_DATABASE_URL: "postgres://aasm:aasm@localhost:5432/aasm_test"
          TIMESCALEDB_AVAILABLE: "1"
        run: cargo nextest run -p aa-gateway timescale

  migration-drift-check:
    needs: [changes]
    if: needs.changes.outputs.storage == 'true'
    name: Migration drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest
      - name: Run gateway migration drift test
        # Boots a throwaway Postgres (testcontainers) and applies the
        # aa-storage-postgres MIGRATOR through the gateway. Fails if the
        # canonical MVP migrations no longer apply cleanly or audit_logs drifts.
        run: cargo nextest run -p aa-gateway -E 'binary(migration_boot)'

  deny:
    needs: [changes]
    # AAASM-3565 supply-chain advisory gate. The `rust` filter already matches
    # aa-*/** (so aa-devtool*/** and aa-devtool-contract/**), Cargo.toml,
    # Cargo.lock and deny.toml — any devtool or manifest change runs this job.
    if: needs.changes.outputs.rust == 'true'
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # AAASM-3565 devtool contract boundary guard: every aa-devtool-* plugin
      # must depend on aa-devtool-contract (the capability-restricted facade),
      # never on aa-core directly. A PR re-adding a raw aa-core dependency would
      # re-open the full-surface hole, so fail here rather than rely on review.
      - name: Enforce devtool contract boundary (no direct aa-core dep)
        run: |
          set -euo pipefail
          # The aa-devtool-contract facade is the ONE crate allowed to depend on
          # aa-core; every other aa-devtool-* plugin must go through it.
          status=0
          for manifest in aa-devtool*/Cargo.toml; do
            case "$manifest" in
              aa-devtool-contract/Cargo.toml) continue ;;
            esac
            if grep -qE '^[[:space:]]*aa-core\b' "$manifest"; then
              echo "::error file=$manifest::declares a direct aa-core dependency; depend on aa-devtool-contract instead (AAASM-3565)"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no aa-devtool-* plugin depends on aa-core directly."
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  backend-license:
    needs: [changes]
    # AAASM-5714. The `deny` job above is the license gate for the CARGO GRAPH.
    # It cannot see an execution-isolation backend that ships as a prebuilt
    # binary — bundled into a release tarball, fetched by install-cli.sh, or
    # baked into a container image — because such an artifact never becomes a
    # crate. That class had no gate at all; this job is it.
    #
    # Deliberately NOT folded into the `deny` job: that job is gated on
    # `changes.rust`, and this gate's inputs (the manifest, the notices file)
    # match no Rust path, so a manifest-only PR would skip the check entirely
    # while the required aggregate still went green.
    if: needs.changes.outputs.backend_license == 'true'
    name: Backend license and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain needed — the gate reads JSON and Markdown. `jq` is
      # preinstalled on ubuntu-latest (scripts/check-release-completeness.sh
      # already relies on this).

      # The negative control runs FIRST and in the same job. A gate proven only
      # against a manifest it accepts may be passing vacuously; this asserts it
      # still rejects each violation class, and for the stated reason. If the
      # gate is ever weakened, this fails before the real check can report OK.
      - name: Self-test the gate (negative control)
        run: bash scripts/check-backend-license-compliance.sh --self-test

      - name: Run backend license and provenance gate
        run: bash scripts/check-backend-license-compliance.sh

  detection-egress-closure:
    needs: [changes]
    # AAASM-5738, for AAASM-5270 exit criterion 6 ("Local-only runtime behavior
    # is verified under egress-denied testing") and product constraint 1 ("raw
    # sensitive content must not be sent to third-party SaaS DLP or
    # classification services").
    #
    # Gated on `changes.rust`. Its globs cover `Cargo.toml`, `Cargo.lock`,
    # `aa-*/**/*.toml` and this workflow — every path a new *dependency* enters
    # through — plus, since review, the gate's own script.
    #
    # That last one was missing and mattered: the verdict is the `EXPECTED`
    # table inside the script, not the manifests, so a pull request editing only
    # the script skipped this job while `ci-success` counted the skip as a pass.
    # An earlier version of this comment asserted the filter already covered
    # "every path", which was true of dependencies and false of the gate itself.
    if: needs.changes.outputs.rust == 'true'
    # Named for what the job measures — `aa-security`, which is detection pass
    # 1 (`BuiltinScannerPass`) — not for the whole detection fast path. The
    # earlier name, "Detection fast path has no outbound capability", was wider
    # than the job: by the script's own scope section the gateway cascade's
    # passes 2 and 3 (`CompiledRegexPass` / `CascadeRegexPass` over `regex`, a
    # direct aa-gateway dependency) are part of that fast path and are neither
    # pinned nor run here. The script's docstring carried that caveat; the
    # check name a reviewer reads in the checks list carried no qualifier, and
    # the name is what most people see.
    name: aa-security detection pass has no outbound capability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Selftest first, same reasoning as the backend-license gate above: a
      # checker proven only against input it accepts may be passing vacuously.
      - name: Self-test the closure control
        run: python3 scripts/check_detection_egress_closure.py --selftest

      - name: Detector dependency closure is unchanged
        run: python3 scripts/check_detection_egress_closure.py

      # ─── The second axis: behaviour, not just capability ──────────────────
      #
      # The closure check is an argument about what is *linked*. This runs the
      # detector's own tests with no network at all, which is what criterion 6
      # literally asks for.
      #
      # NOT an isolation backend. This is a test harness for the sensitive-data
      # fast path; OS-level execution confinement is AAASM-5702's subsystem
      # (`aa-isolation`) and must not be re-implemented here. The distinction
      # this job preserves is that the detector *needs* no egress — which is a
      # different claim from *being prevented* from egress.
      #
      # `sudo unshare -n`, not `unshare -rn`: the unprivileged form needs a USER
      # namespace, and GitHub's Ubuntu images restrict those
      # (kernel.apparmor_restrict_unprivileged_userns=1). The first version of
      # this job used it and failed with
      #   unshare: write failed /proc/self/uid_map: Operation not permitted
      # A network namespace taken through passwordless sudo needs no user
      # namespace, so it works and mutates no host sysctl.
      - name: Build the detector's tests (network still available)
        run: |
          set -euo pipefail
          cargo test -p aa-security --locked --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable | select(. != null)' \
            > /tmp/aa-security-tests.txt
          echo "built $(wc -l < /tmp/aa-security-tests.txt) test binary/binaries"

      # The control that makes the next step mean anything, and it has to check
      # FOUR things rather than one.
      #
      # The first version checked only that curl failed inside the namespace,
      # and it passed vacuously on this very job: `unshare -rn` could not create
      # a namespace at all, so curl never ran, so "curl did not succeed" was
      # true for entirely the wrong reason. It printed "egress denied, as
      # required" having denied nothing. That is precisely the defect class this
      # job exists to catch, reproduced inside the control meant to catch it.
      #
      # So: the namespace must be creatable; it must actually be a *different*
      # network namespace (fewer interfaces than the host, which is a
      # comparison rather than a pinned count); the host must have egress for
      # the namespace to be denying something; and only then does a failing
      # curl inside it mean egress was denied rather than absent to begin with.
      - name: Prove the namespace exists and denies egress (positive control)
        run: |
          set -uo pipefail

          if ! sudo unshare -n -- true; then
            echo "::error::cannot create a network namespace on this runner;"
            echo "::error::the egress-denied run below would prove nothing."
            exit 1
          fi

          host_ifaces=$(ip -o link show | wc -l)
          # Measured through the SAME wrapper the tests use — `runuser` — so the
          # control exercises the shape under test rather than a simpler one.
          ns_ifaces=$(sudo unshare -n -- runuser -u "$(id -un)" -- ip -o link show | wc -l)

          # Assert the DIFFERENCE, not an absolute. A previous version computed
          # host_ifaces, interpolated it into the error text, and then tested
          # `ns_ifaces -ne 1` — so the host figure appeared in the message
          # without appearing in the predicate, and the control's actual
          # argument ("this is a different namespace") went unasserted. The
          # host count has to move for the comparison to discriminate, hence
          # the `-gt 1` guard first: on a host that itself had one interface,
          # `ns_ifaces -lt host_ifaces` could not hold and the step would be
          # reporting on a runner where it cannot tell the two apart.
          if [ "$host_ifaces" -le 1 ]; then
            echo "::error::the host has $host_ifaces interface(s), so an interface"
            echo "::error::count cannot distinguish the namespace from the host."
            exit 1
          fi
          if [ "$ns_ifaces" -ge "$host_ifaces" ]; then
            echo "::error::found $ns_ifaces interface(s) inside the namespace"
            echo "::error::against $host_ifaces on the host — not fewer, so this"
            echo "::error::is not an isolated network namespace."
            exit 1
          fi

          # curl must EXIST before its failure can mean anything: a missing
          # binary exits 127, which a bare `if` reads as "egress denied". That
          # is the same defect this control was rewritten to remove, one level
          # further down.
          command -v curl >/dev/null || { echo "::error::curl absent; the egress probe cannot run"; exit 1; }

          # The host leg is the control for the namespace leg, and it is the
          # step that moves. A failing curl INSIDE the namespace is on its own
          # equally consistent with a runner that has no egress anywhere: both
          # give exit 6, and the step would then attribute to the namespace a
          # denial the namespace had no part in. So require the host to reach
          # the network first; only against a reachable host does an
          # in-namespace 6/7/28 identify the namespace as the cause.
          set +e
          curl -sS --max-time 8 https://example.com >/dev/null 2>&1
          host_curl=$?
          set -e
          if [ "$host_curl" -ne 0 ]; then
            echo "::error::curl exited $host_curl on the HOST, outside the"
            echo "::error::namespace. This runner has no egress to deny, so a"
            echo "::error::failure inside the namespace would demonstrate"
            echo "::error::nothing about the namespace."
            exit 1
          fi

          set +e
          sudo unshare -n -- curl -sS --max-time 8 https://example.com >/dev/null 2>&1
          curl_status=$?
          set -e
          case "$curl_status" in
            0)  echo "::error::reached the network from inside the namespace."; exit 1 ;;
            6|7|28) : ;;  # resolve / connect / timeout — a real network failure
            *)  echo "::error::curl exited $curl_status, which is not a network"
                echo "::error::failure (expected 6, 7 or 28). The probe did not"
                echo "::error::demonstrate egress denial."
                exit 1 ;;
          esac

          echo "namespace created; $ns_ifaces interface(s) inside vs $host_ifaces on the host;"
          echo "host reaches the network (curl 0), namespace does not (curl $curl_status)"

      # Runs the prebuilt binaries rather than `cargo test`, so nothing inside
      # the namespace wants a registry, a lockfile check or CARGO_HOME — a cargo
      # network touch would fail and be indistinguishable from the detector
      # needing egress, which is the very thing under test.
      - name: Detector tests pass with egress denied
        run: |
          set -euo pipefail

          # Pinned population, not a `!= 0` floor. The previous version's own
          # comment said "assert the population, not just the exit codes" and
          # then tested `count -eq 0`, so a change that built 1 of the 8
          # binaries passed it — the "passes by running nothing" shape it meant
          # to close, one binary short of empty.
          #
          # 8 is the measured count for `aa-security` and is expected to move:
          # adding or removing a test target changes it, and the remedy is to
          # update this number in the same commit, the same one-line review the
          # closure gate's EXPECTED table asks for.
          #
          # The number pinned is BINARIES, not tests. The test total moves on
          # every added `#[test]` (326 locally at the time of writing, against
          # 305 when this job was first measured), which would make a pinned
          # test count a weekly red for no signal. The binary count moves only
          # when a test target is added or dropped, which is the structural
          # change worth a look.
          expected_bins=8

          count=0
          while read -r bin; do
            [ -n "$bin" ] || continue
            echo "--- $bin"
            sudo unshare -n -- runuser -u "$(id -un)" -- "$bin"
            count=$((count + 1))
          done < /tmp/aa-security-tests.txt

          if [ "$count" -ne "$expected_bins" ]; then
            echo "::error::ran $count test binary/binaries under egress denial,"
            echo "::error::expected $expected_bins. If a test target was added or"
            echo "::error::removed, update expected_bins in this step; if not,"
            echo "::error::the build step above produced a different population"
            echo "::error::than this job was pinned against."
            exit 1
          fi
          echo "ran $count test binary/binaries with egress denied (pinned at $expected_bins)"

  no-std:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    name: no_std targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: wasm32-unknown-unknown
          - target: thumbv7em-none-eabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build aa-core (no_std + alloc)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build -p aa-core \
            --target "$TARGET" \
            --no-default-features \
            --features alloc

  buf-lint:
    needs: [changes]
    if: needs.changes.outputs.proto == 'true'
    name: Proto lint & breaking check (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history needed for buf breaking --against
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint proto files
        run: buf lint
        working-directory: proto
      - name: Create local base branch for buf breaking check
        if: github.event_name == 'pull_request'
        # AAASM-4022: route github.base_ref through a quoted env var instead of
        # expanding it directly into the shell command (workflow-injection
        # hardening — the ${{ }} expansion is otherwise pasted verbatim into the
        # run script).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF:$BASE_REF"
      - name: Check breaking changes against base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          buf breaking \
            --against "../.git#branch=$BASE_REF,subdir=proto"
        working-directory: proto


  schema-lint:
    needs: [changes]
    if: needs.changes.outputs.schema == 'true'
    name: Schema lint & validation (ajv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install ajv-cli
        run: npm install -g ajv-cli
      - name: Validate every schema is self-consistent (ajv --strict)
        # AAASM-5531: this step used to name policy-document.schema.json alone,
        # so schemas/simulation/ and schemas/capability-manifest/ were never
        # compiled here and a new schemas/<domain>/v1/ directory silently got no
        # coverage from the job whose name implies it. Globbing means the next
        # one is picked up without anyone remembering to add a line.
        run: |
          shopt -s nullglob
          found=0
          for schema in schemas/*/v1/*.schema.json; do
            echo "::group::ajv compile --strict $schema"
            ajv compile --strict -s "$schema"
            echo "::endgroup::"
            found=$((found + 1))
          done
          # A glob that matches nothing would otherwise pass silently — the
          # exact shape of a gate that looks green because it ran on nothing.
          if [ "$found" -eq 0 ]; then
            echo "no schemas matched schemas/*/v1/*.schema.json — the glob is wrong" >&2
            exit 1
          fi
          echo "compiled $found schema(s)"
      - name: Validate example policy documents against schema
        run: |
          ajv validate \
            -s schemas/policy/v1/policy-document.schema.json \
            -d schemas/examples/strict.yaml
          ajv validate \
            -s schemas/policy/v1/policy-document.schema.json \
            -d schemas/examples/balanced.yaml
          ajv validate \
            -s schemas/policy/v1/policy-document.schema.json \
            -d schemas/examples/audit-only.yaml

  openapi-drift:
    needs: [changes]
    if: needs.changes.outputs.openapi == 'true'
    name: OpenAPI spec drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate OpenAPI spec from code
        run: cargo run -p aa-api --bin generate_openapi > /tmp/generated-v1.yaml
      - name: Check spec is up to date
        run: diff openapi/v1.yaml /tmp/generated-v1.yaml

  openapi-lint:
    needs: [changes]
    if: needs.changes.outputs.openapi == 'true'
    name: OpenAPI spec lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint openapi/v1.yaml --fail-severity warn

  compat-matrix-check:
    name: Compatibility matrix update check
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check compatibility matrix is updated when versions change
        run: bash .ci/check-compatibility-matrix.sh

  ebpf-build:
    needs: [changes]
    # AAASM-2580: per-PR/push, only run when aa-ebpf* (or this workflow) changed.
    # AAASM-3446: also run on the weekly schedule and on manual dispatch so the
    # Layer 3 suite keeps standing main coverage despite the path-filter.
    if: needs.changes.outputs.ebpf == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: eBPF probes build (Linux nightly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aa-ebpf-probes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        # Required by aa-proto (transitive dep of aa-runtime) for the
        # multi-layer integration test step.
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly branch @ 2026-06-27
        with:
          # AAASM-5311: pin the actual nightly *release* date, not just the
          # wrapper action commit above — the action SHA only pins which
          # version of the GitHub Action runs; without an explicit `toolchain`
          # input it still installs whatever nightly is current on the day the
          # job runs. That floating nightly is what silently broke this job
          # (a Cargo build-directory-layout change landed between 2026-07-26
          # and 2026-07-30) with no repository change, and the AAASM-3446
          # weekly schedule means the next `schedule` run would have hit it
          # again with nothing to bisect. Bump this date **in its own PR**
          # when a newer nightly feature is needed, and confirm CI is green
          # on that PR before merging it — a stale pin fails safe (an older
          # but working toolchain keeps building); a silent/untested bump
          # does not.
          toolchain: nightly-2026-07-30
          # Do NOT add bpfel-unknown-none to targets: there is no precompiled rust-std
          # for this target. BPF programs are built from source via -Zbuild-std=core
          # (configured in aa-ebpf-probes/.cargo/config.toml). Only rust-src is needed.
          # clippy is required for the "Clippy on eBPF probes" step below.
          components: rust-src,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: aa-ebpf-probes
      - name: Resolve pinned bpf-linker version
        # AAASM-5735: read the version from scripts/build-ebpf-probes.sh rather
        # than repeating it here. The cache key and the install MUST come from
        # one literal — when they were separate, the key stayed at 0.10.3 while
        # an unpinned `cargo install` drifted to 0.11.0, so a cache hit passed
        # and a cache miss failed on the very same commit.
        id: bpf-linker-version
        working-directory: .
        run: |
          v="$(bash scripts/build-ebpf-probes.sh --print-version)"
          test -n "$v" || { echo "::error::could not resolve pinned bpf-linker version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache bpf-linker binary
        # Cache the compiled bpf-linker binary so subsequent CI runs skip the
        # slow bundled-LLVM compile (~5-10 min). The key carries the resolved
        # version, so bumping the pin in the script invalidates the cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-bpf-linker
        with:
          path: ~/.cargo/bin/bpf-linker
          # AAASM-5735: `-r2` is a one-time key-generation bump. Without it the
          # resolved version is unchanged (0.10.3), the old cache still hits, and
          # the corrected `cargo install --version` line would never execute — the
          # PR would go green having proved nothing, since the cache-hit path was
          # never the broken one. Bumping forces one real cold install.
          key: bpf-linker-r2-${{ runner.os }}-${{ steps.bpf-linker-version.outputs.version }}
      - name: Install bpf-linker
        # bpf-linker is the custom linker required for the bpfel-unknown-none target.
        # Using the bundled-LLVM default (no --no-default-features) avoids fragile
        # system-LLVM package discovery. Only runs on cache miss.
        # `--version` is load-bearing: `--locked` alone pins bpf-linker's
        # dependency tree, not bpf-linker itself.
        # The version goes through `env:` rather than `${{ }}` inside `run:` —
        # on a fork `pull_request` the script it is read from is attacker-
        # controlled, and interpolating that straight into a shell command is
        # the workflow-injection pattern.
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        env:
          BPF_LINKER_VERSION: ${{ steps.bpf-linker-version.outputs.version }}
        run: cargo install bpf-linker --version "$BPF_LINKER_VERSION" --locked
      - name: Build eBPF probes
        # AAASM-3712: build via the shared script — the SINGLE SOURCE OF TRUTH
        # also used by release.yml's AAASM-3601 step, so the two recipes can
        # never diverge again. Run from the repo root (overriding this job's
        # working-directory: aa-ebpf-probes default) so the scripts/ path
        # resolves; the script then cd's into aa-ebpf-probes/ itself.
        working-directory: .
        run: bash scripts/build-ebpf-probes.sh
      - name: Clippy on eBPF probes
        # --all-targets would try to build test harness binaries, which require the
        # `test` crate — unavailable on the no_std bpfel-unknown-none target.
        # --bins lints only the BPF program binaries.
        run: cargo clippy --bins -- -D warnings
      - name: Integration test — load and attach aa-file-io kprobe
        # Runs from the workspace root so cargo can resolve the aa-ebpf package.
        # BPF loading requires CAP_BPF + CAP_PERFMON (root). sudo -E preserves
        # CARGO_HOME, RUSTUP_HOME, and PATH so cargo uses the already-installed
        # nightly toolchain and bpf-linker.
        working-directory: ${{ github.workspace }}
        # sudo runs as root (/root/.rustup, /root/.cargo) but the nightly toolchain
        # was installed for the runner user. RUSTUP_HOME and CARGO_HOME are not set
        # as env vars on GitHub runners — they default to ~/.rustup/~/.cargo, which
        # expands to /root/... under sudo. Capture them from the runner's $HOME first,
        # then pass explicit paths so root reuses the already-installed toolchain.
        run: |
          RUNNER_RUSTUP="${HOME}/.rustup"
          RUNNER_CARGO="${HOME}/.cargo"
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=${RUNNER_RUSTUP}" \
            "CARGO_HOME=${RUNNER_CARGO}" \
            cargo +nightly test -p aa-ebpf --features integration-test --test load_hello -- --nocapture
      - name: Integration test — multi-layer runtime (proxy + eBPF)
        # Exercises both proxy and eBPF layers on a shared broadcast channel.
        # The test uses the integration-test feature gate and requires root
        # for eBPF loader attachment. Tests that require root but don't have
        # it will gracefully skip with a log message.
        working-directory: ${{ github.workspace }}
        run: |
          RUNNER_RUSTUP="${HOME}/.rustup"
          RUNNER_CARGO="${HOME}/.cargo"
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=${RUNNER_RUSTUP}" \
            "CARGO_HOME=${RUNNER_CARGO}" \
            cargo test -p aa-runtime --features integration-test -- layer_integration --nocapture --test-threads=1

  e2e-ebpf-linux:
    needs: [changes]
    # AAASM-2580: per-PR/push, only run when aa-ebpf* (or this workflow) changed.
    # AAASM-3446: also run on the weekly schedule and on manual dispatch so the
    # Layer 3 e2e suite keeps standing main coverage despite the path-filter.
    if: needs.changes.outputs.ebpf == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # AAASM-1520 / F116 ST-H — Layer 3 (eBPF) end-to-end interception suite.
    # Linux-only, runs as root for CAP_BPF + CAP_PERFMON; the test source is
    # `#[cfg(all(target_os = "linux", feature = "integration-test"))]` so it
    # is invisible to every other job, including the macOS build job.
    #
    # Kernel requirement: >= 5.10 with BTF (CONFIG_DEBUG_INFO_BTF=y). The
    # current GitHub `ubuntu-latest` images ship a 6.x kernel with BTF
    # enabled. On older kernels the BPF verifier rejects the probe load and
    # the tests fail loudly at startup (which is the intended degradation
    # mode — there is no value pretending to test Layer 3 on a kernel that
    # cannot host the probes).
    name: e2e — Layer 3 eBPF (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        # Required by aa-proto (transitive dep of aa-runtime/aa-gateway).
        run: sudo apt-get install -y protobuf-compiler
      - name: Install curl
        # curl is the libssl-backed agent for tests 1, 3, 4 — its `SSL_write`
        # call is what fires the TLS uprobe. ubuntu-latest already ships curl;
        # the explicit install guards against future image variants that strip it.
        #
        # bpftool is intentionally *not* installed: on ubuntu-latest it is a
        # virtual package satisfied only by `linux-tools-<kernel-version>`,
        # which is fragile to runner-image kernel drift. Test 6 invokes
        # bpftool via `if let Ok(out) = Command::new("bpftool")...` — its
        # absence is a no-op, and the load-twice invariant in the same test
        # is the real "no kernel-resource leak" assertion.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly branch @ 2026-06-27
        with:
          # AAASM-5311: pin the nightly release date — same rationale as the
          # `ebpf-build` job above (this job runs the very `e2e_ebpf` test
          # that a floating nightly's layout change broke). Bump in its own
          # PR, verified green, when a newer nightly feature is needed.
          toolchain: nightly-2026-07-30
          # Same justification as the `ebpf-build` job: bpfel-unknown-none has
          # no precompiled rust-std, so the BPF probes build via
          # `-Zbuild-std=core` which needs rust-src on nightly.
          components: rust-src,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Resolve pinned bpf-linker version
        # AAASM-5735: same single-literal rule as the ebpf-build job — the
        # version comes from scripts/build-ebpf-probes.sh, never from a second
        # copy maintained here.
        id: bpf-linker-version
        run: |
          v="$(bash scripts/build-ebpf-probes.sh --print-version)"
          test -n "$v" || { echo "::error::could not resolve pinned bpf-linker version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache bpf-linker binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-bpf-linker
        with:
          path: ~/.cargo/bin/bpf-linker
          # AAASM-5735: `-r2` is a one-time key-generation bump. Without it the
          # resolved version is unchanged (0.10.3), the old cache still hits, and
          # the corrected `cargo install --version` line would never execute — the
          # PR would go green having proved nothing, since the cache-hit path was
          # never the broken one. Bumping forces one real cold install.
          key: bpf-linker-r2-${{ runner.os }}-${{ steps.bpf-linker-version.outputs.version }}
      - name: Install bpf-linker
        # See the ebpf-build job: `--version` pins bpf-linker, `--locked` only
        # pins its dependency tree. The value goes via `env:` to keep untrusted
        # fork content out of the shell command.
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        env:
          BPF_LINKER_VERSION: ${{ steps.bpf-linker-version.outputs.version }}
        run: cargo install bpf-linker --version "$BPF_LINKER_VERSION" --locked
      - name: Build BPF probes
        # Pre-builds the BPF ELF objects that `aa-ebpf`'s build.rs embeds
        # via `include_bytes_aligned!`. Doing it explicitly here surfaces
        # any verifier or linker failure separately from the test run.
        working-directory: aa-ebpf-probes
        run: cargo build --release
      - name: Run AAASM-1520 e2e suite
        # Loading BPF programs requires CAP_BPF + CAP_PERFMON (root). We
        # preserve the runner-user's RUSTUP_HOME / CARGO_HOME under sudo so
        # the already-installed nightly toolchain and bpf-linker are reused
        # rather than re-downloaded. `--test-threads=1` is required because
        # tests 1/3/4 all attach system-wide TLS uprobes and would interfere
        # with each other if run in parallel; test 2 modifies a shared BPF
        # map.
        run: |
          RUNNER_RUSTUP="${HOME}/.rustup"
          RUNNER_CARGO="${HOME}/.cargo"
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=${RUNNER_RUSTUP}" \
            "CARGO_HOME=${RUNNER_CARGO}" \
            cargo +nightly test \
              -p aa-integration-tests \
              --features integration-test \
              --test e2e_ebpf \
              -- --nocapture --test-threads=1
      - name: Run AAASM-1522 e2e file monitoring suite
        # F116 ST-J — same root-required, single-threaded execution profile
        # as ST-H. The tests share the file-IO PID_FILTER BPF map and rely
        # on per-test PID registration not racing with other suites, so they
        # run in their own `cargo +nightly test` invocation (separate test
        # binary) with `--test-threads=1`. Kept as a distinct step so a ST-J
        # failure does not mask a ST-H failure (or vice versa) in CI output.
        run: |
          RUNNER_RUSTUP="${HOME}/.rustup"
          RUNNER_CARGO="${HOME}/.cargo"
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=${RUNNER_RUSTUP}" \
            "CARGO_HOME=${RUNNER_CARGO}" \
            cargo +nightly test \
              -p aa-integration-tests \
              --features integration-test \
              --test e2e_file_monitoring \
              -- --nocapture --test-threads=1
      - name: Run AAASM-1523 e2e three-layer suite
        # AAASM-1523 / F116 ST-K — three-layer unified audit-stream tests.
        # Drives the in-process `aa_gateway::AuditWriter` mpsc pipeline
        # plus the `three_layers_driver.py` fixture for on-host realism.
        # No BPF load is required by the tests themselves — see the
        # file-level divergence note in
        # `aa-integration-tests/tests/e2e_three_layers_together.rs` for
        # why. Runs in the same Linux CI lane as ST-H per the AC
        # ("shared with ST-H + ST-J") so the protoc + nightly toolchain
        # are reused.
        #
        # `sudo env ...` is required only because the AAASM-1520 step
        # ran as root and the cargo `target/` directory it produced is
        # now owned by root; running this step as the unprivileged
        # runner user would trip `target/debug/.cargo-build-lock`
        # permission-denied. We preserve RUSTUP_HOME / CARGO_HOME so
        # the nightly toolchain is the runner-user one (same trick as
        # the ST-H step).
        run: |
          RUNNER_RUSTUP="${HOME}/.rustup"
          RUNNER_CARGO="${HOME}/.cargo"
          sudo env \
            "PATH=$PATH" \
            "RUSTUP_HOME=${RUNNER_RUSTUP}" \
            "CARGO_HOME=${RUNNER_CARGO}" \
            cargo +nightly test \
              -p aa-integration-tests \
              --features integration-test \
              --test e2e_three_layers_together \
              -- --nocapture --test-threads=1

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.rust == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-benchmark'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run criterion benchmarks
        run: |
          cargo bench -p aa-security --bench scanner_bench
          cargo bench -p aa-gateway --bench policy_check
          cargo bench -p aa-proxy --bench intercept_bench
      - name: Run latency SLA test (5s burst)
        # AAASM-1452: shared GitHub-hosted runners exhibit noisy-neighbour
        # tail latency that breaches the test's bare-metal 15ms default
        # (observed p99 spikes to 733ms+ even on the dedicated Benchmark
        # job under steal-time contention). 1500ms absorbs the runner
        # variance while still surfacing any real ≥100× regression. The
        # 5ms bare-metal target stays enforced by the test name; only the
        # SLA assertion is relaxed.
        env:
          AA_BENCH_SLA_P99_MS: "1500"
        run: cargo test -p aa-gateway --test policy_latency_test -- --nocapture

  conformance:
    needs: [changes]
    # AAASM-4454: run on the broad `rust` set OR the narrow surface-contract
    # `conformance` filter, so the registration-surface contract is guaranteed to
    # re-run when start.rs / aa-gateway main+local_mode / aa-api / the conformance
    # crate change, even if `rust` is later narrowed.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.conformance == 'true'
    name: Rust conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run conformance suite (all categories)
        run: cargo test -p conformance


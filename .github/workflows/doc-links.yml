name: Doc Links

# Guards repo-relative Markdown links in the README from silently re-rotting
# after a docs reorg — the AAASM-4635 regression (README links to
# docs/src/architecture.md etc. 404'd) that AAASM-4670 makes un-repeatable.
# Internal-link only: no network calls, so no flaky external-URL failures and
# no new heavy dependency (portable bash in scripts/check-doc-links.sh).
#
# Also guards against a Markdown file being added under docs/ outside the
# mdBook src/ tree without a deliberate decision -- the AAASM-5328 regression
# (five docs/devtools/ pages never rendered because book.toml's src = "src"
# excludes anything outside docs/src/) that scripts/check-doc-orphans.sh
# makes un-repeatable.
permissions:
  contents: read

on:
  pull_request:
    branches: [main, 'v0.0.1/AAASM-5677/**']
    # AAASM-5677: deliberately NOT path-filtered — selection moved to the
    # `changes` router below. This gate is governance-bearing (CONTRIBUTING,
    # "Which CI checks are governance-bearing"): its failure means published
    # documentation points at pages that do not exist, or that a page was
    # added where the book will never render it. Nothing else reads for that.
    # It therefore has to be a required status check, and a required check only
    # works if it reliably reports — a path-filtered workflow that does not
    # trigger produces no check run at all, and a required check that never
    # arrives blocks the pull request forever.
  push:
    branches: [main]
    # The push backstop keeps its own filter: it is not a required check, and
    # narrowing what runs on main is a cost decision, not a merge-gate one.
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check-doc-links.sh'
      - 'scripts/check-doc-orphans.sh'
      - '.github/workflows/doc-links.yml'

jobs:
  # AAASM-5677: consulted for `pull_request` only. Every glob here has a
  # matching `on.push.paths` entry above, so neither is a dead trigger.
  changes:
    name: Detect changed areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**'
              - 'scripts/check-doc-links.sh'
              - 'scripts/check-doc-orphans.sh'
              - '.github/workflows/doc-links.yml'

  check-links:
    name: Check internal doc links
    needs: [changes]
    # `!cancelled()` stops a skipped `changes` (the push event) from
    # force-skipping this job. A failed `changes` leaves the condition false,
    # so this skips and the aggregate below turns red: fail closed.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate internal Markdown links in README
        run: bash scripts/check-doc-links.sh README.md
      - name: Check for orphaned docs/ Markdown files outside src/
        run: bash scripts/check-doc-orphans.sh

  # AAASM-5677: the stable required context. Named separately from the job it
  # aggregates so renaming an internal job cannot silently drop the branch
  # protection requirement.
  doc-links-success:
    name: Doc Links Success
    needs: [changes, check-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required Doc Links job concluded with '$r'"
                exit 1
                ;;
            esac
          done
          echo "All required Doc Links jobs passed or were intentionally skipped."

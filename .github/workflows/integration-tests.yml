name: Integration tests

permissions:
  contents: read

# End-to-end integration test suite (macOS leg). Runs the `aa-integration-tests`
# crate on macOS so the topology HTTP roundtrip (AAASM-1066) and the CLI
# subcommand coverage (AAASM-1258, AAASM-1441 follow-up) are exercised on a
# non-Linux platform before anything depending on them ships.
#
# AAASM-2631: the Linux leg was dropped — ci.yml's `test` job already runs the
# whole workspace (incl. aa-integration-tests) on ubuntu-latest for every rust
# PR, so running it serially here too was pure duplication. The tests bind
# ephemeral ports (TcpListener::bind 127.0.0.1:0) and pass concurrently in
# `test`, so the Linux coverage is fully retained there.
#
# Node.js SDK E2E fixtures (AAASM-1514 / F116 ST-B): TypeScript fixture scripts
# are installed via pnpm and run in AA_SELFTEST=1 mode inside the Rust harness;
# no running gateway or native bindings are required for the hermetic tests.

on:
  push:
    branches: [main]
    paths:
      - "aa-integration-tests/**"
      - "aa-api/**"
      - "aa-gateway/**"
      - "aa-cli/**"
      - "aa-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "aa-integration-tests/**"
      - "aa-api/**"
      - "aa-gateway/**"
      - "aa-cli/**"
      - "aa-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration-tests.yml"

jobs:
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # AAASM-5943: raised from 30. This is a ceiling that lets a cold-cache run
    # *finish and be measured*; it is deliberately not the fix, and it is not a
    # budget anyone should plan against. See the note above `Pre-build aasm`.
    #
    # Derived, not chosen: the per-step ceilings below sum to 55 min (18+9+28);
    # setup steps measured 58s in run 32946949070; the first cache save has never
    # once executed in this workflow (see cache-on-failure above) so 6 min is
    # allowed for a cold macOS target-dir save. 55 + 1 + 6 = 62.
    #
    # The job ceiling must stay strictly above the sum of the step ceilings.
    # If the job ceiling fires first the run reports `cancelled`, which is the
    # invisible state this ticket exists to eliminate; a step ceiling firing
    # reports `failure`, which is red and blocks. Do not lower this below that
    # sum without lowering the step ceilings too.
    timeout-minutes: 62
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout agent-assembly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout sibling python-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-agent-assembly/python-sdk
          path: python-sdk

      - name: Checkout sibling go-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-agent-assembly/go-sdk
          path: go-sdk

      - name: Checkout sibling node-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-agent-assembly/node-sdk
          path: node-sdk

      - name: Install protobuf compiler
        run: brew install protobuf

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: aa-integration-tests/tests/fixtures/e2e/sdk_go_driver/go.sum

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: integration-tests-${{ matrix.os }}
          # AAASM-5943: without this, a job killed by `timeout-minutes` saves no
          # cache at all, which latched this workflow into a loop it could not
          # recover from on its own. At this exact pin, action.yml ends with
          #   post-if: "success() || env.CACHE_ON_FAILURE == 'true'"
          # and `cache-on-failure` is declared with no default, i.e. falsy. So
          # every cancelled run skipped `Post Run Swatinem/rust-cache` outright
          # (observed directly: step 32 = `skipped` in run 32946949070). Each
          # later run then restored the last cache a *green* run had written, so
          # `Pre-build aasm` compiled from progressively colder state — 2.7 min
          # when green, 8.6-12 min afterwards — which kept the job over the
          # ceiling, which kept the cache unwritten. Setting this makes
          # src/restore.ts export CACHE_ON_FAILURE=true, so the post step runs
          # and a truncated run still contributes its cache.
          #
          # `save-if: always()` is NOT a substitute at this pin: `save-if` is
          # read inside dist/save.js, which never executes when post-if is false.
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: aa-integration-tests/tests/fixtures/agents/typescript/pnpm-lock.yaml

      - name: "Symlink node-sdk for file: dependency resolution"
        # The TypeScript fixture package.json uses file:../../../../../../node-sdk
        # which resolves six levels up from the typescript/ dir to the parent of
        # GITHUB_WORKSPACE. The checkout action places node-sdk one level below
        # GITHUB_WORKSPACE so we create a sibling symlink to bridge the gap.
        run: ln -sfn "$GITHUB_WORKSPACE/node-sdk" "$(dirname "$GITHUB_WORKSPACE")/node-sdk"

      - name: Install TypeScript fixture dependencies
        working-directory: aa-integration-tests/tests/fixtures/agents/typescript
        run: pnpm install --frozen-lockfile

      # AAASM-5943: every long step below carries its own `timeout-minutes`, and
      # that is load-bearing rather than decorative.
      #
      # A job killed by the *job* ceiling reports `cancelled`. GitHub does not
      # treat `cancelled` as a failure: branch protection accepts it, the checks
      # page shows no red, and — verified in run 32946949070 — even the
      # `if: failure()` log-upload step is `skipped`, so no diagnostic escapes
      # and no `if: always()` guard step can help. That is how this workflow ran
      # 13 consecutive main merges without validating any of them while looking
      # untroubled. A step that exceeds its own `timeout-minutes` is killed and
      # marked `failure`, which fails the job, goes red, and blocks the merge.
      #
      # So: the step ceilings are the real gate, and the job ceiling is only a
      # backstop that should never fire. Keep the job ceiling above their sum.
      #
      # Each ceiling is set from measured durations at roughly 1.5x the worst
      # observed value. The job's healthy runs sat at 77-90% of budget (3-7 min
      # of slack) and that is precisely why it tipped over as soon as anything
      # was added, so these are deliberately looser than that.
      - name: Pre-build aasm binary (AAASM-2340)
        # Worst measured 12.0 min (244458b7f, cold cache under the ratchet);
        # 2.7 min warm. 18 = 1.5x worst.
        timeout-minutes: 18
        # Compiling aa-cli (which pulls wasmtime via aa-sandbox) once serially
        # before nextest skips per-test `cargo run -p aa-cli` overhead — under
        # --test-threads=1 every test paid that overhead in sequence, which is
        # what pushed this workflow past the 20-minute timeout-minutes ceiling.
        run: cargo build --quiet -p aa-cli --bin aasm

      - name: Pre-build aa-api-server binary (AAASM-5908)
        # Worst measured 5.4 min (244458b7f). 9 = 1.67x worst.
        timeout-minutes: 9
        # Same rationale as the aasm pre-build above, for the same reason:
        # `common::api_server::ApiServerProcess::resolve_binary` invokes
        # `cargo build -p aa-api --bin aa-api-server` the first time any test
        # spawns a real server, and under nextest's per-test-binary process
        # isolation that first invocation lands on whichever test file happens
        # to run first — observed costing 264s in one run (job
        # 97739259633, test e2e_api_server_graceful_shutdown), on a workflow
        # already living close to its 30-minute ceiling. Building it here once
        # keeps every later `cargo build` invocation a fast no-op freshness
        # check instead of a cold compile landing unpredictably on one test.
        run: cargo build --quiet -p aa-api --bin aa-api-server

      - name: Run integration tests
        # Only clean measurement is 18.9 min (34a274da6, the last green run);
        # under the ratchet it was truncated at 11.9-16.4 min and never
        # finished. 28 = 1.48x the green figure. If this ceiling ever fires the
        # suite is genuinely too slow — that is a real red failure to
        # investigate, not a number to raise.
        timeout-minutes: 28
        env:
          PYTHON_SDK_PATH: ${{ github.workspace }}/python-sdk
          GO_SDK_PATH: ${{ github.workspace }}/go-sdk
          # AAASM-2340: spawn the binary pre-built in the previous step
          # instead of paying cargo-run overhead per test under --test-threads=1.
          AASM_BIN_PATH: ${{ github.workspace }}/target/debug/aasm
        run: cargo nextest run -p aa-integration-tests --test-threads=1


      - name: Upload gateway logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-tests-gateway-logs-${{ matrix.os }}
          path: |
            target/nextest/**/*.log
            target/debug/build/aa-integration-tests-*/output
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

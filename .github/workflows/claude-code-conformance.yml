name: Claude Code conformance

permissions:
  contents: read

# AAASM-5283 — the executable completion gate for the Claude Code Developer
# Integration (AAASM-5281) and for every future tool productisation.
#
# Why a dedicated workflow rather than a job in ci.yml
# ----------------------------------------------------
# ci.yml has a two-layer trigger model: the workflow's own `on.*.paths` decides
# whether CI runs at all, and a `dorny/paths-filter` router decides which jobs
# run inside it. A router filter with no matching `on.*.paths` entry is a dead
# trigger. Keeping this gate in its own file gives it one unambiguous trigger
# surface, and lets the three lanes below carry different prerequisites without
# threading three more filters through that router.
#
# The lanes
# ---------
# 1. `hermetic` (ubuntu)  — the default gate. Needs nothing external: the tool
#    binary is stood in for by a path plus a version override, and the proxy,
#    scanner, receipt store and provider are all in-process. Required.
# 2. `macos`              — the same suite on the platform the integration
#    targets, where file modes, temp paths and TLS differ. Required.
# 3. `native-cli`         — `aa-cli`'s native Claude Code suite, every case of
#    which gates on the real binary. It cannot measure anything on a hosted
#    runner and does not pretend to: it exists to *report* that, rather than
#    let the same five green ticks stand for five measurements. Not required.
# 4. `real-tool`          — `workflow_dispatch` only. Installs the real
#    `claude` binary and points `AA_SPIKE_CLAUDE_BIN` at it, so the one
#    assertion a mock cannot make (does Claude Code's embedded Node runtime
#    accept the Agent Assembly certificate authority through
#    `NODE_EXTRA_CA_CERTS`) is actually taken. Not required for a merge, but it
#    can fail: see below. It uses no credentials and reaches no external model
#    provider — every request is redirected to an in-process mock.
#
# The security-regression assertions are not a separate lane. They live in the
# same binary as the scenarios they guard, because a regression set that can be
# skipped independently of the suite it protects will eventually be skipped.
#
# Skipping vs passing vs measuring
# --------------------------------
# Scenarios that need the real binary print `SKIP [...]` with the reason and
# return. `--no-capture` is deliberate: a skip must be legible in the log rather
# than indistinguishable from a green assertion. But a runner counts a skip as a
# pass, so the summary line alone cannot tell a lane that measured from one that
# declined to — which is why every lane sets `AA_CONFORMANCE_OUTCOME_DIR` and
# renders the resulting ledger into the job summary, and why the real-tool lane
# asserts its scenario recorded `measured`.
#
# AAASM-5465 makes that arithmetic explicit rather than per-lane. Every lane runs
# under nextest's `evidence` profile, which emits a JUnit report, and hands both
# the report and the ledger to `.ci/test-evidence-summary.sh`. That step prints
# how many of the lane's passing cases were *substantive* (ran and asserted)
# versus declined, splitting the declines into "unsupported platform" and "tool
# binary absent" because those need different fixes — and it fails, rather than
# merely reporting, when a lane that exists to measure measured nothing.
#
# The `native-cli` lane below is the extreme case the ticket was raised for: all
# five of its cases gate on the real binary, so on a runner without one it is a
# green result carrying zero evidence. It is `continue-on-error` at the job level
# — the absence is honest, not a regression — but the summary states NO EVIDENCE
# PRODUCED on the run's front page instead of letting five green ticks speak for
# it. The `real-tool` lane runs the same suite with the binary installed and
# `--require-evidence`, so *there* a decline is a failure.
#
# Where the tolerance lives (the `real-tool` lane)
# ------------------------------------------------
# This lane used to carry a job-level `continue-on-error`, on the grounds that a
# third-party npm package this repository does not control must not read as a
# product regression. That tolerance was far too wide: it also swallowed a
# genuine failure of the one assertion the lane exists to make, leaving the run
# green either way. The tolerance now sits on the single step that depends on
# the third party. If that step fails the lane reports, loudly, that it did not
# run — an honest absence of evidence. Everything after it is the product, and
# fails the job.

on:
  push:
    branches: [main]
    paths:
      - "aa-integration-tests/tests/conformance_claude_code.rs"
      - "aa-integration-tests/tests/conformance_support/**"
      - "aa-integration-tests/tests/spike_support/**"
      # AAASM-5465: the shared evidence ledger, the suite whose emptiness the
      # `native-cli` lane exists to report, and the two files that decide how
      # that report is produced.
      - "aa-integration-tests/tests/evidence/**"
      - "aa-cli/tests/integrations_claude_code.rs"
      - ".ci/test-evidence-summary.sh"
      - ".config/nextest.toml"
      - "aa-devtool-claude-code/**"
      - "aa-devtool-contract/**"
      - "aa-core/src/integration/**"
      - "aa-runtime/src/devint/**"
      - "aa-proxy/**"
      - "aa-security/**"
      - "aa-cli/src/commands/integrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/claude-code-conformance.yml"
  pull_request:
    branches: [main]
    paths:
      - "aa-integration-tests/tests/conformance_claude_code.rs"
      - "aa-integration-tests/tests/conformance_support/**"
      - "aa-integration-tests/tests/spike_support/**"
      # AAASM-5465: the shared evidence ledger, the suite whose emptiness the
      # `native-cli` lane exists to report, and the two files that decide how
      # that report is produced.
      - "aa-integration-tests/tests/evidence/**"
      - "aa-cli/tests/integrations_claude_code.rs"
      - ".ci/test-evidence-summary.sh"
      - ".config/nextest.toml"
      - "aa-devtool-claude-code/**"
      - "aa-devtool-contract/**"
      - "aa-core/src/integration/**"
      - "aa-runtime/src/devint/**"
      - "aa-proxy/**"
      - "aa-security/**"
      - "aa-cli/src/commands/integrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/claude-code-conformance.yml"
  workflow_dispatch:
    inputs:
      real_tool:
        description: "Also run the optional real Claude Code lane"
        type: boolean
        default: false

jobs:
  conformance:
    name: Conformance (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: hermetic
            os: ubuntu-latest
          - lane: macos
            os: macos-latest
    env:
      AA_CONFORMANCE_OUTCOME_DIR: ${{ github.workspace }}/.conformance-outcomes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: claude-code-conformance-${{ matrix.lane }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest

      - name: Run the conformance suite
        # --no-capture so a `SKIP [...]` line is visible in the log. Without it
        # a skipped scenario reads exactly like a passing one.
        #
        # `--profile evidence` adds the JUnit report the summary step needs for
        # the denominator: the ledger says which cases declined, and only the
        # runner knows how many there were.
        run: |
          cargo nextest run --profile evidence -p aa-integration-tests \
            --test conformance_claude_code --no-capture

      - name: Report what this lane measured
        # `always()`: a lane that failed still has an outcome worth reading, and
        # the ledger is most useful exactly when something went wrong.
        #
        # `--require-evidence`: this lane is required for a merge and its 25
        # hermetic scenarios need nothing external, so every one of them
        # declining would mean the suite had stopped measuring the product
        # rather than that the runner lacked something.
        if: always()
        env:
          LANE: ${{ matrix.lane }}
        run: |
          .ci/test-evidence-summary.sh \
            --lane "conformance (${LANE})" \
            --junit target/nextest/evidence/junit.xml \
            --evidence-dir "${AA_CONFORMANCE_OUTCOME_DIR}" \
            --require-evidence

  native-cli:
    name: Native CLI suite (evidence report)
    # The lane AAASM-5465 was raised for. `aa-cli/tests/integrations_claude_code.rs`
    # gates every one of its five cases on the real `claude` binary, which no
    # GitHub-hosted runner has, so it reports five green tests having asserted
    # nothing. That is not a regression to fail on — the binary genuinely is not
    # there — but it must not read as five measurements either.
    #
    # `continue-on-error` at the job level, and no `--require-evidence`: the
    # summary step states NO EVIDENCE PRODUCED, emits a warning annotation, and
    # lists which five cases declined and why. The lane that *can* measure them
    # is `real-tool` below, which provisions the binary and does require
    # evidence.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      AA_CONFORMANCE_OUTCOME_DIR: ${{ github.workspace }}/.conformance-outcomes

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: claude-code-conformance-native-cli

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest

      - name: Run the native CLI suite
        run: cargo nextest run --profile evidence -p aa-cli --test integrations_claude_code --no-capture

      - name: Report what this lane measured
        if: always()
        run: |
          .ci/test-evidence-summary.sh \
            --lane "native CLI suite" \
            --junit target/nextest/evidence/junit.xml \
            --evidence-dir "${AA_CONFORMANCE_OUTCOME_DIR}"

  real-tool:
    name: Conformance (real Claude Code)
    # Opt-in only. Not required for a merge — but it is allowed to fail, so that
    # a run someone deliberately asked for cannot report green having measured
    # nothing. The third-party tolerance sits on the install step below.
    if: github.event_name == 'workflow_dispatch' && inputs.real_tool
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # The conformance suite's ledger, and the job default. The native-CLI run
      # below overrides it so each suite's declines are counted against its own
      # case count rather than the other's.
      AA_CONFORMANCE_OUTCOME_DIR: ${{ github.workspace }}/.outcomes-conformance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: claude-code-conformance-real-tool

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83c419a40a2e48673b2c523337e57f602dfe53c9 # cargo-nextest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Claude Code
        # The one step that depends on something this repository does not
        # control, and therefore the only step allowed to fail without failing
        # the lane. No credential is configured and none is needed: every
        # request the binary makes is redirected onto an in-process mock
        # provider by the proxy under test.
        id: install_tool
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Report that the lane could not run
        if: steps.install_tool.outcome == 'failure'
        run: |
          set -euo pipefail
          note="the real-tool lane did not run: @anthropic-ai/claude-code could not be installed, so no measurement was taken. This is an absence of evidence, not a passing measurement."
          echo "::warning title=Real-tool lane not run::${note}"
          printf '### Conformance (real Claude Code)\n\n- **not run** — %s\n' "${note}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the tool version under test
        if: steps.install_tool.outcome == 'success'
        run: claude --version

      - name: Run the conformance suite against the real binary
        # The JUnit report is copied aside straight away: the `evidence` profile
        # writes one fixed path, and the native-CLI run below would otherwise
        # overwrite it — leaving the summary to divide this suite's declines by
        # that suite's case count.
        if: steps.install_tool.outcome == 'success'
        run: |
          set -euo pipefail
          AA_SPIKE_CLAUDE_BIN="$(command -v claude)" \
            cargo nextest run --profile evidence -p aa-integration-tests \
              --test conformance_claude_code --no-capture
          cp target/nextest/evidence/junit.xml junit-conformance.xml

      - name: Run the native CLI suite against the real binary
        # The suite that is entirely gated on the tool. Here — and only here —
        # the binary exists, so this is the one lane in which those five cases
        # can produce evidence at all.
        #
        # Separate ledger directory from the run above so each summary divides
        # the right declines by the right denominator.
        if: steps.install_tool.outcome == 'success'
        env:
          AA_CONFORMANCE_OUTCOME_DIR: ${{ github.workspace }}/.outcomes-native-cli
        run: |
          set -euo pipefail
          cargo nextest run --profile evidence -p aa-cli --test integrations_claude_code --no-capture
          cp target/nextest/evidence/junit.xml junit-native-cli.xml

      - name: Report what the conformance suite measured
        if: always() && steps.install_tool.outcome == 'success'
        run: |
          .ci/test-evidence-summary.sh \
            --lane "conformance (real Claude Code)" \
            --junit junit-conformance.xml \
            --evidence-dir "${{ github.workspace }}/.outcomes-conformance" \
            --require-evidence

      - name: Report what the native CLI suite measured
        # `--require-evidence` here is the whole point of provisioning the
        # binary: on a hosted runner without it these five cases decline and the
        # `native-cli` lane merely reports that. Here the binary exists, so a
        # decline means the lane failed to point the suite at what it installed.
        if: always() && steps.install_tool.outcome == 'success'
        run: |
          .ci/test-evidence-summary.sh \
            --lane "native CLI suite (real Claude Code)" \
            --junit junit-native-cli.xml \
            --evidence-dir "${{ github.workspace }}/.outcomes-native-cli" \
            --require-evidence

      - name: Assert the lane actually measured the real binary
        # The suite's own zero-traffic failure covers a scenario that ran and
        # established nothing. This covers the other way the lane can be green
        # without evidence: the scenario declining, because the binary this lane
        # provisioned was not where it was looked for. A skip is an honest
        # outcome on a developer laptop and a broken lane here.
        if: steps.install_tool.outcome == 'success'
        run: |
          set -euo pipefail
          record="${AA_CONFORMANCE_OUTCOME_DIR}/real-tool-lane.json"
          if [ ! -f "${record}" ]; then
            echo "::error title=Real-tool lane measured nothing::the real-tool scenario recorded no outcome at ${record}; the lane exists to take one measurement and did not take it."
            exit 1
          fi
          if ! jq -e '.outcome == "measured"' "${record}" > /dev/null; then
            echo "::error title=Real-tool lane measured nothing::$(jq -r '"the real-tool scenario recorded `\(.outcome)`: \(.detail)"' "${record}")"
            exit 1
          fi
          jq -r '"the real-tool scenario measured: \(.detail)"' "${record}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Dependabot configuration — agent-assembly
#
# Keeps three dependency ecosystems up to date automatically:
#
#   1. cargo        — Rust workspace crates (all 10 crates share one lockfile
#                     at the workspace root "/")
#   2. npm (pnpm)   — dashboard React + TypeScript frontend managed with pnpm;
#                     Dependabot uses "npm" ecosystem for pnpm projects and
#                     auto-detects pnpm via pnpm-lock.yaml in "dashboard/"
#   3. github-actions — Action SHAs pinned in .github/workflows/*.yml
#                       Dependabot will open PRs to bump the commit SHA and
#                       update the inline version comment when a new release
#                       of a pinned action is available
#
# Common settings applied to every entry:
#   commit-message  — Gitmoji ⬆ prefix to match the project commit convention
#   schedule        — daily to catch CVEs and patch releases quickly;
#                     adjust to "weekly" if PR noise becomes too high
#
# Reference:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# AAASM-5675: `target-branch` is deliberately absent from EVERY entry below, and
# adding it back disables Dependabot security updates for that entry's manifest
# files. GitHub's security-update docs are explicit — "you should not specify a
# `target-branch`" — and the options reference states that setting it means the
# manifest files of that package manager no longer receive security updates.
#
# It was previously set to "main" on all three entries, which is the repository's
# default branch anyway, so it bought nothing and silently cost security updates
# repo-wide. Removing it changes no targeting behaviour: Dependabot targets the
# default branch when the field is absent, and that default is `main`.
updates:

  # ── Rust workspace ────────────────────────────────────────────────────────
  # Covers every crate in the Rust workspace (aa-core, aa-runtime, aa-ebpf,
  # aa-proxy, aa-sdk-client, aa-wasm, aa-gateway, aa-api, aa-cli, …).
  # The workspace resolver means a single Cargo.lock at "/" tracks them all.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "⬆"
    open-pull-requests-limit: 10
    ignore:
      # time 0.3.48 introduced an E0119 trait-coherence conflict that breaks
      # rcgen 0.14.8 (our pinned cert-gen dep, used by aa-gateway/aa-proxy):
      #   error[E0119]: conflicting implementations of trait `From<…HourBase>`
      # No fixable combination exists yet — 0.3.48 is the latest `time` and
      # 0.14.8 is the latest published `rcgen` (no 0.14.9 / 0.15). Skip this
      # one broken release; a later `time` (0.3.49+) or an `rcgen` fix will
      # re-enable the bump automatically. See PR #1026.
      - dependency-name: "time"
        versions: ["0.3.48"]

  # ── Dashboard (pnpm) ─────────────────────────────────────────────────────
  # React + TypeScript frontend scaffold located in dashboard/, managed with
  # pnpm (packageManager: pnpm@10.9.0 declared in dashboard/package.json).
  # Dependabot uses the "npm" ecosystem value for pnpm projects — it auto-
  # detects pnpm via the presence of pnpm-lock.yaml in the target directory.
  # Dependabot requires an explicit directory pointing to the folder that
  # contains package.json; it will NOT discover it from the root entry above.
  # Covers: react, react-dom, vite, typescript, @vitejs/plugin-react, @types/*.
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "daily"
    labels: ["dependencies", "dashboard", "pnpm"]
    commit-message:
      prefix: "⬆"
    open-pull-requests-limit: 10

  # ── Developer-integration reference client (pnpm) ────────────────────────
  # AAASM-5675. This directory had a pnpm-lock.yaml and no entry here, so it
  # received no scheduled version updates at all — the reason its dependencies
  # drifted unattended.
  #
  # No `allow:` block, deliberately. An earlier draft of this entry carried
  # `allow: - dependency-type: "all"` and a comment calling it load-bearing.
  # Both were wrong twice over: the options reference scopes `all`'s
  # dependencies-of-direct-dependencies behaviour to bundler / pip / composer /
  # cargo / gomod / uv, and **npm is in neither that list nor the `indirect`
  # one**, so for npm `all` is exactly `direct`; and `allow` is not honoured for
  # security updates at all (dependabot-core#2521, open since 2020). Dependabot
  # already updates vulnerable transitive npm dependencies during security
  # updates without any config lever.
  #
  # The same draft asserted that js-yaml "was never in this directory's
  # package.json and never will be". It is there, at `pnpm.overrides` — and that
  # override is what actually resolved the advisory, which makes it the opposite
  # of the claim. Left recorded here because a wrong root-cause in a comment
  # outlives the pull request that introduced it.
  - package-ecosystem: "npm"
    directory: "/examples/aa-devint-reference-client"
    schedule:
      interval: "daily"
    labels: ["dependencies", "examples", "pnpm"]
    commit-message:
      prefix: "⬆"
    open-pull-requests-limit: 10

  # ── Integration-test TypeScript agent fixtures (pnpm) ────────────────────
  # AAASM-5675. Same shape as the entry above, found by the same sweep: a
  # pnpm-lock.yaml with no entry here. It is test-fixture code and not shipped,
  # so the blast radius of a vulnerability is smaller — but "smaller" is not the
  # reason it was uncovered, and an unsatisfiable security job here would fail
  # exactly as the reference client's did. Covered deliberately rather than left
  # to be rediscovered.
  #
  # This directory has a live advisory right now: its pnpm-lock.yaml resolves
  # js-yaml@4.1.1 at two sites, inside the >= 4.0.0 < 4.3.1 affected range, and
  # unlike the reference client its package.json carries no `pnpm.overrides`
  # pinning it. Covering it here is what lets Dependabot raise that PR; the pin
  # itself is tracked separately (AAASM-5775).
  - package-ecosystem: "npm"
    directory: "/aa-integration-tests/tests/fixtures/agents/typescript"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "test-fixtures", "pnpm"]
    commit-message:
      prefix: "⬆"
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # All actions in .github/workflows/ are pinned to full commit SHAs
  # (per SonarCloud rule S7637). Dependabot will open PRs to update both
  # the SHA and the inline version comment (e.g. # v4 → # v5) when a new
  # release is tagged upstream.
  # Covers: actions/checkout, dtolnay/rust-toolchain, Swatinem/rust-cache,
  #         taiki-e/install-action, codecov/codecov-action,
  #         EmbarkStudios/cargo-deny-action, SonarSource/sonarqube-scan-action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "⬆"
    open-pull-requests-limit: 10

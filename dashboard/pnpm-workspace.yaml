# pnpm settings for the dashboard. AAASM-6133.
#
# These nine entries were migrated verbatim out of package.json's
# "pnpm.overrides" field. pnpm 11 no longer reads that field
# (https://pnpm.io/settings), so leaving them there meant a one-line bump of
# any `pnpm/action-setup` pin to 11 would have dropped all nine security floors
# with no error, no warning and a green build. pnpm-workspace.yaml is read by
# both pnpm 10 and pnpm 11, so the floors survive the major bump whenever it
# happens.
#
# Keys, values and order are unchanged from the package.json block — several of
# these are not cosmetic (dompurify and undici exist precisely because a
# transitive dependency otherwise resolves below a patched version), and the
# same defect class has already caused two real regressions: HORO-377, where a
# relock silently deleted this block, and AAASM-6032 in
# ai-agent-assembly/examples. `scripts/check_pnpm_overrides_parity.py` fails the
# build if this file and pnpm-lock.yaml ever disagree, or if a floor is
# reintroduced into package.json.
overrides:
  '@babel/core': ^7.29.7
  browserslist: ^4.28.7
  # GHSA-p98j-92pf-mc4p (IN_PLACE: a node-removing afterSanitize hook leaves
  # detached-subtree event handlers armed, giving DOM XSS). Vulnerable range is
  # >= 3.4.13 <= 3.4.15, fixed in 3.4.16, and the dependency is runtime-scoped,
  # so it ships to the browser.
  #
  # This entry overrides an upstream EXACT pin rather than topping up a stale
  # floor: monaco-editor@0.57.0 declares `dompurify: 3.4.15`, not a range, so
  # there is no semver-compatible resolution for Dependabot to propose - which
  # is why the alert sat open with no pull request.
  #
  # Removal condition: drop this entry once a monaco-editor release declares
  # dompurify >= 3.4.16 (either as a range or as a newer exact pin).
  dompurify: ^3.4.16
  esbuild: ^0.28.1
  js-yaml: ^4.3.2
  # Six advisories - GHSA-w293-vg96-wgc3 (high), GHSA-2jfj-6hjv-fm6j,
  # GHSA-pmjh-fq2x-6v4x, GHSA-8436-99hf-9mmv, GHSA-2gqq-gqf2-x968,
  # GHSA-r53p-7pc4-xj5r - all of which affect BOTH the 7.x and the 8.x line, at
  # `< 7.29.1` and `>= 8.0.0, < 8.10.2` respectively.
  #
  # The floor moved major deliberately, and raising it inside 7.x would have
  # been the wrong fix. The sole consumer is jsdom@30.1.1, which declares
  # `undici: ^8.10.2`; the previous ^7.28.0 entry was therefore a silent
  # cross-major DOWNGRADE, resolving 7.29.0 for a dependent that asked for 8.x.
  # An override downgrades as readily as it upgrades and nothing in the install
  # warns about it. ^8.10.2 is simultaneously the 8.x fix level for all six
  # advisories and the exact range jsdom declares, so this one change clears the
  # advisories and puts the resolution back inside the declared range.
  undici: ^8.10.2
  # GHSA-q2hr-2g5m-vwhr (a crafted brace pattern makes expand() allocate
  # super-linearly, so a caller expanding untrusted input is a DoS) reaches all
  # three lines at three different fix levels: < 1.1.21, >= 2.0.0 < 2.1.7 and
  # >= 4.0.0 < 5.0.12. All three previous floors were stale, so the advisory
  # fired against floors that already existed. Each line arrives through
  # minimatch - 3.1.5 (`^1.1.7`), 5.1.9 (`^2.0.1`) and 9.0.9 (`^2.0.2`) for the
  # 1.x and 2.x lines, 10.2.5 (`^5.0.5`) for the 5.x line - and every one of
  # those is a range that admits the patched version, so these are ordinary
  # floor raises rather than overrides of an upstream pin.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12

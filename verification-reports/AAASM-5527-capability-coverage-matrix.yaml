# AAASM-5527 — machine-readable capability coverage matrix
#
# Companion to AAASM-5527-capability-coverage-matrix-and-threat-model.md, which
# carries the prose, the threat model, the bypass catalogue and the Go/No-Go
# recommendations. This file carries the seventeen ticket-required fields split
# individually, so AAASM-5531 can consume them without parsing Markdown tables.
#
# Placement note: this lives in verification-reports/ rather than a docs/spec
# directory because docs/src/** and docs/src/SUMMARY.md are held by AAASM-5592
# concurrently (see the companion document, "Why this file lives here").
# AAASM-5531 owns promoting it to a canonical, CI-validated location.
#
# NOT a source of truth for the architecture — ADR 0033 is. Every `coverage`
# value is one of ADR 0033 §6's eleven terms and validation should enforce that.

meta:
  ticket: AAASM-5527
  epic: AAASM-5526
  goal: CBLPCRLM-13
  fix_version: agent-assembly v0.0.1-rc.7
  compiled: "2026-08-06"
  base_commit: 299de3883
  canonical_architecture: docs/src/adr/0033-canonical-governance-and-enforcement-architecture.md
  protection_ladder: docs/src/adr/0030-developer-integration-boundaries-and-trust-model.md
  companion: verification-reports/AAASM-5527-capability-coverage-matrix-and-threat-model.md

schema:
  # The seventeen fields the ticket requires, plus eight this survey found
  # necessary to make a claim checkable. See the companion document's
  # "Fields this artifact recommends for the AAASM-5531 manifest".
  required_fields:
    - id
    - capability
    - framework_or_tool
    - language
    - platform
    - launch_path
    - transport
    - interception_component
    - identity_source
    - policy_context
    - decision_timing
    - observe_or_enforce
    - sync_or_best_effort
    - failure_posture
    - known_bypasses
    - evidence
    - current_level
    - target_level
  recommended_additions:
    - default_state
    - released_channels
    - released_platforms
    - reachability
    - boundary_class
    - failure_posture           # third enum value fail_open_silent
    - evidence_runs_on_main
    - deny_signal
    - redaction_actor
    - coverage                  # closed enum, ADR 0033 §6
    - released_note             # channel/platform exceptions in prose
    - evidence_quality          # unit_only | wire_level
    - boundary_conditional_on   # what the boundary depends on holding
    - boundary_attained         # false where the class is named but not reached
    - coverage_qualifiers       # THE general rule for secondary coverage.
                                # A mapping {aspect: <coverage term>} used wherever
                                # one row's coverage differs by aspect — connection
                                # vs payload, E3 vs E4, MCP path vs LLM path, one
                                # SDK vs the others. Replaces five ad-hoc keys that
                                # were declared rather than resolved; values are
                                # the same closed ADR 0033 §6 enum as `coverage`.
    - released_matrix           # channel -> platforms, REQUIRED where the two do
                                # not factorise (every aa-proxy row: macOS is
                                # crates.io-only per release.yml:274)
    - current_level_scope       # e.g. tool_governance_only — an ADR 0030 rung
                                # that is reachable but does NOT imply data-path prevention
    - notes
    - tickets
    - response_side_posture     # where request and response postures differ
    - failure_posture_node      # where one SDK diverges from the others
    - q3_changed_answer
    - q4_changed_answer
    - q4_changed_answer_in_product_favour
    - evidence_gate_note        # why a path-filtered gate does not cover its test
  enums:
    coverage:                   # ADR 0033 §6 — closed set; anything else is invalid
      [observed, detected, evaluated, denied_before_execution, redacted,
       approval_required, degraded, unmeasured, experimental, planned, unsupported]
    decision_timing: [pre, in_line, post, none]
    observe_or_enforce: [enforce, observe, none]
    sync_or_best_effort: [sync, best_effort, none]
    failure_posture:
      # `fail_open_silent` is a distinct value on purpose: G7 and G9 fail open
      # WITHOUT emitting a degradation, which is materially different from G6,
      # which does. `silent_truncation` is M7/N9's posture — the request is not
      # refused and not forwarded intact; the body is emptied.
      [fail_closed, fail_open, fail_open_silent, silent_truncation, not_applicable]
    default_state: [on, off, open, closed, mixed, not_applicable]
    released_channels:
      [github_release, homebrew, install_script, crates_io, pypi, npm,
       go_modules, not_applicable]
    released_platforms:
      [linux_x86_64, linux_aarch64, macos, windows, not_applicable]
    evidence_runs_on_main:
      # NOT a boolean. A path-filtered gate with a cron backstop is weak
      # evidence; one with no backstop is not evidence of a standing property at
      # all. `path_gated_no_backstop` is this artifact's OWN situation: the link,
      # anchor, YAML and markdownlint checks are run by hand because
      # doc-links.yml is path-filtered to README.md and docs/**, and no
      # markdownlint job exists in CI at all.
      [standing, path_gated_with_schedule, path_gated_no_backstop, manual_only, none]
    reachability:
      # WHY the capability is or is not reachable. Split out from the old
      # boolean `reachable_in_release`, which conflated four different causes
      # and was wrong in both directions for ~25 of 80 rows.
      #   shipped                 reachable through the listed channels
      #   shipped_crates_io_only  the bin publishes to crates.io but is absent
      #                           from the GitHub Release / Homebrew / installer
      #                           channels most users actually use
      #   dead_code               the binary ships; no route reaches the code
      #   absent_mechanism        no such mechanism exists in the tree
      #   stubbed_default         the code path exists but the default config
      #                           routes past it (S7)
      [shipped, shipped_with_platform_exception, shipped_crates_io_only, dead_code, absent_mechanism, stubbed_default]
    boundary_class:
      B1: universal within one patched function
      B2: universal within one framework
      B3: universal within one process
      B4: universal within one container
      B5: universal within one host
      B6: universal within one managed device
      B7: universal across opaque SaaS agents
    deny_signal: [raise, sentinel_value, none]
    redaction_actor: [proxy_scanner, gateway_instructions, none]
    current_level:              # ADR 0030 ladder for dev-tool rows
      [not_installed, detected_not_integrated, partially_integrated, integrated,
       gateway_protected, host_enforced, l1_observe, not_applicable]


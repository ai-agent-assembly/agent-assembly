openapi: 3.1.0
info:
  title: Agent Assembly API
  description: |-
    REST API for the Agent Assembly governance gateway.

    This spec is auto-generated from `aa-api` route annotations via `utoipa`. CI fails if the generated spec drifts from the committed `openapi/v1.yaml`.
  contact:
    name: Agent Assembly Contributors
    url: https://github.com/ai-agent-assembly/agent-assembly
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
servers:
- url: http://localhost:7700
  description: Local development gateway
paths:
  /api/v1/admin/retention-policy:
    get:
      tags:
      - admin
      summary: Get the live retention policy + last-run stats
      description: Returns the gateway's currently-active retention configuration plus the most recent successful run's statistics. The `last_run` field is `null` until the engine has completed at least one pass.
      operationId: get_retention_policy
      responses:
        '200':
          description: Current retention policy document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyDocument'
        '503':
          description: Retention engine not configured (gateway started without storage section)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags:
      - admin
      summary: Hot-reload the retention policy thresholds
      description: Atomically replaces the gateway's active retention configuration. Validation runs both client-side in the dashboard and server-side here; on validation failure the active config is preserved. The cron schedule is read-only at runtime — only thresholds and the cold action can be changed without a restart.
      operationId: update_retention_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetentionPolicyRequest'
        required: true
      responses:
        '200':
          description: Configuration applied; updated document returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicyDocument'
        '400':
          description: Invalid request body (validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Retention engine not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/admin/retention-policy/run:
    post:
      tags:
      - admin
      summary: Run the retention engine once immediately
      description: Triggers `RetentionEngine::run_once` with the live config, optionally forcing dry-run mode for this single invocation. Returns the resulting `RetentionStats` so the dashboard's "Last retention run" panel can refresh inline.
      operationId: run_retention_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRetentionRequest'
        required: true
      responses:
        '200':
          description: Run completed; stats returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRunStatsDto'
        '500':
          description: Backend retention pass failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Retention engine not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/agents:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents` — list all registered agents with pagination.'
      description: Returns a paginated list of all agents currently known to the registry.
      operationId: list_agents
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed). Defaults to 1.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
      - name: per_page
        in: query
        description: Items per page (max 100). Defaults to 50.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Paginated list of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentResponse'
  /api/v1/agents/{id}:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/:id` — inspect a specific agent by ID.'
      description: Retrieve details of a specific agent by its hex-encoded UUID.
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
    delete:
      tags:
      - agents
      summary: '`DELETE /api/v1/agents/:id` — deregister (kill) an agent.'
      description: Deregister and terminate the agent process.
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Agent deregistered
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/agents/{id}/budget:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/:id/budget` — per-scope budget rollup for an agent.'
      description: |-
        Returns rows for the agent itself, its team (if it belongs to one), the
        org / global totals, and its delegation subtree (if it has descendants).
        Each row carries `spent_usd`, `limit_usd`, `remaining_usd`, and
        `percent_used` (the latter two omitted when no limit is configured).
        Backs `aasm policy show <agent_id> --show-budget` (AAASM-1051) and the
        dashboard's budget-burn surface (AAASM-1055).
      operationId: get_agent_budget
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Budget rollup rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetRollupResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/agents/{id}/capabilities:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/:id/capabilities` — effective permissions with provenance.'
      description: |-
        Returns the agent's merged `allow`/`deny` capability set plus the per-scope
        contribution from every policy in its cascade. Used by `aasm policy show
        <agent_id> --show-permissions` and `aasm topology lineage <agent_id>
        --show-permissions`, and by the dashboard's inherited-permissions panel.
      operationId: get_agent_capabilities
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionsResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/agents/{id}/config:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/:id/config` — per-agent config projection (AAASM-5098).'
      description: |-
        Read-only projection backing the Agent-Detail Config-YAML tab (ADR-0022,
        narrow Option C). Returns **only fields with a real per-agent source**: the
        registered `enforcement_mode` (the field the enforcement path consults, not
        `metadata["mode"]`), the agent's effective policy cascade, and a *qualitative*
        recommendation naming the resources that dominate its recent denials. The
        mock's `fail_open`, `rate_limit`, `observability`, and `issuer` are omitted
        from the contract entirely — ADR-0022 verified none has a per-agent source,
        and emitting them as `null` would imply a concept that does not exist. The
        recommendation carries no quantified improvement estimate: the `−N%`
        counterfactual is blocked on AAASM-5094's traffic replay.

        Deny-by-default and tenant-scoped: [`authorize_agent_access`] confines the
        caller to an agent in its own team (admin sees any; a caller with no team
        scope is denied before any read), so neither the cascade nor the denial
        rollup crosses a tenant boundary. No enforcement or audit-write path is touched.
      operationId: get_agent_config
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Per-agent config projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
        '400':
          description: Invalid agent ID format
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks access to the agent's team
        '404':
          description: Agent not found
  /api/v1/agents/{id}/decisions:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/:id/decisions` — recent per-agent decision stream.'
      description: |-
        Read-only projection of the existing audit log: the agent's most recent
        governance decisions, newest-first, one row per decision
        (`design/v1/hi-fi/agent-detail.jsx` Traffic tab). Backs the agent-detail
        Traffic tab's per-decision table beneath its aggregate summary (AAASM-5058).

        Deny-by-default and tenant-scoped: [`authorize_agent_access`] confines the
        caller to an agent in its own team (admin sees any; a caller with no team
        scope is denied before any audit read), so the returned decisions never
        cross a tenant boundary. Entries carrying no policy `decision` are skipped so
        the stream is decisions only. No audit-write or enforcement path is touched.
      operationId: get_agent_decisions
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          Maximum number of decision rows to return (newest-first). Defaults to
          [`DEFAULT_DECISIONS_LIMIT`], clamped to [`MAX_DECISIONS_LIMIT`].
        required: false
        schema:
          type:
          - integer
          - 'null'
          minimum: 0
      responses:
        '200':
          description: Recent per-agent decisions, newest-first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDecisionsResponse'
        '400':
          description: Invalid agent ID format
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks access to the agent's team
        '404':
          description: Agent not found
  /api/v1/agents/{id}/edges:
    get:
      tags:
      - agents
      summary: List directed edges for an agent.
      description: |-
        Returns edges ordered newest-first.  `direction` defaults to `outgoing`.
        `limit` defaults to 100 and is capped at 1000.  `before` filters to edges
        recorded before the given ISO 8601 timestamp.
      operationId: list_agent_edges
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent ID
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Filter by edge type (snake_case). Omit for all types.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: messages
      - name: direction
        in: query
        description: Direction of edges relative to the agent. Defaults to `outgoing`.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: outgoing
      - name: limit
        in: query
        description: Maximum number of results. Defaults to 100, capped at 1000.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        example: 100
      - name: before
        in: query
        description: Return only edges recorded before this ISO 8601 timestamp.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: 2026-01-01T00:00:00Z
      responses:
        '200':
          description: Edge list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeListResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Store error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/agents/{id}/graph:
    get:
      tags:
      - agents
      summary: Return the topology subgraph reachable from an agent.
      description: |-
        Performs BFS outward from `id` up to `depth` hops (default 2, max 5).
        Returns all unique nodes reachable and the edges between them, with
        `is_cross_team` computed via a batched registry lookup.
      operationId: get_agent_graph
      parameters:
      - name: id
        in: path
        description: Hex-encoded root agent ID
        required: true
        schema:
          type: string
      - name: depth
        in: query
        description: BFS depth from the root agent. Defaults to 2, capped at 5.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        example: 2
      responses:
        '200':
          description: Subgraph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Store error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/agents/{id}/resume:
    post:
      tags:
      - agents
      summary: '`POST /api/v1/agents/:id/resume` — resume a suspended agent.'
      description: Resume an agent that was previously suspended back to Active status.
      operationId: resume_agent
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/agents/{id}/subtree-burn:
    get:
      tags:
      - agents
      summary: '`GET /api/v1/agents/{id}/subtree-burn` — per-direct-child subtree spend time series.'
      description: |-
        Reads `BudgetTracker::agent_spend_history` for the agent itself and each
        direct descendant from `AgentRegistry::children_of`, then aligns the
        per-child series day-by-day so the response has one point per day in the
        requested window (`7d` default, `30d` opt-in). Days with no recorded
        spend appear with `spent_usd = "0"` for that child rather than being
        omitted, so the dashboard's stacked area renders without gaps.

        The agent's own spend is included as a synthetic `child_name: "(self)"`
        row whenever it has any recorded spend across the window, so the stack
        adds up to the subtree total.

        The history store is in-memory only (not persisted across restarts);
        the chart will populate progressively as agents accrue spend after
        the most recent gateway start.
      operationId: get_agent_subtree_burn
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      - name: period
        in: query
        description: 'Period string: `7d` (default) or `30d`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Subtree-burn time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtreeBurnResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/agents/{id}/suspend:
    post:
      tags:
      - agents
      summary: '`POST /api/v1/agents/:id/suspend` — suspend an agent.'
      description: Suspend a running agent with a reason logged for audit.
      operationId: suspend_agent
      parameters:
      - name: id
        in: path
        description: Hex-encoded agent UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendRequest'
        required: true
      responses:
        '200':
          description: Agent suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendResponse'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: '`GET /api/v1/alerts` — list recent governance alerts.'
      description: List recent governance alerts such as budget warnings and policy violations.
      operationId: list_alerts
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed). Defaults to 1.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
      - name: per_page
        in: query
        description: Items per page (max 100). Defaults to 50.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: Paginated list of recent alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertResponse'
  /api/v1/alerts/destinations:
    get:
      tags:
      - alert-destinations
      summary: '`GET /api/v1/alerts/destinations` — list destinations.'
      description: |-
        List configured notification destinations. The `kind` query parameter filters
        to webhook, slack, pagerduty, or opsgenie. Returns the full set when absent.
      operationId: list_destinations
      parameters:
      - name: kind
        in: query
        description: Optional kind filter (`webhook`, `slack`, `pagerduty`, `opsgenie`).
        required: false
        schema:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DestinationKind'
      responses:
        '200':
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DestinationResponse'
    post:
      tags:
      - alert-destinations
      summary: '`POST /api/v1/alerts/destinations` — create a destination.'
      description: |-
        Register a new notification destination. The request `kind` discriminates the
        `config` shape and is validated server-side; an unknown kind returns 400
        `invalid_kind` and a malformed config returns 400 `invalid_config`.
      operationId: create_destination
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationRequest'
        required: true
      responses:
        '201':
          description: Destination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '400':
          description: Invalid kind or config
  /api/v1/alerts/destinations/{id}:
    get:
      tags:
      - alert-destinations
      summary: '`GET /api/v1/alerts/destinations/{id}` — fetch one destination.'
      description: |-
        Retrieve a single notification destination by id. Returns 404
        `destination_not_found` when the id is unknown.
      operationId: get_destination
      parameters:
      - name: id
        in: path
        description: Destination identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '404':
          description: Destination not found
    put:
      tags:
      - alert-destinations
      summary: '`PUT /api/v1/alerts/destinations/{id}` — update a destination.'
      description: |-
        Replace name, config, or enabled state on an existing destination. Preserves
        the original `created_at`, bumps `updated_at`, and re-validates the config —
        invalid input returns 400.
      operationId: update_destination
      parameters:
      - name: id
        in: path
        description: Destination identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDestinationRequest'
        required: true
      responses:
        '200':
          description: Destination updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationResponse'
        '400':
          description: Invalid update payload
        '404':
          description: Destination not found
    delete:
      tags:
      - alert-destinations
      summary: '`DELETE /api/v1/alerts/destinations/{id}` — remove a destination.'
      description: |-
        Remove a destination. Returns 409 `destination_in_use` when any active alert
        rule still references this id — the rule must be removed or re-targeted
        before the destination can be deleted.
      operationId: delete_destination
      parameters:
      - name: id
        in: path
        description: Destination identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Destination removed
        '404':
          description: Destination not found
        '409':
          description: Destination still referenced by a routing rule
  /api/v1/alerts/destinations/{id}/test:
    post:
      tags:
      - alert-destinations
      summary: '`POST /api/v1/alerts/destinations/{id}/test` — fire a test notification.'
      description: |-
        Send a real test notification through the destination's connector — no
        dry-run — so operators can verify the round-trip end-to-end. Returns 502
        `connector_failed` with the upstream status and body when the connector
        rejects the payload.
      operationId: test_destination
      parameters:
      - name: id
        in: path
        description: Destination identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Optional severity / message overrides
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestDestinationRequest'
        required: true
      responses:
        '200':
          description: Connector accepted the test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDestinationResponse'
        '404':
          description: Destination not found
        '502':
          description: Connector failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorFailedBody'
  /api/v1/alerts/rules:
    get:
      tags:
      - alert-rules
      summary: List alert rules.
      description: |-
        Returns every persisted [`AlertRule`] as a bare JSON array ordered
        by `created_at` then `id` so the dashboard's
        `useAlertRulesQuery` (AAASM-1075) can consume the response
        directly. Pass `?enabled=true|false` to restrict the response to
        the matching subset.
      operationId: list_rules
      parameters:
      - name: enabled
        in: query
        description: Filter by the rule's `enabled` flag. Omit to return every rule.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: Bare array of alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags:
      - alert-rules
      summary: Create a new alert rule.
      description: |-
        Validates the request body against the destination registry and the
        per-metric range rules, then persists it with a server-assigned id
        and RFC 3339 `created_at` / `updated_at` timestamps. Returns the
        stored record. Surfaces `invalid_metric`, `invalid_threshold`,
        `destination_unknown`, or `rule_name_conflict` on rejection.
      operationId: create_rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '201':
          description: Created rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Validation failure (invalid_metric, invalid_threshold, destination_unknown, ...)
        '409':
          description: rule_name_conflict
  /api/v1/alerts/rules/{id}:
    get:
      tags:
      - alert-rules
      summary: Fetch a single alert rule by id.
      description: |-
        Returns the full [`AlertRule`] record, or `rule_not_found` (404)
        when `id` is unknown.
      operationId: get_rule
      parameters:
      - name: id
        in: path
        description: Rule id assigned by the server
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Rule detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          description: rule_not_found
    put:
      tags:
      - alert-rules
      summary: Replace an alert rule.
      description: |-
        Same validation as `POST`. The store preserves the existing `id`
        and `created_at` while bumping `updated_at`. Returns the updated
        record, or `rule_not_found` (404) when `id` is unknown.
      operationId: update_rule
      parameters:
      - name: id
        in: path
        description: Rule id assigned by the server
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Validation failure
        '404':
          description: rule_not_found
        '409':
          description: rule_name_conflict
    delete:
      tags:
      - alert-rules
      summary: Delete an alert rule.
      description: |-
        Returns `204 No Content` on success, or `rule_not_found` (404) when
        the id is unknown. Already-fired alerts derived from a deleted rule
        keep their snapshot so the alert detail view still works.
      operationId: delete_rule
      parameters:
      - name: id
        in: path
        description: Rule id assigned by the server
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Rule deleted
        '404':
          description: rule_not_found
  /api/v1/alerts/silence:
    post:
      tags:
      - alerts
      summary: |-
        `POST /api/v1/alerts/silence` — silence an active alert for a
        configurable duration (AAASM-1387 / AAASM-1648).
      description: |-
        Validates the body, flips the target alert's status to
        `"suppressed"` via [`AlertStore::suppress`](crate::alerts::AlertStore::suppress),
        and records a [`SilenceRecord`] in the [`SilenceStore`](crate::alerts::silence_store::SilenceStore).
        The silence-expiry watcher (AAASM-1646) restores the alert when
        `expires_at` is reached.

        `created_by` is resolved from the authenticated caller
        (`AuthenticatedCaller.key_id`); under `AuthMode::Off` this is the
        bypass principal `"__bypass__"`.

        ## Errors

        | Status | Code | Trigger |
        |---|---|---|
        | 400 | `invalid_duration` | `duration_seconds == 0` or `> 604_800` |
        | 400 | `reason_too_long` | `reason.len() > 500` |
        | 404 | `alert_not_found` | `alert_id` is not in `AlertStore` |
        | 409 | `alert_already_silenced` | an active silence exists for `alert_id` |
      operationId: silence_alert
      requestBody:
        description: Silence parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SilenceAlertRequest'
        required: true
      responses:
        '201':
          description: Silence applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilenceResponse'
        '400':
          description: Invalid request (`invalid_duration` or `reason_too_long`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Alert already silenced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearer_auth: []
  /api/v1/alerts/ws:
    get:
      tags:
      - alerts-stream
      summary: |-
        `GET /api/v1/alerts/ws` — upgrade to a WebSocket and stream
        real-time alert lifecycle events.
      description: |-
        **Subprotocol**: clients MUST offer `aaasm-alerts-v1` in the
        `Sec-WebSocket-Protocol` upgrade header. Upgrades without it are
        rejected with `400` before protocol switch. The committed
        `openapi/v1.yaml` carries this as `x-ws-subprotocol:
        aaasm-alerts-v1` on the path object.
      operationId: ws_alerts_handler
      parameters:
      - name: events
        in: query
        description: |-
          Comma-separated lifecycle filter: `fire`, `resolve`, `silence`.
          All three are included when omitted.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: severity
        in: query
        description: |-
          Comma-separated severity filter: `CRITICAL`, `HIGH`, `MEDIUM`,
          `LOW`. All four are included when omitted.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agent_id
        in: query
        description: Restrict the stream to a single hex-encoded agent id.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: ticket
        in: query
        description: |-
          Short-lived, single-use WebSocket ticket (AAASM-4861). Browsers can't set
          an `Authorization` header on a WS handshake, so the dashboard mints a
          ticket via `POST /api/v1/auth/ws-ticket` and presents it here instead of
          putting a long-lived credential in the URL. Non-browser clients may
          instead send an `Authorization: Bearer` header and omit this.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '101':
          description: WebSocket upgrade successful. Server streams AlertWsFrame JSON text frames.
        '200':
          description: Frame schema (delivered as WebSocket text frames, not as an HTTP response body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertWsFrame'
        '400':
          description: Bad request — missing subprotocol or invalid filter query parameter
    x-ws-subprotocol: aaasm-alerts-v1
  /api/v1/alerts/{id}:
    get:
      tags:
      - alerts
      summary: '`GET /api/v1/alerts/:id` — fetch one governance alert by ID.'
      description: |-
        Returns the rich [`AlertDetailResponse`] shape — rule snapshot,
        routing log, silence, dedup state, plus the legacy budget/secret
        alert fields. Returns 404 with an RFC 7807 problem detail if the
        alert is unknown or has been evicted from the in-memory ring buffer.
      operationId: get_alert
      parameters:
      - name: id
        in: path
        description: ULID alert identifier (26 chars)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Alert detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetailResponse'
        '404':
          description: Alert not found
  /api/v1/alerts/{id}/resolve:
    post:
      tags:
      - alerts
      summary: '`POST /api/v1/alerts/:id/resolve` — mark a governance alert as resolved.'
      description: |-
        Idempotent — calling against an already-resolved alert returns the same
        record with `updated_at` unchanged. Returns 404 if the id is unknown or
        has been evicted from the ring buffer.
      operationId: resolve_alert
      parameters:
      - name: id
        in: path
        description: ULID alert identifier (26 chars)
        required: true
        schema:
          type: string
      requestBody:
        description: Optional resolution metadata
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAlertRequest'
        required: true
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '404':
          description: Alert not found
  /api/v1/analytics/action-volume:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/action-volume` — action counts over time, per category.'
      description: |-
        Buckets the requested window into [`SERIES_BUCKETS`] equal slices and counts
        audit events per slice, grouped into a small set of action categories
        (`intercepted`, `dispatched`, `violations`, `approvals` — see
        [`action_category`]). Each emitted series carries a point for every bucket
        (including zeros) so the line chart is continuous; `t` is the bucket-start
        epoch-millisecond timestamp. Only categories that recorded at least one
        event in the window are emitted, so an idle window yields an empty series
        list rather than fabricated activity. Confined to the caller's tenant.
      operationId: get_action_volume
      parameters:
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-category action-volume time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionVolumeResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/agent-decision-mix:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/agent-decision-mix` — per-agent decision distribution.'
      description: |-
        Aggregates the existing audit log over the requested window, grouping by
        agent id and tallying each recorded decision into the Agent-Detail
        traffic-mix buckets `allow` / `narrow` / `scrub` / `pending` / `deny` (the
        vocabulary in `dashboard/src/features/trace/decision.ts`). The audit
        event-type → bucket mapping is [`decision_mix_bucket`], identical to the
        gateway's own decision write path (`decision_to_event_type_from_response`)
        and to the enforcement timeline (AAASM-5031): read-only observability over
        data the API already holds — no enforcement or audit-write path is touched.

        **Truthfulness.** Only the four proto `Decision` outcomes the gateway records
        are populated. `narrow` is always `0`: the proto `Decision` enum has no
        `NARROW` variant, so no audit event can be attributed to it, and inventing a
        count would fabricate governance activity that never happened. Agents with no
        tracked decision in the window are omitted entirely (the dashboard renders an
        empty state rather than a synthetic all-zero row). Confined to the caller's
        tenant via [`fetch_window_entries`] and bounded by [`MAX_ANALYTICS_AUDIT_EVENTS`],
        matching the sibling per-agent route (`agent-enforcement`, AAASM-5084).
      operationId: get_agent_decision_mix
      parameters:
      - name: window
        in: query
        description: |-
          Recent window to summarise: `1h` | `24h` | `7d` | `30d`. Defaults to
          `24h` — the window the Agent-Detail "traffic mix · last 24h" card shows;
          any unrecognised value also falls back to `24h`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-agent allow/narrow/scrub/pending/deny decision distribution over the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDecisionMixCounts'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/agent-enforcement:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/agent-enforcement` — per-agent blocked + scrubbed counts.'
      description: |-
        Aggregates the existing audit log over the requested window, grouping by
        agent id and counting the two enforcement outcomes the Fleet page surfaces:
        `blocked` = `PolicyViolation` events, `scrubbed` = `CredentialLeakBlocked`
        events. This is the same audit event-type → verdict mapping the enforcement
        timeline uses ([`timeline_verdict`], AAASM-5031): read-only observability
        over data the API already holds — no enforcement or audit-write path is
        touched, and no value is fabricated. Only agents that recorded at least one
        blocked or scrubbed decision appear (an agent with neither is omitted, so the
        dashboard renders `—` rather than a synthetic zero). Confined to the caller's
        tenant via [`fetch_window_entries`], matching the other audit-derived
        analytics routes (tool-usage, policy-effectiveness).
      operationId: get_agent_enforcement
      parameters:
      - name: window
        in: query
        description: |-
          Recent window to summarise: `1h` | `24h` | `7d` | `30d`. Defaults to
          `24h` — the window the Fleet "/24h" columns and Agent-Detail tiles show;
          any unrecognised value also falls back to `24h`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-agent blocked + scrubbed decision counts over the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentEnforcementCounts'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/approvals:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/approvals` — resolved-approval volume, rate and latency.'
      description: |-
        Aggregates the approval queue's resolved history over records whose decision
        timestamp falls in the window, confined to the caller's tenant (admin sees
        all teams; a tenant-scoped caller sees only its own team; untagged records
        are admin-only — matching the `/approvals` list route). `byOutcome` splits
        approved / rejected / `timed_out` (expired); `volume` is their sum;
        `approvalRate` = approved / volume; `medianTta` is the median time-to-answer
        in seconds across decided (non-expired) approvals.
      operationId: get_approvals
      parameters:
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Approval volume, rate and latency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalAnalyticsResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/cost-breakdown:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/cost-breakdown` — stacked spend broken down by a dimension.'
      description: |-
        The budget tracker exposes **point-in-time** spend (today's totals per agent
        and per team), not a time series, so the v1 response emits a single bucket
        labelled with the current budget date. Grouping:

        * `agent` (default) — one segment per agent, from the budget snapshot's
          per-agent breakdown. Only an admin sees the per-agent rows (they are not
          team-keyed, so exposing them to a tenant caller would leak other tenants'
          agents — same rule the `/costs` route applies).
        * `team` — one segment per team; an admin sees every team, a tenant-scoped
          caller sees only its own team's row.
        * `model` — **no per-model spend source exists** in the budget tracker, so
          this returns an empty bucket list rather than fabricated segments.
      operationId: get_cost_breakdown
      parameters:
      - name: groupBy
        in: query
        description: 'Grouping dimension: `agent` | `team` | `model`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Cost broken down into stacked segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostBreakdownResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/fleet-health:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/fleet-health` — per-agent health sparklines.'
      description: |-
        The registry exposes point-in-time status, not a health time series, so the
        v1 view emits a single current sample per agent: `score` = 100 when Active,
        40 when Suspended, 0 when Deregistered (see [`health_score`]), stamped with
        the current epoch-millisecond time. Scoped to the agents the caller may see
        (admin sees all; a tenant-scoped caller sees only its own team's agents).
      operationId: get_fleet_health
      parameters:
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-agent health sparklines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetHealthResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/kpis:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/kpis` — a single scalar KPI plus its window-over-window delta.'
      description: |-
        v1 metric definitions (documented because several are not uniquely
        determined by the available in-process state):

        * `agents` — number of registered agents the caller may see (registry is
          point-in-time, so `delta` is always `0.0`).
        * `invocations` — count of `ToolCallIntercepted` + `ToolDispatched` audit
          events in the window; `delta` compares against the immediately preceding
          equal-length window.
        * `cost` — current daily spend (USD) from the budget tracker snapshot
          (point-in-time; `delta` is `0.0`, `unit` = `USD`).
        * `anomalies` — count of `PolicyViolation` audit events in the window (the
          closest available signal to an anomaly); `delta` is window-over-window.
        * `p99` — request-tail latency. **No latency source exists** in the
          in-process audit/budget state, so this honestly returns `0.0` (`unit` =
          `ms`) rather than a fabricated value.

        Audit-derived metrics are confined to the caller's tenant; registry/budget
        metrics use the same visibility rules as the cost route.
      operationId: get_kpis
      parameters:
      - name: metric
        in: query
        description: 'KPI to compute: `agents` | `invocations` | `p99` | `cost` | `anomalies`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: range
        in: query
        description: |-
          Time range preset (`24h`, `7d`, `30d`, `90d`) or custom
          `YYYY-MM-DD..YYYY-MM-DD`. Defaults to `7d`.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved; not yet applied to KPIs).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved; not yet applied to KPIs).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: KPI value and window-over-window delta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/policy-effectiveness:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/policy-effectiveness` — per-rule daily outcome counts.'
      description: |-
        Groups audit events that carry a non-empty `policy_rule` by rule and by UTC
        day, classifying each into the v1 buckets:

        * `warns` — the evaluation was a shadow / dry-run (`dry_run: true`).
        * `blocks` — a `PolicyViolation` event, or a non-dry-run evaluation whose
          `decision` was not an allow.
        * `passes` — a non-dry-run evaluation whose `decision` was an allow (or that
          recorded no explicit decision).

        The rule `name` equals its id in v1 (the audit log records only the rule
        identifier). Rules with no recorded evaluations produce no entry, so an idle
        window returns an empty rule list. Confined to the caller's tenant.
      operationId: get_policy_effectiveness
      parameters:
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-rule daily policy effectiveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyEffectivenessResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/tool-usage:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/tool-usage` — per-tool call counts and error rate.'
      description: |-
        Aggregates `ToolCallIntercepted` / `ToolDispatched` audit events in the
        window by tool identifier (see [`extract_tool_name`]). `calls` is the event
        count; `errorRate` is the fraction whose policy `decision` was not an allow
        (see [`decision_is_error`]) — the v1 definition of a failed tool call.
        Events whose payload carries no resolvable tool name are skipped, so a
        window with no tool activity returns an empty list rather than a synthetic
        tool. Confined to the caller's tenant.
      operationId: get_tool_usage
      parameters:
      - name: range
        in: query
        description: Time range preset or custom range. See [`KpiParams::range`].
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agents
        in: query
        description: Comma-separated agent filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: teams
        in: query
        description: Comma-separated team filter (reserved).
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-tool call statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolUsageResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/trust:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/trust` — per-agent behavioural trust score (ADR 0019).'
      description: |-
        Serves Option A's clean-rate score over the fixed 7-day window, under the
        caller's tenant-configured weight-set (ADR 0019 Option D). Reuses the exact
        audit read + tenant confinement the sibling per-agent rollups use
        ([`fetch_window_entries_with_total`] → [`scope_entries`]): a trust score
        leaking another tenant's behaviour would be an IDOR, so the read is confined
        to the caller's org and the weight-set is read for that same org.

        Per agent it counts the five Option A signals from the audit log
        (`ToolCallIntercepted`, `PolicyViolation`, `CredentialLeakBlocked`,
        `ApprovalRequested`, and `ApprovalDenied` + `ApprovalTimedOut`) and applies
        [`crate::trust::compute_trust`]. The two binding guardrails hold:

        * **Guardrail 1** — the response echoes the effective `weights`, so a `78`
          here is never presented as commensurable with another tenant's `78`.
        * **Guardrail 2** — cold start (`D < MIN_ACTIONS`) yields `null` regardless
          of the weights, and a window truncated at the analytics cap yields no
          score at all (`truncated: true`, empty `agents`) — never a partial score.

        Read-only observability over data the API already holds — no enforcement or
        audit-write path is touched.
      operationId: get_trust
      responses:
        '200':
          description: Per-agent trust scores and the weight-set that produced them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/analytics/trust/config:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/analytics/trust/config` — read the caller tenant''s trust weights.'
      description: |-
        Returns the effective weight-set for the caller's org (its stored override,
        or the Option A defaults). Confined to the caller's own tenant: the org is
        resolved from the authenticated caller ([`AuthenticatedCaller::tenant`]),
        never from client input, so a caller can only read its own tenant's config.
      operationId: get_trust_config
      responses:
        '200':
          description: The caller tenant's effective trust weight-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustWeightSet'
        '401':
          description: Missing or invalid credentials
    put:
      tags:
      - analytics
      summary: '`PUT /api/v1/analytics/trust/config` — set the caller tenant''s trust weights.'
      description: |-
        Changing a tenant's trust weights is a tenant-scoped mutation, so it requires
        `Scope::Write` ([`RequireWrite`]) — matching how the other tenant-scoped
        write surfaces (alert rules, destinations) are gated. The target tenant is
        the caller's own org, resolved from [`AuthenticatedCaller::tenant`] and never
        from client input, so a caller cannot rewrite another tenant's weights (an
        IDOR). A caller with no org tenant has no per-tenant config to write and is
        rejected with 400.

        Only the per-signal enabled/weight are configurable (ADR 0019 Option D, v1);
        the bucket thresholds and window are fixed and not part of this body.
      operationId: put_trust_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustWeightSet'
        required: true
      responses:
        '200':
          description: The updated weight-set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustWeightSet'
        '400':
          description: Caller has no tenant org to configure
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks the write scope
  /api/v1/approvals:
    get:
      tags:
      - approvals
      summary: '`GET /api/v1/approvals` — list approval requests with optional filters.'
      description: |-
        Without `status` returns pending requests only (backwards-compatible).
        With `status=PENDING|APPROVED|REJECTED` (case-insensitive) returns the
        matching slice. The `agent` filter narrows by `agent_id` exact match
        across both states.
      operationId: list_approvals
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed). Same semantics as [`PaginationParams::page`].
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: per_page
        in: query
        description: Items per page. Same semantics as [`PaginationParams::per_page`].
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: status
        in: query
        description: |-
          Filter by approval status: `pending` | `approved` | `rejected`
          (case-insensitive). When absent, returns pending requests only —
          matches the pre-AAASM-1477 contract.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agent
        in: query
        description: Filter by `agent_id` exact match.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Paginated list of approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalResponse'
  /api/v1/approvals/{id}:
    get:
      tags:
      - approvals
      summary: '`GET /api/v1/approvals/:id` — look up a single approval by ID.'
      description: |-
        Returns the request whether it is currently pending or has been
        resolved (approved / rejected / timed-out). Resolved entries come
        from a bounded in-memory history (default cap 1000) — older entries
        may have been evicted under load.
      operationId: get_approval
      parameters:
      - name: id
        in: path
        description: Approval request identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approval found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: Approval request not found or evicted from history
  /api/v1/approvals/{id}/approve:
    post:
      tags:
      - approvals
      summary: '`POST /api/v1/approvals/:id/approve` — approve a pending action.'
      description: Approve a pending governance action, unblocking the agent.
      operationId: approve_action
      parameters:
      - name: id
        in: path
        description: Approval request identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
        required: true
      responses:
        '200':
          description: Action approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: Approval request not found
  /api/v1/approvals/{id}/forward:
    post:
      tags:
      - approvals
      summary: |-
        `POST /api/v1/approvals/:id/forward` — reassign a pending approval to a
        different approver (AAASM-5095).
      description: |-
        Forwarding does **not** decide the request: it stays pending so the new
        target must still approve or reject it. This is a governance action and
        carries the *same* write-scope + tenant-ownership guard as approve/reject
        (an operator may only forward approvals in a team it can access, or any
        approval when it holds admin scope). Returns the still-pending approval on
        success, 404 when the id is unknown or already resolved (no pending request
        to forward), and 400 for a missing target or invalid UUID.
      operationId: forward_action
      parameters:
      - name: id
        in: path
        description: Approval request identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardRequest'
        required: true
      responses:
        '200':
          description: Approval reassigned; still pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          description: Missing forward target or invalid UUID
        '404':
          description: Approval request not found or already resolved
  /api/v1/approvals/{id}/reject:
    post:
      tags:
      - approvals
      summary: '`POST /api/v1/approvals/:id/reject` — reject a pending action.'
      description: Reject a pending governance action, denying the agent request.
      operationId: reject_action
      parameters:
      - name: id
        in: path
        description: Approval request identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
        required: true
      responses:
        '200':
          description: Action rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '404':
          description: Approval request not found
  /api/v1/audit/sandbox-summary:
    get:
      tags:
      - audit
      summary: '`GET /api/v1/audit/sandbox-summary` — observe-mode shadow-event aggregate.'
      description: |-
        Returns the dashboard SandboxSummaryCard breakdown — would-be denies,
        would-be redactions, and would-be pending approvals — across every audit
        entry the gateway recorded with `dry_run: true` in the requested window.
        Surfaces the single most-frequent `policy_rule` value as `top_rule`. The
        optional `root` parameter scopes the aggregate to one delegation subtree.
      operationId: get_sandbox_summary
      parameters:
      - name: root
        in: query
        description: Hex-encoded root agent ID; scopes counts to that delegation subtree.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: window
        in: query
        description: 'Time window as a duration string: `24h` (default), `1h`, `7d`, `30m`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Sandbox / observe-mode aggregate counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxSummaryResponse'
        '400':
          description: Invalid query parameter
        '401':
          description: Missing or invalid credentials
  /api/v1/audit/violations-by-lineage:
    get:
      tags:
      - audit
      summary: '`GET /api/v1/audit/violations-by-lineage` — policy violation heatmap by lineage.'
      description: |-
        Returns all agents that recorded at least one `PolicyViolation` event within
        the requested time window, together with their violation count and the top 3
        most-violated policy rules.  The optional `root` parameter scopes the result
        to a single delegation subtree.
      operationId: get_violations_by_lineage
      parameters:
      - name: root
        in: query
        description: Hex-encoded root agent ID; scopes results to that delegation subtree.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: window
        in: query
        description: 'Time window as a duration string: `24h` (default), `1h`, `7d`, `30m`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Violation heatmap nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationsByLineageResponse'
        '400':
          description: Invalid query parameter
        '401':
          description: Missing or invalid credentials
  /api/v1/auth/invite:
    post:
      tags:
      - auth
      summary: Create a single-use, expiring invite for a new account (admin scope only).
      description: |-
        ADR 0031 §3. The raw invite token is returned exactly once in this response;
        only its hash is persisted, so it cannot be recovered later. The invite is
        bound to the target email and role and expires after a fixed window.
      operationId: invite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      responses:
        '200':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '403':
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearer_auth: []
  /api/v1/auth/invite/accept:
    post:
      tags:
      - auth
      summary: 'Accept an invite: set the initial password and activate the account.'
      description: |-
        ADR 0031 §3. Consumes the single-use invite token (rejected if already used
        or expired), hashes the chosen password with argon2id, and activates the
        account. Public: the invitee is not yet authenticated.
      operationId: invite_accept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAcceptRequest'
        required: true
      responses:
        '200':
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '422':
          description: Token expired/used or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: |-
        Authenticate with email + password, returning an access token and setting the
        refresh cookie (ADR 0031 §3).
      description: |-
        Enumeration-safe: an unknown email and a wrong password both return a uniform
        `401`, and an unknown email still runs an argon2 verify against a dummy hash
        so the timing does not distinguish the two. A locked account returns `423`
        with `retry-after` regardless of whether the password is correct.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke the refresh session and clear the cookie.
      description: |-
        ADR 0031 §5. Revokes the caller's refresh token server-side and clears the
        HttpOnly cookie. Requires an authenticated caller; always returns `204`,
        including when no active session is found (idempotent).
      operationId: logout
      responses:
        '204':
          description: Logged out (refresh revoked)
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearer_auth: []
  /api/v1/auth/methods:
    get:
      tags:
      - auth
      summary: Advertise the credential methods this deployment supports (ADR 0031 §Q5).
      description: |-
        Public: the login page reads this before rendering, so it never offers a
        password form on an in-memory (API-key-only) backend. Always lists `api_key`;
        adds `password` only when a Postgres-backed account store is configured.
      operationId: auth_methods
      responses:
        '200':
          description: Available auth methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
  /api/v1/auth/password/reset:
    post:
      tags:
      - auth
      summary: Request a password-reset email (ADR 0031 §Q4).
      description: |-
        Enumeration-safe: always returns `202 Accepted` whether or not the email maps
        to an account, so a caller can never probe which addresses are registered.
        When the email does resolve to an active account, a single-use, expiring reset
        token is minted (stored only as its hash) and the raw token is dispatched via
        the configured mailer; the token is never logged and never returned on the
        wire. A mail outage or an SMTP-less deployment does not change the response.
      operationId: password_reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Reset request accepted (always, enumeration-safe)
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/password/reset/confirm:
    post:
      tags:
      - auth
      summary: |-
        Confirm a password reset: consume the token and set the new password (ADR
        0031 §Q4).
      description: |-
        Validates the new password against the minimum-length floor (`422` if weak),
        then atomically consumes the single-use reset token — a missing, expired, or
        already-used token is rejected with `422`. On success the password is
        re-hashed with argon2id and installed, and every outstanding refresh session
        for the account is revoked so any pre-existing session is forced to re-auth.
        The token is never logged.
      operationId: password_reset_confirm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Password reset; outstanding sessions revoked
        '422':
          description: Token expired/used/unknown or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a valid refresh cookie for a new access token.
      description: |-
        ADR 0031 §5. Rotates the refresh token on use — the presented token is
        revoked and a fresh one is set — so a replayed cookie loses the rotation
        race and is rejected. Public: the HttpOnly refresh cookie is the credential.
      operationId: refresh
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Missing / revoked / expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: |-
        Register the first account (bootstrap owner) or a self-registered account when
        open registration is enabled (ADR 0031 §4 / §Q3).
      description: |-
        The first account on a fresh instance becomes `owner` under an advisory lock
        so two concurrent registrations cannot both claim owner. Once a user exists,
        registration is closed (`403`) unless `AA_AUTH_OPEN_REGISTRATION` is set, in
        which case a subsequent registration creates a `developer` account.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '403':
          description: Registration closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Native auth not available (no Postgres)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/token:
    post:
      tags:
      - auth
      summary: Issue a short-lived JWT token from an authenticated API key.
      description: |-
        The caller must already be authenticated (via API key or existing JWT).
        If `scopes` is provided in the request body, it must be a subset of
        the caller's granted scopes.
      operationId: issue_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: JWT issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Requested scope exceeds caller grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearer_auth: []
  /api/v1/auth/ws-ticket:
    post:
      tags:
      - auth
      summary: Mint a short-lived, single-use WebSocket ticket for the authenticated caller.
      description: |-
        A browser cannot set an `Authorization` header on a WebSocket handshake, so
        the dashboard mints a ticket here (over an authenticated REST call) and
        presents it once as `?ticket=` on the upgrade, instead of putting a
        long-lived credential in the URL where infrastructure logs would capture it
        (AAASM-4861; see ADR 0012). The ticket is bound to this caller's identity,
        scopes, and tenant, is valid only for the requested stream, is atomically
        consumed on first use (replay-safe), is not accepted by any REST route, and
        is not refreshable — a reconnect mints a fresh one.
      operationId: issue_ws_ticket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsTicketRequest'
        required: true
      responses:
        '200':
          description: Ticket issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearer_auth: []
  /api/v1/capability/matrix:
    get:
      tags:
      - capability
      summary: |-
        `GET /api/v1/capability/matrix` — return the agent × resource × verb ×
        decision matrix that backs the dashboard Capability Matrix page.
      description: |-
        Optional filters:
        - `team_id` — return only the agent row whose `id` matches.
        - `tool` — return only the resource column whose `id` matches and filter
          each agent's `caps` map to that single key.
        - `effective_only=true` — exclude cells where all four verb decisions are `na`.
      operationId: get_matrix
      parameters:
      - name: team_id
        in: query
        description: Return only the agent row whose `id` matches this value.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: research-bot-04
      - name: tool
        in: query
        description: |-
          Return only the resource column whose `id` matches this value, and
          filter each agent's caps map to that single resource key.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: gmail
      - name: effective_only
        in: query
        description: When `true`, exclude capability cells where all four verb decisions are `na`.
        required: false
        schema:
          type:
          - boolean
          - 'null'
        example: true
      responses:
        '200':
          description: Capability matrix snapshot (filtered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityMatrix'
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks the admin role required to read the capability matrix
  /api/v1/capability/override:
    get:
      tags:
      - capability
      summary: |-
        `GET /api/v1/capability/override` — list all active capability overrides
        recorded since the server started, optionally filtered to a single agent.
      description: |-
        The response is an array of [`OverrideRecord`] objects. Each record
        corresponds to one successful `POST /capability/override` call and carries
        the agents, resource, verb, decision, and ISO 8601 timestamp of when the
        override was applied.
      operationId: list_overrides
      parameters:
      - name: agent_id
        in: query
        description: Filter results to overrides that affect this agent id
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Active override records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideRecord'
        '401':
          description: Missing or invalid credentials
        '403':
          description: Caller lacks the admin role required to read the global override log
    post:
      tags:
      - capability
      summary: |-
        `POST /api/v1/capability/override` — apply a capability override across
        one or more agents. Mutating capability state is treated as a
        `Global`-scope policy update, so the caller must hold the `OrgAdmin`
        role (Admin API scope).
      description: |-
        Returns the subset of agent rows that actually changed — the dashboard
        uses this to drive an optimistic-UI rollback when an override fails.
        An unknown `agentId` rejects the request with 400 and leaves the store
        untouched; an unknown `resourceId` on an agent is silently skipped. A
        `narrow` or `approval` decision is also rejected with 400 — the projection
        emits only allow / deny / na, so no revoke could restore such a cell.

        When `ttlSeconds` is present the override is automatically reverted after
        that many seconds and the response status is **201 Created**. Without a
        TTL the response is **200 OK** (unchanged behaviour).
      operationId: apply_override
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityOverrideRequest'
        required: true
      responses:
        '200':
          description: Updated agent rows (no TTL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityOverrideResponse'
        '201':
          description: Updated agent rows with TTL scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityOverrideResponse'
        '400':
          description: Unknown agent id, or a decision the projection cannot express (narrow / approval)
        '403':
          description: Caller lacks the role required to mutate capability state
  /api/v1/capability/override/{id}:
    delete:
      tags:
      - capability
      summary: |-
        `DELETE /api/v1/capability/override/{id}` — revert a previously applied
        capability override, restoring each affected cell to its pre-override value.
      description: |-
        Returns 204 No Content on success.  Returns 404 when no active override
        with the supplied `id` exists (either it was never created or has already
        been revoked).
      operationId: revoke_override
      parameters:
      - name: id
        in: path
        description: UUID of the override to revoke
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Override revoked; cells restored to base policy
        '403':
          description: Caller lacks the role required to mutate capability state
        '404':
          description: No active override with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/costs:
    get:
      tags:
      - costs
      summary: '`GET /api/v1/costs` — cost and budget summary.'
      description: |-
        Retrieve the current daily and monthly cost and budget summary,
        including per-agent breakdown and configured budget limits.

        Per-tenant filtering (AAASM-3139): an admin caller sees every tenant's
        per-agent and per-team breakdown; a tenant-scoped caller sees only its own
        team's row; a caller with neither admin scope nor a team scope receives the
        aggregate totals only, with the breakdowns elided rather than leaking every
        tenant's spend (the cross-tenant IDOR that AAASM-3126 admin-gated).
      operationId: get_cost_summary
      responses:
        '200':
          description: Cost and budget summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostSummary'
        '401':
          description: Missing or invalid credentials
  /api/v1/costs/budget-tree:
    get:
      tags:
      - costs
      summary: '`GET /api/v1/costs/budget-tree` — org → team → agent budget inheritance tree.'
      description: |-
        Joins the agent registry's team/lineage structure with the budget tracker's
        per-tier spend so each node shows its configured limit, own spend, and the
        subtree spend a parent's budget constrains. Tenant scope is the visible-agent
        boundary ([`visible_agents`]): an admin sees the whole org; a tenant-scoped
        caller sees only its team's subtree; an unscoped non-admin caller gets a
        `null` root. Within the visible set, an agent is a team-level root when its
        spawn parent is not itself visible, and its spawned sub-agents nest beneath
        it (they inherit its budget line) — so every visible agent appears exactly
        once. Read-only: no enforcement or budget-debit path is touched.
      operationId: get_budget_tree
      responses:
        '200':
          description: Org → team → agent budget-inheritance tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetTreeResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/costs/history:
    get:
      tags:
      - costs
      summary: '`GET /api/v1/costs/history` — trailing daily spend series.'
      description: |-
        Aggregates the budget tracker's per-agent daily spend history into a single
        dense (zero-filled), oldest-first series over the last `days` days. The set
        of agents summed is exactly the caller's visible set ([`visible_agents`]):
        an admin gets the org-wide total, a tenant-scoped caller gets only its own
        team's total, and an unscoped non-admin caller gets an all-zero series —
        so the same endpoint serves every scope without leaking cross-tenant spend.
        Read-only observability over data the tracker already holds; no enforcement
        or budget-debit path is touched. The history is in-memory (see
        `BudgetTracker::spend_history_totals_for`) and resets on gateway restart.
      operationId: get_cost_history
      parameters:
      - name: days
        in: query
        description: |-
          Trailing calendar days to return. Defaults to 7; clamped to 1..=90 so a
          single request can never ask for an unbounded series.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      responses:
        '200':
          description: Trailing daily spend history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostHistoryResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/dispatch_tool:
    post:
      tags:
      - dispatch
      summary: Dispatch a tool by name.
      description: |-
        Demultiplexes on the registered [`ToolKind`]: WASM tools route through
        the sandbox; native / unknown tools fall through to the existing
        secret-injection resolver.
      operationId: dispatch_tool
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchToolRequest'
        required: true
      responses:
        '200':
          description: Tool dispatch resolved (native) or sandboxed (WASM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchToolResponse'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks the write scope required to dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Unknown placeholder referenced in args
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Sandbox dispatch task panicked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Audit pipeline is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/fleet/active-sessions:
    get:
      tags:
      - agents
      summary: |-
        `GET /api/v1/fleet/active-sessions` — list currently-open agent sessions
        across the whole fleet.
      description: |-
        Read-only observability surface for the dashboard Fleet → Active Sessions tab
        (AAASM-5038). Flattens the `active_sessions` the registry already tracks on
        each [`aa_gateway::registry::AgentRecord`] into one fleet-wide list, tagging
        every session with its owning agent's id, name, and team. Purely derived from
        existing registry state — it opens, mutates, and closes nothing, so it changes
        neither session lifecycle nor enforcement.

        Tenant-scoped exactly like [`list_agents`] (AAASM-3865): an admin sees every
        agent's sessions; a team-scoped caller sees only its own team's; an agent with
        no team is admin-only. Results are ordered newest-first by `started_at`.
      operationId: list_active_sessions
      responses:
        '200':
          description: Active agent sessions across the fleet
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FleetActiveSessionResponse'
  /api/v1/health:
    get:
      tags:
      - health
      summary: '`GET /api/v1/health` — liveness and readiness probe.'
      description: |-
        Returns `200` when all subsystems report healthy; `503` when any subsystem
        is degraded. The `checks` map in the response body carries per-subsystem
        status strings (`"ok"` or `"degraded"`).
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: One or more subsystems are degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/iam/api-keys:
    get:
      tags:
      - iam
      summary: '`GET /api/v1/iam/api-keys` — list every API key the IAM store knows.'
      description: |-
        Returned in newest-first order. Active and revoked keys are both
        included; the dashboard filters by status in its tabs.
      operationId: list_api_keys
      responses:
        '200':
          description: All API keys, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
        '403':
          description: Caller lacks the admin role required to read IAM state
    post:
      tags:
      - iam
      summary: '`POST /api/v1/iam/api-keys` — issue a new API key.'
      description: |-
        IAM mutations are gated as a `Global`-scope policy update — the caller
        must hold the `OrgAdmin` role.

        The response `secret` field is shown to the caller **once**; the server
        does not persist it.
      operationId: generate_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateApiKeyRequest'
        required: true
      responses:
        '200':
          description: Generated key (with one-shot secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApiKeyResponse'
        '400':
          description: ttl_seconds is zero or out of range
        '403':
          description: Caller lacks the role required to mutate IAM state
  /api/v1/iam/api-keys/{id}/revoke:
    post:
      tags:
      - iam
      summary: '`POST /api/v1/iam/api-keys/{id}/revoke` — revoke an existing key.'
      description: 404 if the key is unknown, 409 if it is already revoked.
      operationId: revoke_api_key
      parameters:
      - name: id
        in: path
        description: API key id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Key revoked
        '403':
          description: Caller lacks the role required to mutate IAM state
        '404':
          description: Unknown api key id
        '409':
          description: Key is already revoked
  /api/v1/iam/api-keys/{id}/rotate:
    post:
      tags:
      - iam
      summary: |-
        `POST /api/v1/iam/api-keys/{id}/rotate` — atomically revoke `id` and
        issue a replacement carrying the same label, scopes, and owner.
      description: |-
        Returns the new key's one-shot reveal. 404 if `id` is unknown, 409 if
        the source key is already revoked.
      operationId: rotate_api_key
      parameters:
      - name: id
        in: path
        description: API key id to rotate
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Replacement key with one-shot secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApiKeyResponse'
        '403':
          description: Caller lacks the role required to mutate IAM state
        '404':
          description: Unknown api key id
        '409':
          description: Source key is already revoked
  /api/v1/iam/roles:
    get:
      tags:
      - iam
      summary: '`GET /api/v1/iam/roles` — the built-in RBAC roles and their capability grants.'
      description: |-
        Read-only reflection of the gateway's policy-RBAC model
        (`PolicyMutationRequiredRole`). Grants are derived server-side, not stored,
        so the response is stable and requires no IAM state. Gated `RequireRead`
        (deny-by-default): the authz model is not per-tenant secret — it is the same
        data published in `docs/src/policy-rbac.md` — but still requires a valid
        read-scoped caller.
      operationId: list_roles
      responses:
        '200':
          description: Built-in roles with derived capability grants, highest privilege first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleCapabilitiesResponse'
        '401':
          description: Caller is unauthenticated
        '403':
          description: Caller lacks the read scope required to view IAM roles
  /api/v1/logs:
    get:
      tags:
      - logs
      summary: '`GET /api/v1/logs` — paginated audit log query.'
      description: |-
        Query the paginated audit log of governance events.
        Supports optional filtering by agent ID and event type.

        Per-tenant scoping (AAASM-3483): the audit log is per-tenant data. An admin
        caller may read any org's audit (honouring an explicit `?org_id`); a
        tenant-scoped caller has the `org_id` filter forced to its own org, so it
        can neither read another org's audit nor omit the filter to enumerate every
        org. A non-admin caller with no org scope receives an empty page rather than
        a cross-tenant dump.
      operationId: list_logs
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed). Defaults to 1.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
      - name: per_page
        in: query
        description: Items per page (max 100). Defaults to 50.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 100
          minimum: 1
      - name: agent_id
        in: query
        description: Filter by hex-encoded agent ID.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: event_type
        in: query
        description: Filter by event type name (e.g. `PolicyViolation`).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: org_id
        in: query
        description: |-
          AAASM-2008 — filter by organisation identifier. When supplied, only
          audit entries whose `lineage.org_id` matches are returned. Entries
          emitted before the agent was registered with an `org_id` (where the
          field is `None` on the entry) never match an explicit `org_id`
          filter — multi-tenancy isolation requires explicit Org tagging on
          the entry at write time.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/ops:
    get:
      tags:
      - ops
      summary: '`GET /api/v1/ops` — list all registered in-flight operations.'
      description: |-
        Returns a snapshot of every op currently tracked in the registry,
        regardless of lifecycle state (running, paused, or terminated).
      operationId: list_ops
      responses:
        '200':
          description: List of all registered ops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpRecord'
    post:
      tags:
      - ops
      summary: '`POST /api/v1/ops` — register a new in-flight operation in the `running` state.'
      description: |-
        Returns `201 Created` with the initial [`OpRecord`]. Callers may then drive
        lifecycle transitions via the `pause`, `resume`, and `terminate` endpoints.
      operationId: register_op
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOpRequest'
        required: true
      responses:
        '201':
          description: Op registered in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpRecord'
        '400':
          description: Empty or missing op_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/ops/global/halt:
    post:
      tags:
      - ops
      summary: |-
        `POST /api/v1/ops/global/halt` — emit a **fleet-wide** op-control halt
        delivered to every connected runtime.
      description: |-
        The halt is published under the reserved global op-id `"*"` (AAASM-3873),
        a kill switch that no agent can evade. Because it affects every agent in the
        fleet it is gated to admin callers (AAASM-3881).

        * `200 OK` — global halt emitted; body is an [`OpHaltAck`].
        * `400 Bad Request` — unknown action.
        * `403 Forbidden` — caller lacks admin scope.
        * `503 Service Unavailable` — no op-control channel is configured.
      operationId: halt_global
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpHaltRequest'
        required: true
      responses:
        '200':
          description: Global halt emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpHaltAck'
        '400':
          description: Unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller lacks admin scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Op-control channel not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/ops/{id}/halt-agent:
    post:
      tags:
      - ops
      summary: |-
        `POST /api/v1/ops/{id}/halt-agent` — emit an **agent-wide** op-control halt
        for the agent that owns operation `{id}`.
      description: |-
        The halt is published under the reserved `agent:{agent_id}` op-id, which the
        runtime consults on **every** request regardless of the agent-supplied
        `trace_id` (AAASM-3873). It therefore halts the whole agent — not just this
        op — and cannot be evaded by omitting or forging a trace id (AAASM-3881).
        The owning agent identity is resolved server-side from the op registry, so
        the operator addresses a live op they can already see in the ops view.

        * `200 OK` — halt emitted; body is an [`OpHaltAck`].
        * `400 Bad Request` — empty op id or unknown action.
        * `403 Forbidden` — caller lacks write scope or the op's team.
        * `404 Not Found` — no op with this id is registered.
        * `409 Conflict` — the op has no resolvable owning agent to halt.
        * `503 Service Unavailable` — no op-control channel is configured.
      operationId: halt_agent_for_op
      parameters:
      - name: id
        in: path
        description: Operation id identifying the agent to halt.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpHaltRequest'
        required: true
      responses:
        '200':
          description: Agent-wide halt emitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpHaltAck'
        '400':
          description: Empty op id or unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Caller not authorized for this op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Op not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Op has no resolvable owning agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Op-control channel not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/ops/{id}/pause:
    post:
      tags:
      - ops
      summary: '`POST /api/v1/ops/{id}/pause` — transition a running operation to paused.'
      description: |-
        * `200 OK` — op transitioned `running → paused`.
        * `400 Bad Request` — whitespace-only op id.
        * `404 Not Found` — no op with this id is registered.
        * `409 Conflict` — op is already paused or terminated.
      operationId: pause_op
      parameters:
      - name: id
        in: path
        description: Operation id (string form of `GovernanceEvent.id`).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Op paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpActionAck'
        '400':
          description: Empty or malformed operation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Op not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/ops/{id}/resume:
    post:
      tags:
      - ops
      summary: '`POST /api/v1/ops/{id}/resume` — transition a paused operation back to running.'
      description: |-
        * `200 OK` — op transitioned `paused → running`.
        * `400 Bad Request` — whitespace-only op id.
        * `404 Not Found` — no op with this id is registered.
        * `409 Conflict` — op is running or terminated.
      operationId: resume_op
      parameters:
      - name: id
        in: path
        description: Operation id (string form of `GovernanceEvent.id`).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Op resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpActionAck'
        '400':
          description: Empty or malformed operation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Op not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/ops/{id}/terminate:
    post:
      tags:
      - ops
      summary: '`POST /api/v1/ops/{id}/terminate` — terminate a running or paused operation.'
      description: |-
        Idempotent: a second call on an already-terminated op also returns `200 OK`.

        * `200 OK` — op transitioned to `terminated` (or was already terminated).
        * `400 Bad Request` — whitespace-only op id.
        * `404 Not Found` — no op with this id is registered.
      operationId: terminate_op
      parameters:
      - name: id
        in: path
        description: Operation id (string form of `GovernanceEvent.id`).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Op terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpActionAck'
        '400':
          description: Empty or malformed operation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Op not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/overview/enforcement-timeline:
    get:
      tags:
      - analytics
      summary: '`GET /api/v1/overview/enforcement-timeline` — decision counts over time by verdict.'
      description: |-
        Buckets the requested window into [`SERIES_BUCKETS`] equal slices and counts
        audit-recorded enforcement decisions per slice into four verdict lanes —
        `allow` / `narrow` / `deny` / `scrub` — derived from the [`AuditEventType`]
        the gateway writes for each proto `Decision` (see [`timeline_verdict`]). This
        is read-only observability over the existing audit log: no enforcement
        semantics are touched and no new data source is introduced. Every bucket is
        emitted (including zeros) so the dashboard timeline renders a continuous
        axis. Confined to the caller's tenant.
      operationId: get_enforcement_timeline
      parameters:
      - name: window
        in: query
        description: |-
          Recent window to summarise: `1h` | `24h` | `7d` | `30d`. Defaults to
          `24h`; any unrecognised value also falls back to `24h`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Windowed enforcement decision counts by verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementTimelineResponse'
        '401':
          description: Missing or invalid credentials
  /api/v1/policies:
    get:
      tags:
      - policies
      summary: '`GET /api/v1/policies` — list all policy versions.'
      description: |-
        List governance policy versions with optional archive inclusion.
        By default only the active (most recent) version is returned.
      operationId: list_policies
      parameters:
      - name: page
        in: query
        description: Page number (1-indexed). Defaults to 1.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
      - name: per_page
        in: query
        description: Items per page (max 100). Defaults to 50.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          maximum: 100
          minimum: 1
      - name: include_archived
        in: query
        description: |-
          When `true`, include older (inactive) policy versions in the response.
          Defaults to `false` — only the currently active policy version is returned.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated list of policy versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyResponse'
        '403':
          description: Caller lacks admin scope
    post:
      tags:
      - policies
      summary: '`POST /api/v1/policies` — apply a new governance policy.'
      description: |-
        Submit and activate a new governance policy from YAML.
        The caller must hold the role required for the target `scope`
        (default: `global`, requires `OrgAdmin`).
      operationId: create_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
        required: true
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Invalid policy YAML or scope
        '403':
          description: Insufficient role for this policy scope
  /api/v1/policies/active:
    get:
      tags:
      - policies
      summary: '`GET /api/v1/policies/active` — get the currently active policy.'
      description: Retrieve the currently active governance policy.
      operationId: get_active_policy
      responses:
        '200':
          description: Currently active policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '403':
          description: Caller lacks admin scope
        '404':
          description: No active policy loaded
  /api/v1/policies/replay:
    post:
      tags:
      - policies
      summary: |-
        `POST /api/v1/policies/replay` — replay recent traffic against a proposed
        policy and report aggregate impact (AAASM-5094).
      description: |-
        Distinct from `POST /api/v1/policies/simulate`, which dry-runs a *single*
        hypothetical `(agent, tool, target)` probe against the *live* policy. This
        endpoint replays a **corpus** of recorded real traffic (the audit window)
        against a **proposed** policy that is never loaded, and returns aggregate
        impact stats — newly-blocked, newly-narrowed, regressions, false-positives —
        plus a bounded sample of per-request before/after verdict diffs.

        Read-only and non-mutating: the proposed policy is validated but never
        applied ([`PolicyEngine::simulate_against`] runs on a throwaway engine), no
        audit entry is written, and no live state changes.

        ## What is and is not replayed

        The corpus is the recorded audit log. The audit payload persists only
        non-secret action metadata — tool name, paths, hosts — and never the raw tool
        arguments (`aa_runtime::audit_publisher::conversion::build_payload`). Replay
        therefore reconstructs each recorded **tool call** from its persisted tool
        name with empty arguments and diffs the proposed policy's verdict against the
        recorded one. Argument/target-sensitive rules and the credential/PII scrubber
        cannot be faithfully re-exercised from the corpus and are not counted; an
        empty corpus returns all-zero counts, never a fabricated figure.
      operationId: replay_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayPolicyRequest'
        required: true
      responses:
        '200':
          description: Aggregate impact of the proposed policy over the replayed corpus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPolicyResponse'
        '400':
          description: Proposed policy YAML failed validation
        '403':
          description: Caller lacks read scope
  /api/v1/policies/simulate:
    post:
      tags:
      - policies
      summary: '`POST /api/v1/policies/simulate` — dry-run a hypothetical request.'
      description: |-
        Evaluate a hypothetical `(agent, tool, target)` request against the active
        governance policy and return the verdict (allow / narrow / approval / deny),
        the matched rule/reason, and whether the payload would be scrubbed.

        This is a pure, read-only what-if: it runs the policy engine in dry-run mode
        ([`aa_gateway::engine::PolicyEngine::simulate`]) with no state mutation, no
        budget debit, no audit write, and no enforcement side effect.
      operationId: simulate_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatePolicyRequest'
        required: true
      responses:
        '200':
          description: Dry-run verdict for the hypothetical request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatePolicyResponse'
        '403':
          description: Caller lacks read scope
  /api/v1/policies/team/{team_id}:
    get:
      tags:
      - policies
      summary: '`GET /api/v1/policies/team/{team_id}` — policies in force for one team.'
      description: |-
        Read-only inverse of [`PolicyResponse::affects`]: the union of the policy
        cascades of the team's agents, deduplicated by document. Backs the Teams
        surface's Active-policies card (AAASM-5080 / AAASM-5096).

        It is a separate path rather than a field on `GET /api/v1/policies` because
        that endpoint is Admin-only — it discloses every tenant's raw policy YAML —
        while a team's own operator must be able to read the policies governing its
        team. This endpoint discloses no YAML, only document identities, so plain
        Read plus membership in the requested team is the right gate.

        Deny-by-default and tenant-scoped: a non-admin caller may only ask about its
        own team, and each member is additionally filtered through the shared
        `record_visible_to` org+team check, so no agent outside the caller's tenant
        contributes a document.

        Returns `policies: null` rather than `[]` when the team has agents but no
        resolvable cascade — see [`TeamPoliciesResponse::policies`] for why the two
        must not collapse.
      operationId: list_team_policies
      parameters:
      - name: team_id
        in: path
        description: Team identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policies in force for the team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPoliciesResponse'
        '403':
          description: Caller lacks admin scope or membership in this team
  /api/v1/scrub/pattern-counts:
    get:
      tags:
      - scrub
      summary: '`GET /api/v1/scrub/pattern-counts` — per-kind detection counts over a window.'
      description: |-
        Aggregates the persisted `secret_detected` alerts by their recorded
        `detected_pattern_type` (the [`CredentialKind`] string) over the requested
        window. Only kinds that actually fired appear, so an idle window returns an
        empty list rather than zero-filled fabricated rows. The alert read is
        bounded by [`MAX_SCRUB_ALERTS`] and confined to the caller's tenant.
      operationId: get_pattern_counts
      parameters:
      - name: range
        in: query
        description: |-
          Time range preset (`24h`, `7d`, `30d`, `90d`) or custom
          `YYYY-MM-DD..YYYY-MM-DD`. Defaults to `7d`. Matches the analytics
          routes' range grammar.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Per-pattern-kind detection counts over the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternCountsResponse'
        '401':
          description: Missing or invalid credentials
      security:
      - bearer_auth: []
  /api/v1/scrub/patterns:
    get:
      tags:
      - scrub
      summary: '`GET /api/v1/scrub/patterns` — the effective built-in pattern catalogue.'
      description: |-
        Returns every built-in [`CredentialKind`] detector with its canonical kind
        label, `[REDACTED:<kind>]` replacement string, coarse category, and fixed
        severity. This is the real detector set the gateway scanner enforces — the
        dashboard Scrub page can render it directly instead of the static fixtures
        it used before AAASM-5174.

        Custom policy-defined patterns (`data.sensitive_patterns`) are intentionally
        **not** listed here: they are per-policy, not built-in, and exposing/managing
        them is scoped as an AAASM-5174 follow-up. `builtin` is therefore always
        `true` on the current response.
      operationId: get_patterns
      responses:
        '200':
          description: Effective built-in pattern catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrubCatalogueResponse'
        '401':
          description: Missing or invalid credentials
      security:
      - bearer_auth: []
  /api/v1/scrub/posture:
    get:
      tags:
      - scrub
      summary: '`GET /api/v1/scrub/posture` — leak posture over a window.'
      description: |-
        Reports `leaks_intercepted` (the count of `secret_detected` alerts in the
        window) and `distinct_kinds`. A leak *rate* is not derivable — the store
        does not persist the total-payloads-scanned denominator — so `leak_rate` is
        surfaced as explicitly absent with `rate_computed: false` rather than
        fabricated (AAASM-5174 truthfulness requirement). Confined to the caller's
        tenant and bounded by [`MAX_SCRUB_ALERTS`].
      operationId: get_posture
      parameters:
      - name: range
        in: query
        description: |-
          Time range preset (`24h`, `7d`, `30d`, `90d`) or custom
          `YYYY-MM-DD..YYYY-MM-DD`. Defaults to `7d`. Matches the analytics
          routes' range grammar.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Leak posture over the window (leak rate absent when not derivable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureResponse'
        '401':
          description: Missing or invalid credentials
      security:
      - bearer_auth: []
  /api/v1/tools:
    get:
      tags:
      - tools
      summary: List all auto-discovered AI dev tools on the gateway host.
      description: |-
        Runs all registered [`DevToolAdapter`][aa_core::DevToolAdapter]
        implementations concurrently and returns the subset that are installed.
        If no tools are detected, an empty array is returned (not an error).
      operationId: list_tools
      responses:
        '200':
          description: Discovered tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfoSchema'
  /api/v1/topology:
    get:
      tags:
      - topology
      summary: |-
        `GET /api/v1/topology` — the node+edge graph rendered by the dashboard
        Topology page (AAASM-5040).
      description: |-
        Returns every agent the caller's tenant may see as a graph node — reusing
        the same [`AgentNode`] projection as `/topology/overview`, so the per-node
        enforcement-mode / flagged / trust badges added in AAASM-5036 flow through
        end-to-end — plus every stored edge between those nodes, in all six relation
        kinds with a `cross_team` flag (AAASM-5099).

        Unlike the sibling `/topology/*` routes, this handler additionally enriches
        each node's `owner` / `policy_count` / `budget` (AAASM-5045) and
        `effective_permissions` (AAASM-5099) from registry metadata, the policy-engine
        cascade, and the budget tracker respectively, so the dashboard node-detail
        panel renders real values rather than placeholders.

        Tenant-scoped, `RequireRead`, deny-by-default exactly like the sibling
        `/topology/*` routes: a non-admin caller with no tenant scope receives an
        empty graph rather than a cross-tenant dump (AAASM-3483). An edge is emitted
        only when BOTH of its endpoints are visible nodes, so the graph never leaks
        an out-of-tenant peer and never references a node the client didn't receive
        (mirrors the edges.rs BFS tenant boundary, AAASM-3825).
      operationId: get_topology_graph
      responses:
        '200':
          description: Agent topology graph (nodes + edges)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyGraphResponse'
        '500':
          description: Edge store error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/topology/edges:
    get:
      tags:
      - topology
      summary: List all topology edges, optionally filtered by team.
      description: |-
        Iterates every known edge type and collects up to `limit` edges total
        (default 500, max 1 000). When `team_id` is provided, only edges where
        the source **or** target agent belongs to that team are returned.
      operationId: list_topology_edges
      parameters:
      - name: team_id
        in: query
        description: Return only edges where at least one endpoint belongs to this team.
        required: false
        schema:
          type:
          - string
          - 'null'
        example: team-alpha
      - name: limit
        in: query
        description: Maximum number of edges to return. Defaults to 500, capped at 1000.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        example: 500
      responses:
        '200':
          description: Edge list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyEdgeListResponse'
        '500':
          description: Store error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
      - topology
      summary: Record a new directed topology edge.
      description: |-
        Used by SDK emitters (Python, Node.js, Go) to push observed
        agent-to-agent interactions into the gateway edge store.
      operationId: report_edge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportEdgeRequest'
        required: true
      responses:
        '201':
          description: Edge recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEdgeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Store error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/topology/lineage/{agent_id}:
    get:
      tags:
      - topology
      summary: '`GET /api/v1/topology/lineage/{agent_id}` — ancestor chain from root down to agent.'
      description: |-
        Returns the ordered ancestry for the given agent, starting from the root
        (depth 0) and ending with the requested agent as the last element.
        A root agent returns a list of length 1 containing only itself.
        Returns 404 if the agent is unknown.
      operationId: get_lineage
      parameters:
      - name: agent_id
        in: path
        description: Hex-encoded UUID of the agent
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent lineage chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLineage'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
  /api/v1/topology/overview:
    get:
      tags:
      - topology
      summary: '`GET /api/v1/topology/overview` — summary of all teams and root agents.'
      description: |-
        Returns a count of teams, root agents, and total agents across the registry,
        with a per-team breakdown and a list of standalone root agents not assigned
        to any team. Supports optional filtering by status, minimum depth, and
        governance level visibility.
      operationId: get_overview
      parameters:
      - name: status
        in: query
        description: 'Filter by agent status: `active`, `suspended`, or `deregistered`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: min_depth
        in: query
        description: Only include agents at or above this delegation depth.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: show_budget
        in: query
        description: When `true`, include the governance level in each agent node.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: org_id
        in: query
        description: |-
          AAASM-2008 — scope the query to a single organisation. When set,
          only agents whose `org_id` matches are returned (multi-tenancy
          isolation). Empty / absent agents (no `org_id` on the record)
          never match an explicit filter.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Topology overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyOverview'
  /api/v1/topology/stats:
    get:
      tags:
      - topology
      summary: '`GET /api/v1/topology/stats` — aggregate topology statistics.'
      description: |-
        Returns aggregate counts and histograms across the entire registry.
        Includes depth distribution, team-size distribution, child-count distribution,
        orphan count, and average children per parent. Never returns 404.
      operationId: get_stats
      responses:
        '200':
          description: Topology statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyStats'
  /api/v1/topology/team/{team_id}:
    get:
      tags:
      - topology
      summary: '`GET /api/v1/topology/team/{team_id}` — all agents in a team with depth info.'
      description: |-
        Returns all agents belonging to the given team, sorted by delegation depth.
        Results can be filtered by status and minimum depth. Returns 404 if the
        team identifier is not known to the registry.
      operationId: get_team
      parameters:
      - name: team_id
        in: path
        description: Team identifier
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: 'Filter by agent status: `active`, `suspended`, or `deregistered`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: min_depth
        in: query
        description: Only include agents at or above this delegation depth.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: show_budget
        in: query
        description: When `true`, include the governance level in each agent node.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      - name: org_id
        in: query
        description: |-
          AAASM-2008 — scope the query to a single organisation. When set,
          only agents whose `org_id` matches are returned (multi-tenancy
          isolation). Empty / absent agents (no `org_id` on the record)
          never match an explicit filter.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Team topology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamTopology'
        '404':
          description: Team not found
  /api/v1/topology/tree/{root_id}:
    get:
      tags:
      - topology
      summary: '`GET /api/v1/topology/tree/{root_id}` — full subtree from a given root agent.'
      description: |-
        Recursively walks the delegation tree starting from the given agent, up to
        a configurable depth (default 10, maximum 10). Nodes can be filtered by
        status. Returns a nested JSON tree with each agent's children inline.
        Returns 422 if the agent exists but is not a root (depth > 0).
      operationId: get_tree
      parameters:
      - name: root_id
        in: path
        description: Hex-encoded UUID of the starting agent
        required: true
        schema:
          type: string
      - name: depth
        in: query
        description: Maximum traversal depth from the root (default 10, capped at 10).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      - name: status
        in: query
        description: 'Filter tree nodes by status: `active`, `suspended`, or `deregistered`.'
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: show_budget
        in: query
        description: When `true`, include the governance level in each tree node.
        required: false
        schema:
          type:
          - boolean
          - 'null'
      responses:
        '200':
          description: Agent subtree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTree'
        '400':
          description: Invalid agent ID format
        '404':
          description: Agent not found
        '422':
          description: Agent is not a root agent
  /api/v1/traces/{session_id}:
    get:
      tags:
      - traces
      summary: '`GET /api/v1/traces/:session_id` — full trace for one agent session.'
      description: Retrieve the full ordered trace of spans for one agent session.
      operationId: get_trace
      parameters:
      - name: session_id
        in: path
        description: Agent session identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceResponse'
        '404':
          description: Session not found
  /api/v1/ws/events:
    get:
      tags:
      - events
      summary: '`GET /api/v1/ws/events` — upgrade to WebSocket and stream events.'
      description: |-
        Initiates a WebSocket connection for real-time governance event streaming.

        ## Protocol

        1. Client sends an HTTP GET with `Upgrade: websocket` headers.
        2. Server responds with `101 Switching Protocols` and upgrades the connection.
        3. Server sends `GovernanceEvent` JSON objects as text frames.
        4. Server sends periodic ping frames (every 30s); client must respond with pong.
        5. Either side may close the connection with a close frame.

        ## Replay

        The server maintains a circular buffer of the last 1000 events. Pass the
        `since` query parameter with a previously received event `id` to replay
        all buffered events after that id before switching to live streaming.

        ## Event Types

        Filter events using the `types` query parameter (comma-separated):
        - `violation` — audit / pipeline events (policy violations)
        - `approval` — human-in-the-loop approval requests
        - `budget` — budget threshold alerts

        All types are streamed when the parameter is omitted.
      operationId: ws_events_handler
      parameters:
      - name: types
        in: query
        description: |-
          Comma-separated event type filter (e.g. `violation,budget`).
          All types are included when omitted.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: agent_id
        in: query
        description: Filter events by agent identifier (hex-encoded).
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: since
        in: query
        description: |-
          Replay buffered events whose id is greater than this value.
          The server keeps the last 1000 events in a circular buffer.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      - name: ticket
        in: query
        description: |-
          Short-lived, single-use WebSocket ticket (AAASM-4861). Browsers can't set
          an `Authorization` header on a WS handshake, so the dashboard mints a
          ticket via `POST /api/v1/auth/ws-ticket` and presents it here instead of
          putting a long-lived credential in the URL. Non-browser clients may
          instead send an `Authorization: Bearer` header and omit this.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '101':
          description: WebSocket upgrade successful. Server streams GovernanceEvent JSON text frames.
        '200':
          description: Event message schema (delivered as WebSocket text frames, not as an HTTP response body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceEvent'
        '400':
          description: Bad request (invalid query parameters)
components:
  schemas:
    AccessTokenResponse:
      type: object
      description: |-
        Response body carrying a freshly minted access token (login / refresh /
        invite-accept). The refresh token is NOT in the body — it rides in the
        HttpOnly cookie.
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
          description: 'The short-lived access JWT to present as `Authorization: Bearer`.'
        expires_in:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
          minimum: 0
    ActionVolumeResponse:
      type: object
      description: Response for `GET /api/v1/analytics/action-volume`.
      required:
      - series
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/ActionVolumeSeries'
          description: One series per action category (empty when no audit events matched).
    ActionVolumeSeries:
      type: object
      description: One named series in the action-volume chart (an action category).
      required:
      - key
      - name
      - points
      properties:
        key:
          type: string
          description: Stable series key.
        name:
          type: string
          description: Human-readable series name.
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
          description: Time-bucketed points for the series.
    ActiveSessionResponse:
      type: object
      description: Summary of an active session in the API response.
      required:
      - session_id
      - started_at
      - status
      - actions_count
      properties:
        actions_count:
          type: integer
          format: int32
          description: Number of governed actions observed on this session so far (AAASM-5088).
          minimum: 0
        session_id:
          type: string
          description: Hex-encoded session UUID.
        started_at:
          type: string
          description: ISO 8601 timestamp when the session started.
        status:
          type: string
          description: Current status of the session.
    AgentConfigPolicyRef:
      type: object
      description: |-
        One policy document in the agent's effective cascade.

        AAASM-5098 — the honest identity of a document already loaded in the engine:
        its scope-qualified id, human name, optional version, and scope label. Mirrors
        the `Policy` identity the capability matrix emits (`{scope}/{name}` id) so the
        Config-YAML tab and the Capability page name the same document the same way.
      required:
      - id
      - name
      - scope
      properties:
        id:
          type: string
          description: |-
            Scope-qualified id (`{scope}/{name}`, or the bare scope when the document
            is unnamed) — matches the capability matrix's per-policy id.
        name:
          type: string
          description: Human-readable document name, falling back to the scope label when unnamed.
        scope:
          type: string
          description: Wire-format scope label (e.g. `"global"`, `"team:platform"`).
        version:
          type:
          - string
          - 'null'
          description: Document `policy_version`, if the source declared one.
    AgentConfigRecommendation:
      type: object
      description: |-
        A qualitative posture recommendation for the agent (AAASM-5098, ADR-0022).

        Names the resources that dominate the agent's recent denials so an operator
        can see *what* to narrow, without asserting a quantified improvement. The
        `−N%` counterfactual is deliberately withheld — producing it requires the
        traffic replay AAASM-5094 builds, and fabricating a percentage would ship a
        number the product cannot stand behind (ADR-0022 §Option C). Every count here
        is a historical denial tally over the window, not a prediction.
      required:
      - window
      - total_denials
      - top_resources
      - top_resources_share_pct
      - summary
      properties:
        summary:
          type: string
          description: |-
            Human-readable qualitative finding, e.g. "3 resources account for 78% of
            this agent's denials in the last 7 days". Names resources, never a policy
            (naming a specific policy needs a matcher that does not exist) and never a
            projected improvement percentage.
        top_resources:
          type: array
          items:
            $ref: '#/components/schemas/DeniedResourceShare'
          description: The resources responsible for the most denials, most-denied first.
        top_resources_share_pct:
          type: number
          format: double
          description: |-
            Share of the window's denials the `top_resources` together account for,
            as a 0–100 percentage of `total_denials` (a historical count ratio, not a
            projected improvement).
        total_denials:
          type: integer
          format: int64
          description: Total denials (`PolicyViolation` audit events) counted in the window.
          minimum: 0
        window:
          type: string
          description: Recent window the finding covers (e.g. `"7d"`).
    AgentConfigResponse:
      type: object
      description: |-
        Per-agent config projection returned by `GET /api/v1/agents/{id}/config`.

        AAASM-5098 (ADR-0022, narrow Option C). Backs the Agent-Detail Config-YAML
        tab. **Every field carries a real per-agent server-side source** — the
        contract deliberately omits the mock's `fail_open`, `rate_limit`,
        `observability`, and `issuer` because ADR-0022 verified none of them has a
        per-agent source. They are absent from this schema entirely rather than
        emitted as `null`: a null `observability` would imply the concept exists and
        is unset, a stronger claim than the truth.
      required:
      - agent_id
      - policies
      properties:
        agent_id:
          type: string
          description: Hex-encoded agent UUID.
        enforcement_mode:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EnforcementModeLabel'
            description: |-
              The agent's registered enforcement-mode override, sourced from
              `AgentRecord.enforcement_mode` — the field the enforcement path consults,
              **not** the free-form `metadata["mode"]` the Topology/Fleet views render
              (ADR-0021 / ADR-0022). `None` (omitted) when the agent declares no
              per-agent override, in which case the effective mode is decided per policy
              document, not per agent — omitted rather than defaulted so the response
              never fabricates a posture the agent did not set.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfigPolicyRef'
          description: The policy documents in the agent's effective cascade, broadest → narrowest.
        recommendation:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentConfigRecommendation'
            description: |-
              Qualitative posture recommendation, or `None` (omitted) when the agent has
              too few denials in the window to rank a dominant resource. Qualitative
              only — no quantified improvement estimate (ADR-0022; the `−N%` is blocked
              on AAASM-5094's replay).
    AgentCostEntry:
      type: object
      description: Per-agent cost entry within the budget summary.
      required:
      - agent_id
      - daily_spend_usd
      - date
      properties:
        agent_id:
          type: string
          description: Agent identifier (hex-encoded).
        daily_spend_usd:
          type: string
          description: Daily spend for this agent in USD.
        date:
          type: string
          description: Calendar date (YYYY-MM-DD) the daily spend applies to.
        monthly_spend_usd:
          type:
          - string
          - 'null'
          description: Total spend this month in USD for this agent (if monthly tracking is enabled).
    AgentDecisionMixCounts:
      type: object
      description: |-
        One agent's decision-outcome distribution over the requested window.

        The five fields are the Agent-Detail traffic-mix vocabulary
        (`allowed / narrowed / scrubbed / pending / denied`, see
        `dashboard/src/features/trace/decision.ts`). Four are sourced from the audit
        log's recorded decision event types; `narrow` has no audit source and is
        always `0` (see [`get_agent_decision_mix`]).
      required:
      - agent_id
      - allow
      - narrow
      - scrub
      - pending
      - deny
      properties:
        agent_id:
          type: string
          description: |-
            Hex-encoded agent id — the same 32-char lower-hex form `AgentResponse.id`
            uses, so the dashboard can join this mix directly onto its fleet/agent rows.
        allow:
          type: integer
          format: int64
          description: |-
            Allowed decisions: `ToolCallIntercepted` audit events (the gateway records
            proto `Decision::ALLOW` as this event type).
          minimum: 0
        deny:
          type: integer
          format: int64
          description: |-
            Denied decisions: `PolicyViolation` audit events (the gateway records
            proto `Decision::DENY` as this event type).
          minimum: 0
        narrow:
          type: integer
          format: int64
          description: |-
            Narrowed decisions. **No audit source exists**: the proto `Decision` enum
            has no `NARROW` variant and the gateway never writes a narrow event type
            (narrowing is a capability-plane concept, not a per-invocation audit
            decision), so this is always `0` — a truthful absence rather than a
            fabricated count.
          minimum: 0
        pending:
          type: integer
          format: int64
          description: |-
            Pending decisions: `ApprovalRequested` audit events (the gateway records
            proto `Decision::PENDING` as this event type).
          minimum: 0
        scrub:
          type: integer
          format: int64
          description: |-
            Scrubbed decisions: `CredentialLeakBlocked` audit events (the gateway
            records proto `Decision::REDACT` as this event type).
          minimum: 0
    AgentDecisionResponse:
      type: object
      description: |-
        One row of the agent's recent decision stream (AAASM-5058).

        Backs the agent-detail Traffic tab's per-decision table
        (`design/v1/hi-fi/agent-detail.jsx`), one row per governance decision the
        gateway recorded for this agent. Every field is read straight from the
        existing audit log — no enforcement or audit-write path is touched. Columns
        the audit log has no source for are surfaced as `null` rather than
        fabricated (see [`AgentDecisionResponse::latency_ms`]).
      required:
      - timestamp
      - sessionId
      - seq
      - decision
      - decisionLabel
      properties:
        decision:
          type: integer
          format: int64
          description: |-
            The policy `decision` as the proto [`Decision`](aa_proto::assembly::common::v1::Decision)
            enum's **integer** discriminant, exactly as the gateway writes it (see
            the AAASM-5035 note in `analytics::decision_is_error`): `1` = Allow,
            `2` = Deny, `3` = Pending, `4` = Redact, `0` = Unspecified.
        decisionLabel:
          $ref: '#/components/schemas/DecisionLabel'
          description: |-
            Lowercase label derived from `decision` (`allow` / `deny` / `pending` /
            `redact` / `unspecified`) so the UI can map to its verdict styling
            without re-deriving the enum. Derived, not a separate audit field.
        latencyMs:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The design's `latency` column. **Always `null`: the audit log records no
            per-decision latency today**, so it is surfaced nullable rather than
            fabricated. Wired through so the column lands the day a latency source is
            added, without another contract change.
          minimum: 0
        matchedPolicy:
          type:
          - string
          - 'null'
          description: |-
            The matched policy rule id (audit `policy_rule`, top-level or under
            `detail`). The design's `policy` column. `null` when the decision
            recorded no rule (e.g. a baseline allow with no matching rule).
        resource:
          type:
          - string
          - 'null'
          description: |-
            The action's primary target derived from the audit `detail` (tool name,
            file path, network host, process command, or LLM model). The design's
            `resource` column. `null` when the detail carries no resolvable target.
        seq:
          type: integer
          format: int64
          description: |-
            Per-session monotonic sequence of the audit entry. Combined with
            `sessionId` it uniquely identifies the row.
          minimum: 0
        sessionId:
          type: string
          description: |-
            Hex-encoded id of the session the decision was recorded under. Lets the
            UI link a row to its trace; not part of the visible design columns.
        timestamp:
          type: string
          description: Decision timestamp as an RFC 3339 UTC string (audit `timestamp_ns`).
        traceId:
          type:
          - string
          - 'null'
          description: |-
            Distributed-trace id linking this decision to its session trace
            (`/api/v1/traces/...`). **Always `null` today**: the audit log records no
            per-decision trace id, so it is surfaced nullable rather than fabricated.
            Populated once trace-id propagation lands on the runtime — the
            ADR-0018-gated follow-up (ADR 0018 / AAASM-5086 follow-up).
        verb:
          type:
          - string
          - 'null'
          description: |-
            The recorded action category (audit payload `action_type`, e.g.
            `TOOL_CALL` / `FILE_OPERATION`). The design's `verb` column: the audit
            log records the action *category*, not a fine-grained read/write verb,
            so this is the closest recorded source. `null` when unrecorded.
        verdict:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RuntimeVerdict'
            description: |-
              The canonical 5-way runtime verdict (`allow` / `narrow` / `scrub` /
              `pending` / `deny`, AAASM-5086) for this action — the vocabulary the
              dashboard renders. Distinct from `decision`/`decisionLabel`, which are the
              coarse proto enforcement outcome: a proto `deny` cannot tell a full block
              from a scoped `narrow`, nor a proto `allow` from a `scrub`. **Always
              `null` today**: deriving the verdict requires capturing it at decision
              time on the enforcement hot path, which is the ADR-0018-gated follow-up
              (populated once decision-capture lands — ADR 0018 / AAASM-5086 follow-up).
              Wired through now so the column lands without another contract change.
    AgentDecisionsResponse:
      type: object
      description: Recent per-agent decision stream (AAASM-5058).
      required:
      - decisions
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AgentDecisionResponse'
          description: Decisions newest-first, capped to the request's `limit`.
    AgentEnforcementCounts:
      type: object
      description: One agent's blocked + scrubbed decision counts over the requested window.
      required:
      - agent_id
      - blocked
      - scrubbed
      properties:
        agent_id:
          type: string
          description: |-
            Hex-encoded agent id — the same 32-char lower-hex form `AgentResponse.id`
            uses, so the dashboard can join these counts directly onto its fleet rows.
        blocked:
          type: integer
          format: int64
          description: |-
            Blocked decisions in the window: `PolicyViolation` audit events (the
            gateway records proto `Decision::DENY` as this event type).
          minimum: 0
        scrubbed:
          type: integer
          format: int64
          description: |-
            Scrubbed decisions in the window: `CredentialLeakBlocked` audit events
            (the gateway records proto `Decision::REDACT` as this event type).
          minimum: 0
    AgentHealth:
      type: object
      description: One agent's health sparkline.
      required:
      - id
      - name
      - points
      properties:
        id:
          type: string
          description: Hex-encoded agent id.
        name:
          type: string
          description: Display name (metadata `name`, falling back to the id).
        points:
          type: array
          items:
            $ref: '#/components/schemas/HealthPoint'
          description: |-
            Health samples. The v1 view emits a single current sample per agent
            (the registry exposes point-in-time status, not a health time series).
    AgentLineage:
      type: object
      description: |-
        An agent's complete ancestry chain ordered root-first.

        The first element is the root agent; the last element is the requested
        agent itself. A root agent returns a list of length 1 containing only itself.

        # Example JSON
        ```json
        {
          "agent_id": "aabbccdd00112233aabbccdd00112233",
          "ancestor_count": 2,
          "ancestors": [
            { "id": "root000000000000root000000000000", "name": "root", "depth": 0, "delegation_reason": null, "team_id": null },
            { "id": "aabbccdd00112233aabbccdd00112233", "name": "child", "depth": 1, "delegation_reason": "orchestrate", "team_id": "team-alpha" }
          ]
        }
        ```
      required:
      - agent_id
      - ancestor_count
      - ancestors
      properties:
        agent_id:
          type: string
          description: The subject agent's hex-encoded UUID.
        ancestor_count:
          type: integer
          description: Number of entries in `ancestors` (includes the agent itself).
          minimum: 0
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/LineageStep'
          description: 'Ordered ancestry: index 0 is the root agent, last element is the requested agent.'
      example:
        agent_id: aabbccdd00112233aabbccdd00112233
        ancestor_count: 2
        ancestors:
        - delegation_reason: null
          depth: 0
          id: root000000000000root000000000000
          name: root
          team_id: null
        - delegation_reason: orchestrate
          depth: 1
          id: aabbccdd00112233aabbccdd00112233
          name: child
          team_id: team-alpha
    AgentMode:
      type: string
      description: Enforcement mode for an agent's capability policy.
      enum:
      - enforce
      - shadow
    AgentNode:
      type: object
      description: |-
        Minimal agent representation used in list and tree responses.

        # Example JSON
        ```json
        {
          "id": "0102030405060708090a0b0c0d0e0f10",
          "name": "my-agent",
          "depth": 1,
          "status": "active",
          "team_id": "team-alpha"
        }
        ```
      required:
      - id
      - name
      - depth
      - status
      - mode
      - flagged
      - trust
      properties:
        budget:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeBudget'
            description: |-
              Per-agent daily budget spend / limit (AAASM-5045), or `null` when this
              projection is built without a budget-tracker lookup. Like `policy_count`,
              only the graph endpoint resolves it; the other endpoints leave it `null`.
        depth:
          type: integer
          format: int32
          description: Delegation depth — 0 for root agents.
          minimum: 0
        effective_permissions:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/NodeEffectivePermissions'
            description: |-
              The agent's policy-inheritance chain and merged capability set
              (AAASM-5099), or `null` when this projection is built without a
              policy-engine lookup. Like `policy_count` / `budget`, only the graph
              endpoint resolves it — the list / tree / team endpoints leave it `null`
              so the client renders "no data" rather than an empty-but-authoritative
              chain.
        flagged:
          type: boolean
          description: |-
            Whether the agent is policy-flagged — it has recorded at least one
            `PolicyViolation` audit event (`count > 0`, AAASM-5103). Drives the
            danger-tinted node card and ⚑ marker in the topology graph.

            Derived from the per-agent audit aggregate
            ([`crate::routes::agent_violations::AgentViolationCounts`]), which the
            topology handlers build once per request and set here — the
            `From<&AgentRecord>` conversion leaves it `false` because the record no
            longer carries a violation counter (the dead field it used to read was
            removed in AAASM-5103).
        governance_level:
          type:
          - string
          - 'null'
          description: Governance level — included only when `show_budget=true`.
        id:
          type: string
          description: Hex-encoded agent UUID.
        mode:
          type: string
          description: |-
            Enforcement-mode badge: `enforce`, `shadow`, or `off`. Derived from the
            canonical `AgentRecord::enforcement_mode` field the gateway actually
            consults (AAASM-5289) — not the free-form `metadata["mode"]` — so the
            badge cannot show a mode enforcement is not in. `None` (no per-agent
            override) resolves to `enforce`, the server-wide default. See
            [`agent_mode`].
        name:
          type: string
          description: Human-readable agent name.
        owner:
          type:
          - string
          - 'null'
          description: |-
            Operator / engineer who owns this agent, read from the agent record's
            `metadata["owner"]` (AAASM-5045). `null` when the registrant supplied no
            owner tag — kept present (not omitted) so the node-detail panel renders an
            explicit "no data" state rather than inferring a value.
        policy_count:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Number of governance policies whose scope cascade applies to this agent
            — `Global → Org → Team → Agent`, the same walk `PolicyEngine::evaluate`
            uses (AAASM-5045). `null` when this projection is built without a
            policy-engine lookup: only the whole-fleet graph endpoint
            (`GET /api/v1/topology`) resolves it; the list / tree / team endpoints
            leave it `null` rather than emitting a misleading `0`.
          minimum: 0
        status:
          $ref: '#/components/schemas/AgentNodeStatus'
          description: 'Runtime status: `active`, `suspended`, or `deregistered`.'
        team_id:
          type:
          - string
          - 'null'
          description: Team this agent belongs to, if any.
        trust:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Trust score as an integer on a 0–100 scale, or `null` when no
            trust-analytics source exists yet.
            The registry does not compute a per-agent trust score today, so this is
            currently always `null` — the same placeholder the Fleet page uses. Kept
            present (not omitted) so the client renders an explicit "no data" state
            instead of inferring a misleading default.
          maximum: 100
          minimum: 0
      example:
        budget:
          limit_usd: 100.0
          spend_usd: 4.1
        depth: 1
        flagged: false
        id: 0102030405060708090a0b0c0d0e0f10
        mode: enforce
        name: my-agent
        owner: platform-team
        policy_count: 3
        status: active
        team_id: team-alpha
        trust: null
    AgentNodeStatus:
      type: string
      description: |-
        Runtime status of an agent node in the topology projection.

        AAASM-5218 — constrains the wire vocabulary of [`AgentNode::status`] at the
        OpenAPI derive to exactly the three values `status_str` can emit, so the
        generated spec (and the TypeScript client) advertises a closed enum instead
        of an unconstrained `string`. Serializes lowercase, matching the strings the
        registry's [`AgentStatus`] mapped to before this was a free-form field.

        Deliberately distinct from the runtime registry [`AgentStatus`], whose
        `Suspended(_)` variant carries a parameterised reason an enum cannot express,
        and from the capability-view `AgentStatus` — the three agent-status
        vocabularies are not reconciled here (that is an ADR question, see AAASM-5209).
      enum:
      - active
      - suspended
      - deregistered
    AgentResponse:
      type: object
      description: JSON representation of an agent returned by the API.
      required:
      - id
      - name
      - framework
      - version
      - status
      - tool_names
      - metadata
      - session_count
      - policy_violations_count
      - is_flagged
      - active_sessions
      - recent_events
      - recent_traces
      properties:
        active_sessions:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSessionResponse'
          description: Currently active sessions for this agent.
        framework:
          type: string
          description: Agent framework (e.g. "langgraph", "crewai").
        id:
          type: string
          description: Hex-encoded agent UUID.
        is_flagged:
          type: boolean
          description: |-
            Whether the agent is policy-flagged — it has recorded at least one policy
            violation (`policy_violations_count > 0`, AAASM-5103). Clients should read
            this rather than re-deriving a threshold, so the Fleet and Topology
            surfaces cannot diverge on whether a given agent is flagged.
        last_event:
          type:
          - string
          - 'null'
          description: ISO 8601 timestamp of the most recent event.
        layer:
          type:
          - string
          - 'null'
          description: Governance layer this agent is assigned to (e.g. "advisory", "enforced").
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        name:
          type: string
          description: Human-readable agent name.
        pid:
          type:
          - integer
          - 'null'
          format: int32
          description: OS process ID, if known.
          minimum: 0
        policy_violations_count:
          type: integer
          format: int32
          description: |-
            Number of policy violations recorded for this agent, derived from the
            `PolicyViolation` audit events (AAASM-5103) — the same canonical source
            the analytics `agent-enforcement` aggregation counts. `0` when the agent
            has recorded none.
          minimum: 0
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/RecentEventResponse'
          description: Most recent events emitted by this agent.
        recent_traces:
          type: array
          items:
            $ref: '#/components/schemas/RecentTraceResponse'
          description: Most recent trace session IDs for this agent.
        session_count:
          type: integer
          format: int32
          description: Number of sessions handled.
          minimum: 0
        status:
          type: string
          description: Current runtime status.
        tool_names:
          type: array
          items:
            type: string
          description: Tools declared at registration.
        version:
          type: string
          description: Semver version string.
    AgentStatus:
      type: string
      description: Liveness status surfaced to the matrix view.
      enum:
      - active
      - idle
      - suspended
    AgentTree:
      type: object
      description: |-
        Recursive tree node representing an agent and all its descendants.

        # Example JSON
        ```json
        {
          "id": "0102030405060708090a0b0c0d0e0f10",
          "name": "root-agent",
          "depth": 0,
          "status": "active",
          "team_id": "team-alpha",
          "delegation_reason": null,
          "spawned_by_tool": null,
          "children": []
        }
        ```
      required:
      - id
      - name
      - depth
      - status
      - mode
      - flagged
      - trust
      - children
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/AgentTree'
        delegation_reason:
          type:
          - string
          - 'null'
          description: Reason this agent was delegated from its parent, if recorded.
        depth:
          type: integer
          format: int32
          description: Delegation depth — 0 for root agents.
          minimum: 0
        flagged:
          type: boolean
          description: |-
            Whether the agent is policy-flagged (`count > 0`). Same derivation and
            audit source as [`AgentNode::flagged`] (AAASM-5103).
        governance_level:
          type:
          - string
          - 'null'
          description: Governance level — included only when `show_budget=true`.
        id:
          type: string
          description: Hex-encoded agent UUID.
        mode:
          type: string
          description: |-
            Enforcement-mode badge: `enforce`, `shadow`, or `off`. Same canonical
            `enforcement_mode` derivation as [`AgentNode::mode`] (AAASM-5289).
        name:
          type: string
          description: Human-readable agent name.
        spawned_by_tool:
          type:
          - string
          - 'null'
          description: Tool that spawned this agent, if known.
        status:
          type: string
          description: 'Runtime status: `active`, `suspended`, or `deregistered`.'
        team_id:
          type:
          - string
          - 'null'
          description: Team this agent belongs to, if any.
        trust:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Trust score as an integer on a 0–100 scale, or `null` when no
            trust-analytics source exists yet.
            Same representation, placeholder, and null contract as
            [`AgentNode::trust`] (AAASM-5104).
          maximum: 100
          minimum: 0
      example:
        children: []
        delegation_reason: null
        depth: 0
        flagged: false
        id: 0102030405060708090a0b0c0d0e0f10
        mode: enforce
        name: root-agent
        spawned_by_tool: null
        status: active
        team_id: team-alpha
        trust: null
    AgentTrustScore:
      type: object
      description: One agent's trust score over the fixed 7-day window (AAASM-5083).
      required:
      - agent_id
      - trust
      properties:
        agent_id:
          type: string
          description: |-
            Hex-encoded agent id — the same 32-char lower-hex form `AgentResponse.id`
            uses, so the dashboard can join scores directly onto its fleet rows.
        trust:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Trust score on a 0–100 scale, or `null` when the agent has fewer than
            `MIN_ACTIONS` governed actions in the window (cold start) — the same
            `Option<u8>` contract the topology / capability projections carry. A
            score is only ever a whole number; `null` is never `0` or `50`.
          maximum: 100
          minimum: 0
    AlertDetailResponse:
      type: object
      description: |-
        Rich alert detail response used by `GET /api/v1/alerts/:id`.

        Carries the rule-engine context defined in AAASM-1385 (rule snapshot,
        routing log, silence, dedup state) alongside the legacy budget/secret
        alert fields for backward compatibility. Rule-engine fields serialize
        as `null` / empty when the underlying `StoredAlert` lacks a
        `rule_context` (i.e. it was a budget or secret-detection alert).
      required:
      - id
      - severity
      - status
      - first_fired_at
      - destination_ids
      - event_payload
      - routing_log
      - dedup_occurrence_count
      - category
      - message
      - timestamp
      properties:
        agent_id:
          type:
          - string
          - 'null'
          description: Agent ID that triggered the alert. `null` for org-scope alerts.
        category:
          type: string
          description: Alert category — `"budget"`, `"secret_detected"`, or `"rule"`.
        dedup_occurrence_count:
          type: integer
          format: int32
          description: |-
            Number of times this alert has matched within the active dedup
            window. Always `1` for legacy alerts.
          minimum: 0
        dedup_window_expires_at:
          type:
          - string
          - 'null'
          description: Timestamp when the active dedup window ends, or `null`.
        destination_ids:
          type: array
          items:
            type: string
          description: Destinations the rule routes to. Empty for legacy alerts.
        detected_pattern_type:
          type:
          - string
          - 'null'
          description: Primary detected credential kind for `secret_detected` alerts.
        event_payload:
          description: |-
            Free-form payload of the triggering event. `null` for legacy
            alerts.
        first_fired_at:
          type: string
          description: ISO 8601 timestamp of the first fire.
        id:
          type: string
          description: Unique alert identifier.
        message:
          type: string
          description: Human-readable alert message.
        redacted_value:
          type:
          - string
          - 'null'
          description: '`[REDACTED:<Kind>]` label for `secret_detected` alerts.'
        resolved_at:
          type:
          - string
          - 'null'
          description: |-
            ISO 8601 timestamp at which the alert was resolved, or `null`
            while firing.
        routing_log:
          type: array
          items:
            $ref: '#/components/schemas/RoutingLogEntry'
          description: Connector-framework delivery log. Empty for legacy alerts.
        ruleSnapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AlertRule'
            description: |-
              Full [`AlertRule`] snapshot captured at fire time so the
              alert-detail view can render the originating rule even after
              the live rule has been edited or deleted (AAASM-1658). `null`
              for legacy budget/secret alerts.
        rule_id:
          type:
          - string
          - 'null'
          description: |-
            Identifier of the rule that produced the alert, or `null` for
            legacy budget/secret alerts.
        rule_name:
          type:
          - string
          - 'null'
          description: Human-readable rule name, or `null` for legacy alerts.
        severity:
          type: string
          description: Alert severity level (`info` / `warning` / `critical`).
        silence:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Silence'
            description: Active silence record, or `null`.
        status:
          type: string
          description: |-
            Lifecycle status — `"unresolved"` on capture, flipped to
            `"resolved"` once `POST /alerts/:id/resolve` has fired.
        team_id:
          type:
          - string
          - 'null'
          description: Team attribution. `null` when not scoped to a team.
        timestamp:
          type: string
          description: |-
            ISO 8601 timestamp when the alert was captured (mirrors
            `first_fired_at` for legacy alerts).
        updated_at:
          type:
          - string
          - 'null'
          description: ISO 8601 timestamp of the last mutation. `null` pre-resolve.
    AlertResponse:
      type: object
      description: JSON representation of a governance alert.
      required:
      - id
      - severity
      - category
      - message
      - timestamp
      - status
      properties:
        agent_id:
          type:
          - string
          - 'null'
          description: Agent ID that triggered the alert (if applicable).
        category:
          type: string
          description: Alert category (e.g. "budget", "secret_detected").
        detected_pattern_type:
          type:
          - string
          - 'null'
          description: |-
            Primary detected credential kind for `secret_detected` alerts
            (e.g. `"AwsAccessKey"`). Omitted for budget alerts.
        id:
          type: string
          description: Unique alert identifier.
        message:
          type: string
          description: Human-readable alert message.
        redacted_value:
          type:
          - string
          - 'null'
          description: |-
            `[REDACTED:<Kind>]` label for `secret_detected` alerts — never
            contains the raw secret. Omitted for budget alerts.
        severity:
          type: string
          description: Alert severity level (e.g. "warning", "critical").
        status:
          type: string
          description: |-
            Lifecycle status — `"unresolved"` on capture, `"resolved"` once
            the alert has been acknowledged via `POST /alerts/:id/resolve`.
        team_id:
          type:
          - string
          - 'null'
          description: |-
            Team attribution propagated from the originating request
            context. Omitted when no team was associated.
        timestamp:
          type: string
          description: ISO 8601 timestamp when the alert was raised.
        updated_at:
          type:
          - string
          - 'null'
          description: |-
            ISO 8601 timestamp of the last mutation (e.g. resolve). `None`
            while the alert is still in its initial captured state.
    AlertRule:
      type: object
      description: |-
        A persisted alert rule. Same shape is used for request bodies on
        POST / PUT and for response bodies on GET, matching the Story
        description verbatim.

        `id`, `created_at`, and `updated_at` are server-assigned; clients
        must omit them on POST (the in-memory store will populate them) and
        the store will overwrite them on PUT to preserve `id` + `created_at`
        and bump `updated_at`.
      required:
      - id
      - name
      - description
      - metric
      - operator
      - threshold
      - evaluationWindowSeconds
      - severity
      - destinationIds
      - dedupWindowSeconds
      - enabled
      - createdAt
      - updatedAt
      properties:
        createdAt:
          type: string
          description: RFC 3339 timestamp when the rule was first created.
        dedupWindowSeconds:
          type: integer
          format: int32
          description: Window in seconds during which repeat firings are deduplicated.
          minimum: 0
        description:
          type: string
          description: Free-form description displayed in the dashboard rule list.
        destinationIds:
          type: array
          items:
            type: string
          description: |-
            Destinations the alert is routed to. Non-empty; each id must
            exist in the destination registry.
        enabled:
          type: boolean
          description: Whether the rule is actively evaluated.
        evaluationWindowSeconds:
          type: integer
          format: int32
          description: Evaluation window in seconds — must be one of `{300, 900, 3600}`.
          minimum: 0
        id:
          type: string
          description: Server-assigned ULID-style identifier.
        metric:
          $ref: '#/components/schemas/RuleMetric'
          description: Metric the rule polls.
        name:
          type: string
          description: |-
            Human-readable rule name. Must be 1-128 characters and unique
            per tenant (uniqueness is enforced at the store layer).
        operator:
          $ref: '#/components/schemas/RuleOperator'
          description: |-
            Comparison operator applied between the metric value and
            [`Self::threshold`].
        severity:
          $ref: '#/components/schemas/RuleSeverity'
          description: Severity propagated to alerts emitted by this rule.
        suppressionLabels:
          type: object
          description: Optional free-form `key=value` suppression labels.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        threshold:
          type: number
          format: double
          description: |-
            Numeric threshold. Must be 0-100 for percentage metrics
            (see [`AlertRule::validate`]).
        updatedAt:
          type: string
          description: RFC 3339 timestamp of the last mutation.
    AlertRuleRequest:
      type: object
      description: |-
        Wire shape for POST / PUT request bodies.

        Mirrors the Story's JSON example. Enum-shaped fields are accepted as
        strings so the handler can map unknown values onto the spec's
        `invalid_metric` error code rather than relying on serde's default
        422 rejection.
      required:
      - name
      - description
      - metric
      - operator
      - threshold
      - evaluationWindowSeconds
      - severity
      - destinationIds
      - dedupWindowSeconds
      - enabled
      properties:
        dedupWindowSeconds:
          type: integer
          format: int32
          minimum: 0
        description:
          type: string
        destinationIds:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        evaluationWindowSeconds:
          type: integer
          format: int32
          minimum: 0
        metric:
          type: string
        name:
          type: string
        operator:
          type: string
        severity:
          type: string
        suppressionLabels:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        threshold:
          type: number
          format: double
    AlertWsFrame:
      oneOf:
      - type: object
        description: A new alert was just captured into the store.
        required:
        - ts
        - alert
        - type
        properties:
          alert:
            $ref: '#/components/schemas/AlertResponse'
            description: Full alert payload — same shape as `GET /api/v1/alerts/{id}`.
          ts:
            type: string
            description: ISO 8601 timestamp at which the server emitted this frame.
          type:
            type: string
            enum:
            - alert.fire
      - type: object
        description: |-
          An existing alert was acknowledged via the resolve endpoint.
          `alert.status` is `"resolved"`.
        required:
        - ts
        - alert
        - type
        properties:
          alert:
            $ref: '#/components/schemas/AlertResponse'
          ts:
            type: string
          type:
            type: string
            enum:
            - alert.resolve
      - type: object
        description: |-
          An existing alert was suppressed by an active silence. Reserved
          for the future suppression feature — no production code emits
          this variant today; the schema is published so clients can
          already round-trip frames once a producer exists.
        required:
        - ts
        - alert
        - silence
        - type
        properties:
          alert:
            $ref: '#/components/schemas/AlertResponse'
          silence:
            description: |-
              Silence metadata — left as a free-form object so the
              concrete `Silence` schema can land in a follow-up without
              breaking the WS contract.
          ts:
            type: string
          type:
            type: string
            enum:
            - alert.silence
      - type: object
        description: |-
          Keep-alive frame emitted every 30 s when no other frame was
          sent in that window (AC).
        required:
        - ts
        - type
        properties:
          ts:
            type: string
          type:
            type: string
            enum:
            - heartbeat
      description: |-
        Lifecycle frame pushed to clients over the alerts WebSocket.

        Server-only — `AlertResponse` does not currently derive
        `Deserialize`, so this enum is `Serialize`-only. Client-side
        parsing happens through `serde_json::Value` in tests.
    ApiKeyResponse:
      type: object
      required:
      - id
      - label
      - prefix
      - scopes
      - status
      - created_at
      - owner
      - role
      - assigned_policies
      - recent_activity
      properties:
        assigned_policies:
          type: array
          items:
            type: string
        created_at:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          description: AAASM-5177 — RFC3339 expiry instant, or `null` for a non-expiring key.
        id:
          type: string
        label:
          type: string
        last_used:
          type:
          - string
          - 'null'
        owner:
          type: string
        prefix:
          type: string
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/RecentActivityResponse'
        role:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScopeResponse'
        status:
          $ref: '#/components/schemas/ApiKeyStatusResponse'
    ApiKeyScopeResponse:
      type: string
      description: Scopes a key may hold. Wire form matches the dashboard's TS union.
      enum:
      - read:members
      - write:members
      - read:policies
      - write:policies
      - read:audit
      - admin
    ApiKeyStatusResponse:
      type: string
      enum:
      - active
      - revoked
      - expired
    ApprovalAnalyticsResponse:
      type: object
      description: Response for `GET /api/v1/analytics/approvals`.
      required:
      - volume
      - medianTta
      - approvalRate
      - byOutcome
      properties:
        approvalRate:
          type: number
          format: double
          description: Approval rate = approved / (approved + rejected + expired), `0.0` when none.
        byOutcome:
          $ref: '#/components/schemas/ApprovalOutcome'
          description: Breakdown by final outcome.
        medianTta:
          type: number
          format: double
          description: Median time-to-answer in seconds across resolved (non-expired) approvals.
        volume:
          type: integer
          format: int64
          description: Total resolved approvals in the window (approved + rejected + expired).
          minimum: 0
    ApprovalOutcome:
      type: object
      description: Resolved-outcome counts for the approvals analytics panel.
      required:
      - approved
      - rejected
      - expired
      properties:
        approved:
          type: integer
          format: int64
          description: Approvals granted.
          minimum: 0
        expired:
          type: integer
          format: int64
          description: Approvals that expired without a decision (`timed_out`).
          minimum: 0
        rejected:
          type: integer
          format: int64
          description: Approvals rejected.
          minimum: 0
    ApprovalPayload:
      type: object
      description: |-
        Payload for `event_type: "approval"` events.

        Represents either a freshly-submitted human-in-the-loop approval
        request or a status-change notification (e.g. auto-expiration). The
        `status` field discriminates: `"pending"` for new requests,
        `"expired"` for auto-expirations (AAASM-1453).
      required:
      - request_id
      - action
      - condition_triggered
      - submitted_at
      - timeout_secs
      - expires_at
      properties:
        action:
          type: string
          description: Human-readable description of the action awaiting approval.
        condition_triggered:
          type: string
          description: Policy condition that triggered this request.
        expires_at:
          type: integer
          format: int64
          description: |-
            Unix epoch timestamp (seconds) at which the request expires
            (`submitted_at + timeout_secs`). Provided as a pre-computed
            absolute timestamp so dashboard consumers can render the
            auto-expire countdown without local-clock drift.
          minimum: 0
        request_id:
          type: string
          description: Unique ID for the approval request (UUID v4).
        status:
          type: string
          description: |-
            Lifecycle status — `"pending"` for newly-submitted requests
            (the original event semantics) or `"expired"` when the
            per-request timeout has elapsed without a human decision
            (AAASM-1453). Defaults to `"pending"` for legacy producers
            pre-AAASM-1453 that haven't been updated.
        submitted_at:
          type: integer
          format: int64
          description: Unix epoch timestamp (seconds) when the request was submitted.
          minimum: 0
        timeout_secs:
          type: integer
          format: int64
          description: Seconds before the request times out.
          minimum: 0
    ApprovalResponse:
      type: object
      description: JSON representation of a pending approval request.
      required:
      - id
      - agent_id
      - action
      - reason
      - status
      - created_at
      - expires_at
      properties:
        action:
          type: string
          description: The governance action requiring approval.
        agent_id:
          type: string
          description: Agent that triggered the approval.
        created_at:
          type: string
          description: ISO 8601 timestamp when the request was created.
        expires_at:
          type: string
          description: |-
            ISO 8601 timestamp at which the pending request expires
            (`created_at` + the governing `approval_timeout_secs`). The
            dashboard renders a countdown from this value. Empty string on
            post-decision (`approved` / `rejected`) responses where
            expiration is no longer meaningful.
        id:
          type: string
          description: Unique approval request identifier.
        quorum:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QuorumStatus'
            description: |-
              Multi-approver quorum status (AAASM-5095). Present only when the
              approval is a quorum approval; absent for single-target approvals. When
              present the tally reflects real approver responses and is never
              fabricated.
        reason:
          type: string
          description: Human-readable reason for the approval request.
        routing_status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RoutingStatusInfo'
            description: Structured routing metadata. Absent until the router has processed the request.
        status:
          type: string
          description: 'Current status: "pending", "approved", or "rejected".'
        team_id:
          type:
          - string
          - 'null'
          description: Team the approval was routed to, if known.
    AuthMethodsResponse:
      type: object
      description: |-
        Response body for `GET /auth/methods` (ADR 0031 §Q5). Advertises which
        credential paths this deployment can serve so the frontend degrades honestly.
      required:
      - methods
      properties:
        methods:
          type: array
          items:
            type: string
          description: |-
            `["api_key"]` on an in-memory deployment; `["api_key","password"]` when a
            Postgres store backs native accounts.
    BudgetAlertPayload:
      type: object
      description: |-
        Payload for `event_type: "budget"` events.

        Emitted when an agent's spend crosses a configured daily threshold
        (80 % or 95 % of the daily limit).
      required:
      - threshold_pct
      - spent_usd
      - limit_usd
      properties:
        limit_usd:
          type: number
          format: double
          description: Configured daily limit in USD.
        spent_usd:
          type: number
          format: double
          description: Current total spend in USD at the time of the alert.
        threshold_pct:
          type: integer
          format: int32
          description: Threshold percentage that was crossed (e.g. `80` or `95`).
          minimum: 0
    BudgetRollupResponse:
      type: object
      description: Aggregated budget rollup for an agent across its scope hierarchy.
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BudgetRowResponse'
          description: Rows ordered narrowest scope first (agent → team → org → subtree).
    BudgetRowResponse:
      type: object
      description: One budget row in the rollup — agent / team / org / subtree × daily / monthly.
      required:
      - scope
      - period
      - spent_usd
      properties:
        limit_usd:
          type:
          - string
          - 'null'
          description: Configured limit for the period, if any (string-encoded Decimal).
        percent_used:
          type:
          - number
          - 'null'
          format: double
          description: Spend / limit × 100. Omitted when no limit.
        period:
          type: string
          description: 'Period the row covers: `"daily"`, `"monthly"`, or `"today"` (subtree).'
        remaining_usd:
          type:
          - string
          - 'null'
          description: '`limit_usd - spent_usd`, clamped at zero. Omitted when no limit.'
        scope:
          type: string
          description: 'Scope label: `"agent"`, `"team:<id>"`, `"org"`, or `"subtree"`.'
        spent_usd:
          type: string
          description: Total USD spent in the period (string-encoded Decimal).
    BudgetTreeNode:
      type: object
      description: One node in the budget-inheritance tree.
      required:
      - id
      - label
      - kind
      - depth
      - own_spend_usd
      - subtree_spend_usd
      - children
      properties:
        budget_limit_usd:
          type:
          - string
          - 'null'
          description: |-
            Configured daily budget limit in USD for this node, if any (decimal
            string). Agent nodes fall back to the global limit when they carry no
            per-agent override, mirroring the enforcement path's resolution.
        children:
          type: array
          items:
            $ref: '#/components/schemas/BudgetTreeNode'
        depth:
          type: integer
          format: int32
          description: Depth from the org root (org = 0, team = 1, agents from 2 and deeper).
          minimum: 0
        governance_level:
          type:
          - string
          - 'null'
          description: |-
            Governance level for agent nodes (e.g. `L0Discover`), read from the
            registry record; absent for org/team nodes.
        id:
          type: string
          description: 'Stable node id: the org id, the team id, or the hex agent id.'
        kind:
          type: string
          description: 'Node tier: `org` | `team` | `agent`.'
        label:
          type: string
          description: 'Human-readable label: org/team id, or the agent''s registered name.'
        monthly_budget_limit_usd:
          type:
          - string
          - 'null'
          description: |-
            Configured calendar-month budget limit in USD for this node, if any
            (decimal string). Populated for team nodes from the tracker-wide team
            monthly envelope (AAASM-5087) so the Teams monthly-budget card can read
            the limit off the tree; `None` for tiers without a configured monthly
            cap. This is a calendar-month window, not a rolling window.
        own_spend_usd:
          type: string
          description: |-
            Spend attributable to this node itself, excluding descendants (USD
            string). Org and team nodes never spend directly, so this is `"0"`.
        subtree_spend_usd:
          type: string
          description: |-
            Spend across this node and its entire subtree (USD string) — the figure a
            parent's budget constrains.
    BudgetTreeResponse:
      type: object
      description: Response for `GET /api/v1/costs/budget-tree`.
      properties:
        root:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BudgetTreeNode'
            description: |-
              Org root of the inheritance tree, or `null` when the caller can see no
              tenant (an unscoped non-admin caller) so the client renders an empty state.
    CallStackNode:
      type: object
      description: |-
        One node in the hierarchical call stack rendered beneath an
        expanded Live Ops row in the dashboard.

        Mirrors the proto `assembly.audit.v1.CallStackNode` message and the
        dashboard `LiveOperation.callStack[]` TS type.
      required:
      - id
      - kind
      - label
      properties:
        children:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CallStackNode'
          description: |-
            Recursive descent — nested calls produced by this step. Omitted
            when the node has no children.
        id:
          type: string
          description: Stable identifier for this node within the call stack.
        kind:
          type: string
          description: |-
            Node category — one of `"llm"`, `"tool"`, or `"result"`. String-typed
            (not an enum) to keep this open-ended for downstream renderers.
        label:
          type: string
          description: Human-readable label rendered in the dashboard.
        latency_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Step-local latency in milliseconds. Omitted when the producer did
            not record a duration for this node.
    CapCell:
      type: object
      description: |-
        One cell in the (agent × resource) matrix: a decision per verb, plus an
        optional `flag` marker the UI uses to highlight over-permissioned cells.
      required:
      - read
      - write
      - delete
      - exec
      properties:
        delete:
          $ref: '#/components/schemas/Decision'
        exec:
          $ref: '#/components/schemas/Decision'
        flag:
          type:
          - boolean
          - 'null'
          description: |-
            `Some(true)` when this cell's grant is over-permission — the agent is
            effectively allowed a destructive system verb its declared `RiskTier`
            baseline does not warrant (AAASM-5175, ADR 0029). Absent when the cell is
            within baseline, or when the agent is not evaluated (no resolvable tier,
            or an empty cascade). Only the offending marker is emitted; a per-cell
            `false` is not, so the UI highlights positives without negative clutter.
        read:
          $ref: '#/components/schemas/Decision'
        write:
          $ref: '#/components/schemas/Decision'
    CapabilityAgent:
      type: object
      description: One agent row in the dashboard Capability Matrix.
      required:
      - id
      - name
      - framework
      - trust
      - status
      - lastSeen
      - caps
      properties:
        caps:
          type: object
          description: Resource-id → CapCell mapping for this agent.
          additionalProperties:
            $ref: '#/components/schemas/CapCell'
          propertyNames:
            type: string
        flagged:
          type:
          - boolean
          - 'null'
          description: |-
            Over-permission verdict (AAASM-5175, ADR 0029): `Some(true)` when the
            agent is effectively granted a destructive system capability its declared
            `RiskTier` baseline does not warrant, `Some(false)` when it was evaluated
            and found within baseline. Absent when the agent is *not* evaluated — it
            declared no resolvable risk tier, or its policy cascade is empty (in which
            case every cell is `Allow` by fall-through and flagging would be a false
            positive). This is a structural grant-vs-posture signal, distinct from the
            behavioural `trust` score (ADR 0019) and the topology violation-volume flag.
        framework:
          type: string
        id:
          type: string
          description: Hex-encoded agent UUID, as registered.
        lastSeen:
          type: string
          description: ISO 8601 UTC timestamp of the agent's most recent heartbeat.
        mode:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentMode'
            description: |-
              Enforcement posture, from the agent's registered `enforcement_mode`
              override. Absent when the agent declared none (the effective mode is then
              per-policy-document, so there is no single agent-level answer) or when it
              declared `Disabled`, which this two-value view cannot represent.
        name:
          type: string
        note:
          type:
          - string
          - 'null'
          description: |-
            When `flagged` is `Some(true)`, a human-readable explanation naming the
            tier and the offending grants (e.g. "Low-risk agent granted file_delete,
            terminal_exec beyond its tier baseline"). Absent otherwise — there is no
            operator-authored note source, so a note only ever accompanies a flag.
        owner:
          type:
          - string
          - 'null'
          description: |-
            Owning team, from the registry's first-class `team_id` (falling back to
            `org_id`). Absent when the agent registered without either.
        status:
          $ref: '#/components/schemas/AgentStatus'
        trust:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Trust score as an integer on a 0–100 scale, or `null` when no
            trust-analytics source exists yet.

            Always `null`: no trust score is computed anywhere in the gateway today.
            Deriving one would be a new scoring rule, which is the subject of its own
            story (AAASM-5083) — emitting a placeholder here would be indistinguishable
            from a real score to every consumer.
          maximum: 100
          minimum: 0
    CapabilityMatrix:
      type: object
      description: |-
        Top-level response shape for `GET /api/v1/capability/matrix`. Mirrors
        the `CapabilityMatrix` interface in `dashboard/src/api/capability.ts`.
      required:
      - resources
      - agents
      - policies
      - sampleCalls
      - cascadeLoaded
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityAgent'
        cascadeLoaded:
          type: boolean
          description: |-
            Whether the projecting engine actually carries a policy cascade
            (`PolicyEngine::cascade_loaded`). AAASM-5106 / ADR 0024: when the cascade
            is unloaded — the state of every shipped aa-api deployment today, which
            loads its policy through `load_from_file` and leaves `scope_index` empty —
            `decide()` falls through to `Allow` for every cell, so the grid asserts an
            unbroken wall of `ALLOW` for capabilities the primary policy actually
            denies. `false` here is the matrix-level "not evaluated — policy cascade
            not loaded" signal the dashboard renders as an unavailable state, so an
            operator never reads a fabricated `Allow` as a real grant. It is a fact
            about the projection's *data*, never an operator choice; the enforcement
            path (`evaluate_primary`) is unaffected.

            Required-but-always-present, not optional: the key is always on the wire,
            so a client reads an explicit `false` it must handle rather than a missing
            field it can shrug off — the same absent-vs-unknown discipline as
            [`CapabilityAgent::trust`] and `TeamPoliciesResponse::policies`.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        sampleCalls:
          type: array
          items:
            $ref: '#/components/schemas/SampleCall'
    CapabilityOverrideRequest:
      type: object
      description: |-
        Request payload for `POST /api/v1/capability/override` — apply a single
        (resource, verb, decision) override across one or more agents.
      required:
      - agentIds
      - resourceId
      - verb
      - decision
      properties:
        agentIds:
          type: array
          items:
            type: string
          description: Agents to apply the override to.
        decision:
          $ref: '#/components/schemas/Decision'
          description: New decision to record for that (resource, verb) pair.
        resourceId:
          type: string
          description: Identifier of the resource whose cell is being overridden.
        ttlSeconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Optional TTL in seconds. When set, the override is automatically
            reverted to the pre-override value after this duration elapses.
            The endpoint returns 201 Created instead of 200 OK when TTL is provided.
          minimum: 0
        verb:
          $ref: '#/components/schemas/Verb'
          description: Verb (read / write / delete / exec) within the cell.
    CapabilityOverrideResponse:
      type: object
      description: |-
        Response envelope for `POST /api/v1/capability/override`: the stable UUID
        assigned to this override (use it to `DELETE /capability/override/{id}`)
        plus the subset of agent rows that actually changed.
      required:
      - overrideId
      - updated
      properties:
        overrideId:
          type: string
          description: Stable UUID for this override; pass to `DELETE /capability/override/{id}` to revert.
        updated:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityAgent'
    ChangeType:
      type: string
      description: Classifier for what a proposed-vs-current decision change represents.
      enum:
      - newly-blocked
      - narrowed
      - unchanged
      - tightened
      - false-positive
    ChildSpendResponse:
      type: object
      description: Per-direct-child contribution to a single day's subtree spend.
      required:
      - child_agent_id
      - child_name
      - spent_usd
      properties:
        child_agent_id:
          type: string
          description: Hex-encoded child agent ID.
        child_name:
          type: string
          description: Display name of the child agent.
        spent_usd:
          type: string
          description: USD spent by this child on the given date (string-encoded Decimal).
    ColdActionDto:
      type: string
      description: |-
        Cold-tier action chosen by the admin.

        Wire-level enum kept lowercase (`drop` / `archive`) so the JSON body
        is identical to the YAML config key and the dashboard dropdown value.
      enum:
      - drop
      - archive
    ConnectorFailedBody:
      type: object
      description: Response body for a failed test-fire (502).
      required:
      - error
      - connector_status
      - connector_body
      properties:
        connector_body:
          type: string
          description: |-
            Up-to-2048-byte snippet of the connector response body (or transport
            error description if no HTTP response was reached).
        connector_status:
          type: integer
          format: int32
          description: HTTP status the connector observed, or `0` if no response was received.
          minimum: 0
        error:
          type: string
          description: Always `"connector_failed"`.
    CostBreakdownResponse:
      type: object
      description: Response for `GET /api/v1/analytics/cost-breakdown`.
      required:
      - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/CostBucket'
          description: |-
            Ordered cost buckets. The v1 view emits a single current-day bucket
            (the budget tracker exposes point-in-time spend, not a time series).
    CostBucket:
      type: object
      description: A single bucket (x-axis position) of the cost-breakdown chart.
      required:
      - label
      - segments
      properties:
        label:
          type: string
          description: Bucket label (the current calendar date for the v1 point-in-time view).
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CostSegment'
          description: Per-dimension spend segments within this bucket.
    CostHistoryPoint:
      type: object
      description: One calendar day of the spend-history series.
      required:
      - date
      - spend_usd
      properties:
        date:
          type: string
          description: Calendar date (YYYY-MM-DD, in the tracker's timezone) for this bucket.
        spend_usd:
          type: string
          description: |-
            Total spend recorded on this date in USD, serialized as a decimal string
            so money precision is never lost to float rounding (mirrors `/costs`).
    CostHistoryResponse:
      type: object
      description: Response for `GET /api/v1/costs/history`.
      required:
      - days
      - points
      properties:
        days:
          type: integer
          format: int32
          description: Number of days in the returned series (the resolved, clamped `days`).
          minimum: 0
        points:
          type: array
          items:
            $ref: '#/components/schemas/CostHistoryPoint'
          description: Daily spend buckets, oldest first, dense (zero-filled) across the window.
    CostSegment:
      type: object
      description: One stacked segment within a cost bucket (a single agent / team / model).
      required:
      - key
      - name
      - value
      properties:
        key:
          type: string
          description: Stable segment key (agent id hex, team id, or model name).
        name:
          type: string
          description: Human-readable segment label.
        value:
          type: number
          format: double
          description: Spend for this segment in USD.
    CostSummary:
      type: object
      description: JSON representation of the cost/budget summary.
      required:
      - daily_spend_usd
      - date
      properties:
        daily_limit_usd:
          type:
          - string
          - 'null'
          description: Configured daily budget limit in USD, if set.
        daily_spend_usd:
          type: string
          description: Total spend today in USD.
        date:
          type: string
          description: Calendar date (YYYY-MM-DD) the daily spend applies to.
        monthly_limit_usd:
          type:
          - string
          - 'null'
          description: Configured monthly budget limit in USD, if set.
        monthly_spend_usd:
          type:
          - string
          - 'null'
          description: Total spend this month in USD (if monthly tracking is enabled).
        per_agent:
          type: array
          items:
            $ref: '#/components/schemas/AgentCostEntry'
          description: Per-agent cost breakdown for the current day.
        per_team:
          type: array
          items:
            $ref: '#/components/schemas/TeamCostEntry'
          description: Per-team cost rollup for the current day.
    CreateDestinationRequest:
      allOf:
      - $ref: '#/components/schemas/DestinationConfig'
        description: Discriminated per-kind configuration.
      - type: object
        required:
        - name
        properties:
          enabled:
            type: boolean
            description: Whether dispatch is enabled on creation (defaults to true).
          name:
            type: string
            description: Operator-supplied display name.
      description: Body for `POST /api/v1/alerts/destinations`.
    CreatePolicyRequest:
      type: object
      description: Request body for creating a new policy.
      required:
      - policy_yaml
      properties:
        policy_yaml:
          type: string
          description: Raw YAML content of the governance policy.
        scope:
          type:
          - string
          - 'null'
          description: |-
            Optional client-declared governance scope (e.g. `"global"`,
            `"team:platform"`). Advisory: authorization is derived from the policy
            document's own declared scope, and a value that disagrees with the
            document is rejected.
    DailyBurnPointResponse:
      type: object
      description: One point in the subtree-burn time series.
      required:
      - date
      - per_child
      - total_usd
      properties:
        date:
          type: string
          description: ISO 8601 calendar date (YYYY-MM-DD) the point covers.
        per_child:
          type: array
          items:
            $ref: '#/components/schemas/ChildSpendResponse'
          description: Per-direct-child contributions, ordered by child agent ID for stability.
        total_usd:
          type: string
          description: Total subtree spend for the date (root + descendants, string-encoded Decimal).
    DecideRequest:
      type: object
      description: Request body for approval decide actions.
      properties:
        by:
          type:
          - string
          - 'null'
          description: Identity of the operator making the decision.
        conditions:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            Structured approval conditions attached to an approve decision
            (AAASM-5095). Each entry is a condition slug such as `"this-once"`,
            `"policy-exception"`, or `"time-boxed"`. Ignored on reject. Absent or
            empty ⇒ an unconditional approval.
        reason:
          type:
          - string
          - 'null'
          description: Optional reason for the decision.
    Decision:
      type: string
      description: Decision recorded for a single (agent, resource, verb) tuple.
      enum:
      - allow
      - narrow
      - approval
      - deny
      - na
    DecisionLabel:
      type: string
      description: |-
        Wire vocabulary for [`AgentDecisionResponse::decision_label`].

        AAASM-5219 — constrains the `decisionLabel` field to the closed set of
        lowercase labels [`decision_label`] can emit, one per proto
        [`Decision`](aa_proto::assembly::common::v1::Decision) discriminant plus the
        `unspecified` fallback, so the generated OpenAPI spec advertises an enum
        rather than a free-form `string`. Serializes lowercase.
      enum:
      - allow
      - deny
      - pending
      - redact
      - unspecified
    DeniedResourceShare:
      type: object
      description: One resource's contribution to an agent's recent denials.
      required:
      - resource
      - denials
      - share_pct
      properties:
        denials:
          type: integer
          format: int64
          description: Denials attributed to this resource in the window.
          minimum: 0
        resource:
          type: string
          description: The denied resource (the audit `blocked_action`, e.g. `"gmail/write"`).
        share_pct:
          type: number
          format: double
          description: This resource's share of `total_denials`, as a 0–100 percentage.
    DestinationConfig:
      oneOf:
      - type: object
        description: Generic HTTP webhook.
        required:
        - config
        - kind
        properties:
          config:
            type: object
            description: Generic HTTP webhook.
            required:
            - url
            properties:
              secret_header:
                type:
                - string
                - 'null'
                description: Optional secret shipped in the `X-AAASM-Token` header.
              url:
                type: string
                description: Target URL (http or https).
          kind:
            type: string
            enum:
            - webhook
      - type: object
        description: Slack incoming webhook.
        required:
        - config
        - kind
        properties:
          config:
            type: object
            description: Slack incoming webhook.
            required:
            - webhook_url
            properties:
              channel_override:
                type:
                - string
                - 'null'
                description: Optional `#channel` or `@user` override.
              webhook_url:
                type: string
                description: Slack-issued incoming webhook URL.
          kind:
            type: string
            enum:
            - slack
      - type: object
        description: PagerDuty Events API v2.
        required:
        - config
        - kind
        properties:
          config:
            type: object
            description: PagerDuty Events API v2.
            required:
            - routing_key
            properties:
              routing_key:
                type: string
                description: Integration routing key.
              severity_map:
                type:
                - object
                - 'null'
                description: Optional severity-name mapping (AAASM severity → PagerDuty severity).
                additionalProperties:
                  type: string
                propertyNames:
                  type: string
          kind:
            type: string
            enum:
            - pagerduty
      - type: object
        description: OpsGenie REST alerts API.
        required:
        - config
        - kind
        properties:
          config:
            type: object
            description: OpsGenie REST alerts API.
            required:
            - api_key
            - team_id
            properties:
              api_key:
                type: string
                description: OpsGenie API key (GenieKey).
              team_id:
                type: string
                description: Target team identifier.
          kind:
            type: string
            enum:
            - opsgenie
      description: |-
        Per-kind configuration payload for a `Destination`.

        Serialised as `{ "kind": "...", "config": { ... } }` so that the API
        surface keeps configuration fields cleanly grouped under `config`.
    DestinationKind:
      type: string
      description: Kind of notification destination.
      enum:
      - webhook
      - slack
      - pagerduty
      - opsgenie
    DestinationResponse:
      allOf:
      - $ref: '#/components/schemas/DestinationConfig'
        description: Discriminated per-kind configuration (`kind` + `config`).
      - type: object
        required:
        - id
        - name
        - enabled
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            description: RFC 3339 creation timestamp.
          enabled:
            type: boolean
            description: Whether dispatch is allowed.
          id:
            type: string
            description: Stable identifier (`dst_<32 hex>`).
          name:
            type: string
            description: Operator-supplied display name.
          updated_at:
            type: string
            description: RFC 3339 last-mutation timestamp.
      description: Public JSON shape returned by every destination handler.
    DispatchToolRequest:
      type: object
      description: Request body for `POST /api/v1/dispatch_tool`.
      required:
      - tool
      - args
      properties:
        args:
          description: |-
            Placeholder-form args. May contain `${NAME}` tokens that the gateway
            will resolve via the `SecretsStore` before audit + forwarding. For
            WASM tools (`ToolKind::Wasm`) the args are forwarded as raw bytes to
            the sandbox without placeholder resolution.
        tool:
          type: string
          description: Name of the tool the agent wants to dispatch (e.g. `"call_database"`).
    DispatchToolResponse:
      type: object
      description: |-
        Response body for `POST /api/v1/dispatch_tool`.

        Two flows fan in through this shape:

        * **Native / secret-injection** — `resolved_args` + `names_substituted`
          carry the AAASM-1920 result; `sandbox` is `None`.
        * **WASM sandbox** (AAASM-2033) — `sandbox` carries the dispatch
          verdict; `resolved_args` is `null` and `names_substituted` is empty.
      required:
      - resolved_args
      - names_substituted
      properties:
        names_substituted:
          type: array
          items:
            type: string
          description: |-
            The placeholder names that were resolved during this call. Names
            only — never the resolved values. Echoes the audit-log shape so
            callers can correlate dispatches with audit entries. Empty for
            WASM-sandbox dispatches.
        resolved_args:
          description: |-
            Post-substitution args ready to forward to the tool sink. Contains
            the *resolved* credential values; callers must not log these.
            `null` for WASM-sandbox dispatches.
        sandbox:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SandboxDispatchOutcome'
            description: |-
              WASM sandbox dispatch verdict, present only when the named tool was
              registered as `ToolKind::Wasm` in `AppState::tool_registry`.
              (AAASM-2033 / F116 ST-W.)
    EdgeListResponse:
      type: object
      description: Paginated list of directed edges for an agent.
      required:
      - agent_id
      - edges
      - count
      properties:
        agent_id:
          type: string
          description: The queried agent ID.
        count:
          type: integer
          description: Total number of edges returned.
          minimum: 0
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResponse'
          description: The list of matching edges, newest first.
    EdgeResponse:
      type: object
      description: A single directed edge between two agents.
      required:
      - id
      - source_agent_id
      - target_agent_id
      - edge_type
      - created_at
      - is_cross_team
      properties:
        created_at:
          type: string
          description: ISO 8601 timestamp when the edge was recorded.
        edge_type:
          type: string
          description: Edge semantic type (snake_case).
        id:
          type: integer
          format: int64
          description: Auto-assigned edge identifier.
        is_cross_team:
          type: boolean
          description: Whether the edge crosses team boundaries.
        metadata:
          description: Optional freeform metadata attached at emission time.
        source_agent_id:
          type: string
          description: Hex-encoded source agent ID.
        target_agent_id:
          type: string
          description: Hex-encoded target agent ID.
    EffectivePermissionsResponse:
      type: object
      description: Effective permission set for an agent, with cascade provenance.
      required:
      - allow
      - deny
      - sources
      properties:
        allow:
          type: array
          items:
            type: string
          description: Capabilities allowed after merging the cascade (most-restrictive-wins).
        deny:
          type: array
          items:
            type: string
          description: Capabilities denied after merging the cascade.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/PermissionSourceResponse'
          description: Per-scope contribution, in cascade order (broadest → narrowest).
    EnforcementBucket:
      type: object
      description: 'One time bucket of the enforcement timeline: decision counts by verdict.'
      required:
      - ts
      - allow
      - narrow
      - deny
      - scrub
      properties:
        allow:
          type: integer
          format: int64
          description: Permitted decisions (`ToolCallIntercepted` = proto `Decision::ALLOW`).
          minimum: 0
        deny:
          type: integer
          format: int64
          description: Blocked decisions (`PolicyViolation` = proto `Decision::DENY`).
          minimum: 0
        narrow:
          type: integer
          format: int64
          description: Held-for-approval decisions (`ApprovalRequested` = proto `Decision::PENDING`).
          minimum: 0
        scrub:
          type: integer
          format: int64
          description: Credential/secret redactions (`CredentialLeakBlocked` = proto `Decision::REDACT`).
          minimum: 0
        ts:
          type: integer
          format: int64
          description: Bucket-start timestamp, epoch milliseconds.
    EnforcementModeLabel:
      type: string
      description: |-
        Wire vocabulary for [`AgentConfigResponse::enforcement_mode`].

        AAASM-5098 / ADR-0022 — the agent's registered enforcement-mode override,
        serialized as the same `snake_case` labels the core [`aa_core::EnforcementMode`]
        uses. A dedicated schema (rather than surfacing the core enum) so the
        generated OpenAPI advertises a closed enum. Emitted only when the agent
        declares an override; see [`AgentConfigResponse::enforcement_mode`].
      enum:
      - enforce
      - observe
      - disabled
    EnforcementTimelineResponse:
      type: object
      description: Response for `GET /api/v1/overview/enforcement-timeline`.
      required:
      - window
      - bucketSecs
      - buckets
      properties:
        bucketSecs:
          type: integer
          format: int64
          description: Width of each bucket in seconds (`window / 24`).
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/EnforcementBucket'
          description: |-
            Ordered buckets, oldest first — always [`SERIES_BUCKETS`] of them,
            including empty buckets, so the timeline renders a continuous axis.
        window:
          type: string
          description: Echo of the resolved window preset (`1h` | `24h` | `7d` | `30d`).
    EventPayload:
      oneOf:
      - $ref: '#/components/schemas/ViolationPayload'
        description: Pipeline / violation event payload.
      - $ref: '#/components/schemas/ApprovalPayload'
        description: Approval request event payload.
      - $ref: '#/components/schemas/BudgetAlertPayload'
        description: Budget threshold alert payload.
      - $ref: '#/components/schemas/OpsChangePayload'
        description: In-flight ops registry state-transition payload (AAASM-1422 PR-B).
      description: |-
        Discriminated union of all possible `GovernanceEvent.payload` shapes.

        The concrete variant is determined by the sibling `event_type` field:
        - `"violation"` → [`ViolationPayload`]
        - `"approval"` → [`ApprovalPayload`]
        - `"budget"` → [`BudgetAlertPayload`]
        - `"ops_change"` → [`OpsChangePayload`]
    EventType:
      type: string
      description: |-
        Classification of governance events for client-side filtering.

        Clients specify a comma-separated list of these values in the `types`
        query parameter to receive only matching events on the WebSocket.
      enum:
      - violation
      - approval
      - budget
      - ops_change
    FleetActiveSessionResponse:
      type: object
      description: |-
        A currently-open agent session in the fleet-wide active-sessions listing
        (AAASM-5038).

        Enriches the per-agent [`ActiveSessionResponse`] with the owning agent's
        identity so the dashboard Fleet → Active Sessions tab can render one flat,
        fleet-wide table without a second lookup. `actions_count` is now sourced
        from real gateway traffic (AAASM-5088): each CheckAction / BatchCheck the
        gateway evaluates for the session increments it. `current_task` from the
        design mock stays omitted — the session layer has no real source for a task
        label, and this endpoint surfaces only state that already exists.
      required:
      - agent_id
      - agent_name
      - session_id
      - started_at
      - status
      - actions_count
      properties:
        actions_count:
          type: integer
          format: int32
          description: Number of governed actions observed on this session so far (AAASM-5088).
          minimum: 0
        agent_id:
          type: string
          description: Hex-encoded UUID of the agent that owns the session.
        agent_name:
          type: string
          description: Human-readable name of the owning agent.
        session_id:
          type: string
          description: Hex-encoded session UUID.
        started_at:
          type: string
          description: ISO 8601 timestamp when the session started.
        status:
          type: string
          description: Current status of the session (e.g. "running", "idle").
        team_id:
          type:
          - string
          - 'null'
          description: Team the owning agent belongs to, if any.
    FleetHealthResponse:
      type: object
      description: Response for `GET /api/v1/analytics/fleet-health`.
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentHealth'
          description: One entry per agent the caller may see.
    ForwardRequest:
      type: object
      description: Request body for the forward/reassign action (AAASM-5095).
      required:
      - to
      properties:
        by:
          type:
          - string
          - 'null'
          description: |-
            Identity of the operator performing the forward. Optional; recorded for
            audit context.
        reason:
          type:
          - string
          - 'null'
          description: Optional reason for the reassignment.
        to:
          type: string
          description: Approver identifier (user id or role) to reassign the request to.
    GenerateApiKeyRequest:
      type: object
      required:
      - label
      - scopes
      properties:
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScopeResponse'
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            AAASM-5177 — optional time-to-live in seconds. When omitted, the server
            applies [`DEFAULT_API_KEY_TTL_SECS`] (a safe, bounded default) rather than
            issuing a non-expiring key. Must be positive; `0` is rejected.
          minimum: 0
    GeneratedApiKeyResponse:
      type: object
      description: |-
        One-shot reveal shape returned by generate / rotate. `secret` MUST be
        captured by the caller — the server does not store it.
      required:
      - id
      - prefix
      - secret
      properties:
        id:
          type: string
        prefix:
          type: string
        secret:
          type: string
    GovernanceEvent:
      type: object
      description: |-
        A governance event delivered to WebSocket subscribers.

        This is the unified JSON representation sent over the wire.
        It wraps events from all three domain channels (pipeline,
        approval, budget) into a single schema that clients can
        filter by [`EventType`].
      required:
      - id
      - event_type
      - agent_id
      - payload
      - timestamp
      properties:
        agent_id:
          type: string
          description: Agent that produced or is associated with the event.
        event_type:
          $ref: '#/components/schemas/EventType'
          description: Classification of the event for client-side filtering.
        id:
          type: integer
          format: int64
          description: Monotonically increasing event identifier.
          minimum: 0
        payload:
          $ref: '#/components/schemas/EventPayload'
          description: |-
            Event-specific payload whose schema depends on `event_type`:
            `ViolationPayload`, `ApprovalPayload`, or `BudgetAlertPayload`.
        timestamp:
          type: string
          description: Timestamp when the event was received by the API layer (ISO 8601).
    GraphNode:
      type: object
      description: A node in the topology subgraph.
      required:
      - id
      properties:
        id:
          type: string
          description: Hex-encoded agent ID.
    GraphResponse:
      type: object
      description: Subgraph reachable from an agent within a depth bound.
      required:
      - root_agent_id
      - nodes
      - edges
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResponse'
          description: All edges between nodes in this subgraph.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
          description: All unique agent nodes reachable within `depth` hops.
        root_agent_id:
          type: string
          description: Root agent ID used for the BFS.
    HealthPoint:
      type: object
      description: 'A single fleet-health sample: `t` epoch milliseconds, `score` 0–100.'
      required:
      - t
      - score
      properties:
        score:
          type: integer
          format: int64
          description: Health score in `[0, 100]`.
        t:
          type: integer
          format: int64
          description: Epoch-millisecond timestamp of the sample.
    HealthResponse:
      type: object
      description: Response body for the health endpoint.
      required:
      - status
      - version
      - api_version
      - uptime_secs
      - active_connections
      - pipeline_lag_ms
      - checks
      properties:
        active_connections:
          type: integer
          format: int64
          description: Number of currently active WebSocket/SSE connections.
        api_version:
          type: string
          description: API version prefix (e.g. `"v1"`).
        checks:
          type: object
          description: Per-subsystem health status. Each value is `"ok"` or `"degraded"`.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        pipeline_lag_ms:
          type: integer
          format: int64
          description: Pipeline processing lag in milliseconds (placeholder, always 0 for now).
          minimum: 0
        status:
          type: string
          description: 'Liveness status string: `"ok"` when all subsystems healthy, `"degraded"` otherwise.'
        uptime_secs:
          type: integer
          format: int64
          description: Server uptime in seconds since startup.
          minimum: 0
        version:
          type: string
          description: Gateway version (semver from Cargo.toml).
    InviteAcceptRequest:
      type: object
      description: Request body for `POST /auth/invite/accept`.
      required:
      - token
      - password
      properties:
        password:
          type: string
          description: The initial password to set on the account (must clear the floor).
        token:
          type: string
          description: The raw invite token delivered to the invitee.
    InviteRequest:
      type: object
      description: Request body for `POST /auth/invite` (admin only).
      required:
      - email
      - role
      properties:
        email:
          type: string
          description: The email to invite.
        role:
          $ref: '#/components/schemas/Role'
          description: The role the invited account will receive on accept.
    InviteResponse:
      type: object
      description: |-
        Response body for `POST /auth/invite`. The raw invite token is returned once
        to the inviting admin to deliver out of band; only its hash is stored.
      required:
      - invite_id
      - token
      properties:
        invite_id:
          type: string
          description: The created invite id (UUID string).
        token:
          type: string
          description: |-
            The single-use, expiring raw invite token. Returned exactly once, here;
            the server stores only its SHA-256 hash and can never surface it again.
    KpiResponse:
      type: object
      description: |-
        Response for `GET /api/v1/analytics/kpis` — a single scalar KPI plus the
        fractional change versus the previous equivalent window.
      required:
      - metric
      - value
      - delta
      properties:
        delta:
          type: number
          format: double
          description: |-
            Fractional change vs the previous equivalent window
            (`0.12` = +12%). `0.0` when no prior window is available.
        metric:
          type: string
          description: Echo of the requested metric key.
        unit:
          type:
          - string
          - 'null'
          description: Unit hint for the value (e.g. `USD`, `ms`), when meaningful.
        value:
          type: number
          format: double
          description: Current value of the metric over the requested window.
    LineageStep:
      type: object
      description: |-
        One step in an agent's ancestry chain.

        # Example JSON
        ```json
        { "id": "root000000000000root000000000000", "name": "root", "depth": 0, "delegation_reason": null, "team_id": null }
        ```
      required:
      - id
      - name
      - depth
      properties:
        delegation_reason:
          type:
          - string
          - 'null'
          description: Reason the next agent in the chain was delegated from this node.
        depth:
          type: integer
          format: int32
          description: Delegation depth of this node.
          minimum: 0
        id:
          type: string
          description: Hex-encoded UUID of this ancestor (or the subject agent).
        name:
          type: string
          description: Human-readable name.
        team_id:
          type:
          - string
          - 'null'
          description: Team this node belongs to.
      example:
        delegation_reason: null
        depth: 0
        id: root000000000000root000000000000
        name: root
        team_id: null
    LogEntry:
      type: object
      description: JSON representation of an audit log entry.
      required:
      - seq
      - timestamp
      - agent_id
      - session_id
      - event_type
      - payload
      properties:
        agent_id:
          type: string
          description: Hex-encoded agent ID that produced this log entry.
        event_type:
          $ref: '#/components/schemas/LogEventType'
          description: Type of audit event.
        payload:
          type: string
          description: Pre-serialized JSON payload.
        seq:
          type: integer
          format: int64
          description: Monotonic sequence number within the session.
          minimum: 0
        session_id:
          type: string
          description: Hex-encoded session ID for the agent run.
        timestamp:
          type: string
          description: ISO 8601 timestamp of the event.
    LogEventType:
      type: string
      description: |-
        Category of an audit log entry, mirroring [`aa_core::AuditEventType`].

        AAASM-5221 — constrains the [`LogEntry::event_type`] wire vocabulary to the
        closed set of labels [`AuditEventType::as_str`] emits, so the generated
        OpenAPI spec advertises an enum rather than a free-form `string`. Variants
        serialize verbatim (PascalCase), matching the strings the audit log has
        always written, so the wire shape is unchanged.

        Kept in lock-step with `AuditEventType`: the [`From`] impl is exhaustive, so
        adding an audit variant without extending this enum is a compile error.
      enum:
      - ToolCallIntercepted
      - PolicyViolation
      - CredentialLeakBlocked
      - ApprovalRequested
      - ApprovalGranted
      - ApprovalDenied
      - BudgetLimitApproached
      - BudgetLimitExceeded
      - ApprovalTimedOut
      - ApprovalRouted
      - ApprovalEscalated
      - AgentForceDeregistered
      - MessageBlocked
      - ToolDispatched
      - A2ACallIntercepted
      - A2AImpersonationAttempted
      - SandboxStarted
      - SandboxFilesystemBlocked
      - SandboxCpuTimeout
      - SandboxOomKilled
      - SandboxTerminated
      - SandboxHostFnRateLimited
      - GovernanceMutation
    LoginRequest:
      type: object
      description: Request body for `POST /auth/login`.
      required:
      - email
      - password
      properties:
        email:
          type: string
          description: The account email (case-insensitive).
        password:
          type: string
          description: The account password.
        remember_me:
          type: boolean
          description: When true, the refresh session is issued with an extended lifetime.
    NodeBudget:
      type: object
      description: |-
        Per-agent daily budget projection for a topology node (AAASM-5045).

        A slim read-only view of the gateway `BudgetTracker` state for one agent —
        the same source the `/api/v1/costs` per-agent
        breakdown reads. `spend_usd` is today's accrued spend (0 when the agent has
        no accrual yet); `limit_usd` is the agent's effective daily limit
        (per-agent override, else the server-wide daily limit) or `null` when no
        limit is configured. Emitted as `f64` (not the tracker's `Decimal`) because
        the dashboard budget bar renders numbers directly — the two decimals of a
        USD amount are well within `f64`'s exact range.

        # Example JSON
        ```json
        { "spend_usd": 4.10, "limit_usd": 100.0 }
        ```
      required:
      - spend_usd
      properties:
        limit_usd:
          type:
          - number
          - 'null'
          format: double
          description: |-
            Effective daily budget limit in USD (per-agent override, else the
            server-wide daily limit), or `null` when no limit is configured.
        spend_usd:
          type: number
          format: double
          description: Daily spend accrued for this agent today, in USD.
      example:
        limit_usd: 100.0
        spend_usd: 4.1
    NodeEffectivePermissions:
      type: object
      description: |-
        The policy cascade that governs one agent, with per-tier provenance
        (AAASM-5099) — the data behind the node-detail Policy-Inheritance panel.

        `chain` is the `Global → Org → Team → Agent` walk, broadest first. `allow` /
        `deny` are the capability set that walk produces after the *earlier*
        enforcement stages are folded in — a capability blocked by the network or
        tool stage appears in `deny` and never in `allow`, even though the merged
        capability set alone says nothing about it. See
        `routes::topology::project_effective_permissions` for exactly which stages are
        mirrored and which cannot be.

        Two consequences for a reader of this payload:

        * `allow_restricted` must be read together with `allow`: an empty `allow` with
          `allow_restricted = true` is deny-all, not "unrestricted" (AAASM-4154).
        * Absence from `deny` is **not** a grant. A `tools: { "*": { allow: false } }`
          cascade denies tools that have never been named, and no list can enumerate
          them.

        The hi-fi mock (`design/v1/hi-fi/topology.jsx`) additionally draws a
        "parent" row. There is no parent tier in the product's scope vocabulary
        (`aa_gateway::policy::scope::PolicyScope` is `Global | Org | Team | Agent |
        Tool`) — a parent agent's own `agent:`-scoped policies are not inherited by
        its children — so no parent row is emitted rather than fabricating one.

        Distinct from `agents::EffectivePermissionsResponse`
        (`GET /api/v1/agents/{id}/capabilities`), which lists one row per *document*
        that declares capabilities. This one lists one row per *tier* — including a
        tier that carries no policy, which is what the panel renders as "no team
        policy" — and is embedded per node so the graph needs no per-agent fan-out.

        # Example JSON
        ```json
        {
          "chain": [{ "tier": "global", "scope": "global", "policies": ["baseline"] }],
          "allow": ["file_read"],
          "deny": ["terminal_exec"],
          "allow_restricted": true
        }
        ```
      required:
      - chain
      - allow
      - deny
      - allow_restricted
      - cascade_loaded
      properties:
        allow:
          type: array
          items:
            type: string
          description: |-
            Capabilities the merged cascade explicitly allows, canonical wire names
            (`file_read`, `mcp_tool:<name>`, …), sorted.
        allow_restricted:
          type: boolean
          description: |-
            Whether an allow-list restriction is in force — anything absent from
            `allow` is denied, even when `allow` is empty.
        cascade_loaded:
          type: boolean
          description: |-
            Whether the projecting engine actually carries a policy cascade
            (`PolicyEngine::cascade_loaded`). AAASM-5106 / ADR 0024: with no cascade
            loaded — every shipped aa-api deployment — the walk resolves nothing, so
            every tier's `policies` is empty and `allow` / `deny` are empty. That is
            **not** the real permission set: enforcement falls back to the primary
            policy slot this projection cannot enumerate. `false` here is the
            loaded/unavailable signal the dashboard renders as "policy inheritance
            unknown — cascade not loaded", so an empty chain never reads as a real
            "no policies apply". Distinct from a *loaded* cascade whose walk carries no
            document at a tier, which is real state ("no team policy"). This changes
            no enforcement; it only annotates the projection's confidence in its own
            output.

            Required-but-always-present, matching `AgentNode`'s null discipline for
            unmeasured fields: the key is always on the wire so a client cannot read
            an empty chain as authoritative by omission.
        chain:
          type: array
          items:
            $ref: '#/components/schemas/PolicyChainTier'
          description: Cascade tiers that apply to this agent, broadest → narrowest.
        deny:
          type: array
          items:
            type: string
          description: |-
            Capabilities the merged cascade explicitly denies, canonical wire names,
            sorted.
      example:
        allow:
        - file_read
        allow_restricted: true
        cascade_loaded: true
        chain:
        - policies:
          - baseline
          scope: global
          tier: global
        deny:
        - terminal_exec
    OpActionAck:
      type: object
      description: |-
        Acknowledgement returned by the per-op lifecycle endpoints.

        The fields are deliberately minimal — they document what the
        gateway received, not the resulting state (which the dashboard
        observes via the WebSocket event stream).
      required:
      - op_id
      - action
      - accepted_at
      properties:
        accepted_at:
          type: string
          description: Server-side timestamp when the request was accepted (RFC 3339).
        action:
          type: string
          description: Action that was requested — one of `"pause"`, `"resume"`, `"terminate"`.
        op_id:
          type: string
          description: Operation id from the URL path.
    OpHaltAck:
      type: object
      description: Acknowledgement returned by the agent-wide / global halt endpoints.
      required:
      - scope
      - target
      - action
      - accepted_at
      properties:
        accepted_at:
          type: string
          description: Server-side timestamp when the halt was accepted (RFC 3339).
        action:
          type: string
          description: Action that was emitted — one of `"pause"`, `"resume"`, `"terminate"`.
        scope:
          type: string
          description: Halt scope — `"agent"` for an agent-wide halt, `"global"` for fleet-wide.
        target:
          type: string
          description: Targeted agent id for an agent-scoped halt; empty for a global halt.
    OpHaltRequest:
      type: object
      description: |-
        Request body for the operator kill-switch endpoints
        ([`halt_agent_for_op`], [`halt_global`]).
      required:
      - action
      properties:
        action:
          type: string
          description: Signal to emit — one of `"pause"`, `"resume"`, `"terminate"`.
    OpRecord:
      type: object
      description: Snapshot of a registered operation returned by the registry and API.
      required:
      - op_id
      - state
      - registered_at
      - updated_at
      properties:
        op_id:
          type: string
          description: Stable identifier supplied at registration time.
        registered_at:
          type: string
          description: RFC 3339 timestamp when the op was first registered.
        state:
          $ref: '#/components/schemas/OpState'
          description: Current lifecycle state.
        updated_at:
          type: string
          description: RFC 3339 timestamp of the most recent state change.
    OpState:
      type: string
      description: Lifecycle state of a registered in-flight operation.
      enum:
      - pending
      - running
      - paused
      - completing
      - terminated
    OpsChangePayload:
      type: object
      description: |-
        Payload for `event_type: "ops_change"` events.

        Emitted on every transition of an in-flight operation in the
        gateway-side [`aa_gateway::ops::OpsRegistry`] (AAASM-1422 PR-B).
        The dashboard's `useLiveOpsStream` hook correlates rows by `op_id`
        (composed from `trace_id:span_id`) and updates the matching row in
        place, so a `pause` followed by the confirming `paused` event
        auto-clears any optimistic override.

        Actual emission on registry transitions ships in PR-H. PR-B only
        defines the payload shape so PR-C (dashboard rework) and PR-H
        (gateway emission) can build against a stable schema in parallel.

        Agent attribution travels on the enclosing
        [`super::event::GovernanceEvent::agent_id`] — same convention as
        `ViolationPayload`, `ApprovalPayload`, and `BudgetAlertPayload`.
      required:
      - op_id
      - state
      - updated_at
      properties:
        op_id:
          type: string
          description: |-
            Stable operation identifier — `"{trace_id}:{span_id}"` composed
            in the gateway. The dashboard keys its row map by this value so
            successive `ops_change` events for the same op merge into one
            row instead of stacking.
        state:
          type: string
          description: |-
            New lifecycle state after the transition. Mirrors the
            `aa_gateway::ops::OpState` enum (snake_case wire format:
            `pending` / `running` / `paused` / `completing` / `terminated`).
          example: running
        updated_at:
          type: string
          description: |-
            RFC 3339 UTC timestamp of the transition. Same value as the
            matching `OpRecord.updated_at` returned by the registry.
    OverrideRecord:
      type: object
      description: |-
        A recorded capability override entry returned by
        `GET /api/v1/capability/override`.

        Each `POST /capability/override` call that successfully mutates at least
        one cell appends one of these records. The log is in-memory and lives as
        long as the server process; TTL-based expiry is not yet implemented.
      required:
      - id
      - agentIds
      - resourceId
      - verb
      - decision
      - createdAt
      - active
      properties:
        active:
          type: boolean
          description: |-
            Whether the override is still replayed over the projection. Set to
            `false` by an explicit `DELETE /capability/override/{id}` or by the TTL
            timer firing; entries are never removed, so a revoked override stays
            visible in the log with `active: false`.
        agentIds:
          type: array
          items:
            type: string
          description: Agent identifiers this override was applied to.
        createdAt:
          type: string
          description: ISO 8601 UTC timestamp when the override was applied.
        decision:
          $ref: '#/components/schemas/Decision'
          description: New decision recorded for that (resource, verb) pair.
        id:
          type: string
          description: Unique identifier for this override entry (UUID v4).
        resourceId:
          type: string
          description: Resource whose cell was overridden.
        verb:
          $ref: '#/components/schemas/Verb'
          description: Verb within the cell that was changed.
    PaginatedAgentResponse:
      type: object
      description: |-
        Paginated `GET /api/v1/agents` body (AAASM-4892).

        A named wrapper (mirroring `PaginatedApprovalResponse`) so the OpenAPI schema
        `$ref`s `AgentResponse` and matches the `{ items, total }` object the handler
        actually serializes — not the bare array a generic `Vec<T>` annotation implied.
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
          description: Agents in the current page.
        page:
          type: integer
          format: int32
          description: 1-indexed page number echoed from the request.
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Items per page echoed from the request.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total agents visible to the caller across all pages.
          minimum: 0
    PaginatedAlertResponse:
      type: object
      description: |-
        Paginated `GET /api/v1/alerts` body (AAASM-4892) — a named wrapper so the
        OpenAPI schema `$ref`s `AlertResponse` and matches the `{ items, total }`
        object the handler serializes, not a bare array.
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertResponse'
          description: Alerts in the current page.
        page:
          type: integer
          format: int32
          description: 1-indexed page number echoed from the request.
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Items per page echoed from the request.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total alerts visible to the caller across all pages.
          minimum: 0
    PaginatedApprovalResponse:
      type: object
      description: |-
        Paginated wire-format envelope for `GET /api/v1/approvals`.

        Mirrors the JSON shape produced by [`PaginatedResponse<ApprovalResponse>`]
        — `{items, page, per_page, total}` — but is declared as a concrete,
        non-generic type so utoipa can register it as a named component schema
        and downstream codegen (the dashboard `openapi-typescript` step) sees
        a typed envelope rather than a bare array. Introduced to close the
        drift between the handler's runtime body and the OpenAPI contract
        flagged by AAASM-1922; the other paginated list endpoints
        (`list_agents`, `list_alerts`, `list_policies`, `list_logs`) carry the
        same drift and will be addressed independently.
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalResponse'
          description: Items in the current page.
        page:
          type: integer
          format: int32
          description: 1-indexed page number echoed from the request.
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Items per page echoed from the request.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of items across all pages (after filters).
          minimum: 0
    PaginatedLogResponse:
      type: object
      description: |-
        Paginated `GET /api/v1/logs` body (AAASM-4892) — a named wrapper so the
        OpenAPI schema `$ref`s `LogEntry` and matches the `{ items, total }` object
        the handler serializes, not a bare array.
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          description: Audit log entries in the current page.
        page:
          type: integer
          format: int32
          description: 1-indexed page number echoed from the request.
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Items per page echoed from the request.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total entries matching the filter across all pages.
          minimum: 0
    PaginatedPolicyResponse:
      type: object
      description: |-
        Paginated `GET /api/v1/policies` body (AAASM-4892) — a named wrapper so the
        OpenAPI schema `$ref`s `PolicyResponse` and matches the `{ items, total }`
        object the handler serializes, not a bare array.
      required:
      - items
      - page
      - per_page
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyResponse'
          description: Policy versions in the current page.
        page:
          type: integer
          format: int32
          description: 1-indexed page number echoed from the request.
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Items per page echoed from the request.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total policy versions across all pages.
          minimum: 0
    PasswordResetConfirmRequest:
      type: object
      description: Request body for `POST /auth/password/reset/confirm` (ADR 0031 §Q4).
      required:
      - token
      - new_password
      properties:
        new_password:
          type: string
          description: The new password to set (must clear the minimum-length floor).
        token:
          type: string
          description: |-
            The raw reset token delivered by email. Only its hash is stored server-
            side; this is checked against that hash and consumed single-use.
    PasswordResetRequest:
      type: object
      description: Request body for `POST /auth/password/reset` (ADR 0031 §Q4).
      required:
      - email
      properties:
        email:
          type: string
          description: |-
            The account email to send a reset link to (case-insensitive). Whether it
            exists is never revealed — the response is always `202`.
    PatternCount:
      type: object
      description: A per-kind hit count within the queried window.
      required:
      - kind
      - hits
      properties:
        hits:
          type: integer
          format: int64
          description: Number of `secret_detected` alerts of this kind in the window.
          minimum: 0
        kind:
          type: string
          description: |-
            Detected credential kind, e.g. `"AwsAccessKey"`. This is the
            `detected_pattern_type` recorded on each `secret_detected` alert.
    PatternCountsResponse:
      type: object
      description: Response for `GET /api/v1/scrub/pattern-counts`.
      required:
      - counts
      - total_hits
      - window_seconds
      properties:
        counts:
          type: array
          items:
            $ref: '#/components/schemas/PatternCount'
          description: |-
            Per-kind counts, ordered by kind. Only kinds that fired at least once in
            the window appear (an idle window yields an empty list — no fabricated
            activity).
        total_hits:
          type: integer
          format: int64
          description: Total `secret_detected` alerts counted across all kinds in the window.
          minimum: 0
        window_seconds:
          type: integer
          format: int64
          description: Length of the aggregation window in seconds.
          minimum: 0
    PermissionSourceResponse:
      type: object
      description: Per-scope contribution to an agent's effective permissions.
      required:
      - scope
      - allow
      - deny
      properties:
        allow:
          type: array
          items:
            type: string
          description: Capability identifiers this scope explicitly allows.
        deny:
          type: array
          items:
            type: string
          description: Capability identifiers this scope explicitly denies.
        scope:
          type: string
          description: Wire-format scope label (e.g. `"global"`, `"team:platform"`).
    Policy:
      type: object
      description: A policy version shown in the dashboard Capability Matrix's policies tab.
      required:
      - id
      - name
      - scope
      - status
      - affects
      - rules
      properties:
        affects:
          type: array
          items:
            type: string
          description: Ids of the agents whose cascade includes this policy scope.
        hits24h:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Number of times this policy document fired in the last 24 hours.

            Sourced (AAASM-5107) by joining this row's document content digest against
            the per-document decision counts from the last-24h audit window — each
            policy decision records the deciding document's digest on its audit entry.
            Absent, never `0`, when the document recorded no decision in the window: a
            `0` would be indistinguishable from "fired zero times".
          minimum: 0
        id:
          type: string
        name:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        scope:
          type: string
        status:
          $ref: '#/components/schemas/PolicyStatus'
        version:
          type:
          - string
          - 'null'
          description: |-
            Revision from the policy document's `metadata.version`. Absent for
            documents parsed from the flat (non-envelope) format, which declare none.
    PolicyChainTier:
      type: object
      description: |-
        One scope tier of an agent's policy-inheritance chain (AAASM-5099).

        A tier is emitted only when the agent actually has that selector: an agent
        with no `org_id` has no Org tier, so no Org row appears. The `Tool` tier is
        deliberately absent — it is selected per *action* (see
        `aa_gateway::engine::action_tool_name`), not per agent, so there is no
        agent-level answer to project.

        # Example JSON
        ```json
        { "tier": "team", "scope": "team:platform", "policies": ["team-baseline"] }
        ```
      required:
      - tier
      - scope
      - policies
      properties:
        policies:
          type: array
          items:
            type: string
          description: |-
            Names of the loaded policy documents at this tier, in cascade order.
            Empty when the tier applies to the agent but carries no policy — that is
            real state ("no team policy"), not missing data.
        scope:
          type: string
          description: |-
            Wire-format scope selector this tier resolves to, e.g. `team:platform`
            — the same string `PolicyScope`'s `Display` produces, so it matches the
            `scope` a policy document declares.
        tier:
          type: string
          description: 'Cascade tier: `global`, `org`, `team`, or `agent`.'
      example:
        policies:
        - team-baseline
        scope: team:platform
        tier: team
    PolicyDay:
      type: object
      description: Per-rule, per-day policy outcome counts.
      required:
      - date
      - blocks
      - warns
      - passes
      properties:
        blocks:
          type: integer
          format: int64
          description: Blocked evaluations (policy violations / denies) for the rule that day.
          minimum: 0
        date:
          type: string
          description: UTC calendar date (`YYYY-MM-DD`).
        passes:
          type: integer
          format: int64
          description: Passed (allowed) evaluations for the rule that day.
          minimum: 0
        warns:
          type: integer
          format: int64
          description: Warned (shadow / dry-run) evaluations for the rule that day.
          minimum: 0
    PolicyEffectivenessResponse:
      type: object
      description: Response for `GET /api/v1/analytics/policy-effectiveness`.
      required:
      - rules
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleStat'
          description: One entry per policy rule that recorded at least one evaluation.
    PolicyResponse:
      type: object
      description: JSON representation of a governance policy version.
      required:
      - name
      - version
      - active
      - rule_count
      - policy_yaml
      properties:
        active:
          type: boolean
          description: Whether this is the currently active policy.
        affects:
          type:
          - array
          - 'null'
          items:
            type: string
          description: |-
            Names of the agents this policy version is in force for — the agents
            whose live policy cascade carries this document (AAASM-5096).

            Absent, never `[]`, when the version is not in force for any agent the
            caller may see: an archived version, or one whose document the running
            engine does not carry. `[]` would assert "this policy targets nobody",
            which is a different and stronger claim than "not currently loaded".
        hits24h:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Number of times this policy document fired in the last 24 hours.

            Sourced (AAASM-5107) by joining this row's document content digest against
            the per-document decision counts tallied from the last-24h audit window —
            each policy decision now records the deciding document's digest on its
            audit entry (`AuditEntry::policy_doc_id`, stamped at the enforcement
            boundary from `PolicyDocument::content_digest`). The digest distinguishes
            two versions of the same `(scope, name)` pair.

            **Absent, never `0`.** A document that recorded no decision in the window,
            a row whose snapshot cannot be parsed to a digest, or a key shared by two
            distinct live documents (no single "the" document to count) all report
            absent — preserving the absent-vs-"fired zero times" distinction
            AAASM-5096 established. The same sourcing applies to the capability
            matrix's `Policy.hits24h`.
          minimum: 0
        name:
          type: string
          description: Policy name from metadata.
        policy_yaml:
          type: string
          description: |-
            Raw YAML content of this policy version. Empty string when the
            underlying snapshot is not retrievable from the history store
            (e.g. a policy loaded at startup before any history entry exists).
        rule_count:
          type: integer
          description: Number of rules in this policy version.
          minimum: 0
        version:
          type: string
          description: Policy version string.
    PolicyRule:
      type: object
      description: |-
        A single rule inside a policy — resource, verbs scoped, action, and an
        optional condition expression.
      required:
      - resource
      - verb
      - action
      - condition
      properties:
        action:
          type: string
        condition:
          type: string
        resource:
          type: string
        verb:
          type: array
          items:
            $ref: '#/components/schemas/Verb'
    PolicyRuleStat:
      type: object
      description: One policy rule's daily effectiveness series.
      required:
      - id
      - name
      - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/PolicyDay'
          description: Per-day outcome counts, ordered by date ascending.
        id:
          type: string
          description: Rule identifier (from the audit payload `policy_rule`).
        name:
          type: string
          description: Human-readable rule name (equals the id in v1).
    PolicyStatus:
      type: string
      description: Lifecycle status of a policy version in the capability view.
      enum:
      - active
      - proposed
      - archived
    PostureResponse:
      type: object
      description: |-
        Response for `GET /api/v1/scrub/posture`.

        The v1 leak-posture figure is the count of distinct outbound payloads that
        the gateway's credential scanner **caught and redacted** in the window —
        i.e. the number of `secret_detected` alerts. This is a real, defensible
        "leaks intercepted" figure derived entirely from persisted alerts.

        A *leak-rate* (leaks caught ÷ payloads scanned) is deliberately **not**
        reported: the alert store persists only the detections, not the denominator
        of total payloads scanned, so a rate could not be computed without inventing
        the denominator. When that denominator is unavailable the rate fields are
        surfaced as explicitly absent (`leak_rate: null`, `rate_computed: false`)
        rather than fabricated.
      required:
      - leaks_intercepted
      - distinct_kinds
      - rate_computed
      - window_seconds
      properties:
        distinct_kinds:
          type: integer
          format: int64
          description: Number of distinct credential kinds observed leaking in the window.
          minimum: 0
        leak_rate:
          type:
          - number
          - 'null'
          format: double
          description: |-
            Fraction of scanned payloads that contained a leak, or `null` when it is
            not computable from the available state (see the type doc). Never
            fabricated.
        leaks_intercepted:
          type: integer
          format: int64
          description: |-
            Number of outbound payloads that were caught and redacted in the window
            (count of `secret_detected` alerts). Always a real figure.
          minimum: 0
        rate_computed:
          type: boolean
          description: |-
            Whether [`leak_rate`](Self::leak_rate) was computable. `false` today
            because the total-payloads-scanned denominator is not persisted.
        window_seconds:
          type: integer
          format: int64
          description: Length of the posture window in seconds.
          minimum: 0
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details JSON body.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Human-readable explanation specific to this occurrence.
        error_code:
          type:
          - string
          - 'null'
          description: |-
            Stable machine-readable error code (e.g. `"invalid_threshold"`)
            for clients that need to branch on the specific failure
            without parsing the human-readable `detail`. Omitted from the
            wire when unset so existing endpoints stay byte-identical.

            Codes are static identifiers — `&'static str` keeps the struct
            small enough that handlers returning `Result<_, ProblemDetail>`
            stay under clippy's `result_large_err` threshold.
        instance:
          type:
          - string
          - 'null'
          description: URI reference identifying the specific occurrence.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 0
        title:
          type: string
          description: Short human-readable summary.
        type:
          type: string
          description: URI reference identifying the problem type.
      example:
        detail: 'No route matched: /unknown'
        instance: /unknown
        status: 404
        title: Not Found
        type: about:blank
    QuorumApproverStatus:
      type: object
      description: Response state of a single approver in a multi-approver quorum (AAASM-5095).
      required:
      - approver
      - status
      properties:
        approver:
          type: string
          description: Approver identifier (user id or role) participating in the quorum.
        status:
          type: string
          description: |-
            This approver's response so far: `"pending"`, `"approved"`, or
            `"rejected"`. Never fabricated — reflects the approver's real recorded
            response.
    QuorumStatus:
      type: object
      description: |-
        Multi-approver quorum status for an approval request (AAASM-5095).

        Present **only** when the approval is a quorum approval (more than one
        approver is required). It carries a truthful "`responded` of `required`
        responded" tally plus the per-approver breakdown — the counts always
        reflect real approver responses and are never fabricated. Absent
        (serialized as omitted) for single-target approvals.

        NOTE: full N-approver quorum *enforcement* (gateway-side routing that
        blocks resolution until the quorum is met) is scoped as a follow-up. This
        type is the wire contract; until the gateway can supply real per-approver
        responses the field is emitted as absent rather than with a fabricated
        count.
      required:
      - required
      - responded
      - approvers
      properties:
        approvers:
          type: array
          items:
            $ref: '#/components/schemas/QuorumApproverStatus'
          description: Per-approver response breakdown. Length is the quorum size.
        required:
          type: integer
          format: int32
          description: Number of approver responses required to satisfy the quorum (N).
          minimum: 0
        responded:
          type: integer
          format: int32
          description: |-
            Number of approvers that have responded so far — a real count of the
            entries in `approvers` whose status is not `"pending"`. Never a
            fabricated value.
          minimum: 0
    RecentActivityResponse:
      type: object
      required:
      - id
      - timestamp
      - action
      - target
      properties:
        action:
          type: string
        id:
          type: string
        target:
          type: string
        timestamp:
          type: string
    RecentEventResponse:
      type: object
      description: Summary of a recent event in the API response.
      required:
      - event_type
      - summary
      - timestamp
      properties:
        event_type:
          type: string
          description: Event type classification (e.g. "violation", "approval", "budget").
        summary:
          type: string
          description: Short human-readable summary.
        timestamp:
          type: string
          description: ISO 8601 timestamp when the event occurred.
    RecentTraceResponse:
      type: object
      description: Summary of a recent trace session for an agent.
      required:
      - session_id
      - timestamp
      properties:
        session_id:
          type: string
          description: Hex-encoded session UUID, usable with `aasm trace <session-id>`.
        timestamp:
          type: string
          description: ISO 8601 timestamp when the trace session started.
    RegisterOpRequest:
      type: object
      description: Request body for `POST /api/v1/ops` — register a new in-flight operation.
      required:
      - op_id
      properties:
        op_id:
          type: string
          description: Stable identifier for the operation, typically a `GovernanceEvent.id`.
    RegisterRequest:
      type: object
      description: Request body for `POST /auth/register`.
      required:
      - email
      - password
      properties:
        email:
          type: string
          description: |-
            The new account email (case-insensitive). OSS is single-workspace, so no
            `tenant_name` is accepted (ADR 0031 §4).
        password:
          type: string
          description: The new account password (must clear the minimum-length floor).
    RegisterResponse:
      type: object
      description: Response body for a successful `POST /auth/register`.
      required:
      - user_id
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
          description: |-
            The short-lived access JWT for the bootstrap owner (the refresh token is
            delivered as the HttpOnly cookie alongside).
        expires_in:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
          minimum: 0
        user_id:
          type: string
          description: The id of the newly created account (UUID string).
    ReplayPolicyRequest:
      type: object
      description: |-
        Request body for `POST /api/v1/policies/replay` (AAASM-5094).

        Describes a *proposed* (unloaded) policy plus the corpus window to replay it
        against. Nothing here is persisted and the proposed policy is never applied —
        it is a pure, read-only what-if over recorded traffic.
      required:
      - policy_yaml
      properties:
        policy_yaml:
          type: string
          description: |-
            Proposed policy document as raw YAML. Parsed and validated exactly like a
            `create_policy` body, but evaluated through an ephemeral engine
            ([`aa_gateway::engine::PolicyEngine::simulate_against`]) so it is never
            loaded, applied, or persisted.
        sample_size:
          type:
          - integer
          - 'null'
          description: |-
            Maximum number of per-request before/after sample diffs to return.
            Defaults to [`REPLAY_DEFAULT_SAMPLE_SIZE`], capped at
            [`REPLAY_MAX_SAMPLE_SIZE`]. Does not affect the aggregate counts, which
            always reflect the whole replayed corpus.
          minimum: 0
        window_hours:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            How many hours of recent recorded traffic to replay. Defaults to
            [`REPLAY_DEFAULT_WINDOW_HOURS`] (24h) when omitted. The read is bounded to
            the most recent [`REPLAY_MAX_EVENTS`] events within the window.
          minimum: 0
    ReplayPolicyResponse:
      type: object
      description: |-
        Response body for `POST /api/v1/policies/replay` (AAASM-5094).

        Aggregate impact of the proposed policy over the replayed corpus, plus a
        bounded sample of the per-request verdict changes. Every count is a real
        tally of re-evaluating recorded actions — an empty corpus yields all-zero
        counts and no samples, never a fabricated figure.

        ## Fidelity caveat

        The audit log deliberately persists only non-secret action *metadata* (tool
        name, path, host) and never the raw tool arguments/target
        (`aa_runtime::audit_publisher::conversion::build_payload`). Replay therefore
        reconstructs each action from its persisted tool name with **empty
        arguments**, so target-sensitive predicates and the credential/PII scrubber
        cannot be re-exercised from the corpus. Verdict changes driven purely by
        per-tool allow/deny/approval rules are faithful; changes that would depend on
        argument content are out of reach and are not counted. See
        [`replayable_actions`] and the endpoint doc comment.
      required:
      - newly_blocked
      - newly_narrowed
      - regressions
      - false_positives
      - replayed
      - samples
      properties:
        false_positives:
          type: integer
          format: int64
          description: |-
            Number of corpus entries whose recorded verdict was a clean `allow` but
            the proposed policy would now require human approval — a false-positive /
            friction increase short of an outright block.
          minimum: 0
        newly_blocked:
          type: integer
          format: int64
          description: |-
            Number of corpus entries the proposed policy would newly block (recorded
            verdict allowed/narrowed/approval, proposed verdict `deny`).
          minimum: 0
        newly_narrowed:
          type: integer
          format: int64
          description: |-
            Number of corpus entries the proposed policy would newly narrow — allowed
            but with sensitive content scrubbed (recorded verdict `allow`, proposed
            verdict `narrow`).
          minimum: 0
        regressions:
          type: integer
          format: int64
          description: |-
            Number of corpus entries whose recorded verdict was a block/deny but the
            proposed policy would now allow — a regression that opens previously
            closed traffic.
          minimum: 0
        replayed:
          type: integer
          format: int64
          description: |-
            Total corpus entries replayed (tool-call decisions in the window that
            carried a recorded verdict and a tool name). Denominator for the counts
            above; `0` when the corpus is empty.
          minimum: 0
        samples:
          type: array
          items:
            $ref: '#/components/schemas/ReplaySampleDiff'
          description: |-
            A bounded sample of the per-request verdict changes, capped by the
            request's `sample_size`. Empty when no verdict changed.
    ReplaySampleDiff:
      type: object
      description: |-
        One per-request before/after diff in a replay response: the recorded verdict
        vs. the verdict the proposed policy would have produced for the same action.

        Only entries whose verdict actually *changed* are returned as samples — an
        unchanged entry carries no impact to illustrate.
      required:
      - tool
      - before
      - after
      properties:
        after:
          $ref: '#/components/schemas/SimulateVerdict'
          description: Verdict the proposed policy would produce for the same action.
        before:
          $ref: '#/components/schemas/SimulateVerdict'
          description: |-
            Verdict recorded when this action actually ran, mapped from the audit
            entry's persisted decision.
        tool:
          type: string
          description: |-
            Tool/capability the recorded action invoked (from the audit entry's
            persisted `detail.tool_name`).
    ReportEdgeRequest:
      type: object
      description: Request body for recording a new directed edge.
      required:
      - source_agent_id
      - target_agent_id
      - edge_type
      properties:
        edge_type:
          type: string
          description: Edge semantic type (e.g. `"messages"`, `"delegates_to"`).
        metadata_json:
          type:
          - string
          - 'null'
          description: Optional metadata JSON string.
        source_agent_id:
          type: string
          description: Hex-encoded source agent ID.
        target_agent_id:
          type: string
          description: Hex-encoded target agent ID.
    ReportEdgeResponse:
      type: object
      description: Response after recording a new edge.
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          description: Auto-assigned edge identifier.
    ResolveAlertRequest:
      type: object
      description: Request body for `POST /api/v1/alerts/:id/resolve`.
      properties:
        reason:
          type:
          - string
          - 'null'
          description: |-
            Optional human-readable note recorded with the resolution. The
            in-memory store does not persist this today but the field is
            accepted so CLI / dashboard clients can submit a reason.
    Resource:
      type: object
      description: |-
        A resource that an agent may interact with — one column family in the
        dashboard Capability Matrix.
      required:
      - id
      - name
      - paths
      properties:
        group:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ResourceGroup'
            description: |-
              Coarse group this resource belongs to.

              Only populated for the fixed system capability families, whose domain
              the `Capability` enum itself names (`file_*` → `files`, `network_*` /
              `terminal_exec` → `infra`). An MCP tool is an operator-supplied string
              with no classification anywhere in the policy model, so its group is
              left absent rather than guessed.
        id:
          type: string
          description: |-
            Stable identifier — the wire-format [`aa_core::Capability`] family this
            column projects (`"filesystem"`, `"terminal"`, `"network_outbound"`) or
            the declared MCP tool name for a tool column.
        name:
          type: string
          description: Human-readable display name.
        paths:
          type: array
          items:
            type: string
          description: |-
            Globbed paths covered by this resource.

            Always empty: the capability model grants a whole family or tool, it
            does not carry per-path sub-scopes, so there is no real source for this.
    ResourceGroup:
      type: string
      description: Coarse group a resource belongs to, used for matrix column headings.
      enum:
      - comm
      - files
      - data
      - infra
      - code
    ResumeResponse:
      type: object
      description: Response from `POST /api/v1/agents/:id/resume`.
      required:
      - agent_id
      - previous_status
      - new_status
      properties:
        agent_id:
          type: string
          description: Hex-encoded agent UUID.
        new_status:
          type: string
          description: Agent status after the resume operation.
        previous_status:
          type: string
          description: Agent status before the resume operation.
    RetentionPolicyDocument:
      type: object
      description: |-
        Snapshot of the active retention configuration plus the most recent
        run's stats. Body of `GET /api/v1/admin/retention-policy`.
      required:
      - hot_days
      - warm_days
      - cold_action
      - dry_run
      - schedule
      properties:
        archive_url:
          type:
          - string
          - 'null'
          description: |-
            Archive destination (e.g. `s3://bucket/path`). Required when
            `cold_action == "archive"`; `None` otherwise.
        cold_action:
          $ref: '#/components/schemas/ColdActionDto'
          description: Action applied to rows older than `warm_days`.
        dry_run:
          type: boolean
          description: |-
            When true, the engine logs the work it *would* perform without
            taking action.
        hot_days:
          type: integer
          format: int32
          description: Days a row stays indexed and queryable in the hot tier.
          minimum: 0
        last_run:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RetentionRunStatsDto'
            description: |-
              Stats from the most recent successful run. `None` when the engine
              has not yet completed a pass.
        schedule:
          type: string
          description: |-
            Cron schedule (UTC) on which the background task fires. Read-only
            — schedule changes still require a gateway restart.
        warm_days:
          type: integer
          format: int32
          description: |-
            Days a row stays in the warm tier (compressed where supported)
            before the cold action runs.
          minimum: 0
    RetentionRunStatsDto:
      type: object
      description: |-
        Wire representation of [`aa_gateway::storage::RetentionStats`].

        Used both inline on [`RetentionPolicyDocument`] (`last_run`) and as
        the body of `POST /api/v1/admin/retention-policy/run`.
      required:
      - ran_at
      - hot_rows
      - compressed_rows
      - archived_rows
      - dropped_rows
      - freed_bytes
      - dry_run
      properties:
        archived_rows:
          type: integer
          format: int64
          description: Rows archived during the run.
          minimum: 0
        compressed_rows:
          type: integer
          format: int64
          description: Rows compressed into warm tier during the run.
          minimum: 0
        dropped_rows:
          type: integer
          format: int64
          description: Rows dropped during the run.
          minimum: 0
        dry_run:
          type: boolean
          description: |-
            Whether the run executed in dry-run mode (logged work without
            actually deleting / compressing).
        freed_bytes:
          type: integer
          format: int64
          description: Bytes freed from primary storage by compression or drop.
          minimum: 0
        hot_rows:
          type: integer
          format: int64
          description: Rows remaining in the hot tier after the run.
          minimum: 0
        ran_at:
          type: string
          description: Timestamp (UTC) at which the run completed (ISO 8601).
    Role:
      type: string
      description: |-
        A native-account user role (ADR 0031 data model).

        Roles are a coarse, human-facing label stored on the user row; authorization
        is still driven by the [`Scope`] set [`Role::scopes`] expands each role to.
        Serialized lowercase to match the `users.role` enum values in the migration.
      enum:
      - owner
      - admin
      - developer
      - viewer
    RoleCapabilitiesResponse:
      type: object
      description: One built-in RBAC role and the governance capabilities it grants.
      required:
      - role
      - description
      - capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string
          description: |-
            Capability grant strings derived from the policy-RBAC table. Read grants
            (`read:policies` / `read:audit`) reflect each role's read authority;
            `write:policies:<scope>` grants come straight from `required_role_for`.
        description:
          type: string
          description: Human-readable summary of what the role may do.
        role:
          type: string
          description: Canonical role identifier, snake_case (e.g. `org_admin`).
    RoutingHistoryEntry:
      type: object
      description: One step in the routing history of an approval request.
      required:
      - at
      - action
      - to_role
      properties:
        action:
          type: string
          description: 'Whether this step was an initial routing or an escalation: `"routed"` or `"escalated"`.'
        at:
          type: integer
          format: int64
          description: Unix epoch timestamp (seconds) when this step occurred.
          minimum: 0
        from_role:
          type:
          - string
          - 'null'
          description: Role that previously held the request, if any.
        to_role:
          type: string
          description: Role the request was routed or escalated to.
    RoutingLogEntry:
      type: object
      description: |-
        One delivery attempt by the connector framework for a routed alert.

        Each entry records the outcome of fanning an alert out to a configured
        destination — Slack, PagerDuty, webhook, etc. The framework appends a
        new entry per attempt; dedup-suppressed re-fires must NOT add entries.
      required:
      - destination_id
      - delivered_at
      - status
      properties:
        delivered_at:
          type: string
          description: |-
            ISO 8601 timestamp at which the connector framework completed
            the delivery attempt.
        destination_id:
          type: string
          description: Identifier of the destination the alert was routed to.
        status:
          type: string
          description: |-
            Outcome label — typically `"ok"`, `"error"`, or a connector-
            specific status string.
    RoutingStatusInfo:
      type: object
      description: Structured routing metadata set by the approval router.
      required:
      - status
      - history
      properties:
        escalate_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (seconds) at which escalation is scheduled to fire.
          minimum: 0
        history:
          type: array
          items:
            $ref: '#/components/schemas/RoutingHistoryEntry'
          description: Full routing and escalation history for this request.
        routed_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Unix timestamp (seconds) when the initial routing decision was recorded.
          minimum: 0
        status:
          type: string
          description: 'Routing status string: `"routed_to_team_admin"`, `"routed_to_org_admin"`, or `"escalated_to_<role>"`.'
        target_role:
          type:
          - string
          - 'null'
          description: Role the request is currently assigned to (e.g. `"TeamAdmin"`, `"OrgAdmin"`).
        target_team_id:
          type:
          - string
          - 'null'
          description: Team the request was routed to, if known.
    RuleMetric:
      type: string
      description: |-
        Metric a rule evaluates against. Snake-case wire form matches the
        Story's enum exactly so the dashboard rule-builder dropdown can map
        1:1 onto these variants.
      enum:
      - budget_spent_pct
      - anomaly_score
      - approval_pending_age
      - policy_violation_count
    RuleOperator:
      type: string
      description: |-
        Comparison operator applied between the metric's current value and
        the rule's threshold. Wire form is the literal symbol (e.g. `">"`),
        matching the Story description.
      enum:
      - '>'
      - '>='
      - <
      - =
    RuleSeverity:
      type: string
      description: |-
        Severity assigned to alerts that this rule fires. Wire form is the
        uppercase string matching the Story (e.g. `"CRITICAL"`).
      enum:
      - CRITICAL
      - HIGH
      - MEDIUM
      - LOW
    RunRetentionRequest:
      type: object
      description: Body of `POST /api/v1/admin/retention-policy/run`.
      properties:
        dry_run:
          type: boolean
          description: |-
            When true, the run logs the work it *would* perform without
            taking action. Defaults to `false`.
    RuntimeVerdict:
      type: string
      description: |-
        The canonical 5-way runtime verdict for a single enforced action.

        Wire form is lowercase (`"allow"`, `"narrow"`, `"scrub"`, `"pending"`,
        `"deny"`) to match the dashboard's verdict styling keys. The variants are
        ordered least-to-most restrictive; do not reorder for wire stability, but the
        order carries no serialized meaning (each variant serializes by name).
      enum:
      - allow
      - narrow
      - scrub
      - pending
      - deny
    SampleCall:
      type: object
      description: |-
        A representative call sample shown alongside the matrix to explain the
        effect of the current (and any proposed) policy.
      required:
      - ts
      - agent
      - verb
      - resource
      - currentDecision
      properties:
        agent:
          type: string
        changeType:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChangeType'
        currentDecision:
          $ref: '#/components/schemas/Decision'
        detail:
          type:
          - string
          - 'null'
        fpReason:
          type:
          - string
          - 'null'
          description: Free-form explanation for a `false-positive` change classification.
        proposedDecision:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Decision'
        resource:
          type: string
        ts:
          type: string
        verb:
          $ref: '#/components/schemas/Verb'
    SandboxDispatchOutcome:
      type: object
      description: |-
        Sandbox dispatch outcome — populated on the `sandbox` field of
        [`DispatchToolResponse`] when the named tool routed through
        [`aa_sandbox::wasm_dispatch::dispatch_wasm_tool`].
      required:
      - ok
      properties:
        errno:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            WASI errno that triggered `FilesystemBlocked`. `None` for other
            error variants and for success.
          minimum: 0
        error:
          type:
          - string
          - 'null'
          description: |-
            Discriminant name of the [`SandboxError`] variant that fired —
            `FilesystemBlocked`, `CpuTimeout`, `WallClockTimeout`,
            `MemoryExhausted`, `InvalidWasm`, or `Wasmtime`. `None` on success.
        exit_code:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            WASI exit code surfaced by a clean guest exit (`proc_exit(0)` or a
            `_start` return). `None` when the dispatch failed.
        ok:
          type: boolean
          description: |-
            `true` iff the sandbox runtime returned `Ok`. `false` for every
            `SandboxError` variant.
    SandboxSummaryCounts:
      type: object
      description: |-
        Aggregate counts for the dashboard SandboxSummaryCard.

        Each field is the number of shadow audit events (entries whose payload
        carries `dry_run: true`) that would have produced the named outcome under
        live enforcement. `would_be_redactions` is the count of dry-run entries
        that also carry one or more credential-scanner findings — those secrets
        would have been redacted by the scanner under `enforcement_mode: enforce`.
      required:
      - would_be_denies
      - would_be_redactions
      - would_be_pending_approvals
      properties:
        would_be_denies:
          type: integer
          format: int64
          description: Shadow-decision = `"deny"` count.
          minimum: 0
        would_be_pending_approvals:
          type: integer
          format: int64
          description: Shadow-decision = `"pending"` count.
          minimum: 0
        would_be_redactions:
          type: integer
          format: int64
          description: Dry-run entries with non-empty `credential_findings`.
          minimum: 0
    SandboxSummaryResponse:
      type: object
      description: Response for `GET /api/v1/audit/sandbox-summary`.
      required:
      - counts
      - window_secs
      - generated_at
      properties:
        counts:
          $ref: '#/components/schemas/SandboxSummaryCounts'
          description: Counts bucketed by the dashboard's wouldBe* categories.
        generated_at:
          type: string
          description: ISO 8601 UTC timestamp when this response was generated.
        top_rule:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SandboxSummaryTopRule'
            description: Top-ranked policy rule by shadow-event frequency, when one exists.
        window_secs:
          type: integer
          format: int64
          description: Time window used for aggregation, in seconds.
          minimum: 0
    SandboxSummaryTopRule:
      type: object
      description: |-
        Most-frequent matched policy rule across the shadow events in the window.

        Mirrors `policy_rule` field on the shadow payload (see
        `aa-gateway::service::policy_service::record_audit`). Omitted from the
        response when no shadow entry carried a non-empty `policy_rule`.
      required:
      - id
      - count
      properties:
        count:
          type: integer
          format: int64
          description: Number of shadow events in the window matched by this rule.
          minimum: 0
        id:
          type: string
          description: Rule identifier as recorded in the shadow payload's `policy_rule`.
    Scope:
      type: string
      description: |-
        Authorization scope level for API operations.

        Variants are ordered by privilege: `Read < Write < Admin`.
        A caller with `Admin` scope satisfies any scope requirement.
      enum:
      - read
      - write
      - admin
    ScrubCatalogueResponse:
      type: object
      description: Response for `GET /api/v1/scrub/patterns`.
      required:
      - patterns
      - total
      properties:
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/ScrubPattern'
          description: Every built-in detector, in the scanner's stable declaration order.
        total:
          type: integer
          description: Total number of built-in detectors (equals `patterns.len()`).
          minimum: 0
    ScrubPattern:
      type: object
      description: One entry in the effective pattern catalogue.
      required:
      - kind
      - redaction_label
      - category
      - severity
      - builtin
      properties:
        builtin:
          type: boolean
          description: |-
            Whether this is a built-in detector (always `true` here — custom
            policy-defined patterns are not yet exposed through this endpoint; see
            the AAASM-5174 follow-up notes).
        category:
          type: string
          description: |-
            Coarse detector family: `api_key` | `cloud_credential` | `auth_token` |
            `database_url` | `private_key` | `pii` | `generic`.
        kind:
          type: string
          description: |-
            Canonical detector kind label, e.g. `"AwsAccessKey"`. Stable identifier
            and the value that appears in the `[REDACTED:<kind>]` replacement.
        redaction_label:
          type: string
          description: |-
            The exact replacement string this detector emits when it redacts a
            match, e.g. `"[REDACTED:AwsAccessKey]"`.
        severity:
          type: string
          description: 'Fixed leak severity: `critical` | `high` | `medium` | `low`.'
    SeriesPoint:
      type: object
      description: 'A single time-series point: `t` is epoch milliseconds, `value` the count.'
      required:
      - t
      - value
      properties:
        t:
          type: integer
          format: int64
          description: Epoch-millisecond timestamp of the bucket (bucket start).
        value:
          type: number
          format: double
          description: Aggregated value for the bucket.
    Silence:
      type: object
      description: |-
        Active silence record attached to an alert.

        Present when an operator has acknowledged the alert and asked the
        notification framework to suppress further routing until `expires_at`.
      required:
      - id
      - expires_at
      properties:
        expires_at:
          type: string
          description: ISO 8601 timestamp at which the silence expires.
        id:
          type: string
          description: Stable identifier of the silence record.
        reason:
          type:
          - string
          - 'null'
          description: Optional free-text reason captured at silence creation time.
    SilenceAlertRequest:
      type: object
      description: Request body for `POST /api/v1/alerts/silence` (AAASM-1387 / AAASM-1648).
      required:
      - alert_id
      - duration_seconds
      properties:
        alert_id:
          type: string
          description: ULID of the alert to silence.
        duration_seconds:
          type: integer
          format: int32
          description: |-
            Duration of the silence window in seconds. Must be > 0 and
            ≤ 604_800 (7 days). Validation lives in the handler and returns
            HTTP 400 `invalid_duration` on violation.
          minimum: 0
        reason:
          type:
          - string
          - 'null'
          description: |-
            Optional free-text note recorded on the silence (max 500 chars).
            Returns HTTP 400 `reason_too_long` when oversize.
    SilenceResponse:
      type: object
      description: |-
        Response body for `POST /api/v1/alerts/silence` (AAASM-1387). Wire
        shape matches the spec: silence identifier is exposed as `silence_id`
        (the in-memory [`SilenceRecord`] uses `id` internally; the conversion
        renames on the way out).
      required:
      - silence_id
      - alert_id
      - starts_at
      - expires_at
      - created_by
      properties:
        alert_id:
          type: string
          description: ULID of the suppressed alert.
        created_by:
          type: string
          description: |-
            Stable identifier of the principal that created the silence
            (API-key id or JWT subject, per `AuthenticatedCaller.key_id`).
        expires_at:
          type: string
          description: |-
            ISO 8601 timestamp at which the silence expires; the
            `silence_watcher` (AAASM-1646) restores the alert at or shortly
            after this instant.
        reason:
          type:
          - string
          - 'null'
          description: |-
            Free-text reason captured at silence creation time. Omitted in
            the response when no reason was supplied.
        silence_id:
          type: string
          description: ULID identifier of the silence record.
        starts_at:
          type: string
          description: ISO 8601 timestamp at which the silence took effect.
    SimulatePolicyRequest:
      type: object
      description: |-
        Request body for `POST /api/v1/policies/simulate` (AAASM-5037).

        Describes a hypothetical `(agent, tool, target)` request to evaluate against
        the active policy. No part of it is persisted — it is a pure what-if.
      required:
      - agent_id
      - tool
      properties:
        agent_id:
          type: string
          description: |-
            Identifier (id or name) of the hypothetical agent to evaluate as. Mapped
            to the same internal `AgentId` a live request for this agent would use,
            so a registered agent's org/team lineage is honored.
        org_id:
          type:
          - string
          - 'null'
          description: |-
            Optional organization attribute used for policy-cascade lineage when the
            agent is not resolvable from the registry.
        target:
          type:
          - string
          - 'null'
          description: |-
            Optional target/resource of the action (e.g. a recipient, host, or path).
            Folded into the simulated tool-call arguments so target-sensitive
            predicates and credential/PII scanning apply.
        team_id:
          type:
          - string
          - 'null'
          description: |-
            Optional team attribute used for policy-cascade lineage when the agent is
            not resolvable from the registry.
        tool:
          type: string
          description: Tool or capability the agent would invoke (e.g. `"gmail.send"`, `"shell"`).
    SimulatePolicyResponse:
      type: object
      description: Response body for `POST /api/v1/policies/simulate` (AAASM-5037).
      required:
      - verdict
      - reason
      - redacted
      properties:
        matched_rule:
          type:
          - string
          - 'null'
          description: |-
            Label of the policy rule / reason that produced the verdict. `null` for a
            clean allow with no matched narrowing or deny rule.
        reason:
          type: string
          description: Human-readable explanation of the verdict.
        redacted:
          type: boolean
          description: |-
            Whether the payload would be scrubbed before reaching the model because
            credential/PII content was detected (drives the `"narrow"` verdict).
        verdict:
          $ref: '#/components/schemas/SimulateVerdict'
          description: 'Dry-run verdict: `allow`, `narrow`, `approval`, or `deny`.'
    SimulateVerdict:
      type: string
      description: |-
        Dry-run verdict returned by `POST /api/v1/policies/simulate`.

        AAASM-5220 — constrains the [`SimulatePolicyResponse::verdict`] wire
        vocabulary to the closed set the simulate handler emits, so the generated
        OpenAPI spec advertises an enum rather than a free-form `string`. Serializes
        lowercase.
      enum:
      - allow
      - narrow
      - approval
      - deny
    SubtreeBurnResponse:
      type: object
      description: Response for `GET /api/v1/agents/{id}/subtree-burn`.
      required:
      - agent_id
      - period
      - points
      properties:
        agent_id:
          type: string
          description: Hex-encoded root agent ID.
        period:
          type: string
          description: 'Requested period: `"7d"` or `"30d"`.'
        points:
          type: array
          items:
            $ref: '#/components/schemas/DailyBurnPointResponse'
          description: Time series, ordered oldest → newest.
    SuspendRequest:
      type: object
      description: Request body for `POST /api/v1/agents/:id/suspend`.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Reason for suspending the agent (logged for audit).
    SuspendResponse:
      type: object
      description: Response from `POST /api/v1/agents/:id/suspend`.
      required:
      - agent_id
      - previous_status
      - new_status
      properties:
        agent_id:
          type: string
          description: Hex-encoded agent UUID.
        new_status:
          type: string
          description: Agent status after the suspend operation.
        previous_status:
          type: string
          description: Agent status before the suspend operation.
    TeamCostEntry:
      type: object
      description: Per-team cost entry within the budget summary.
      required:
      - team_id
      - daily_spend_usd
      - date
      properties:
        daily_spend_usd:
          type: string
          description: Daily spend for this team in USD (sum of all member agent spends today).
        date:
          type: string
          description: Calendar date (YYYY-MM-DD) the daily spend applies to.
        monthly_limit_usd:
          type:
          - string
          - 'null'
          description: |-
            Configured per-team calendar-month budget limit in USD, if set
            (AAASM-5087). This is the tracker-wide team envelope — the same limit
            applies to every team — surfaced so the Teams monthly-budget card can
            render spend against limit. `None` when no team monthly limit is
            configured. This is a calendar-month window, not a rolling window.
        monthly_spend_usd:
          type:
          - string
          - 'null'
          description: Total spend this month in USD for this team (if monthly tracking is enabled).
        team_id:
          type: string
          description: Team identifier.
    TeamPoliciesResponse:
      type: object
      description: Response body for `GET /api/v1/policies/team/{team_id}` (AAASM-5096).
      required:
      - team_id
      - policies
      properties:
        policies:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TeamPolicyResponse'
          description: |-
            Every policy document in force for at least one visible agent in the
            team, ordered by scope then name.

            **`null`, never `[]`, when the mapping could not be resolved** — the same
            absent-vs-empty discipline as [`PolicyResponse::affects`], and for a
            sharper reason. `[]` is a positive governance claim: "nothing governs this
            team". That claim is only true when the team has no agent this caller can
            see, so there is nothing for a policy to be in force over — the one case
            that serializes `[]`.

            When the team *does* have visible agents but not one of them resolved a
            cascade document, the honest answer is "unknown", not "none":
            `PolicyEngine::evaluate` falls back to `evaluate_primary` for exactly
            those agents, so the primary policy slot is still in force over them —
            this projection just cannot name it. That is the state of **every shipped
            aa-api deployment today**: `AppState::local_in_memory` loads the policy
            through `load_from_file`, which populates the primary slot and leaves
            `scope_index` empty, and nothing else in aa-api ever calls
            `load_cascade_from_dir` (AAASM-5106). Emitting `[]` there would render as
            "No policy is in force for this team" while a policy *is* being enforced.

            The handler reads that state from the engine's authoritative
            [`cascade_loaded`](aa_gateway::engine::PolicyEngine::cascade_loaded) signal
            (`false` ⇒ `null`), rather than inferring it from an empty result — an
            empty result over a team with no visible agents is otherwise
            indistinguishable from the genuinely-empty case and used to leak `[]`.
        team_id:
          type: string
          description: The team the mapping was resolved for, echoed from the request.
    TeamPolicyResponse:
      type: object
      description: |-
        One policy document in force for a team, as shown on the Teams surface's
        Active-policies card (`design/v1/hi-fi/teams.jsx`).
      required:
      - id
      - name
      - scope
      properties:
        hits24h:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Number of times this policy document fired in the last 24 hours. Sourced
            from per-document decision counts (AAASM-5107); absent, never `0`, when
            the document recorded no decision in the window — see
            [`PolicyResponse::hits_24h`] for the full sourcing and absent-vs-zero rule.
          minimum: 0
        id:
          type: string
          description: |-
            Scope-qualified document id (`"{scope}/{name}"`, or the bare scope for a
            document declaring no `metadata.name`). Matches the id the capability
            matrix emits for the same document.
        name:
          type: string
          description: |-
            The document's `metadata.name`, falling back to its scope label when the
            document declares none (the flat, non-envelope policy format).
        scope:
          type: string
          description: |-
            The document's declared scope (`global` / `org:x` / `team:x` / `agent:x`),
            so the card can show which tier of the cascade the policy comes from.
        version:
          type:
          - string
          - 'null'
          description: |-
            Revision from the document's `metadata.version`. Absent for a document
            that declares none.
    TeamSummary:
      type: object
      description: |-
        High-level statistics for a single team.

        # Example JSON
        ```json
        { "team_id": "team-alpha", "agent_count": 7, "root_agent_count": 1 }
        ```
      required:
      - team_id
      - agent_count
      - root_agent_count
      properties:
        agent_count:
          type: integer
          description: Total agents in this team.
          minimum: 0
        root_agent_count:
          type: integer
          description: Root agents (depth == 0) in this team.
          minimum: 0
        team_id:
          type: string
          description: Team identifier.
      example:
        agent_count: 7
        root_agent_count: 1
        team_id: team-alpha
    TeamTopology:
      type: object
      description: |-
        All agents belonging to a single team.

        # Example JSON
        ```json
        { "team_id": "team-alpha", "agent_count": 2, "members": [] }
        ```
      required:
      - team_id
      - agent_count
      - members
      properties:
        agent_count:
          type: integer
          description: Number of agents in this team (after filtering).
          minimum: 0
        members:
          type: array
          items:
            $ref: '#/components/schemas/AgentNode'
          description: Agents in this team.
        team_id:
          type: string
          description: Team identifier.
      example:
        agent_count: 2
        members: []
        team_id: team-alpha
    TestDestinationRequest:
      type: object
      description: Body for `POST /api/v1/alerts/destinations/{id}/test`.
      properties:
        message:
          type:
          - string
          - 'null'
          description: Optional message body; defaults to `"AAASM test fire"`.
        severity:
          type:
          - string
          - 'null'
          description: Optional severity label; defaults to `"LOW"`.
    TestDestinationResponse:
      type: object
      description: Response body for a successful test-fire.
      required:
      - delivered_at
      - connector_response_status
      - connector_response_body
      properties:
        connector_response_body:
          type: string
          description: Up-to-2048-byte snippet of the connector response body.
        connector_response_status:
          type: integer
          format: int32
          description: HTTP status the connector observed.
          minimum: 0
        delivered_at:
          type: string
          description: RFC 3339 timestamp when the connector reported success.
    TokenRequest:
      type: object
      description: Request body for `POST /auth/token`.
      properties:
        scopes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Scope'
          description: |-
            Requested scopes for the issued JWT.
            If omitted, the caller's full scopes are used.
    TokenResponse:
      type: object
      description: Response body for `POST /auth/token`.
      required:
      - token
      - expires_at
      - scopes
      properties:
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the token expires.
          minimum: 0
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: Scopes granted in the token.
        token:
          type: string
          description: The issued JWT token string.
    ToolInfoSchema:
      type: object
      description: |-
        Schema wrapper so utoipa can derive the OpenAPI schema for [`DevToolInfo`].

        The real handler returns `Vec<DevToolInfo>` directly; this wrapper is only
        referenced by utoipa's `#[utoipa::path]` macro so it can generate a schema
        entry without requiring [`DevToolInfo`] itself to implement `ToSchema`.
      required:
      - kind
      - install_path
      - governance_level
      - supports_mcp
      - supports_managed_settings
      properties:
        governance_level:
          type: string
        install_path:
          type: string
        kind:
          type: string
        supports_managed_settings:
          type: boolean
        supports_mcp:
          type: boolean
        version:
          type:
          - string
          - 'null'
    ToolStat:
      type: object
      description: Per-tool call statistics.
      required:
      - name
      - calls
      - errorRate
      properties:
        calls:
          type: integer
          format: int64
          description: Number of intercepted / dispatched calls in the window.
          minimum: 0
        errorRate:
          type: number
          format: double
          description: Fraction (0.0–1.0) of this tool's calls that were blocked/denied.
        name:
          type: string
          description: Tool name as recorded in the audit payload.
    ToolUsageResponse:
      type: object
      description: Response for `GET /api/v1/analytics/tool-usage`.
      required:
      - tools
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolStat'
          description: Per-tool statistics (empty when no tool events carried a tool name).
    TopologyEdgeListResponse:
      type: object
      description: All edges in the topology graph, optionally filtered by team membership.
      required:
      - edges
      - count
      properties:
        count:
          type: integer
          description: Total number of edges returned.
          minimum: 0
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResponse'
          description: Matching edges, sorted newest-first within each edge type.
    TopologyGraphEdge:
      type: object
      description: |-
        One directed edge in the dashboard topology graph (AAASM-5040, widened in
        AAASM-5099).

        A slim projection of a stored [`aa_core::topology::Edge`] carrying what the
        dashboard graph renders: the two hex-encoded endpoints, the relation `kind`,
        and whether the edge crosses a team boundary.

        `kind` covers all six stored [`aa_core::topology::EdgeType`] variants. The
        two structural kinds keep the graph vocabulary the frontend already renders
        (`delegates_to` → `delegation`, `calls` → `call`); the other four pass the
        stored wire string through unchanged (`reads`, `writes`, `approves`,
        `messages`), matching the frontend `TopologyEdge` 1:1 so the client consumes
        edges without remapping.

        # Example JSON
        ```json
        { "source": "0102030405060708090a0b0c0d0e0f10", "target": "aabbccdd00112233aabbccdd00112233", "kind": "delegation", "cross_team": false }
        ```
      required:
      - source
      - target
      - kind
      - cross_team
      properties:
        cross_team:
          type: boolean
          description: |-
            Whether the two endpoints belong to different teams. Matches the
            `is_cross_team` rule `/topology/edges` uses (`edges::compute_cross_team`):
            true only when both endpoints carry a `team_id` and the two differ — an
            endpoint with no team is never counted as crossing a boundary.
        kind:
          type: string
          description: |-
            Relation kind rendered by the graph: `delegation`, `call`, `reads`,
            `writes`, `approves`, or `messages`.
        source:
          type: string
          description: Hex-encoded UUID of the source (delegating / calling) agent.
        target:
          type: string
          description: Hex-encoded UUID of the target agent.
      example:
        cross_team: false
        kind: delegation
        source: 0102030405060708090a0b0c0d0e0f10
        target: aabbccdd00112233aabbccdd00112233
    TopologyGraphResponse:
      type: object
      description: |-
        The whole-fleet topology graph rendered by the dashboard Topology page
        (AAASM-5040): every agent visible to the caller as a node, plus every stored
        edge between those nodes (all six relation kinds, AAASM-5099).

        Nodes reuse the [`AgentNode`] projection (so the per-node enforcement-mode,
        flagged, and trust badges from AAASM-5036 are carried through), letting the
        dashboard render those badges from live registry data instead of a fixture.

        # Example JSON
        ```json
        { "nodes": [], "edges": [], "unclaimed_observable": true }
        ```
      required:
      - nodes
      - edges
      - unclaimed_observable
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyGraphEdge'
          description: |-
            Edges of every stored relation kind whose endpoints are both visible
            nodes.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AgentNode'
          description: All agents visible to the caller, one graph node each (sorted by id).
        unclaimed_observable:
          type: boolean
          description: |-
            Whether the caller's scope can observe unclaimed (team-less) agents at
            all (AAASM-5183).

            Scope-derived, not data-derived: it mirrors what
            [`crate::routes::topology::record_visible_to`] does with a `team_id: None`
            record. An admin, and any caller not confined to a specific team, CAN
            observe unclaimed agents; a team-scoped (non-admin) caller structurally
            CANNOT — `record_visible_to` drops every `team_id: None` record for it —
            so a team-scoped caller's `nodes` never contains an unclaimed agent even
            when the registry holds some.

            The Teams page reads this to decide whether an empty unclaimed set is the
            honest "no unclaimed agents" (the caller could have seen them and there
            are none) or "unclaimed agents are not available in your scope" (the
            caller could not have seen them either way). It deliberately carries no
            count: disclosing how many unclaimed agents exist to a caller whose scope
            cannot see them is not authorised (no product/security sign-off).
      example:
        edges: []
        nodes: []
        unclaimed_observable: true
    TopologyOverview:
      type: object
      description: |-
        Overview of the entire agent topology across all teams.

        # Example JSON
        ```json
        {
          "team_count": 2,
          "root_agent_count": 3,
          "total_agent_count": 12,
          "teams": [{ "team_id": "team-alpha", "agent_count": 7, "root_agent_count": 1 }],
          "standalone_root_agents": []
        }
        ```
      required:
      - team_count
      - root_agent_count
      - total_agent_count
      - teams
      - standalone_root_agents
      properties:
        root_agent_count:
          type: integer
          description: Number of root agents (depth == 0) across all teams.
          minimum: 0
        standalone_root_agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentNode'
          description: Root agents that are not assigned to any team, sorted by agent id.
        team_count:
          type: integer
          description: Number of teams with at least one registered agent.
          minimum: 0
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
          description: Per-team agent count summaries, sorted by team_id.
        total_agent_count:
          type: integer
          description: Total number of agents in the registry.
          minimum: 0
      example:
        root_agent_count: 3
        standalone_root_agents: []
        team_count: 2
        teams:
        - agent_count: 7
          root_agent_count: 1
          team_id: team-alpha
        total_agent_count: 12
    TopologyStats:
      type: object
      description: |-
        Aggregate topology statistics across all registered agents.

        # Example JSON
        ```json
        {
          "total_agents": 15,
          "root_agent_count": 3,
          "max_depth": 4,
          "active_count": 12,
          "suspended_count": 2,
          "deregistered_count": 1,
          "team_count": 2,
          "team_sizes": { "team-alpha": 8, "team-beta": 4 },
          "depth_histogram": { "0": 3, "1": 7, "2": 5 },
          "team_size_histogram": { "4": 1, "8": 1 },
          "spawn_count_histogram": { "0": 8, "2": 4, "4": 1 },
          "orphan_count": 2,
          "avg_children_per_parent": 2.5
        }
        ```
      required:
      - total_agents
      - root_agent_count
      - max_depth
      - active_count
      - suspended_count
      - deregistered_count
      - team_count
      - team_sizes
      - depth_histogram
      - team_size_histogram
      - spawn_count_histogram
      - orphan_count
      - avg_children_per_parent
      properties:
        active_count:
          type: integer
          description: Agents currently in `Active` status.
          minimum: 0
        avg_children_per_parent:
          type: number
          format: double
          description: Average number of children across all agents that have at least one child.
        depth_histogram:
          type: object
          description: Agent count per depth level (depth → count).
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          propertyNames:
            type: string
        deregistered_count:
          type: integer
          description: Agents in `Deregistered` status.
          minimum: 0
        max_depth:
          type: integer
          format: int32
          description: Maximum observed delegation depth.
          minimum: 0
        orphan_count:
          type: integer
          description: Agents that have no team assignment and are not root agents (depth > 0).
          minimum: 0
        root_agent_count:
          type: integer
          description: Number of root agents (depth == 0).
          minimum: 0
        spawn_count_histogram:
          type: object
          description: Number of agents per child-count bucket (child_count → agent_count).
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          propertyNames:
            type: string
        suspended_count:
          type: integer
          description: Agents currently in `Suspended` status.
          minimum: 0
        team_count:
          type: integer
          description: Number of teams with at least one agent.
          minimum: 0
        team_size_histogram:
          type: object
          description: Number of teams per team-size bucket (team_size → team_count).
          additionalProperties:
            type: integer
            format: int32
            minimum: 0
          propertyNames:
            type: string
        team_sizes:
          type: object
          description: Agent count per team (team_id → count).
          additionalProperties:
            type: integer
            minimum: 0
          propertyNames:
            type: string
        total_agents:
          type: integer
          description: Total agents in the registry.
          minimum: 0
      example:
        active_count: 12
        avg_children_per_parent: 2.5
        depth_histogram:
          '0': 3
          '1': 7
          '2': 5
        deregistered_count: 1
        max_depth: 4
        orphan_count: 2
        root_agent_count: 3
        spawn_count_histogram:
          '0': 8
          '2': 4
          '4': 1
        suspended_count: 2
        team_count: 2
        team_size_histogram:
          '4': 1
          '8': 1
        team_sizes:
          team-alpha: 8
          team-beta: 4
        total_agents: 15
    TraceResponse:
      type: object
      description: Full trace for one agent session.
      required:
      - session_id
      - agent_id
      - spans
      properties:
        agent_id:
          type: string
          description: Agent that produced this trace.
        session_id:
          type: string
          description: Session identifier.
        spans:
          type: array
          items:
            $ref: '#/components/schemas/TraceSpan'
          description: Ordered list of spans in the session.
    TraceSpan:
      type: object
      description: A single span within an agent session trace.
      required:
      - span_id
      - operation
      - start_time
      properties:
        decision:
          type:
          - string
          - 'null'
          description: Governance decision result for this span.
        end_time:
          type:
          - string
          - 'null'
          description: End time of the span (ISO 8601, if completed).
        operation:
          type: string
          description: Operation name.
        parent_span_id:
          type:
          - string
          - 'null'
          description: Parent span identifier (links to the calling action).
        span_id:
          type: string
          description: Span identifier.
        start_time:
          type: string
          description: Start time of the span (ISO 8601).
    TrustResponse:
      type: object
      description: Response for `GET /api/v1/analytics/trust` (AAASM-5083, ADR 0019 Option D).
      required:
      - agents
      - weights
      - window
      - minActions
      - truncated
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentTrustScore'
          description: |-
            Per-agent trust scores. Every agent that recorded at least one governed
            action in the window appears; its `trust` is `null` below `MIN_ACTIONS`
            (cold start). Empty when the window is truncated (see `truncated`).
        minActions:
          type: integer
          format: int64
          description: |-
            The minimum governed-action count below which `trust` is `null` (cold
            start). Fixed at `MIN_ACTIONS` in v1.
          minimum: 0
        truncated:
          type: boolean
          description: |-
            Whether the audit window was truncated at the analytics cap. When `true`,
            `agents` is empty and no score is emitted — a truncated window yields
            `null`, never a partial score (ADR 0019 Guardrail 2).
        weights:
          $ref: '#/components/schemas/TrustWeightSet'
          description: |-
            The tenant's effective weight-set that produced these scores (ADR 0019
            Guardrail 1). A score is only comparable to another computed under the
            same weights — the client must not rank raw scores across tenants.
        window:
          type: string
          description: The fixed scoring window (`7d` in v1 — not tenant-tunable).
    TrustSignalWeight:
      type: object
      description: |-
        The effective per-signal weight in the response's echoed weight-set.

        ADR 0019 Guardrail 1 — the score is labelled with the weight-set that
        produced it, so a client never compares a `78` under one tenant's weights to
        a `78` under another's. Mirrors [`crate::trust::SignalConfig`] on the wire.
      required:
      - enabled
      - weight
      properties:
        enabled:
          type: boolean
          description: Whether this signal contributed to the penalty for this score.
        weight:
          type: number
          format: double
          description: The weight applied to this signal's count when enabled.
    TrustWeightSet:
      type: object
      description: |-
        The tenant's effective trust weight-set, echoed on every trust response
        (ADR 0019 Guardrail 1). Deserializable so it also serves as the config
        read/write body.
      required:
      - policy_violation
      - credential_redaction
      - approval_rejection
      properties:
        approval_rejection:
          $ref: '#/components/schemas/TrustSignalWeight'
          description: |-
            Penalty weight for an approval rejection (`ApprovalDenied` +
            `ApprovalTimedOut`). Default 0.5.
        credential_redaction:
          $ref: '#/components/schemas/TrustSignalWeight'
          description: Penalty weight for a `CredentialLeakBlocked` (DLP redaction). Default 1.5.
        policy_violation:
          $ref: '#/components/schemas/TrustSignalWeight'
          description: Penalty weight for a `PolicyViolation` (denied action). Default 1.0.
    UpdateDestinationRequest:
      allOf:
      - oneOf:
        - type: 'null'
        - $ref: '#/components/schemas/DestinationConfig'
          description: |-
            New discriminated configuration. When supplied it fully replaces
            the existing config and is re-validated.
      - type: object
        properties:
          enabled:
            type:
            - boolean
            - 'null'
            description: New enabled flag.
          name:
            type:
            - string
            - 'null'
            description: New display name.
      description: |-
        Body for `PUT /api/v1/alerts/destinations/{id}`.

        All fields are optional — supplying just `enabled` toggles dispatch
        without touching the configuration payload.
    UpdateRetentionPolicyRequest:
      type: object
      description: |-
        Body of `PUT /api/v1/admin/retention-policy` — partial update of the
        runtime retention configuration. Each field must be present; the
        server-side validation matches the dashboard's client-side rules
        (hot_days &ge; 1, warm_days &gt; hot_days, archive_url required when
        `cold_action == "archive"`).
      required:
      - hot_days
      - warm_days
      - cold_action
      properties:
        archive_url:
          type:
          - string
          - 'null'
          description: |-
            Archive destination. Required when `cold_action == "archive"`;
            must start with `s3://` or `gs://`.
        cold_action:
          $ref: '#/components/schemas/ColdActionDto'
          description: New cold-tier action.
        hot_days:
          type: integer
          format: int32
          description: New value for `hot_days`. Must be &ge; 1.
          minimum: 0
        warm_days:
          type: integer
          format: int32
          description: New value for `warm_days`. Must be strictly greater than `hot_days`.
          minimum: 0
    Verb:
      type: string
      description: Verb a capability cell scopes its decision to.
      enum:
      - read
      - write
      - delete
      - exec
    ViolationNode:
      type: object
      description: A single node in the policy-violations-by-lineage heatmap.
      required:
      - agent_id
      - violation_count
      - top_policies
      properties:
        agent_id:
          type: string
          description: Hex-encoded agent ID.
        depth:
          type:
          - integer
          - 'null'
          format: int32
          description: Delegation depth (0 = root agent).
          minimum: 0
        parent_agent_id:
          type:
          - string
          - 'null'
          description: Hex-encoded parent agent ID, if known.
        team_id:
          type:
          - string
          - 'null'
          description: Team the agent belongs to, if registered.
        top_policies:
          type: array
          items:
            type: string
          description: Top 3 most-frequently violated policy rules in the window.
        violation_count:
          type: integer
          format: int64
          description: Number of `PolicyViolation` audit events in the requested window.
          minimum: 0
    ViolationPayload:
      oneOf:
      - type: object
        description: A governance audit event enriched with runtime metadata.
        required:
        - source
        - received_at_ms
        - sequence_number
        - kind
        properties:
          call_stack:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/CallStackNode'
            description: |-
              Hierarchical call stack for the operation (LLM / tool / result
              steps). Omitted when the producer did not record a stack.
          decision:
            type:
            - string
            - 'null'
            description: |-
              Governance decision bucket from the proto `Decision`, in the
              dashboard's decision-mix vocabulary — one of `"allow"` (proto
              `ALLOW`), `"scrub"` (proto `REDACT`), `"pending"` (proto
              `PENDING`), or `"deny"` (proto `DENY`). Distinct from `status`,
              which collapses allow/redact into `"running"` and so cannot feed
              the Live Ops allow/scrub/deny/await counters. Omitted when the
              decision is unspecified. There is deliberately no `"narrow"`
              bucket: the proto `Decision` enum has no such variant, so no
              event can be attributed to it (matches
              `analytics::decision_mix_bucket`).
          kind:
            type: string
            enum:
            - audit
          latency_ms:
            type:
            - integer
            - 'null'
            format: int64
            description: |-
              Observed latency in milliseconds. Optional today — populated once
              the audit pipeline tracks per-action duration end-to-end.
            minimum: 0
          op_type:
            type:
            - string
            - 'null'
            description: |-
              Operation kind from the underlying `AuditEvent.action_type` — one of
              `"llm_call"`, `"tool_call"`, `"file_op"`, `"network"`, `"process"`,
              `"spawn"`, or `"unknown"` when unspecified. Drives the Live Ops
              dashboard's per-row "op type" column.
          received_at_ms:
            type: integer
            format: int64
            description: Unix milliseconds when the pipeline received the event.
          resource:
            type:
            - string
            - 'null'
            description: |-
              Target resource derived from the action's `detail` variant — e.g.
              `LLMCallDetail.model_name`, `ToolCallDetail.tool_name`,
              `FileOpDetail.path`. Drives the Live Ops "resource" column.
          sequence_number:
            type: integer
            format: int64
            description: Monotonic sequence number assigned by the pipeline.
            minimum: 0
          source:
            type: string
            description: 'Source that delivered the event: `"sdk"`, `"ebpf"`, or `"proxy"`.'
          status:
            type:
            - string
            - 'null'
            description: |-
              Operation lifecycle status mapped from the proto `Decision`:
              `"running"` (allow / redact), `"blocked"` (deny), `"pending"`
              (awaiting human approval).
          team:
            type:
            - string
            - 'null'
            description: |-
              Team identifier from the agent's lineage context. Empty for
              legacy events and root agents without a team set.
      - type: object
        description: An interception layer became unavailable.
        required:
        - layer
        - reason
        - remaining_layers
        - kind
        properties:
          kind:
            type: string
            enum:
            - layer_degradation
          layer:
            type: string
            description: Name of the degraded layer (e.g. `"ebpf"`, `"proxy"`).
          reason:
            type: string
            description: Human-readable reason for the degradation.
          remaining_layers:
            type: array
            items:
              type: string
            description: Remaining active layers after degradation.
      description: |-
        Payload for `event_type: "violation"` events.

        Represents a governance audit event from the pipeline — either an
        action that violated policy or an interception layer degradation.
    ViolationsByLineageResponse:
      type: object
      description: Response for `GET /api/v1/audit/violations-by-lineage`.
      required:
      - nodes
      - window_secs
      - generated_at
      properties:
        generated_at:
          type: string
          description: ISO 8601 UTC timestamp when this response was generated.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ViolationNode'
          description: Heatmap nodes — one entry per agent that recorded at least one violation.
        window_secs:
          type: integer
          format: int64
          description: Time window used for aggregation, in seconds.
          minimum: 0
    WsTicketPurpose:
      type: string
      description: |-
        What a ticket authorizes. A ticket minted for one purpose is rejected by any
        other WS endpoint, so a leaked live-ops ticket can't open the alert stream.
      enum:
      - events
      - alerts
    WsTicketRequest:
      type: object
      description: Request body for `POST /auth/ws-ticket` (AAASM-4861).
      required:
      - purpose
      properties:
        purpose:
          $ref: '#/components/schemas/WsTicketPurpose'
          description: |-
            Which WebSocket stream the ticket will open. A ticket minted for one
            purpose is rejected by any other WS endpoint.
    WsTicketResponse:
      type: object
      description: Response body for `POST /auth/ws-ticket` (AAASM-4861).
      required:
      - ticket
      - expires_at
      - purpose
      properties:
        expires_at:
          type: integer
          format: int64
          description: |-
            Unix timestamp when the ticket expires. It is also invalidated the moment
            it is used; whichever comes first.
          minimum: 0
        purpose:
          $ref: '#/components/schemas/WsTicketPurpose'
          description: The stream this ticket may open (echoes the request).
        ticket:
          type: string
          description: The opaque, single-use ticket to present as `?ticket=` on the WS upgrade.

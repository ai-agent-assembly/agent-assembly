apiVersion: agent-assembly.dev/v1alpha1
kind: GovernancePolicy
metadata:
  name: it-network-allowlist
  version: "0.1.0"

# AAASM-1943 (F116 ST-W — Scenario 2): demonstrates the policy-DSL shape
# operators write to declare which outbound hosts a sandboxed tool may
# reach. Used by `e2e_tool_sandbox.rs` against a standalone (no-gateway)
# proxy — that path still reads AA_PROXY_NETWORK_ALLOWLIST, unrelated to
# this file's spec.network.allowlist section.
#
# AAASM-5851: this same fixture is also loaded directly as a real gateway
# policy by `e2e_network_egress_gateway.rs`, where spec.network.allowlist
# IS what's consulted — aa-proxy's egress checks ask the gateway for a
# CheckAction decision whenever ProxyConfig.gateway_endpoint is configured,
# closing the gap the previous version of this comment described as
# "future work".
#
# Pattern grammar (shared with aa-core::policy::is_host_allowed_by_egress_allowlist):
# * exact case-insensitive match — `api.openai.com`
# * leftmost-label wildcard       — `*.openai.com` (matches `chat.openai.com`,
#                                     not `openai.com` itself, not
#                                     `evil.openai.com.attacker.net`)
# * universal wildcard            — `*` (rarely used; escape hatch only)

spec:
  network:
    allowlist:
      - api.openai.com
      - "*.anthropic.com"
      - allowed.example.com

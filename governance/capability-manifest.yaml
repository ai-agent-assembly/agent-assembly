  notes: >-
    Prior belief was that the Ed25519 seed is SHA-256(public agent id), making any agent
    impersonable. FIXED by AAASM-5332 — the identity key is random CSPRNG, persisted
    owner-only, with enforce_did_key_binding on the gateway side. The claim this row
    previously carried against aa-cli/src/commands/run_registration.rs:583,668 is
    withdrawn by the companion Markdown at :690 and :1046, and was an inversion. Read at
    the evidence tree, both call sites
    sit inside that module's own test block (opens at :462). :583 mints a deliberately
    FOREIGN key ("somebody-else") to assert the binding check refuses it; :668 IS the
    AAASM-5332 regression assertion (assert_ne! on derive_transport_key("parity-check")
    against cli.public_key). Both exist to prove the vulnerability is CLOSED, so citing
    them as evidence it is partly open reversed their meaning. The
    aa-gateway/tests/lifecycle_service_test.rs fixtures do seed from derive_transport_key,
    which is untidy but implies no production gap — a SHA-256-seeded Ed25519 public key is
    indistinguishable from a random one server-side. SCOPE: fixed on main, still live in
    the published v0.0.1-rc.6.

  - >-
    resolve_decision has ZERO non-test callers in this repository — every reference is in
    aa-sdk-client/src/decision.rs itself, below the test gate at :99. The out-of-repo FFI
    shims do not reliably supply the refusal either: the Node shim hard-codes fail-OPEN,
    mapping QueryFailed, ChannelClosed and Shutdown to Decision::Allow
    (node-sdk/native/aa-ffi-node/src/lib.rs:204-209). POSITIVE CONTROL for the zero:
    aa-cli does depend on aa-sdk-client (aa-cli/Cargo.toml:74), so a cross-crate call
    would be findable.
  evidence:
  - kind: gap
    reason: 'GAP, with a control that holds. resolve_decision is defined at aa-sdk-client/src/decision.rs:58;
      every reference is in that file, all below #[cfg(test)] at :99, and it has 0 hits in
      aa-cli/src, aa-runtime/src AND all three SDK repos. POSITIVE CONTROL: aa-cli does depend
      on aa-sdk-client (aa-cli/Cargo.toml:74), so a cross-crate call would be findable — the
      zero is real, not a mis-scoped probe. WITHDRAWN: "refusal lives in the out-of-repo FFI
      shims". The Node shim hard-codes fail-OPEN, mapping QueryFailed, ChannelClosed and Shutdown
      to Decision::Allow (node-sdk/native/aa-ffi-node/src/lib.rs:204-209).'
  evidence_runs_on_main: none
  target_level: correct per ADR 0002 — keep advisory, make the claim wording match
  q4_changed_answer: true

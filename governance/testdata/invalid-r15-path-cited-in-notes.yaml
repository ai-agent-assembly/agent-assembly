# INVALID FIXTURE — expects rule R15, and it exists to pin R15's READ SET.
#
# `invalid-r15-release-scope-unstated.yaml` cites its main-only path in
# `evidence[].path`. This one cites it in `notes` instead, and everything R15
# looked at in round 3 is deliberately clean:
#
#   evidence[0].path        aa-integration-tests/tests/e2e_mcp_interceptor.rs  -> blob at rc.6
#   interception_component  aa-proxy/src/proxy/mod.rs                          -> blob at rc.6
#   notes                   aa-sdk-client/src/identity_store.rs                -> ABSENT at rc.6
#
# Round 3 shipped R15 reading only `evidence[].path` and
# `interception_component`, while the same rule two lines later used
# `prose_values` — twelve prose fields plus known_bypasses[],
# preconditions[].note and evidence[].{reason,describes,control,note} — to
# decide whether the required scope statement was PRESENT. A read set narrower
# than the write set is a hole exactly that wide, and three real rows were in
# it: I7 (`notes`), L6 (`evidence[0].reason`), I5 (`known_bypasses[2]`). The
# latter two fields are AAASM-5588's publication surface.
#
# THE TRUTH TABLE, which is the point of this file. Two candidate read sets:
#
#   | read set                                   | this fixture | invalid-r15-release-scope-unstated |
#   |--------------------------------------------|--------------|------------------------------------|
#   | evidence[].path + interception_component   | PASSES (bug) | fails [R15]                        |
#   | evidence[].path + prose_values (shipped)   | fails [R15]  | fails [R15]                        |
#
# The two disagree on THIS input and agree on the other one, so this is the
# fixture that discriminates the read sets — the other proves only that R15 is
# not a no-op. Per Appendix A: when a rule can plausibly read one of several
# field sets, fixture the SET, not merely the failure.
#
# WHY THIS PATH, and do not "tidy" it:
#
#   git cat-file -t 299de3883:aa-sdk-client/src/identity_store.rs  -> blob
#   git cat-file -t v0.0.1-rc.6:aa-sdk-client/src/identity_store.rs -> exit 128, absent
#   git cat-file -t v0.0.1-rc.6:aa-sdk-client/src/keypair.rs       -> blob   (POSITIVE CONTROL:
#                                                the tag probe is live, so the absence is measured)
#
# A historical tag cannot retroactively acquire a file, so the discriminating
# power is stable rather than incidental. Moving the citation into
# `interception_component`, or swapping it for a path that exists at the tag,
# silently restores the round-3 blind spot.

# INVALID FIXTURE — expects rule R8.
#
# `transport` names NODE_EXTRA_CA_CERTS, which no preconditions[] entry declares.
#
# R8's namespace is not only AA_*. A handful of externally-owned variables are
# load-bearing for our own claims — NODE_EXTRA_CA_CERTS is the CA-trust mechanism
# L1 depends on, and L2/L3 cite its ABSENCE as the reason TLS interception fails
# there. Before this rule widened, all of that lived in prose with no structured
# home and no machine check.

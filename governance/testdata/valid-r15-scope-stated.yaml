# POSITIVE CONTROL FOR R15 — the green half of the red/green pair.
#
# This is `invalid-r15-release-scope-unstated.yaml` with exactly ONE line added:
# a `notes` field naming the tag. Nothing else differs — same evidence path,
# same tree, same everything:
#
#   diff invalid-r15-release-scope-unstated.yaml valid-r15-scope-stated.yaml
#     > notes: 'SCOPE: fixed on main, still live in the published v0.0.1-rc.6.'
#
# A one-line diff is what proves R15 keys on the STATEMENT and not on something
# incidental to the invalid fixture — a negative fixture alone shows only that
# the rule is not a no-op, never that it is satisfiable by the thing it asks
# for. The programme's standard is that a gate nobody has watched pass for the
# right reason is not known to work either.
#
# HONEST LIMIT, and it is the reason this file is a control and not a proof of
# correctness: R15's check is a substring search for the tag. The sentence
# below is true, but an INVERTED one passes just as well — e.g. "Behaviour is
# unchanged since rc.6; no divergence between main and the release", which is
# false of every row here and still contains `rc.6`. R15 forces the tag into a
# field a reviewer can read; it cannot read it for them.

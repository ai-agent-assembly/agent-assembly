[package]
name = "aa-devtool-windsurf"
version.workspace = true
publish = false  # AAASM-2340: dev-tool subsystem held back from this alpha — user directive
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DevToolAdapter for Windsurf Cascade — admin settings sync, MCP registry control, terminal allow/deny"

[dependencies]
aa-devtool-contract = { path = "../aa-devtool-contract" }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
# AAASM-6093: the DevToolAdapter methods are `async fn`, so their file I/O must
# not block the executor thread. `fs` is the only feature needed here — the
# runtime itself is the caller's.
tokio        = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

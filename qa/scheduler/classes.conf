# Resource-class table for qa/scheduler/aa-sched (AAASM-5891).
#
# Columns (whitespace-delimited, no spaces inside a field):
#   id                  class identifier, matched by `aa-sched run --class`
#   limit               max concurrent holders of this class's pool
#   pool_kind           GLOBAL | WORKTREE | CARGO_TARGET — how the pool key
#                        is resolved at runtime (see aa-sched's resolve_pool_key)
#   retry_safe          yes|no — may a stalled job of this class be retried
#                        automatically after being killed?
#   poll_s              watchdog poll interval, seconds (0 = unsupervised)
#   stall_polls         consecutive flat polls before a job is a stall
#                        candidate (stall_polls * poll_s = the no-progress
#                        budget)
#   grace_s             seconds between SIGTERM and SIGKILL on a confirmed stall
#   breaker_threshold   consecutive stalls before the circuit breaker opens
#
# id limit pool_kind retry_safe poll_s stall_polls grace_s breaker_threshold

# Jira/gh/file reads and LLM reasoning contend for nothing on this machine.
# Deliberately UNSUPERVISED (poll_s=0) — the real ceiling for this class is
# the agent/reasoning ceiling in qa/ORCHESTRATION.md, not a semaphore here.
# This row exists so "no limit" is a visible decision, not an omission.
readonly 10 GLOBAL yes 0 0 0 0

# Contention here is one worktree's git index/working tree, not the machine
# — up to N distinct worktrees run concurrently, each serialized against
# itself. Never retried: a half-applied commit/push must never be repeated
# unattended.
write_repo 1 WORKTREE no 5 20 10 2

# Non-cargo checks: shellcheck, ruff, mypy, pnpm lint/typecheck, bats.
# Seconds-to-a-minute, hold no shared lock.
lint_fast 4 GLOBAL yes 2 15 5 2

# Cargo holds an exclusive lock on <target-dir>/{debug,release}/.cargo-lock.
# A limit of 2 does not buy 2x throughput — it buys one build plus one
# process asleep on the OS lock, which *is* the 50-minute signature of the
# incident this Story exists to fix. Real parallelism is available by KEY:
# a private CARGO_TARGET_DIR gets its own pool (at the disk cost documented
# in this machine's own disk-pressure incident notes).
# stall_polls(30) * poll_s(5) = 150s no-progress budget before a candidate
# stall is even considered — generous because normal cargo compile units
# can legitimately take over a minute of CPU with no log output.
cargo_build 1 CARGO_TARGET yes 5 30 10 2

# cargo nextest run --workspace, testcontainers, integration lanes. Its
# compile phase takes the *same* lock as cargo_build, so it is the same
# physical resource — sharing the CARGO_TARGET pool_kind means it shares
# cargo_build's pool key at runtime. A separate class id only so it gets
# its own breaker state and log granularity, not its own capacity.
# stall_polls(40) * poll_s(5) = 200s — integration tests spend real time in
# testcontainers pulls/health-checks with no log growth.
heavy_test 1 CARGO_TARGET yes 5 40 15 2

# The incident: 3046s (50m46s) measured in lefthook.toml's own comment for
# a full-workspace `cargo doc --workspace --no-deps`. GLOBAL (not per
# CARGO_TARGET_DIR) because the binding cost is wall-clock and disk, not
# only the lock — three private target dirs would dodge the lock and still
# burn ~2.5 CPU-hours combined.
# stall_polls(60) * poll_s(10) = 600s — rustdoc can go quiet for minutes on
# a single large crate.
cargo_doc_workspace 1 GLOBAL yes 10 60 15 2

# `security add-trusted-cert` (aa-proxy/src/lib.rs, tls/keychain.rs),
# `sudo aasm proxy install-ca`, and VZVirtualMachine.start() on the shared
# rootfs.img (AAASM-5870 — wiring that VM boot into this class is that
# ticket's own follow-up work, not done here). Serialized by the OS/admin-
# auth prompt anyway; concurrent attempts race GUI prompts. Never retried:
# a partially-applied trust-store or VM mutation must never be repeated
# unattended.
macos_security 1 GLOBAL no 5 30 10 2

# Test-only registry fixture (AAASM-5893 case 11 — the os.set_inheritable
# regression). A dedicated limit-1 pool so a second `run` attempt against the
# same class is guaranteed to contend, independent of the real registry's
# `lightweight` pool (limit 6, which case 11 must NOT use — 6-way capacity
# would let the second acquire succeed even with a broken lock, hiding the
# exact bug this case exists to catch).
version: 1
defaults:
  wait_secs: 0
  soft_timeout_secs: 600
  hard_timeout_secs: 1800
  max_wallclock_secs: 21600
  grace_secs: 20
  breaker_open_threshold: 3
  degraded_limit: 0
  duplicate_policy: suppress
pools:
  test-single:
    limit: 1
    root: null
  test-single-2:
    limit: 1
    root: null
  # AAASM-5951's stall-termination tests: a dedicated pool so they never
  # contend with the SIGINT-relay (test-single-2) or fingerprint (test-single)
  # cases above.
  test-single-3:
    limit: 1
    root: null
classes:
  test-class:
    pool: test-single
    progress_signals: [cpu]
  # AAASM-5948 case 16: a short grace_secs so the SIGKILL-escalation test
  # doesn't wait out the real default (20s) — a separate pool from
  # test-single so it can't contend with the other cases' jobs.
  test-class-fast-grace:
    pool: test-single-2
    grace_secs: 1
    progress_signals: [cpu]
  # AAASM-5948 case 17: grace_secs: 0 must escalate to SIGKILL immediately
  # on the FIRST relay, not silently disable escalation (signal.alarm(0)
  # means "cancel", not "fire now"). Shares test-single-2's pool — case 16
  # and case 17 never run concurrently, so no contention.
  test-class-zero-grace:
    pool: test-single-2
    grace_secs: 0
    progress_signals: [cpu]
  # AAASM-5951: short soft/hard timeouts so the stall-classification tests
  # don't wait out the real defaults (600s/1800s). soft_timeout_secs=1,
  # hard_timeout_secs=2 gives a narrow but reliable window for a real
  # sleep-based test: an owned hung job crosses hard within ~2-3s, a
  # healthy busy job stays under 1s of no-progress on every poll.
  test-class-stall:
    pool: test-single-3
    soft_timeout_secs: 1
    hard_timeout_secs: 2
    grace_secs: 1
    progress_signals: [cpu]
  # AAASM-5951: soft_timeout_secs reachable, hard_timeout_secs effectively
  # unreachable within a test's lifetime — isolates the soft-only path from
  # the hard/kill path.
  test-class-soft-only:
    pool: test-single-3
    soft_timeout_secs: 1
    hard_timeout_secs: 9999
    grace_secs: 1
    progress_signals: [cpu]
  # AAASM-5952 case 6: a distinct, non-default breaker_open_threshold (5,
  # vs. the defaults' 3) — review found the original case only proved a
  # CLI override beats the global DEFAULT_FIELDS value, never that it beats
  # a genuinely class-specific configured value. No pool-acquisition
  # behavior exercised, so it's harmless to reuse test-single-3.
  test-class-high-breaker-threshold:
    pool: test-single-3
    breaker_open_threshold: 5

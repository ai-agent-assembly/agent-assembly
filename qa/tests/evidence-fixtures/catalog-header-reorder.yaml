  name: Synthetic journey — reordered table columns
  priority: P1
  persona_track: Test
  surfaces: [test-surface]
  entry_point: cli
  lanes: [functional]
  browser_required: false
  outcome: Fixture only.
  release_blocking: true
  lifecycle_state: automated
  evidence:
  - repo: agent-assembly
    kind: test
    selector: "qa/tests/evidence-fixtures/catalog-header-reorder.yaml::t96"
  execution_lanes: [pr]
  fidelity: mock

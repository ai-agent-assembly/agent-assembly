catalog_version: '1'
source: AAASM-4522 (durable human-readable journey inventory) — this file is a selection index, not a
  replacement
policy: docs/src/qa/release-qa-policy.md
# feature_refs (optional, per journey; AAASM-5844): the implementation ticket(s)
# this journey provides release-QA coverage for — distinct from each entry's own
# `jira:` field, which points to the journey's own AAASM-4522 Story, not an
# implementation ticket. Omit entirely on journeys with no known feature-delta
# coverage yet (backward-compatible — every pre-existing entry omits it and stays
# valid). Populated/maintained by the feature -> QA-coverage reconciliation
# procedure (.claude/skills/release-qa-gate/REFERENCE.md#feature--qa-coverage-reconciliation)
# and mechanically checked by scripts/qa/check-feature-coverage.py.
# --- AAASM-5874: Release Assurance Registry fields (all optional additive) ---
# release_blocking (bool, optional, default false): mirrors the release-QA
#   policy's P0 "always executed, release-blocking" tier. Explicit rather than
#   re-derived from `priority` so a P1 can be escalated without renumbering it.
# lifecycle_state (enum, optional): automated | partial | manual_live | gap |
#   unsupported | stale | retired. Truthful coverage state per AAASM-5873's
#   audit taxonomy (EXECUTABLE->automated, PARTIAL->partial,
#   MANUAL_OR_LIVE_ONLY->manual_live, NOT_EXECUTED/NOT_COVERED->gap,
#   STALE->stale). Required when release_blocking is true.
# evidence (list of {repo, kind, selector}, optional): kind is test |
#   ci_job | manual_record. `selector` for kind=test is a
#   `<path>::<test-or-function-name>` the validator resolves against the
#   named repo checkout (file exists + selector name found in it) — it does
#   NOT invoke a build/test runner. Required (non-empty + resolvable) when
#   lifecycle_state is automated AND release_blocking is true. Populating it
#   on a `partial` entry is still encouraged (it documents what evidence
#   does exist) but is not enforced by the validator — `gap_owner` is what's
#   enforced there instead, since the incompleteness is the point.
# execution_lanes (list of pr|main|nightly|release|live_dogfood, optional):
#   required (non-empty) when lifecycle_state is automated AND
#   release_blocking is true.
# fidelity (enum, optional): mock | controlled_fake | real_local_process |
#   container | published_artifact | real_external_provider. Required under
#   the same automated + release_blocking condition as execution_lanes.
# platforms (list of str, optional): required OS/runner scope when relevant.
# negative_control (str, optional): reference to the mutation/fault-injection
#   evidence proving the journey's test is load-bearing.
# gap_owner (str, optional): an AAASM-* ticket owning an incomplete/missing
#   entry. Required when release_blocking is true and lifecycle_state is
#   partial, gap, unsupported or stale.
# retirement ({reason, ref}, optional): used only for lifecycle_state:
#   retired — the row stays (stable IDs are never deleted), but is excluded
#   from active selection. `ref` may be a ticket or a policy document.
# See scripts/qa/validate-golden-journeys.py for the enforced rules and
# docs/src/qa/release-qa-policy.md for how execution_lanes/fidelity feed
# release-tier selection.

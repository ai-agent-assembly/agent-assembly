[package]
name = "aa-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Security primitives for Agent Assembly — credential scanning, redaction, and audit-normalization. Leaf crate with no aa-core dependency."

[dependencies]
aho-corasick = "1"
serde = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }

[features]
# The canonical policy AST's YAML parsing (`policy::parse`) needs serde + serde_yaml.
serde = ["dep:serde", "dep:serde_yaml"]

[dev-dependencies]
# AAASM-5352: enable this crate's own `serde` feature for its tests, so the
# canonical model's serialized form is pinned by the default `cargo nextest run
# --workspace` that CI runs — without it those tests need `--all-features` and
# would silently never execute. Dev-only, so the published dependency graph and
# the leaf/WASM layering are unchanged. Same pattern as `aa-core` and `aa-cache`.
aa-security = { path = ".", features = ["serde"] }
criterion = { workspace = true, features = ["html_reports"] }
# AAASM-5269 transport-floor harness only. Dev-only, so it does not enter the
# published crate's dependency graph; the harness measures the JSON
# serialisation tax an out-of-process provider would pay, so hand-rolling it
# would measure something other than what a real adapter costs.
serde_json = { workspace = true }

[[bench]]
name = "scanner_bench"
harness = false

# AAASM-5269 research benchmark. Not a gate and not asserted on — it exists so the
# per-payload-class fast-path numbers quoted in the Spike report are reproducible.
[[bench]]
name = "spike_5269_payload_classes"
harness = false

# AAASM-5269 research harness. Criterion reports a mean/median; a synchronous
# enforcement budget needs the tail, so this one times each call and prints real
# p50/p95/p99. Also not a gate.
[[bench]]
name = "spike_5269_percentiles"
harness = false

# AAASM-5269 research harness. Measures what an out-of-process provider costs in
# transport alone, with a stand-in provider that performs no detection, so the
# architecture comparison is not confounded by provider quality. Also not a gate.
[[bench]]
name = "spike_5269_transport_floor"
harness = false

[lints]
workspace = true

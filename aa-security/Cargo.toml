[package]
name = "aa-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Security primitives for Agent Assembly — credential scanning, redaction, and audit-normalization. Leaf crate with no aa-core dependency."

[dependencies]
aho-corasick = "1"
serde = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }

[features]
# The canonical policy AST's YAML parsing (`policy::parse`) needs serde + serde_yaml.
serde = ["dep:serde", "dep:serde_yaml"]

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "scanner_bench"
harness = false

# AAASM-5269 research benchmark. Not a gate and not asserted on — it exists so the
# per-payload-class fast-path numbers quoted in the Spike report are reproducible.
[[bench]]
name = "spike_5269_payload_classes"
harness = false

# AAASM-5269 research harness. Criterion reports a mean/median; a synchronous
# enforcement budget needs the tail, so this one times each call and prints real
# p50/p95/p99. Also not a gate.
[[bench]]
name = "spike_5269_percentiles"
harness = false

[lints]
workspace = true

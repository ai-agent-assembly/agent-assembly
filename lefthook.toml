[pre-commit]
parallel = true

[pre-commit.commands.fmt]
glob = "*.rs"
run = "cargo fmt --all -- --check"
fail_text = "Formatting issues found. Run 'cargo fmt --all' to fix."

# --- Why there is no [pre-commit.commands.clippy] here anymore (AAASM-5838) ---
# `cargo clippy --all-targets --all-features` used to run here on
# every commit touching a `*.rs` file — a full-workspace invocation with no
# per-crate scoping. On this repo's shared-`CARGO_TARGET_DIR` convention
# (multiple worktrees/sessions sharing one build cache), that routinely
# blocked a single-crate commit for 50+ minutes waiting on unrelated crates'
# incremental compilation, or on the shared target-dir lock another session
# already held — synchronously, in the commit path, with no way to bypass it
# short of `--no-verify` (forbidden — see the repo root CLAUDE.md).
#
# CI's `clippy` job (`.github/workflows/ci.yml`) already runs
# `--workspace --all-targets --all-features --exclude aa-ebpf -- -D warnings`
# as a required check before merge — this hook duplicated that coverage,
# synchronously, on every commit rather than once per PR, for every crate CI
# already covers. Not identical, though: `aa-ebpf` (the `--exclude`, a
# nightly-toolchain-only Linux crate) was linted ONLY by this hook — CI does
# not lint it anywhere else (`ebpf-build`'s clippy step targets the separate
# `aa-ebpf-probes` crate, not `aa-ebpf` itself). Removing this hook leaves
# `aa-ebpf` with no clippy coverage except `scripts/clippy-changed-crates.sh`
# run explicitly on a diff that touches it — a real, narrow gap, not silently
# assumed away. Run `scripts/clippy-changed-crates.sh` before opening a PR for
# a fast, scoped local check on whatever your diff actually touches; CI
# remains the authoritative full-workspace gate for every crate it covers.

[pre-commit.commands.deny]
# AAASM-5699: patterns match against the *whole path*, so a wildcard-free
# `Cargo.toml` is an exact path match — it caught the workspace-root manifest and
# none of the 35 crate manifests under `aa-*/`. The licence/advisory/banned-crate
# gate therefore never ran for 35 of the repo's 36 manifests: a commit adding a
# dependency to `aa-gateway/Cargo.toml` alone printed `deny (skip) no matching
# staged files`. The leading `*` fixes it because `*` crosses `/` at any depth.
#
# `*Cargo.lock` is in the list because what cargo-deny evaluates is the *resolved*
# graph, which comes from the lock file, not the version requirements in the
# manifests. Measured: the root manifest asks for `serde = "1"`, the lock pins
# 1.0.229, and `cargo deny check bans` reports `serde v1.0.229`. So a bare
# `cargo update` — a lock-only diff, no manifest touched — can pull in a new
# transitive crate carrying a denied licence, a banned crate, an unvendored source
# or a fresh RUSTSEC advisory, and a manifest-only glob would not gate it. The
# whole check costs ~1 s, which is not worth trading against that.
#
# Over-triggers on `aa-sandbox/fuzz/{Cargo.toml,Cargo.lock}`: that crate is in the
# workspace `exclude` list, so this root-level check does not evaluate its graph.
# Running anyway is harmless; do not record it as coverage of the fuzz crate.
glob = ["*Cargo.toml", "*Cargo.lock"]
run = "cargo deny check"
fail_text = "cargo-deny check failed. Review license or advisory violations."

[pre-push]
parallel = true

[pre-push.commands.doc]
# AAASM-5695: unfiltered, this full-workspace rustdoc build ran on every push,
# whatever the diff — 3046 s (50m46s) measured here on a branch whose only
# changed file is this one. A wait that long on a docs-only change is what
# pressures people into --no-verify.
#
# `files` is load-bearing, and *whether* it is depends on a state most readers
# will not have in mind. lefthook's built-in push_files is `git diff HEAD
# @{push}`, so its behaviour splits:
#   - @{push} resolves — the branch has a same-named upstream, i.e. after its
#     first `git push -u`. push_files is then the real push diff and a bare
#     `glob` filters correctly. Measured: a no-Rust diff skipped.
#   - @{push} does not resolve — push.default=simple plus a branch whose name
#     differs from its upstream's. That is every ticket branch *before* its
#     first push, and stacked worktrees with no upstream at all. lefthook then
#     falls back to a list holding every tracked file (observed to include
#     `.cargo/config.toml` and `verification-reports/*.md`, which no such push
#     touches), so a bare `glob` matches on every push and filters nothing.
#     Measured: a diff containing zero Rust still ran the full build.
# Deleting `files` is therefore wasteful rather than unsafe — the gate would run
# always, never silently off — but it un-does this ticket precisely when it
# pays, on the first push of a ticket branch. Diffing against the upstream
# merge-base removes the dependency on @{push} entirely; with no upstream at
# all we fail open to the whole tree, keeping the old always-run behaviour
# rather than dropping the gate.
#
# Patterns match against the whole path, and a wildcard-free pattern is an exact
# path match: plain `Cargo.toml` catches the root manifest and misses all 35
# crate manifests under `aa-*/`. Hence the leading `*` (which does cross `/`).
#
# AAASM-5838: `@{u}` does not resolve for a worktree branch before its first
# `git push -u` — every ticket branch created via `git worktree add -b`, which
# is this repo's normal workflow (see root CLAUDE.md's Git Worktree Workflow).
# That used to fall straight to `git ls-files` (the whole tracked tree), so a
# ticket branch's very first push ran the full-workspace doc build regardless
# of how small the actual diff was — measured elsewhere at ~27 minutes on a
# 2-file, non-Rust diff, purely because upstream tracking wasn't set yet.
#
# Before falling all the way to the whole tree, try the merge-base against
# this repo's canonical remote-tracking branches — `remote/main` (the org
# remote per CLAUDE.md's push-remote convention) and `origin/main` (a fork
# checkout) — both of which resolve for a freshly-branched worktree with no
# push history at all, since the branch was cut from one of them. This is the
# same diff `@{u}` would compute after the first push in the common case
# (branching from the current tip of the default branch), just resolvable
# before that push happens.
#
# Known gaps — tracked, not hidden:
#   - Pushing a ref that is not HEAD (`git push remote <branch>` from a checkout
#     sitting elsewhere, or `git push --all`) computes an empty set and skips.
#     AAASM-5726; lefthook's own push_files shares the blind spot.
#   - `.proto`-only and deletion-only diffs skip here and have no workspace
#     rustdoc gate anywhere in CI: ci.yml's `Rustdoc` job builds only
#     `-p aa-core` (1 of 32 workspace members per `cargo metadata`; aa-proto is
#     not in its dependency closure), and docs.yml's `--workspace` rustdoc is
#     not triggered by `proto/**` or `aa-*/**/*.rs`. Do not record this as
#     covered. The residual is bounded: this hook sets no RUSTDOCFLAGS, so it
#     only ever caught rustdoc *hard* errors — it passed at exit 0 while
#     emitting 67 rustdoc warnings in aa-api.
#   - A worktree branch cut from something other than `remote/main` /
#     `origin/main` tip (e.g. stacked on another feature branch, per the Git
#     Worktree Workflow's dependency-stacking case) still falls to the full
#     `git ls-files` tree until its first push sets `@{u}` — deliberately: a
#     merge-base against the wrong branch would silently under-scope the
#     check, which is worse than the slow-but-correct fallback it replaces.
files = 'git diff --name-only --merge-base @{u} HEAD 2>/dev/null || git diff --name-only --merge-base remote/main HEAD 2>/dev/null || git diff --name-only --merge-base origin/main HEAD 2>/dev/null || git ls-files'
glob = ["*.rs", "*Cargo.toml", "*Cargo.lock"]

# AAASM-5895: wrapped through the `cargo-doc` resource class
# (qa/resource-classes.yaml, pool `cargo-shared-target`, limit 1) — this is
# the exact hook whose 3+ concurrent invocations deadlocked on the shared
# CARGO_TARGET_DIR flock for ~50 minutes in the AAASM-5877 incident this
# whole Story (AAASM-5891) exists to fix. Blocked on AAASM-5947 (worktree-
# scoped fingerprint) and AAASM-5948 (Ctrl-C orphan containment) landing
# first — wrapping before those existed would have made a foreground
# `git push` fail or hang on this machine, per design review.
#
# No queueing, no fail-open, no wrapper script: resource-lock.py's `run`
# already gives exactly the behavior the product-owner decision thread
# specified, with zero extra flags —
#   - fail-fast: `cargo-doc`'s wait_secs is unset, so it inherits the
#     registry defaults' wait_secs: 0 — a saturated slot returns
#     immediately (EXIT_SATURATED=75), never queues.
#   - fail-closed: EXIT_SATURATED/EXIT_DUPLICATE (76) are as nonzero as any
#     other failure to lefthook, so a saturated slot REJECTS the push —
#     there is no code path here that swallows either exit code into a
#     passed hook.
#   - distinguishable message, no custom wrapper needed: resource-lock.py's
#     own `eprint` on both paths ("pool '...' saturated ...",
#     "duplicate job already running ...") is prefixed `aa-qa-lock:` and
#     inherited straight through to this hook's stderr (fork+execvp, no fd
#     redirection) — visibly distinct from rustdoc's own error output on a
#     genuine build failure, without this file inventing a second
#     classification scheme.
#   - no blocked foreground shell: same reasoning — wait_secs: 0 means this
#     process never sleeps waiting for the slot.
#
# What this hook does NOT do: retry. Point 4 of the decision thread (retry
# belongs to the orchestration/scheduler layer, not the hook) is documented
# in qa/ORCHESTRATION.md's "Resource classes" section — an automated QA
# campaign hitting EXIT_SATURATED here should record the retryable state,
# continue other dependency-ready work, and retry the push later, not stop
# and ask a human merely because another worktree holds the slot.
run = "python3 scripts/qa/resource-lock.py run --class cargo-doc -- cargo doc --workspace --no-deps"
fail_text = "Documentation build failed, OR another push/worktree currently holds the cargo-doc build slot (see the 'aa-qa-lock:' line above — 'saturated'/'duplicate' means contention, not a build error). Fix rustdoc errors before pushing; wait or retry shortly if this is resource contention."

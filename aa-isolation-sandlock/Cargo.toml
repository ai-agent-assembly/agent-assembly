[package]
name = "aa-isolation-sandlock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux process-isolation backend for Agent Assembly, implemented over the Sandlock supervisor (AAASM-5708)"
# AAASM-5708. Held back from crates.io for the same reasons as `aa-isolation`
# (see that crate's `src/lib.rs` "Packaging" section) plus one of its own: this
# crate is useless without an external `sandlock` executable that AASM does not
# distribute on any channel, so a published copy would advertise a capability
# nothing published can provide.
#
# `cargo workspaces publish` (release.yml `publish-crates`) ships every workspace
# member that does NOT carry this key, so omitting it would publish this crate by
# default rather than by decision.
publish = false

[dependencies]
# The backend-neutral contract this crate implements. `aa-isolation` is
# `publish = false` too, so this edge is packaging-safe in the same direction.
aa-isolation = { path = "../aa-isolation", version = "0.0.1-rc.6" }
# Only for the `ClaimTerm` evidence vocabulary, which `aa-isolation` re-uses
# verbatim and this crate must name when it records a decision.
aa-core = { path = "../aa-core", version = "0.0.1-rc.6" }

# AAASM-5709, and only for `src/inherit.rs`: `fcntl(F_GETFD/F_SETFD)`, to stop an
# inherited descriptor crossing `exec` into the confined program. The standard
# library exposes no way to set the close-on-exec flag on a descriptor it did not
# create, and the alternative — taking ownership of the descriptor and dropping
# it — closes something this process does not own and races a concurrent open
# that reuses the number.
#
# Linux-only by target, because the enumeration it acts on is `/proc/self/fd`
# and the backend is unavailable off Linux anyway. `libc` is already a workspace
# dependency; this adds no new crate to the tree, only a new edge.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
default = []

[dev-dependencies]
aa-isolation-sandlock = { path = "." }

# AAASM-5712, and only for `tests/adversarial/`: the in-memory reference backend.
#
# The adversarial harness has to drive a *second* implementation of
# `IsolationBackend` through the same canonical interface, or "the harness is
# backend-agnostic" is a claim about the shape of its code rather than a fact
# about what it has been run against. The mock is the only other implementation
# that exists, and it is behind a non-default feature so that a release build of
# a consumer cannot select a backend that enforces nothing.
#
# Turning it on *here* keeps that property: `dev-dependencies` feature unification
# under resolver 2 applies to this crate's test build alone, so nothing shipped
# gains the feature by this line.
aa-isolation = { path = "../aa-isolation", version = "0.0.1-rc.6", features = ["mock-backend"] }

# AAASM-5709, and only for the descriptor scenario in
# `tests/linux_confinement.rs`: `dup`, to obtain a descriptor that is inheritable
# across `exec` by construction. The scenario's control depends on that being
# true, and assuming what `File::open` did with the close-on-exec flag would make
# the control's premise an assumption rather than a fact.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true

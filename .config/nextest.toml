# cargo-nextest configuration.
#
# AAASM-3650: a modest global retry absorbs residual runner-starvation
# flakes (e.g. a healthz round-trip that is slow on a noisy-neighbour
# GitHub-hosted runner) without masking real regressions:
#
#   * Retries only rescue NON-deterministic failures. A deterministic
#     regression fails all 3 attempts and is still reported as failed.
#   * nextest reports any test that passed only after a retry as FLAKY,
#     so the noise stays visible instead of being silently swallowed.
#
# CI invokes nextest with the default profile (`cargo nextest run
# --workspace ...`, `-p aa-gateway`, etc. — no `--profile ci`), so the
# retry policy belongs under `[profile.default]`.
[profile.default]
retries = 2

# AAASM-6410: the profile the `Coverage` job runs under. Diagnostics, not the
# fix. `Coverage` has twice lost its hosted runner ("lost communication with the
# server") inside `Generate coverage report` with no test named, because nothing
# bounds a single test there. A per-test slow-timeout turns a wedged test into a
# named nextest FAILED instead. `period = "300s"` x `terminate-after = 4` = a
# 20 minute kill: the whole suite finishes in 33-54 minutes in green runs, so no
# real test comes near it even with llvm-cov's 2-5x overhead. Inherits `retries`
# from `[profile.default]`.
[profile.coverage.slow-timeout]
period = "300s"
terminate-after = 4

# AAASM-5465: the profile the Claude Code conformance lanes run under.
# AAASM-5977 additionally moved `integration-tests.yml`'s own `Run integration
# tests` step onto this profile, for the same reason: AC5 needs the executed
# test count so a future silent coverage drop is visible from CI output
# without reasoning about individual test durations.
#
# Why a JUnit report at all
# -------------------------
# A scenario that declines to measure prints `SKIP [...]` and returns, which the
# runner counts as a pass. The evidence ledger
# (`aa-integration-tests/tests/evidence/mod.rs`) records every such decline, but
# a count of declines only becomes "how much of this lane was substantive" when
# it is netted against how many cases the runner actually ran — and the runner is
# the only thing that knows that number. `.ci/test-evidence-summary.sh` subtracts
# the one from the other and refuses to call a lane that declined everything a
# lane that measured something.
#
# Inherits `retries` from `[profile.default]`; a retried test appears once in the
# report, so the arithmetic is unaffected.
[profile.evidence]
retries = 2

# AAASM-6033: diagnostics, not the fix. Before this, a breach of the
# `Run integration tests` step's 28-minute ceiling names no test and writes
# no JUnit report (the step is killed before nextest can write one) —
# `integration-tests.yml`'s own note on this. A per-test slow-timeout turns
# that into a named, immediate nextest FAILED instead. `period = "360s"`
# is deliberately generous: the slowest known real test in this crate
# (`cli_run_codex_launch_env`) has measured up to ~264s, and `retries = 2`
# above means a `terminate-after` kill is retried up to 3 attempts total —
# `terminate-after = 1` keeps the worst case at 360s x 3 = 18 min for one
# pathological test, bounded and still well inside the step ceiling.
[profile.evidence.slow-timeout]
period = "360s"
terminate-after = 1

[profile.evidence.junit]
path = "junit.xml"

# AAASM-6033: `integration-tests.yml`'s `Run integration tests` step raised
# --test-threads from 1 to 4 once its original reason (per-test `cargo run`
# overhead, serialized by definition) was eliminated by the AASM_BIN_PATH
# pre-build step. The real-process/long-running tests below still need to
# run one at a time — several spawn real gateway/proxy processes and are
# timing-sensitive under concurrent CPU load — so they're pinned into their
# own serial group instead of forcing the whole 747-test suite serial again.
# ci.yml's `Test` job already runs the full workspace, these tests included,
# fully concurrently and is green, which is the safety precedent for
# everything *not* listed here running at --test-threads=4.
[test-groups.serial-process]
max-threads = 1

[[profile.evidence.overrides]]
filter = '''
binary_id(aa-integration-tests::cli_run_claude_deterministic_conformance)
  + binary_id(aa-integration-tests::cli_run_claude_governed_launch)
  + binary_id(aa-integration-tests::cli_run_claude_launch_env)
  + binary_id(aa-integration-tests::cli_run_codex_launch_env)
  + binary_id(aa-integration-tests::cli_run_concurrent_isolation)
  + binary_id(aa-integration-tests::cli_run_leak_freedom)
  + binary_id(aa-integration-tests::cli_run_trusted_proxy)
  + binary_id(aa-integration-tests::adversarial_isolation_launch)
  + binary_id(aa-integration-tests::e2e_sensitive_data_reference_journey)
  + binary_id(aa-integration-tests::cli_run_stub_coding_agent_workflow)
'''
test-group = "serial-process"

# AAASM-6297: the stub coding-agent workflow tests each start a real
# `aasm proxy start` / per-launch proxy. Run six at once on a cold build and
# `aasm proxy start`'s fixed 5s bind wait expires for some of them (measured:
# 3 of 6 failed first attempt with "aa-proxy did not bind ... within 5s", all
# passed on retry). Serialising removes the contention instead of leaning on
# `retries`, under the default profile as well as `evidence`.
[[profile.default.overrides]]
filter = "binary_id(aa-integration-tests::cli_run_stub_coding_agent_workflow)"
test-group = "serial-process"

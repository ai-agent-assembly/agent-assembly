[package]
name = "aa-isolation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral agent execution isolation contract for Agent Assembly (ADR 0035)"
# AAASM-5704. Held back from crates.io deliberately — see the "Packaging" section
# of the crate-level documentation in `src/lib.rs` for the full rationale.
# `cargo workspaces publish` (release.yml `publish-crates`) ships every workspace
# member that does NOT carry this key, so omitting it would publish this crate by
# default rather than by decision.
publish = false

[dependencies]
# Only for the `ClaimTerm` evidence vocabulary (`aa_core::attestation`).
aa-core = { path = "../aa-core", version = "0.0.1-rc.6" }
# AAASM-5707, and only for `src/lowering.rs`: the canonical cross-layer policy
# AST that lowering reads. Two dependencies remain the whole list, and neither
# is a platform, an async runtime or a serialization format — the three things
# the crate documentation says this contract must not acquire by being depended
# upon. `aa-security` is a leaf crate whose own default feature set is empty.
#
# The direction is forced rather than chosen. `aa-policy` owns effective-policy
# resolution and would be the natural home, but it carries no `publish = false`,
# so `cargo workspaces publish` (release.yml `publish-crates`) ships it — while
# this crate deliberately opts out. A dependency from a shipped crate onto an
# opted-out one fails `cargo publish` on a dependency that is not on crates.io,
# which is the same fence `aa-cli` needs for `aa-sdk-client`. (`aa-policy` is
# absent from crates.io today only because no release has run since it was
# extracted; that is a timing fact, not an opt-out.) The other direction,
# `aa-security -> aa-isolation`, is a cycle: `aa-core` already depends on
# `aa-security`. This edge is the only one that is both acyclic and
# packaging-safe.
aa-security = { path = "../aa-security", version = "0.0.1-rc.6" }
serde = { workspace = true, optional = true, features = ["derive"] }

[features]
default = []
# Off by default and never enabled by a shipped binary. See `src/lib.rs`
# "Serialization" — turning this on is a decision to expose a wire contract,
# not a convenience.
serde = ["dep:serde", "aa-core/serde"]
# The in-memory reference backend. Off by default so a release build of a
# consumer cannot select a backend that enforces nothing.
mock-backend = []

[dev-dependencies]
# Self dev-dependency (same pattern as aa-core): turns the non-default features
# on for this crate's OWN test build, so `cargo nextest run -p aa-isolation`
# alone exercises the mock backend and the serde derives without making either
# a default for downstream consumers.
aa-isolation = { path = ".", features = ["mock-backend", "serde"] }
serde_json = { workspace = true }

[lints]
workspace = true

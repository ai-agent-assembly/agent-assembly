# Policy artifact for the sandlock confined arm (AAASM-5713).
#
# An explicit allow-all, in the shape `aasm run` itself prints when it refuses
# an unconfigured launch. It exists so the harness measures the isolation
# *boundary*'s cost, not the policy engine's — every family here is meant to
# be permitted by AASM's own rules, so any failure under confinement is a
# property of the backend's ability to express AASM's isolation lowering, not
# of this policy being restrictive on the AASM side. See ../launchers/sandlock.sh
# and ../policy/README.md.
apiVersion: agent-assembly/v1
kind: Policy
metadata:
  name: allow-all
spec:
  tools:
    "*":
      allow: true

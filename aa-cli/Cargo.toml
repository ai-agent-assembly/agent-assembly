[package]
name = "aa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "aasm — command-line tool for Agent Assembly"

# AAASM-5316: explicit include list lets `_embedded/dashboard/dist/` (the
# publish-staged copy of `dashboard/dist/`, see release.yml and build.rs) ship in
# the published tarball even though `aa-cli/.gitignore` lists `_embedded/`.
# cargo's default file-enumeration is git-aware and silently drops gitignored
# paths, so up to and including v0.0.1-rc.6 every published aa-cli tarball
# carried ZERO `_embedded` files and `cargo install aasm` produced a binary whose
# `aasm dashboard` served only build.rs's "Dashboard not built" stub. `aa-ebpf`
# and `aa-proto` already carry the same override for the same reason; this is
# the third instance of the pattern, not a new one.
include = [
    "src/**",
    "tests/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "_embedded/dashboard/dist/**",
]

[[bin]]
name = "aasm"
path = "src/main.rs"

[dependencies]
aa-core              = { path = "../aa-core", version = "0.0.1-rc.6" }
aa-security          = { path = "../aa-security", version = "0.0.1-rc.6", features = ["serde"] }
# strip-for-publish:begin devtool
# AAASM-2340: this dep wires `aasm run` + `aasm tools` to the `aa-devtool*`
# adapter crates. The dev-tool subsystem isn't ready to ship in this alpha,
# so `.ci/strip-for-publish.sh` removes this region (and the source files
# that consume it) before `cargo workspaces publish` runs. Source builds
# keep the full surface — no edits required to develop on `aasm run` /
# `aasm tools` locally.
#
# AAASM-5274: the per-tool adapter crates are reached *through*
# `aa_devtool::registry`, not linked directly, so `aasm run` and
# `aasm tools` cannot resolve different adapters for the same tool. Adding
# a tool therefore needs no change to this manifest.
aa-devtool           = { path = "../aa-devtool", version = "0.0.1-rc.6" }
# AAASM-5350: the endpoint managed-settings file is Claude Code's canonical
# artifact, and its path plus validator live with that adapter. `aasm run` reads
# it to decide whether --no-proxy is permitted.
aa-devtool-claude-code = { path = "../aa-devtool-claude-code", version = "0.0.1-rc.6" }
# AAASM-5705: the backend-neutral execution-isolation contract (ADR 0035,
# AAASM-5704). `aasm run`'s planner resolves each launch into an `ExecutionSpec`
# so a later ticket under Epic AAASM-5702 can negotiate it against a real
# isolation backend. Nothing here selects, activates or links a backend.
#
# In this region rather than a new one: `aa-isolation` is `publish = false`, and
# its only consumer is `run.rs`, which the `devtool` region already strips. Its
# crate docs call for exactly this fencing — without it, `cargo publish` for
# aa-cli fails on a dependency that is not on crates.io.
aa-isolation         = { path = "../aa-isolation", version = "0.0.1-rc.6" }
# strip-for-publish:end devtool
aa-gateway           = { path = "../aa-gateway", version = "0.0.1-rc.6" }
aa-policy            = { path = "../aa-policy", version = "0.0.1-rc.6" }
# AAASM-5280: `aasm integrations` is a Developer Integration API client. The
# reference client, the socket convention and the local enrolment file all live
# in aa-runtime, and reimplementing any of them here would be the second
# implementation ADR 0030 §7.1 exists to prevent. aa-proto supplies the wire
# view types the CLI projects into its own report models.
aa-proto             = { path = "../aa-proto", version = "0.0.1-rc.6" }
aa-runtime           = { path = "../aa-runtime", version = "0.0.1-rc.6" }
aa-proxy             = { path = "../aa-proxy", version = "0.0.1-rc.6" }
# strip-for-publish:begin sdkclient
# AAASM-5323: `aasm run` registers through the gateway's gRPC
# `AgentLifecycleService`, building the request with the same `aa-sdk-client`
# code the language SDKs use. Reimplementing the did:key derivation, the
# challenge handshake or the possession proof here would create a second
# implementation of the one identity contract the gateway gates on — the exact
# divergence this dependency exists to prevent.
#
# `aa-sdk-client` is `publish = false` (ADR 0002 / AAASM-2559: it ships to the
# SDK shims as a git-SHA pin, not via crates.io), so this region is stripped by
# `.ci/strip-for-publish.sh` along with `run.rs` and `run_registration.rs`, its
# only consumers.
aa-sdk-client        = { path = "../aa-sdk-client", version = "0.0.1-rc.6" }
# AAASM-5349: `aasm run` reports its governed launch to the gateway's
# `AuditService` over the same gRPC transport, authenticated with the credential
# token registration returned. In this region because `run_audit.rs` is stripped
# with the rest of the `aasm run` surface — a dependency left behind with no
# consumer would enlarge the published crate for nothing.
tonic                = { workspace = true }
# strip-for-publish:end sdkclient
aa-sandbox           = { path = "../aa-sandbox", version = "0.0.1-rc.6" }
aa-storage           = { path = "../aa-storage", version = "0.0.1-rc.6" }
aa-storage-memory    = { path = "../aa-storage-memory", version = "0.0.1-rc.6" }
aa-storage-redis     = { path = "../aa-storage-redis", version = "0.0.1-rc.6" }
anyhow         = { workspace = true }
async-trait    = { workspace = true }
axum           = { workspace = true }
chrono         = { workspace = true, features = ["serde"] }
clap           = { workspace = true, features = ["derive", "env"] }
clap_complete  = "4"
colored        = "3"
csv            = "1"
comfy-table    = "8"
console        = "0.16"
crossterm      = "0.29"
dirs           = { workspace = true }
futures-util   = "0.3"
hex            = { workspace = true }
include_dir    = "0.7"
libc           = { workspace = true }
mime           = "0.3"
mime_guess     = "2"
open           = "5"
owo-colors     = "4"
ratatui        = { version = "0.30", features = ["crossterm"] }
reqwest        = { workspace = true, features = ["rustls", "json", "blocking", "query"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
serde_yaml     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
toml           = { workspace = true }
url            = { workspace = true }
uuid           = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
# AAASM-5280: the integration tests drive `aasm integrations` against a real
# DI-API server over a real socket, using the same DevToolIntegration fixture
# aa-runtime's own tests use — a second copy would drift from it.
aa-runtime     = { path = "../aa-runtime", features = ["test-fixtures"] }
assert_cmd     = { workspace = true }
tokio-util     = { workspace = true, features = ["rt"] }
tempfile       = { workspace = true }
wiremock       = "0.6"
# strip-for-publish:begin sdkclient
# AAASM-5323: `aasm run`'s registration tests stand up the *real*
# `AgentLifecycleServiceImpl` over tonic and verify the possession proof the CLI
# submits against the registered public key. A mock gateway would only ever
# prove the CLI agrees with the mock.
ed25519-dalek  = "3"
tonic          = { workspace = true }
tokio-stream   = { workspace = true }
# strip-for-publish:end sdkclient

[lints]
workspace = true
